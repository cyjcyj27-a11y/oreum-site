<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>심리테스트 — MBTI · 정신연령 · 연애유형 · 직업적성</title>
<meta name="description" content="MBTI테스트, 정신연령테스트, 연애테스트, 직업적성테스트를 한곳에서 무료로 해 보세요.">
<meta name="theme-color" content="#fff6ea">
<style>
@font-face{font-family:Tokki;src:url(fonts/tokki.woff2) format('woff2');font-display:swap}
@font-face{font-family:Suite;src:url(fonts/suite-rg.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Suite;src:url(fonts/suite-xb.woff2) format('woff2');font-weight:800;font-display:swap}
:root{--bg:#fff6ea;--paper:#fffdf8;--ink:#2b2420;--soft:#7a6d63;--line:#eadfce;--c:#ff8a3d;--c2:#ffe2cc;--shadow:0 3px 0 #e6d6c0,0 10px 24px rgba(90,60,30,.08)}
body[data-t=mbti]{--c:#7b4fd6;--c2:#ebe2fb}
body[data-t=love]{--c:#d9466f;--c2:#ffdbe5}
body[data-t=job]{--c:#2d5fa8;--c2:#dbe7fb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{word-break:keep-all;font-family:Suite,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.6;min-height:100vh;
 background-image:radial-gradient(circle at 1px 1px,rgba(120,90,60,.08) 1px,transparent 0);background-size:18px 18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{padding:18px 0 36px;text-align:center}
.logo{font-family:Tokki,Suite,sans-serif;font-size:40px;line-height:1.1;color:var(--ink);letter-spacing:-1px}
.logo b{color:var(--c);font-weight:400;transition:color .3s}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:5px;padding:36px 0 10px;margin-top:-26px;background:linear-gradient(var(--bg) 80%,transparent)}
.tab{flex:1;min-width:0;padding:11px 2px 9px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-weight:800;font-size:16px;white-space:nowrap;color:var(--soft);transition:.2s}
.tab small{display:block;font-size:12px;font-weight:400;margin-top:-2px}
.tab.on{color:#fff;border-color:transparent;transform:translateY(-1px)}
.tab[data-id=mbti].on{background:#7b4fd6;box-shadow:0 3px 0 #5534a3}
.tab[data-id=age].on{background:#ff8a3d;box-shadow:0 3px 0 #c9621f}
.tab[data-id=love].on{background:#d9466f;box-shadow:0 3px 0 #a12c4e}
.tab[data-id=job].on{background:#2d5fa8;box-shadow:0 3px 0 #1d3f73}
.card{background:var(--paper);border-radius:22px;border:2px solid var(--line);box-shadow:var(--shadow);padding:22px 20px;margin-top:12px}
.intro{text-align:center}
.intro svg.art{width:100%;max-width:300px;height:auto;display:block;margin:4px auto 6px}
.intro h1{font-family:Tokki,Suite,sans-serif;font-weight:400;font-size:38px;line-height:1.15;color:var(--c)}
.intro .sub{color:var(--soft);margin-top:6px}
.meta{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.meta span{background:var(--c2);color:var(--ink);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:800}
.note{font-size:14px;color:var(--soft);margin-top:10px}
.big{display:block;width:100%;margin-top:16px;padding:16px;border-radius:16px;background:var(--c);color:#fff;font-weight:800;font-size:21px;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:800;color:var(--soft)}
.ghost:active{transform:translateY(2px)}
/* 문항 */
.top{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px}
.back:disabled{opacity:.35}
.bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.num{font-weight:800;font-size:15px;color:var(--soft);min-width:52px;text-align:right}
.q{min-height:128px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:18px 4px 10px}
.q .no{font-family:Tokki,Suite,sans-serif;color:var(--c);font-size:26px;line-height:1}
.q h2{font-size:24px;line-height:1.4;font-weight:800;margin-top:8px;word-break:keep-all}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:left;font-size:18px;font-weight:800;display:flex;gap:12px;align-items:center;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .15s,background .15s;word-break:keep-all}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c2);color:var(--c);display:grid;place-items:center;font-size:15px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--c);background:var(--c2)}
.opt.sel .k{background:var(--c);color:#fff}
/* 다섯 칸 동그라미 */
.scale{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px;padding:0 2px}
.dot{border-radius:50%;border:3px solid var(--c);background:#fff;transition:transform .1s,background .15s;flex:none}
.dot:active{transform:scale(.9)}
.dot.sel{background:var(--c)}
.dot:nth-child(1),.dot:nth-child(5){width:58px;height:58px}
.dot:nth-child(2),.dot:nth-child(4){width:46px;height:46px}
.dot:nth-child(3){width:36px;height:36px;border-color:#c9bba8}
.dot:nth-child(3).sel{background:#c9bba8}
.dot:nth-child(1),.dot:nth-child(2){border-color:#9aa4b5}
.dot:nth-child(1).sel,.dot:nth-child(2).sel{background:#9aa4b5}
.ends{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--soft)}
.ends b{color:var(--c)}
.pick{text-align:center;height:26px;margin-top:6px;font-weight:800;color:var(--c)}
/* 세 칸 */
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.tri .opt{flex-direction:column;justify-content:center;text-align:center;padding:14px 4px;font-size:16px;gap:6px}
.tri .opt svg{width:34px;height:34px;color:var(--c)}
/* 결과 */
.res{text-align:center}
.res .lead{color:var(--soft);font-weight:800}
.res h1{font-family:Tokki,Suite,sans-serif;font-weight:400;font-size:44px;line-height:1.15;color:var(--c);margin-top:2px;word-break:keep-all}
.res h1 small{font-size:.55em;color:var(--ink)}
.chip{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:99px;color:#fff;font-weight:800;font-size:15px}
.res .desc{text-align:left;margin-top:14px;word-break:keep-all}
.res svg.art{width:100%;max-width:320px;height:auto;display:block;margin:6px auto 0}
.rows{margin-top:14px;text-align:left;display:grid;gap:10px}
.row{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px}
.row h3{font-size:14px;color:var(--c);font-weight:800}
.row p,.row li{font-size:16px;word-break:keep-all}
.row ul{padding-left:18px}
.bub{display:inline-block;position:relative;background:var(--c2);border-radius:14px;padding:8px 14px;margin-top:4px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{background:var(--c2);border-radius:8px;padding:2px 10px;font-size:15px;font-weight:800}
.small{font-size:13px;color:var(--soft);margin-top:14px;text-align:center}
.agein{display:flex;gap:8px;align-items:center;margin-top:6px}
.agein input{width:90px;font:inherit;font-weight:800;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);text-align:center}
.cmp{font-weight:800;margin-top:6px}
.meter{display:grid;gap:8px;margin-top:4px}
.meter div{display:grid;grid-template-columns:62px 1fr 40px;align-items:center;gap:8px;font-size:15px;font-weight:800}
.meter .tr{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .tr i{display:block;height:100%;border-radius:99px}
.axes{display:grid;gap:10px;margin-top:6px}
.ax{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--soft)}
.ax span:last-of-type{text-align:right}
.ax .on{color:var(--ink)}
.ax b{grid-column:1/-1;text-align:center;font-size:14px;color:var(--ink);margin-top:-4px}
.tr2{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.tr2 i{position:absolute;top:0;bottom:0;border-radius:99px}
.row a{color:var(--c);font-weight:800}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btns .ghost{margin:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@media (max-width:380px){.logo{font-size:34px}.q h2{font-size:21px}.res h1{font-size:38px}.dot:nth-child(1),.dot:nth-child(5){width:50px;height:50px}}
</style>
</head>

<div class="wrap">
<header><div class="logo"><b>심리</b>테스트</div></header>

</div>
