<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>팜온마즈 — 오름게임즈</title>
<style>
  @font-face { font-family: 'Griun'; src: url('fonts/Griun_Fromsol-Rg.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Ria'; src: url('fonts/RiaSans-ExtraBold.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Bagel'; src: url('fonts/BagelFatOne-sub.woff2') format('woff2'); font-display: swap; }   /* Bagel Fat One (OFL) — 제목 전용 부분집합 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1410; font-family: 'Griun', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #fff4e6; user-select: none; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #c { display: block; touch-action: none; background: #2a1410; cursor: grab; }
  @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }
  [hidden] { display: none !important; }
  #rotate { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; text-align: center; background: #2a1410; color: #f2ede4; font-size: 17px; line-height: 1.8; padding: 8vw; }
  body.touch.portrait #rotate { display: grid; }
  #rotate button { margin: 22px 0 16px; padding: 15px 32px; border: 0; border-radius: 99px; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 800; color: #2a1c08; background: #ffd24a; }
  #rotate .sub { font-size: 14px; color: #b8ae9c; line-height: 1.7; } #rotate .sub a { color: #d8cfbc; }

  /* ── HUD — 스카이라이더 기본 UI ── */
  #topbar { position: fixed; left: 0; right: 0; top: 0; min-height: calc(44px + env(safe-area-inset-top)); padding: calc(6px + env(safe-area-inset-top)) calc(112px + env(safe-area-inset-right)) 6px calc(112px + env(safe-area-inset-left)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; background: linear-gradient(180deg, rgba(10,14,20,.5), rgba(10,14,20,0)); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .8s; }
  #topbar.show { opacity: 1; }
  .stat { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); font-size: 15px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .stat b { font-weight: normal; font-size: 17px; font-family: 'Ria', 'Griun', sans-serif; letter-spacing: 1px; } .stat .ic { font-size: 13px; }
  .stat .bar { width: 64px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; } .stat .bar i { display: block; height: 100%; width: 50%; background: #5fc8ff; transition: width .3s; }
  #water.low .bar i { background: #ff6a4a; } #water.low b { color: #ff9a8a; }
  .stat.ready { border-color: #ffd24a; background: rgba(255,210,74,.35); animation: blink 2.4s infinite; }
  .tog { position: absolute; top: calc(4px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; font-family: inherit; font-size: 17px; line-height: 1; padding: 0; touch-action: manipulation; cursor: pointer; }
  #btnBgm { right: calc(52px + env(safe-area-inset-right)); }
  .tog.off { opacity: .4; text-decoration: line-through; }
  @media (max-width: 700px) { #topbar { padding-left: calc(104px + env(safe-area-inset-left)); padding-right: calc(92px + env(safe-area-inset-right)); gap: 4px 5px; } .stat { font-size: 13px; padding: 3px 7px; gap: 4px; } .stat b { font-size: 15px; } .stat .bar { width: 46px; } .tog { width: 32px; height: 32px; font-size: 15px; } #btnBgm { right: calc(46px + env(safe-area-inset-right)); } }

  #toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); font-family: 'Ria', sans-serif; font-size: clamp(34px, 7vw, 76px); letter-spacing: 4px; color: #ffd24a; -webkit-text-stroke: 2px #5a2a10; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.5); opacity: 0; pointer-events: none; z-index: 8; text-align: center; white-space: nowrap; transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast.red { color: #ff7a5a; } #toast.blue { color: #7fdcff; -webkit-text-stroke-color: #103050; }
  #keys { position: fixed; right: 22px; bottom: 20px; font-size: 13px; opacity: 0; text-align: right; line-height: 1.7; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.7); transition: opacity .8s; z-index: 5; }
  #keys.show { opacity: .6; } body.touch #keys { display: none; } body.playing #keys { right: 124px; }

  .tbtn { display: none; position: fixed; width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.32); color: #fff; font-family: inherit; font-size: 18px; letter-spacing: 1px; touch-action: manipulation; z-index: 6; text-shadow: 0 1px 2px rgba(0,0,0,.6); padding: 0; right: calc(14px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); cursor: pointer; }
  .tbtn.on { background: rgba(255,210,74,.8); color: #2a1c08; border-color: #ffd24a; text-shadow: none; animation: blink 2.4s infinite; }
  body.playing .tbtn { display: block; }
  @media (max-height: 520px) { .tbtn { width: 72px; height: 72px; font-size: 15px; bottom: calc(16px + env(safe-area-inset-bottom)); } }

  /* 타이틀 */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7vh; background: linear-gradient(180deg, rgba(20,8,10,.3), rgba(20,8,10,0) 45%, rgba(20,8,10,0) 70%, rgba(20,8,10,.5)); transition: opacity 1s; text-align: center; z-index: 10; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 4px; opacity: .8; } #title .brand img { height: 18px; }
  #title h1 { font-family: 'Bagel', 'Ria', 'Griun', sans-serif; font-weight: 400; font-size: clamp(48px, 11vw, 116px); margin: 8px 0 0; letter-spacing: clamp(8px, 1.6vw, 18px); text-indent: clamp(8px, 1.6vw, 18px); color: #b8ff5a; text-shadow: 0 5px 0 #2e6a1e, 0 12px 30px rgba(0,0,0,.45); -webkit-text-stroke: 3px #1f4a14; paint-order: stroke fill; line-height: 1.05; }
  #title .sub { font-family: 'Bagel', 'Ria', sans-serif; font-size: clamp(16px, 3vw, 30px); letter-spacing: 9px; text-indent: 9px; color: #e4ffb0; -webkit-text-stroke: 1.5px #1f4a14; paint-order: stroke fill; text-shadow: 0 3px 0 #2e6a1e; margin-top: 2px; }
  #title .tag { font-family: 'Ria', sans-serif; font-size: 16px; letter-spacing: 6px; color: #ffd24a; margin-top: 6px; }
  #title .btns { margin-top: auto; margin-bottom: 9vh; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #title .go { font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 6px; text-indent: 6px; padding: 12px 40px 14px; border-radius: 999px; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.5); cursor: pointer; touch-action: manipulation; }
  #title .go.main { background: #ffd24a; color: #2a1c08; border-color: #ffd24a; animation: blink 2.4s infinite; }
  #title .go small { display: block; font-family: 'Griun', sans-serif; font-size: 13px; letter-spacing: 1px; text-indent: 0; opacity: .75; margin-top: 4px; }

  /* 상점 */
  #shop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(20,10,12,.5); opacity: 0; pointer-events: none; transition: opacity .3s; padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  #shop.show { opacity: 1; pointer-events: auto; }
  #shop .panel { width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 18px; background: rgba(40,18,16,.95); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 16px 48px rgba(0,0,0,.5); overflow: hidden; }
  #shop .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #shop .head h2 { font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 3px; color: #ffd24a; margin: 0; flex: 1; }
  #shop .tabs { display: flex; gap: 6px; }
  #shop .tabs button { font-family: inherit; font-size: 15px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.3); color: #fff; cursor: pointer; touch-action: manipulation; }
  #shop .tabs button.on { background: #ffd24a; color: #2a1c08; border-color: #ffd24a; }
  #shop .body { padding: 14px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 160px; }
  #shop .foot { display: flex; align-items: center; gap: 14px; padding: 10px 18px 12px; border-top: 1px solid rgba(255,255,255,.1); }
  #shop .foot .money { font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 1px; flex: 1; }
  #shop .next { font-family: 'Ria', sans-serif; font-size: 20px; letter-spacing: 4px; text-indent: 4px; padding: 10px 28px 12px; border-radius: 16px; background: #ffd24a; color: #2a1c08; border: 0; cursor: pointer; touch-action: manipulation; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .items .item { display: flex; align-items: center; gap: 10px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: 10px 12px; cursor: pointer; touch-action: manipulation; }
  .items .item.no { opacity: .45; cursor: default; } .items .item.max { border-color: rgba(127,224,138,.5); cursor: default; }
  .items .item .ic { font-size: 26px; width: 34px; text-align: center; }
  .items .item .n { flex: 1; font-size: 15px; } .items .item .n small { display: block; font-size: 12px; opacity: .6; margin-top: 2px; }
  .items .item .p { font-family: 'Ria', sans-serif; font-size: 17px; color: #ffd24a; white-space: nowrap; } .items .item.max .p { color: #7fe08a; }
  @media (max-width: 700px) { #shop .body { padding: 10px; } #shop .head h2 { font-size: 18px; } #shop .tabs button { font-size: 13px; padding: 5px 10px; } .items { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } .items .item { padding: 7px 9px; } }
  #back { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,12,6,.72); z-index: 60; }
  #back.show { display: flex; }
  #back .box { background: #fff7e8; color: #3a2a18; border: 4px solid #d99a3a; border-radius: 22px; padding: 26px 32px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45); max-width: 86vw; }
  #back .ttl { font-size: clamp(18px, 3vw, 28px); font-weight: 900; letter-spacing: 2px; }
  #back .row { font-size: clamp(15px, 2.4vw, 21px); margin-top: 12px; line-height: 1.7; }
  #back .row b { font-weight: 900; }
  #back .bonus { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: #ffeec4; font-size: clamp(14px, 2.2vw, 19px); }
  #back .next { margin-top: 20px; font-size: 20px; padding: 10px 34px; }
  #ending { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,12,6,.72); z-index: 60; }
  #ending.show { display: flex; }
  #ending .box { background: #fff7e8; color: #3a2a18; border: 4px solid #d99a3a; border-radius: 22px; padding: 30px 36px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45); max-width: 86vw; }
  #ending .ttl { font-size: clamp(20px, 3.6vw, 34px); font-weight: 900; line-height: 1.3; }
  #ending .sub { font-size: clamp(16px, 2.6vw, 24px); margin-top: 10px; }
  #ending .next { margin-top: 22px; font-size: 20px; padding: 10px 34px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>

<div id="topbar">
  <div class="stat"><span class="ic">☀️</span><b>DAY <span id="solN">1</span></b></div>
  <div class="stat"><span class="ic" id="cropIc">🥔</span><b id="cropN">0</b></div>
  <div class="stat"><span class="ic">🧱</span><b id="matN">0</b></div>
  <div class="stat" id="water"><span class="ic">💧</span><span class="bar"><i id="waterBar"></i></span><b id="waterN">40</b></div>
  <button id="btnBgm" class="tog" title="음악">♪</button>
  <button id="btnSfx" class="tog" title="효과음">🔊</button>
</div>
<div id="toast"></div>
<div id="back"><div class="box"><div class="ttl">WELCOME BACK</div><div class="row" id="backRow"></div><div class="bonus" id="backBonus" hidden></div><button class="next" id="btnBack" data-en="COLLECT">받기</button></div></div>
<div id="ending"><div class="box"><div class="ttl" data-en="Colony on Mars complete.">화성에 식민지를 완공하였습니다.</div><div class="sub" data-en="Redevelop?">재개발하실까요?</div><button class="next" id="btnRedev" data-en="REDEVELOP">재개발</button></div></div>
<div id="keys" data-en="Click act · Drag view · Wheel zoom<br>B build · M music · K sound">클릭 행동 · 끌기 화면 · 휠 확대<br>B 빌드 · M 음악 · K 효과음</div>
<button id="btnShop" class="tbtn" data-en="BUILD">빌드</button>
<div id="rotate">
  <div>
    <p data-en="This game plays in landscape">가로 화면에서 하는 게임입니다</p>
    <button type="button" id="rotGo" data-en="Turn to landscape">가로로 돌리기</button>
    <p class="sub"><span data-en="If the button does nothing, turn off your phone's rotation lock and lay it sideways">단추가 안 먹으면 폰의 화면 회전 잠금을 풀고 눕혀 주세요</span><br>
      <a href="#" id="rotSkip" data-en="Play in portrait anyway">그래도 세로로 하기</a></p>
  </div>
</div>

<div id="title">
  <div class="brand"><img src="assets/logo-oreum.svg" alt="">OREUM GAMES</div>
  <h1 data-en="팜온마즈">팜온마즈</h1>
  <div class="sub">FARM ON MARS</div>
  <div class="btns">
    <div class="go main" id="btnCont" hidden><span data-en="CONTINUE">계속하기</span><small id="contInfo"></small></div>
    <div class="go" id="btnNew"><span data-en="NEW GAME">새로 시작</span></div>
  </div>
</div>

<div id="shop">
  <div class="panel">
    <div class="head"><h2 data-en="BUILD">빌드</h2>
      <div class="tabs" id="tabs"><button data-tab="farm" class="on" data-en="FARM">농장</button><button data-tab="city" data-en="CITY">도시</button></div>
    </div>
    <div class="body" id="shopBody"></div>
    <div class="foot"><div class="money">🧱 <span id="shopMat">0</span></div><button class="next" id="btnClose" data-en="CLOSE">닫기</button></div>
  </div>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="assets/landscape.js?v=48"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/buildings.js?v=1"></script>
<script src="js/game.js?v=53"></script>
<script src="/assets/visit.js" defer></script>
<script src="/assets/game-events.js" defer></script>
</body>
</html>
