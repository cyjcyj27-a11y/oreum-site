<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>달빛 의적</title>
<style>
/* 단추 소재 = 조선 관아 물건(도트)
   주 단추: 단청 현판(짙은 초록 판 + 붉은·초록·노랑 단청 띠 테 + 금빛 글씨) · 보조: 창호 문살(창호지 + 나무 살)
   둥근 단추: 놋그릇 · 상단 알약: 먹 칠한 나무 패에 놋쇠 테(붉은 구슬 체력, 엽전) · 창: 한지 + 나무 테·단청 띠 */
@font-face{font-family:'Ttl';src:url('fonts/title.woff2?v=1') format('woff2');font-display:block}
@font-face{font-family:'Px';src:url('fonts/ui.woff2?v=4') format('woff2');font-display:block}
:root{--rug:#1f5a44;--rugD:#0c2a20;--rugL:#2f7a5c;--red:#c8382a;--gold:#f0c058;--goldD:#9a6a1c;--cream:#fff0c8;--tile:#1f4fa8;--tileD:#0f2a66;--tileL:#3a7ae0;--brass:#d8a840;--ink:#1a0e12;--parch:#f2dcaa;--parchD:#c8a46a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0710;color:#fff;font-family:'Px','Malgun Gothic',monospace;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}

/* ---------- 주 단추: 양탄자 ---------- */
.btn{position:relative;border:0;cursor:pointer;font:400 24px/1 'Px',monospace;color:#ffe08a;padding:15px 32px 14px;min-width:150px;white-space:nowrap;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 3px,transparent 3px 9px),linear-gradient(180deg,var(--rugL) 0 18%,var(--rug) 18% 82%,var(--rugD) 82%);
  box-shadow:inset 0 0 0 3px var(--rugD),inset 0 0 0 5px var(--red),inset 0 0 0 7px #2f8a5a,inset 0 0 0 9px var(--gold),inset 0 0 0 11px var(--rugD),0 4px 0 var(--ink),0 0 0 3px var(--ink);
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 4px var(--ink);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .12s}
.btn::before,.btn::after{content:'';position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.btn::before{left:14px}.btn::after{right:14px}
.btn span{position:relative}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px var(--rugD),inset 0 0 0 5px var(--red),inset 0 0 0 7px #2f8a5a,inset 0 0 0 9px var(--gold),inset 0 0 0 11px var(--rugD),0 1px 0 var(--ink),0 0 0 3px var(--ink);transition-duration:.04s}
/* 보조 단추: 청색 타일 */
.btn.tile{color:#3a2210;text-shadow:none;background:
    linear-gradient(90deg,transparent 0 calc(50% - 1px),#7a5634 calc(50% - 1px) calc(50% + 1px),transparent 0) 0 0/24px 100%,
    linear-gradient(0deg,transparent 0 calc(50% - 1px),#7a5634 calc(50% - 1px) calc(50% + 1px),transparent 0) 0 0/100% 50%,
    #f2e6c4;
  box-shadow:inset 0 0 0 3px #5a3e24,inset 0 0 0 5px #9a7448,0 4px 0 var(--ink),0 0 0 3px var(--ink)}
.btn.tile span{background:#f2e6c4;padding:2px 6px}
.btn.tile::before,.btn.tile::after{display:none}
.btn.tile:active{box-shadow:inset 0 0 0 3px #5a3e24,inset 0 0 0 5px #9a7448,0 1px 0 var(--ink),0 0 0 3px var(--ink)}
.btn.sm{font-size:18px;padding:11px 18px 10px;min-width:96px}

/* ---------- 상단바: 놋쇠 판 ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(104px + env(safe-area-inset-left))}
.stat{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;background:#140a0c;font:400 16px/1 'Px',monospace;color:var(--gold);
  box-shadow:inset 0 0 0 2px var(--goldD),0 0 0 2px var(--ink),0 3px 0 var(--ink)}
.stat .lb{font-size:11px;color:#c8a070}
#hp{display:flex;gap:2px}
.pip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0b0 0 18%,#e83a2a 22% 60%,#901a14 64%)}
.pip.off{background:#3a1a18;box-shadow:inset 0 0 0 2px #5a2a24}
.gm{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,transparent 0 22%,#f0c058 24% 70%,#9a6a1c 74%);position:relative}
.gm::after{content:'';position:absolute;left:4px;top:4px;width:4px;height:4px;background:#140a0c}
.spacer{flex:1}
.togs{display:flex;gap:6px}
/* 둥근 단추: 놋쇠 쟁반 */
.tog{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;position:relative;flex:none;
  background:radial-gradient(circle,#e8bc58 0 40%,#c89a38 40% 62%,#f0d070 62% 70%,#9a6a1c 70%);box-shadow:0 0 0 2px var(--ink),0 3px 0 var(--ink);transition:transform .15s}
.tog svg{width:20px;height:20px;position:absolute;left:9px;top:9px}
.tog svg *{fill:var(--ink);stroke:var(--ink)}
.tog svg .s{fill:none}
.tog:active{transform:translateY(2px)}
.tog.off{opacity:.6}
.tog.off::after{content:'';position:absolute;left:20%;right:20%;top:50%;height:3px;margin-top:-1px;background:var(--ink);transform:rotate(-40deg)}
body.playing #oreumFs{display:none}

/* ---------- 창: 양피지 + 양탄자 테 ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,4,10,.6)}
.sheet{position:relative;padding:24px 26px 20px;max-width:min(560px,94vw);max-height:92vh;overflow:auto;color:#3a2210;text-align:center;
  background:repeating-linear-gradient(17deg,rgba(150,120,70,.07) 0 1px,transparent 1px 7px),#f4ead2;
  box-shadow:inset 0 0 0 3px #d8c8a0,0 0 0 4px var(--ink),0 0 0 9px #6a4a2a,0 0 0 11px var(--red),0 0 0 13px #2f8a5a,0 0 0 15px var(--gold),0 0 0 17px var(--ink),0 10px 0 17px rgba(0,0,0,.4);
  animation:pop .18s steps(4)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{font:400 30px/1.1 'Px',monospace;color:var(--red);margin:2px 0 14px;text-shadow:0 2px 0 var(--parchD)}
.sheet p{font-size:16px;line-height:1.55;word-break:keep-all}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* ---------- 타이틀 ---------- */
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(10vh + env(safe-area-inset-bottom));pointer-events:none}
#title>*{pointer-events:auto}

/* ---------- 판 시작 글 ---------- */
#card{position:fixed;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none}
#card .a{font:400 44px/1 'Px',monospace;color:var(--gold);text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),0 6px var(--ink)}
#card .b{font:400 22px/1 'Px',monospace;color:var(--cream);margin-top:14px;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink)}
#pops{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font:400 30px/1 'Px',monospace;white-space:nowrap;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),0 5px var(--ink);animation:pp 1.2s steps(12) forwards}
.pop.big{font-size:42px}
@keyframes pp{0%{transform:translate(-50%,-30%);opacity:0}15%{transform:translate(-50%,-50%);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%);opacity:0}}
#keys{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:8px;z-index:5;pointer-events:none;font:400 13px/1.5 'Px',monospace;color:rgba(255,240,200,.62);text-align:right;text-shadow:1px 0 #1a0e12,-1px 0 #1a0e12,0 1px #1a0e12,0 -1px #1a0e12;display:none}
#keys b{color:#f0c058;font-weight:400}
body.playing:not(.touch) #keys{display:block}
#fade{position:fixed;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none;transition:opacity .35s steps(5)}

/* ---------- 폰 조작 ---------- */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
/* 왼쪽 원형 조이스틱(10/20 사장님 "모바일조이스틱 원형으로"): 좌우 달리기, 위 점프·오르기(싸울 때 막기), 아래 숙이기·내려가기, 대각선 위 = 달리며 뛰기.
   받침 = 먹 칠한 나무 원판에 놋쇠 테, 손잡이 = 상단 둥근 단추와 같은 놋쇠 쟁반. 왼쪽 아래 구석 어디를 눌러도 잡힌다(#szone). 오른쪽 구석은 공격 */
#szone{position:absolute;left:0;bottom:0;width:42%;height:62%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;pointer-events:none;opacity:.7;
  background:radial-gradient(circle,rgba(20,10,12,.38) 0 58%,rgba(20,10,12,.5) 58% 100%);box-shadow:inset 0 0 0 3px rgba(240,192,88,.9),inset 0 0 0 5px rgba(26,14,18,.55),0 0 0 2px rgba(26,14,18,.6)}
#stick svg{position:absolute;inset:0;width:100%;height:100%}
#stick svg path{fill:var(--cream);stroke:var(--ink);stroke-width:1.5;opacity:.85}
#stick svg path.on{fill:var(--gold);opacity:1}
#sKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff0b8 0 10%,#e8bc58 16% 46%,#c89a38 46% 62%,#f0d070 62% 70%,#9a6a1c 70%);box-shadow:0 0 0 2px var(--ink),0 3px 0 var(--ink)}
#stick.on{opacity:.95}
#acts{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));width:84px;height:84px;pointer-events:none}
.ab{position:absolute;pointer-events:auto;border:0;font:400 16px/1 'Px',monospace;color:var(--cream);touch-action:none;opacity:.62;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink)}
#bAtk{right:0;bottom:0;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,var(--rugL) 0 50%,var(--rug) 50% 66%,var(--red) 66% 72%,var(--gold) 72% 80%,var(--rugD) 80%);box-shadow:0 0 0 3px var(--ink)}
.ab.on{opacity:.95;filter:brightness(1.35);transform:translateY(2px)}
#rotate{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0710;pointer-events:auto}
@media (orientation:portrait) and (max-width:820px){body.touch #rotate{display:flex}}
html.ol-land body.touch #rotate{display:none!important}
.rotTip{font:400 22px/1.4 'Px',monospace;color:var(--cream);text-align:center;padding:0 24px;word-break:keep-all;text-shadow:0 2px 0 var(--ink)}

/* ---------- 설명 ---------- */
#how .sheet{max-width:min(1040px,97vw)}
#howRow{display:flex;gap:14px;justify-content:center}
.hc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.hc canvas{width:100%;max-width:240px;aspect-ratio:4/3;image-rendering:pixelated;background:#140a0c;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--gold)}
.hc p{font-size:15px;line-height:1.45;word-break:keep-all}
.hc b{color:var(--red)}
/* ---------- 엔딩 ---------- */
#end .sheet{max-width:min(900px,96vw)}
#endWrap{display:flex;gap:18px;align-items:center}
#cardImg{width:min(290px,40vw);aspect-ratio:4/5;box-shadow:0 0 0 3px var(--ink);background:#111;image-rendering:auto}
#endTxt{flex:1;font-size:17px;line-height:1.7}

@media (max-aspect-ratio:3/4){
  #howRow{flex-direction:column;gap:10px}
  .hc{flex-direction:row;text-align:left}
  .hc canvas{width:36vw;flex:none}
  #endWrap{flex-direction:column}
  #cardImg{width:min(240px,60vw)}
}
@media (max-height:480px){
  #title{padding-bottom:26vh}
  .btn{font-size:5.6vh;padding:2.4vh 5vh 2.2vh;min-width:0}
  .btn.sm{font-size:4.6vh;padding:2vh 3.4vh}
  .sheet{padding:4vh 22px 3vh;max-height:94vh}
  .sheet h2{font-size:7vh;margin:0 0 2.5vh;text-align:left;padding-left:120px}
  #how .row{position:absolute;right:18px;top:2.6vh;margin:0}
  #how .row .btn{font-size:5vh;padding:1.6vh 3.6vh}
  .hc canvas{max-width:40vh}
  .hc p{font-size:3.8vh}
  #card .a{font-size:11vh}#card .b{font-size:5.5vh}
  .pop{font-size:8vh}.pop.big{font-size:11vh}
  #cardImg{width:auto;height:68vh}
  #endTxt{font-size:4vh}
  #stick{width:34vh;height:34vh}#bAtk{width:21vh;height:21vh}#acts{width:21vh;height:21vh}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="stat"><div id="hp"></div></div>
  <div class="stat"><span class="lb">LEVEL</span><span id="hLv">1</span></div>
  <div class="stat"><span class="gm"></span><span id="hGem">0</span></div>
  <div class="spacer"></div>
  <div class="togs">
  <button class="tog" id="bHow" aria-label="HOW TO PLAY"><svg viewBox="0 0 24 24"><path class="s" d="M8.5 9a3.5 3.5 0 1 1 5 3.2c-1 .5-1.5 1.2-1.5 2.3v.5" stroke-width="3" stroke-linecap="square"/><rect x="10.3" y="17.6" width="3.4" height="3.4"/></svg></button>
  <button class="tog" id="bPause" aria-label="PAUSE"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14"/><rect x="13.8" y="5" width="4.2" height="14"/></svg></button>
  <button class="tog" id="bBgm" aria-label="BGM"><svg viewBox="0 0 24 24"><path class="s" d="M9 17.5V5.5l11-2.5v12" stroke-width="2.6"/><ellipse cx="6.3" cy="17.8" rx="3.4" ry="2.7"/><ellipse cx="17.3" cy="15.3" rx="3.4" ry="2.7"/></svg></button>
  <button class="tog" id="bSnd" aria-label="SFX"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4.5v15L7 15H3z"/><path class="s" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke-width="2.4"/></svg></button>
  </div>
</div>

<div id="title">
  <div class="row" id="tBtns">
    <button class="btn" id="bStart"><span>START</span></button>
    <button class="btn tile" id="bCont" hidden><span>CONTINUE</span></button>
  </div>
</div>

<div id="card" hidden><div class="a" id="cardA"></div><div class="b" id="cardB"></div></div>
<div id="pops"></div>
<div id="fade"></div>
<div id="keys" data-k="keys"><b>← →</b> 달리기 · <b>↑</b> 점프·오르기 · <b>↓</b> 숙이기·내려가기<br><b>Z</b> 공격 · 싸울 때 <b>↑</b> 막기</div>

<div id="touch">
  <div id="szone"></div>
  <div id="stick"><svg viewBox="0 0 100 100"><path id="aU" d="M50 9l9 10H41z"/><path id="aD" d="M50 91l9-10H41z"/><path id="aL" d="M9 50l10-9v18z"/><path id="aR" d="M91 50l-10-9v18z"/></svg><div id="sKnob"></div></div>
  <div id="acts">
    <button class="ab" id="bAtk" data-k="atk"><span data-t="atk">공격</span></button>
  </div>
</div>

<div id="rotate"><p class="rotTip" data-k="rot">폰을 가로로 돌려 주세요</p><button class="btn" id="bRot"><span data-t="rot">가로 화면으로</span></button></div>

<div class="ov" id="how" hidden><div class="sheet">
  <h2>HOW TO PLAY</h2>
  <div id="howRow">
    <div class="hc"><canvas id="hw1" width="160" height="120"></canvas><p data-k="h1">달리다 <b>점프</b>하면 멀리 뛰어요. 그냥 달려 나가면 떨어져요</p></div>
    <div class="hc"><canvas id="hw2" width="160" height="120"></canvas><p data-k="h2">위 칸 끝으로 <b>점프</b>하면 매달려요. <b>위</b>를 누르면 올라가요</p></div>
    <div class="hc"><canvas id="hw3" width="160" height="120"></canvas><p data-k="h3">적이 무기를 <b>쳐들면 ↑ 로 막고</b>, 그다음 <b>공격</b></p></div>
    <div class="hc"><canvas id="hw4" width="160" height="120"></canvas><p data-k="h4">화살이 날아오면 <b>↓</b> 로 숙여 피해요</p></div>
  </div>
  <div class="row"><button class="btn" id="howOk"><span>OK</span></button></div>
</div></div>

<div class="ov" id="pause" hidden><div class="sheet">
  <h2>PAUSE</h2>
  <div class="row"><button class="btn" id="pResume"><span>RESUME</span></button></div>
  <div class="row"><button class="btn tile sm" id="pRetry"><span>RETRY</span></button><button class="btn tile sm" id="pTitle"><span>TITLE</span></button></div>
</div></div>

<div class="ov" id="end" hidden><div class="sheet">
  <h2>THE END</h2>
  <div id="endWrap"><img id="cardImg" alt=""><div id="endTxt"></div></div>
  <div class="row"><button class="btn tile sm" id="cSave"><span>저장</span></button><button class="btn tile sm" id="cShare"><span>공유</span></button><button class="btn" id="endOk"><span>OK</span></button></div>
</div></div>

<script src="js/lang.js?v=3"></script>
<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/pix.js?v=4"></script>
<script src="js/world.js?v=2"></script>
<script src="js/render.js?v=2"></script>
<script src="js/levels.js?v=1"></script>
<script src="js/game.js?v=19"></script>
<script src="js/sfx.js?v=2"></script>
<script src="js/how.js?v=2"></script>
<script src="js/card.js?v=2"></script>
<script src="js/main.js?v=8"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
