<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f5d4a">
<meta name="robots" content="noindex">
<title>두뇌풀가동</title>
<link rel="preload" as="image" href="assets/teacher.webp?v=9" fetchpriority="high">
<style>
@font-face{font-family:'NG';src:url('fonts/NanumGothic-title.woff2?v=2') format('woff2');font-display:swap}   /* Nanum Gothic ExtraBold (OFL) — 제목·문제 숫자 부분집합 */
@font-face{font-family:'Ria';src:url('fonts/RiaSans-ExtraBold.woff2') format('woff2');font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{width:100%;height:100%;overflow:hidden;background:#2f5d4a;
  font-family:'Ria',-apple-system,'Malgun Gothic',sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
body.hit #cv,body.hit #q{animation:hit .32s}
@keyframes hit{0%,100%{transform:none}20%{transform:translate(-7px,2px)}40%{transform:translate(7px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

/* ---------- 상단바 (스카이라이더 배치) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;pointer-events:none;
  padding:6px 8px 20px calc(104px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0))}
.stat{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);
  border-radius:999px;padding:5px 10px;font-size:15px}
.stat i{font-style:normal;font-size:13px}
.stat b{font-size:17px;font-weight:400;letter-spacing:.3px}
#hearts{font-size:16px;letter-spacing:1px;color:#ff5a6e}
#hearts .lost{color:rgba(255,255,255,.25)}
.bar{width:84px;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.bar>span{display:block;height:100%;width:100%;border-radius:4px;background:#8fd3ff}
#tbar>span{transition:none}
#tbar.low>span{background:#ff5a5a}
#gbar>span{background:linear-gradient(90deg,#ffb347,#ffe066);width:0;transition:width .25s}
#gbar.full>span{animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.6)}}
.spacer{flex:1 1 20px}
.tog{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(0,0,0,.4);color:#fff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;position:relative;font-family:inherit;touch-action:manipulation}
.tog.off{opacity:.4}
.tog.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;background:#fff;transform:rotate(-45deg);border-radius:1px}
@media (max-width:700px){.stat b{font-size:15px}.stat{padding:5px 8px;gap:5px}.bar{width:52px}#topbar{gap:5px}}
@media (orientation:portrait){#topbar{padding:calc(30px + env(safe-area-inset-top)) 8px 16px 8px;gap:5px}
  #topbar .stat{padding:4px 9px;gap:5px}#topbar .stat b{font-size:15px}#topbar .bar{width:44px}#topbar .tog{width:34px;height:34px}}

/* ---------- 문제 (칠판 글씨) ---------- */
#q{position:fixed;z-index:12;display:flex;align-items:center;justify-content:center;pointer-events:none;
  left:36%;right:2%;top:14%;height:34%}
#qt{font-family:'NG','Ria',sans-serif;font-weight:400;color:#fff;text-align:center;white-space:nowrap;line-height:1;
  font-size:clamp(44px,min(8.6vw,17vh),150px);letter-spacing:.02em;
  text-shadow:0 0 1px rgba(255,255,255,.6),0 2px 0 rgba(0,0,0,.25),0 0 18px rgba(255,255,255,.18);
  transition:transform .12s}
#qt .op{color:#ffe066;margin:0 .12em}
#qt .bx{color:#8fe3ff}
#qt .eq{color:#cfd8d4;margin:0 .12em}
#q.qp #qt{animation:qpop .28s ease-out}
@keyframes qpop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
#q.full #qt{color:#fff3b0;text-shadow:0 0 2px #fff,0 0 22px #ffb347,0 0 50px #ff7a1a}
@media (orientation:portrait){#q{left:0;right:0;top:41%;height:16%}#qt{font-size:clamp(40px,11.5vw,72px)}}

/* ---------- 답 단추 (칠판에 붙인 종이 카드) ---------- */
#ans{position:fixed;z-index:14;display:grid;gap:14px;
  left:38%;right:3%;bottom:calc(4% + env(safe-area-inset-bottom));height:44%;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#ans.ox{grid-template-rows:1fr}
#ans.hid{display:none}
.ab{border:0;cursor:pointer;font-family:'NG','Ria',sans-serif;font-size:clamp(34px,min(5.4vw,9vh),88px);color:#243247;
  background:linear-gradient(180deg,#fffdf3,#f2ead2);border-radius:14px;touch-action:manipulation;position:relative;
  box-shadow:0 7px 0 #c9bf9f,0 12px 22px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,background .12s;
  line-height:1;padding-bottom:6px;overflow:hidden}
.ab::before{content:'';position:absolute;left:50%;top:-6px;width:44px;height:16px;margin-left:-22px;background:rgba(255,230,120,.75);
  transform:rotate(-3deg);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.15)}   /* 붙인 테이프 */
.ab:nth-child(2)::before{transform:rotate(4deg)}
.ab:nth-child(3)::before{transform:rotate(2deg)}
.ab:nth-child(4)::before{transform:rotate(-5deg)}
.ab small{position:absolute;left:10px;top:8px;font-family:'Ria',sans-serif;font-size:14px;color:#9a917a}
body.touch .ab small{display:none}
.ab.on{transform:translateY(6px);box-shadow:0 1px 0 #c9bf9f,0 4px 10px rgba(0,0,0,.25)}
.ab.ok{background:linear-gradient(180deg,#c9f7b0,#8fe36b);color:#1e4d10;box-shadow:0 7px 0 #4e9a2c,0 12px 22px rgba(0,0,0,.28)}
.ab.ng{background:linear-gradient(180deg,#ffc9c9,#ff8a8a);color:#6a1010;box-shadow:0 7px 0 #b84a4a}
.ab.dim{opacity:.45}
#ans.ox .ab{font-size:clamp(60px,min(9vw,16vh),140px)}
#ans.ox .ab:nth-child(1){color:#1f6fd0}
#ans.ox .ab:nth-child(2){color:#d03a3a}
@media (orientation:portrait){#ans{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:38%;gap:11px}
  .ab{font-size:clamp(34px,10vw,64px);border-radius:12px}#ans.ox .ab{font-size:clamp(70px,22vw,120px)}}
@media (orientation:landscape) and (max-height:500px){#ans{gap:9px;height:50%}.ab{font-size:clamp(28px,8vh,60px)}#q{top:12%;height:30%}}

/* ---------- 큰 글자 판 ---------- */
.panel{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.panel.on{display:flex}
.panel h1{font-family:'NG','Ria',sans-serif;font-weight:400;line-height:1;text-align:center;
  color:#fff;-webkit-text-stroke:3px #16302a;paint-order:stroke fill;text-shadow:0 7px 0 #16302a,0 12px 30px rgba(0,0,0,.35)}
.panel .num{font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.35)}
.btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;font-size:30px;color:#243247;
  background:linear-gradient(180deg,#fffdf3,#f2ead2);padding:12px 46px;border-radius:999px;letter-spacing:.06em;
  box-shadow:0 7px 0 #c9bf9f,0 14px 30px rgba(0,0,0,.3);touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c9bf9f}
.btn.sub{font-size:20px;padding:9px 30px;background:#3f7a63;color:#fff;box-shadow:0 5px 0 #1e4636,0 10px 24px rgba(0,0,0,.25)}
.btn.sub:active{box-shadow:0 1px 0 #1e4636}
.btn.inf{font-family:'NG','Ria',sans-serif;font-size:34px;padding:6px 40px;background:linear-gradient(180deg,#ffe9a8,#ffc94d);color:#5a3a00;box-shadow:0 7px 0 #b8861a,0 14px 30px rgba(0,0,0,.3)}

#title{justify-content:flex-start;padding-top:8vh;gap:8px}
#title h1{font-size:clamp(64px,min(13vw,19vh),150px);letter-spacing:.01em;transform:rotate(-2deg);animation:bob 2.4s ease-in-out infinite;-webkit-text-stroke:5px #16302a}
#title h1 .t1{color:#ffe066}
#title h1 .t2{color:#fff}
@keyframes bob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(0deg) translateY(-8px)}}
#title .best{font-size:18px;color:#e8f3ec;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#title .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
@media (orientation:portrait){#title{padding-top:calc(var(--tb,100px) + 10px);transform-origin:50% 0}
  #title h1{font-size:clamp(54px,15vw,84px)}#title .btn{font-size:22px;padding:9px 30px;white-space:nowrap}#title .btn.sub{font-size:15px;padding:7px 22px}#title .best{font-size:15px}
  #title .btn.inf{font-size:28px;padding:5px 30px}}
@media (orientation:landscape) and (max-height:500px){#title{padding-top:7vh;gap:6px}#title h1{font-size:clamp(56px,16vh,110px)}}

#stage h1{font-size:clamp(70px,14vw,150px);color:#ffe066;animation:pop .35s ease-out}
#stage .sub{font-size:clamp(22px,4vw,40px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);animation:pop .4s ease-out}
#clear h1{font-size:clamp(84px,17vw,170px);color:#ffe066;animation:pop .35s ease-out}
#over h1{font-size:clamp(70px,14vw,160px);color:#ff6b6b;animation:pop .35s ease-out}
#clearStars{font-size:54px;letter-spacing:6px;color:#ffd23a;text-shadow:0 4px 0 #9a6a00}
#clearStars .off{color:rgba(255,255,255,.35);text-shadow:none}
#ending .crown{font-size:90px;animation:pop .5s ease-out}
#ending h1{font-size:clamp(50px,min(9vw,12vh),120px);line-height:1.1;color:#ffe066;animation:pop .5s ease-out}
#ending .congrats{font-family:'NG','Ria',sans-serif;font-size:clamp(30px,min(5.5vw,8vh),64px);color:#fff;-webkit-text-stroke:2px #16302a;paint-order:stroke fill;text-shadow:0 5px 0 #16302a;animation:pop .45s ease-out}
#over,#clear,#ending{background:rgba(6,20,14,.35)}
@media (orientation:portrait){#over,#clear{justify-content:flex-end;padding-bottom:16%}}   /* 세로: 글자는 아래쪽(카드 자리), 선생님은 위에 그대로 */
#pause{background:rgba(6,20,14,.5)}
#pause .btn{font-size:40px;padding:10px 40px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* ---------- 떠오르는 글 ---------- */
#pops{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.pop{position:absolute;white-space:nowrap;animation:up 1s ease-out forwards;font-family:'NG','Ria',sans-serif;
  font-size:clamp(38px,6.5vw,70px);color:#ffe066;-webkit-text-stroke:3px #6b4a00;paint-order:stroke fill;text-shadow:0 5px 0 #6b4a00}
.pop.great{color:#8fe36b;-webkit-text-stroke-color:#2c5e14;text-shadow:0 5px 0 #2c5e14}
.pop.nice{color:#8fd3ff;-webkit-text-stroke-color:#1d4d7a;text-shadow:0 5px 0 #1d4d7a}
.pop.miss{color:#ff6b6b;-webkit-text-stroke-color:#6a1010;text-shadow:0 5px 0 #6a1010}
.pop.full{color:#fff;-webkit-text-stroke-color:#c2410c;text-shadow:0 5px 0 #c2410c,0 0 30px #ff9a3c;font-size:clamp(46px,8vw,90px)}
.pop.score{font-family:'Ria',sans-serif;font-size:clamp(22px,3.6vw,36px);color:#fff;-webkit-text-stroke-color:#16302a;text-shadow:0 3px 0 #16302a}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
</style></head>
<body>

<canvas id="cv"></canvas>

<div id="topbar">
  <div class="stat"><b id="stg">STAGE 1</b></div>
  <div class="stat"><span id="hearts"></span></div>
  <div class="stat"><i>⏱</i><span class="bar" id="tbar"><span></span></span></div>
  <div class="stat"><i>⚡</i><span class="bar" id="gbar"><span></span></span></div>
  <div class="stat"><i>⭐</i><b id="score">0</b></div>
  <div class="spacer"></div>
  <button class="tog" id="tPause" title="일시정지">❚❚</button>
  <button class="tog" id="tBgm" title="음악">♪</button>
  <button class="tog" id="tSnd" title="효과음">🔊</button>
</div>

<div id="q"><div id="qt"></div></div>
<div id="ans" class="hid">
  <button class="ab"><small>1</small><span></span></button>
  <button class="ab"><small>2</small><span></span></button>
  <button class="ab"><small>3</small><span></span></button>
  <button class="ab"><small>4</small><span></span></button>
</div>
<div id="pops"></div>

<div class="panel" id="title">
  <h1 id="ttl"><span class="t1">두뇌</span><span class="t2">풀가동</span></h1>
  <div class="row"><button class="btn" id="start">START</button><button class="btn inf" id="inf" hidden>∞</button></div>
  <button class="btn sub" id="newgame" hidden>NEW GAME</button>
  <div class="best" id="best"></div>
</div>
<div class="panel" id="stage"><h1 id="stageT">STAGE 1</h1><div class="sub" id="stageS"></div></div>
<div class="panel" id="clear"><h1>CLEAR</h1><div id="clearStars"></div><div class="num" id="clearN"></div><button class="btn" id="next">NEXT</button></div>
<div class="panel" id="ending"><div class="crown">👑</div><div class="congrats" data-en="Congratulations!">축하드립니다!</div><h1 data-en="You are the<br>BRAIN KING">당신은<br>두뇌왕입니다</h1><div class="num" id="endN"></div><button class="btn" id="endNext">HOME</button></div>
<div class="panel" id="over"><h1>GAME OVER</h1><div class="num" id="overN"></div><button class="btn" id="retry">RETRY</button><button class="btn sub" id="home2">HOME</button></div>
<div class="panel" id="pause"><button class="btn" id="resume">▶</button></div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/teacher.js?v=9"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/art.js?v=11"></script>
<script src="js/game.js?v=5"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
