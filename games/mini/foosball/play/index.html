<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>테이블축구게임</title>
<style>
@font-face{font-family:'Stylish';src:url('fonts/stylish-title.woff2?v=2') format('woff2');font-display:block}
@font-face{font-family:'Ria';src:url('fonts/RiaSans-ExtraBold.woff2') format('woff2');font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#1b130e;
  font-family:'Ria',-apple-system,'Malgun Gothic',sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- 상단바 (스카이라이더 배치) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 8px calc(104px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0))}
body:not(.playing) #topbar .game{display:none}
.stat{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);
  border-radius:15px;padding:5px 10px;backdrop-filter:blur(4px)}
.stat i{font-style:normal;font-size:13px;opacity:.9}
.stat b{font-size:17px;font-weight:400;letter-spacing:.3px}
.spacer{flex:1 1 10px}
.tog{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(0,0,0,.4);color:#fff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;position:relative;font-family:inherit}
.tog.off{opacity:.4}
.tog.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;
  background:#fff;transform:rotate(-45deg);border-radius:1px}
@media (max-width:700px){.stat b{font-size:15px}.stat{padding:5px 8px;gap:5px}#topbar{gap:5px}
  .tog{width:34px;height:34px}}

/* ---------- 점수판 ---------- */
#sb{position:fixed;left:50%;transform:translateX(-50%);z-index:15;top:calc(50px + env(safe-area-inset-top));
  display:flex;align-items:stretch;border-radius:14px;overflow:hidden;pointer-events:none;
  background:rgba(12,8,6,.72);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 6px 20px rgba(0,0,0,.35)}
body:not(.playing) #sb{display:none}
#sb .tm{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:16px;white-space:nowrap}
#sb .chip{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#sb .sc{display:flex;align-items:center;gap:8px;padding:2px 14px;background:rgba(255,255,255,.1);
  font-size:30px;line-height:1;letter-spacing:1px}
#sb .sc i{font-style:normal;opacity:.5;font-size:22px}
#sb .sc b{font-weight:400;min-width:.6em;text-align:center}
#sb .sc b.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.6);color:#ffe14d}}
@media (max-height:500px){#sb{top:calc(46px + env(safe-area-inset-top))}#sb .sc{font-size:24px}#sb .tm{font-size:14px;padding:3px 10px}}
@media (max-width:700px){#sb{top:calc(88px + env(safe-area-inset-top))}}
@media (max-width:700px) and (max-height:500px){#sb{top:calc(44px + env(safe-area-inset-top))}}

/* ---------- 결과 글자 ---------- */
#word{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);z-index:26;pointer-events:none;
  font-family:'Stylish','Ria',sans-serif;font-size:clamp(64px,15vw,150px);color:#ffe14d;opacity:0;white-space:nowrap;
  -webkit-text-stroke:.03em #3a2200;paint-order:stroke fill;
  text-shadow:0 6px 0 rgba(60,30,0,.7),0 0 30px rgba(255,200,60,.55);
  transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .25s}
#word.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#word.them{color:#dfe6ff;-webkit-text-stroke-color:#1a2250;text-shadow:0 6px 0 rgba(10,20,60,.7),0 0 30px rgba(120,150,255,.5)}
#word small{display:block;font-family:'Ria',sans-serif;font-size:.26em;text-align:center;letter-spacing:2px;-webkit-text-stroke:0;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.6)}

#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top));z-index:40;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(90deg,#1f5a2e,#2f8a45);padding:9px 18px;border-radius:20px;font-size:17px;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-14px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ---------- 조작 (폰) ---------- */
.kbtn{position:fixed;z-index:22;width:96px;height:96px;border-radius:50%;
  right:calc(22px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.32);border:2.5px solid rgba(255,255,255,.55);color:#fff;
  display:grid;place-items:center;font-family:inherit;font-size:17px;letter-spacing:1px;touch-action:none;cursor:pointer}
.kbtn span{display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none}
.kbtn span i{font-style:normal;font-size:30px;line-height:1}
.kbtn.on{background:rgba(255,214,60,.4);border-color:#ffe14d}
#k1{right:auto;left:calc(22px + env(safe-area-inset-left));bottom:calc(64px + env(safe-area-inset-bottom))}
body:not(.playing) .kbtn,body:not(.touch) .kbtn{display:none}
body:not(.duo) #k1{display:none}
/* 2P 는 PC 에서만: 폰에선 비활성 단추로 보여 준다 (사장님 9/20) */
#duoPc{display:none;font-size:12px;letter-spacing:1px;opacity:.85}
body.touch #bDuo{opacity:.45;pointer-events:none}
body.touch #duoPc{display:inline}
.track{position:fixed;z-index:21;pointer-events:none;width:46px;border-radius:23px;
  top:30%;bottom:26%;left:calc(18px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.18)}
.track::before,.track::after{position:absolute;left:0;right:0;text-align:center;font-size:15px;opacity:.55}
.track::before{content:'▲';top:6px}.track::after{content:'▼';bottom:6px}
.track i{position:absolute;left:5px;right:5px;height:34px;margin-top:-17px;border-radius:17px;background:rgba(255,255,255,.55);
  box-shadow:0 0 12px rgba(255,255,255,.4)}
#tr2{left:auto;right:calc(18px + env(safe-area-inset-right));bottom:36%}
body:not(.playing) .track,body:not(.touch) .track{display:none}
body:not(.duo) #tr2{display:none}
body.duo .track,body.duo #tr2{top:20%;bottom:46%}
#keys{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;
  font-size:20px;opacity:.9;pointer-events:none;text-align:right;line-height:1.5;text-shadow:0 1px 3px #000,0 0 8px #000;
  background:rgba(0,0,0,.35);padding:6px 14px;border-radius:14px}
body.touch #keys,body:not(.playing) #keys{display:none}

/* ---------- 타이틀 ---------- */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:60px 16px calc(20px + env(safe-area-inset-bottom))}
#logo{font-family:'Stylish','Ria',sans-serif;font-size:clamp(54px,11.5vw,130px);line-height:1;text-align:center;
  color:#fff7e0;letter-spacing:.02em;white-space:nowrap;
  -webkit-text-stroke:.025em #10240f;paint-order:stroke fill;
  text-shadow:0 .05em 0 #1d5a26,0 .09em 0 #0f2f14,0 .12em .18em rgba(0,0,0,.6)}
.menu{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(80vw,310px)}
.btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;color:#fff;border-radius:16px;
  font-size:22px;padding:13px 18px;background:rgba(14,10,6,.72);border:2px solid rgba(255,255,255,.25);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn.main{font-size:28px;background:linear-gradient(180deg,#3fbf5c,#1f7a38);border-color:#bff5c8;
  box-shadow:0 6px 0 #11441f,0 10px 24px rgba(0,0,0,.4)}
.btn.main:active{box-shadow:0 2px 0 #11441f}
.btn small{font-size:14px;opacity:.85}
.duo{display:flex;gap:10px}
.duo .btn{flex:1;font-size:18px;white-space:nowrap;padding:13px 6px}
@media (max-height:520px){#title{gap:10px;padding-top:44px}.btn{padding:10px 14px;font-size:19px}.btn.main{font-size:24px}}

/* ---------- 경기 소개 ---------- */
#vs{position:fixed;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.15));cursor:pointer}
#vs .mid{display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .45s cubic-bezier(.2,1.5,.5,1)}
#vsS{font-size:clamp(30px,6vw,52px);letter-spacing:2px;text-shadow:0 3px 10px rgba(0,0,0,.6)}
#vs .row{display:flex;align-items:center;gap:clamp(14px,4vw,40px)}
#vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(20px,4vw,30px);min-width:6em}
#vs .shirt{width:clamp(56px,11vw,90px);height:clamp(56px,11vw,90px);border-radius:50%;border:4px solid rgba(255,255,255,.85);
  box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 -10px 18px rgba(0,0,0,.25)}
#vs .v{font-family:'Stylish','Ria',sans-serif;font-size:clamp(50px,10vw,90px);color:#ffe14d;text-shadow:0 5px 0 #6a4a00}
#vsG{font-size:clamp(22px,4.5vw,32px);background:rgba(0,0,0,.4);padding:6px 18px;border-radius:20px}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* ---------- 끝 카드 ---------- */
#end{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.5);backdrop-filter:blur(3px)}
#end .ecard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 30px;min-width:min(88vw,360px);
  background:linear-gradient(180deg,rgba(28,60,34,.95),rgba(12,26,16,.95));border:2px solid rgba(160,240,170,.45);border-radius:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
#eTitle{font-family:'Stylish','Ria',sans-serif;font-size:66px;line-height:1}
#eTitle.win{color:#ffe14d;text-shadow:0 4px 0 #6a4a00}
#eTitle.lose{color:#c9d2ff;text-shadow:0 4px 0 #1a2250}
#eScore{display:flex;gap:14px;align-items:center;font-size:40px}
#eScore span{display:flex;align-items:center;gap:8px}
#eScore .chip{width:20px;height:20px;border-radius:50%;border:2px solid #fff}
#eScore i{font-style:normal;opacity:.5}
#eCoins{font-size:22px;color:#ffe14d;min-height:1px}
#end .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
#end .btn{flex:1 1 40%;font-size:19px;padding:11px 12px}

/* ---------- 상점·미션 ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  background:rgba(8,6,4,.9);backdrop-filter:blur(6px);padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:10px;width:min(100%,860px);margin-bottom:10px;padding-left:96px}
.sheet h2{font-weight:400;font-size:28px;flex:1;color:#bff5c8}
.close{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.body{overflow-y:auto;width:min(100%,860px);flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px;padding-bottom:10px}
.card{background:linear-gradient(180deg,rgba(40,70,44,.6),rgba(16,28,18,.7));border:2px solid rgba(255,255,255,.12);border-radius:16px;
  padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.card.on{border-color:#6ee07e;box-shadow:0 0 16px rgba(110,224,126,.4)}
.card img{width:92px;height:92px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.card.lock img{filter:brightness(.55) drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.bn{font-size:19px}
.st{font-size:12px;color:#8ff09c;letter-spacing:1px;display:flex;gap:6px;align-items:center}
.st em{font-style:normal;color:#fff;opacity:.75;width:40px;text-align:right;letter-spacing:0}
.st span{color:rgba(255,255,255,.18)}
.card button{margin-top:6px;width:100%;border:0;border-radius:11px;padding:8px;font-family:inherit;font-size:16px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#3fbf5c,#1f7a38)}
.card.on button{background:rgba(255,255,255,.15)}
.card button:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.45);cursor:default}
#misList{display:flex;flex-direction:column;gap:7px;max-width:520px;margin:0 auto}
.mis{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:13px;padding:11px 14px;font-size:19px}
.mis .ck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:15px}
.mis.ok .ck{background:#3fbf5c;border-color:#3fbf5c}
.mis .mn{flex:1}
.mis.ok .mn{opacity:.6}
.mis .mr{color:#ffe14d;font-size:16px}
.misTop{display:flex;justify-content:center;gap:10px;margin-bottom:10px}

/* ---------- 엔딩 ---------- */
#ending{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at center,rgba(30,90,40,.85),rgba(3,10,5,.95));overflow:hidden}
#ending .cup{font-size:clamp(90px,22vw,180px);animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 30px #ffe14d)}
#ending h1{font-family:'Stylish','Ria',sans-serif;font-weight:400;font-size:clamp(56px,12vw,120px);color:#ffe14d;text-shadow:0 6px 0 #6a4a00,0 0 40px rgba(255,220,80,.6)}
#ending .row2{font-size:clamp(24px,7vw,40px);letter-spacing:2px;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-14px) rotate(-4deg)}}
#confetti{position:absolute;inset:0;pointer-events:none}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 3s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

#pauseCover{position:fixed;inset:0;z-index:35;background:rgba(8,6,4,.86);display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;
  font-size:70px;cursor:pointer}
#pauseCover .btn{font-size:20px}
#loading{position:fixed;inset:0;z-index:100;background:#1b130e}

/* ---------- 가로로 돌리기 (폰 세로일 때만) ---------- */
#rotate{position:fixed;inset:0;z-index:90;display:none;place-items:center;text-align:center;
  background:#14201a;color:#f2ede4;font-size:17px;line-height:1.8;padding:8vw;pointer-events:auto}
body.touch.portrait #rotate{display:grid}
#rotate button{margin:22px 0 16px;padding:15px 32px;border:0;border-radius:99px;cursor:pointer;
  font-family:inherit;font-size:17px;color:#fff;background:#1f7a38}
#rotate .sub{font-size:14px;color:#b9c2b2;line-height:1.7}
#rotate .sub a{color:#e8f2e2}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="topbar">
  <div class="stat game" id="stagePill"><i>STAGE</i><b id="stageN">1</b></div>
  <div class="stat"><i>🪙</i><b id="coins">0</b></div>
  <div class="stat game"><i>🎯</i><b id="goalN">3</b></div>
  <div class="spacer"></div>
  <button class="tog game" id="tPause" aria-label="pause">❚❚</button>
  <button class="tog" id="tBgm" aria-label="music">♪</button>
  <button class="tog" id="tSnd" aria-label="sound">🔊</button>
</div>

<div id="sb">
  <div class="tm"><span class="chip" id="c0"></span><span id="n0">나</span></div>
  <div class="sc"><b id="s0">0</b><i>:</i><b id="s1">0</b></div>
  <div class="tm"><span id="n1">일본</span><span class="chip" id="c1"></span></div>
</div>
<div id="word"></div>
<div id="toasts"></div>

<div class="track" id="tr1"><i></i></div>
<div class="track" id="tr2"><i></i></div>
<button class="kbtn" id="k1" aria-label="kick"><span><i>⚽</i>KICK</span></button>
<button class="kbtn" id="k2" aria-label="kick"><span><i>⚽</i>KICK</span></button>
<div id="keys"></div>

<div id="title" hidden>
  <div id="logo">테이블축구게임</div>
  <div class="menu">
    <button class="btn main" id="bStart">START <small id="tStage">STAGE 1</small></button>
    <button class="btn" id="bNew" hidden>NEW GAME</button>
    <button class="btn" id="bDuo">2 PLAYERS <small id="duoPc">PC ONLY</small></button>
    <div class="duo">
      <button class="btn" id="bShop">👕 상점</button>
      <button class="btn" id="bMis">🏅 미션</button>
    </div>
  </div>
</div>

<div id="vs" hidden>
  <div class="mid">
    <div id="vsS">STAGE 1</div>
    <div class="row">
      <div class="side"><div class="shirt" id="vsC0"></div><span id="vsN0">나</span></div>
      <div class="v">VS</div>
      <div class="side"><div class="shirt" id="vsC1"></div><span id="vsN1">일본</span></div>
    </div>
    <div id="vsG">🎯 3</div>
  </div>
</div>

<div id="end" hidden>
  <div class="ecard">
    <div id="eTitle">WIN</div>
    <div id="eScore"></div>
    <div id="eCoins"></div>
    <div class="btns">
      <button class="btn main" id="eNext">NEXT</button>
      <button class="btn main" id="eRetry">RETRY</button>
      <button class="btn" id="eShop">👕 상점</button>
      <button class="btn" id="eHome">홈</button>
    </div>
  </div>
</div>

<div id="shop" class="sheet" hidden>
  <div class="hd"><h2>상점</h2><div class="stat"><i>🪙</i><b id="shopCoins">0</b></div><button class="close" aria-label="close">✕</button></div>
  <div class="body"><div id="shopGrid"></div></div>
</div>

<div id="missions" class="sheet" hidden>
  <div class="hd"><h2>미션</h2><button class="close" aria-label="close">✕</button></div>
  <div class="body">
    <div class="misTop"><div class="stat"><i>✔</i><b id="misCount">0 / 12</b></div><div class="stat"><i>⚽</i><b id="misGoals">0</b></div></div>
    <div id="misList"></div>
  </div>
</div>

<div id="ending" hidden>
  <div id="confetti"></div>
  <div class="cup">🏆</div>
  <h1>CHAMPION</h1>
  <div class="row2">⚽ ⚽ ⚽</div>
  <button class="btn main" id="endOk">계속</button>
</div>

<div id="pauseCover" hidden>❚❚<button class="btn" id="pHome">홈</button></div>

<div id="rotate">
  <div>
    <p id="rotTitle">가로 화면에서 하는 게임입니다</p>
    <button type="button" id="rotGo">가로로 돌리기</button>
    <p class="sub"><span id="rotHelp">단추가 안 먹으면 폰의 화면 회전 잠금을 풀고 눕혀 주세요</span><br>
      <a href="#" id="rotSkip">그래도 세로로 하기</a></p>
  </div>
</div>
<div id="loading"></div>

<script src="js/lang.js?v=3"></script>
<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="assets/landscape.js"></script>
<script src="lib/three.min.js"></script>
<script src="js/phys.js?v=45"></script>
<script src="js/audio.js?v=5"></script>
<script src="js/table.js?v=13"></script>
<script src="js/game.js?v=32"></script>
<script src="/assets/visit.js?v=16" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
