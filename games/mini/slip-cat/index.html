  // ── 소리 ────────────────────────────────────────────────

  var AC = null, lastAt = {};

  var SFX_FILES = { start: 0.60, clear: 0.75, land: 0.32, die: 0.85, fanfare: 1.0 };

    start:    function () { play('start'); },
    clear:    function () { play('clear'); },     // 판을 넘겼을 때
    newThing: function () { },                    // 새 장애물 예고는 판 넘김 소리에 묻어갑니다
    hit:      function () { play('die'); },
    win:      function () { play('fanfare'); }    // 99판 완주 빵빠레
  };

  // ── 배경음악 ────────────────────────────────────────────
  var bgm = null;
  function bgmEl() {
    if (!bgm) {
      bgm = new Audio('audio/bgm.mp3');
      bgm.loop = true;
      bgm.volume = 0.32;                 // 효과음이 묻히지 않게 낮춰 둡니다
      bgm.preload = 'none';
    }
    return bgm;
  }
  function bgmPlay() {
    if (!bgmOn) return;
    var el = bgmEl();
    var p = el.play();
    if (p && p.catch) p.catch(function () {});   // 자동재생을 막는 브라우저가 있습니다
  }
  function bgmStop() { if (bgm) { try { bgm.pause(); } catch (e) {} } }

  function setSfx(on) {
    sfxOn = on;
    try { localStorage.setItem('luluDodgeSfx', on ? '1' : '0'); } catch (e) {}
    $('sfxBtn').textContent = on ? '🔊' : '🔇';
    $('sfxBtn').classList.toggle('off', !on);
  }
  function setBgm(on) {
    bgmOn = on;
    try { localStorage.setItem('luluDodgeBgm', on ? '1' : '0'); } catch (e) {}
    $('bgmBtn').textContent = on ? '🎵' : '🎜';
    $('bgmBtn').classList.toggle('off', !on);
    if (on) { if (state === STATE.PLAY || state === STATE.CLEAR) bgmPlay(); }
    else bgmStop();
  }

  // ── 그림판 ──────────────────────────────────────────────
  var cv = $('cv'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);   // 2배까지만 — 폰에서 너무 무거워지지 않게
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;                 // 픽셀아트가 뭉개지지 않게
    layout();
  }

  // ── 루루냥 그림 (lulu-farm 의 원본 시트를 그대로 씁니다) ──
  var SHEET = {
    walk: { src: 'sprites/walk_side.webp',  frames: 10, fw: 208, fh: 256, img: null },
    idle: { src: 'sprites/idle_front.webp', frames:  8, fw: 212, fh: 256, img: null },
    cheer:{ src: 'sprites/cheer.webp',      frames:  8, fw: 192, fh: 256, img: null }
  };
  Object.keys(SHEET).forEach(function (k) {
    var s = SHEET[k], im = new Image();
    im.onload = function () { s.img = im; };
    im.src = s.src;
  });

  var GROUND = 0, CHAR_H = 0, CHAR_W = 0, unit = 1;
  function layout() {
    unit = H / 700;
    GROUND = H * 0.86;                                 // 땅 윗선
    CHAR_H = Math.max(76, Math.min(H * 0.17, 150));
    CHAR_W = CHAR_H * (208 / 256);
  }

  // ── 떨어지는 것들 ───────────────────────────────────────
  // from: 몇 판부터 나오는가 / w,h: 기본 크기에 대한 비율
  // spd: 떨어지는 빠르기 / sway: 좌우로 흔들리는 정도
  var KINDS = [
    { key: 'box',    from:  1, w: 1.00, h: 1.00, spd: 1.00, sway: 0.00 },
    { key: 'carrot', from:  4, w: 1.10, h: 1.55, spd: 1.12, sway: 0.00 },
    { key: 'radish', from:  9, w: 1.22, h: 1.48, spd: 0.86, sway: 0.00 },
    { key: 'net',    from: 15, w: 1.34, h: 1.34, spd: 0.90, sway: 1.00 },
    { key: 'tewak',  from: 24, w: 1.46, h: 1.46, spd: 1.00, sway: 0.55 }
  ];

  var STAGE_SEC = 7;          // 한 판을 버텨야 하는 시간
  var BREAK_MS = 1700;        // 판과 판 사이 쉬는 참
  var LAST_STAGE = 99;

  // ── 게임 상태 ───────────────────────────────────────────
  var STATE = { TITLE: 0, PLAY: 1, CLEAR: 2, OVER: 3, WIN: 4 };
  var state = STATE.TITLE;
  var t = 0, stage = 1, stageT = 0, gam = 0;
  var items = [], puffs = [];
  var lulu = { x: 0, vx: 0, dir: 1, anim: 0 };
  var targetX = null;
  var keyL = false, keyR = false;
  var spawnTimer = 0;
  var celebrate = false;
  var skyT = 0;               // 구름이 흘러가는 시간 (게임 중이 아니어도 흐릅니다)
  var bestStage = 0, bestGam = 0;
  try {
    bestStage = parseInt(localStorage.getItem('luluDodgeStage') || '0', 10) || 0;
    bestGam   = parseInt(localStorage.getItem('luluDodgeGam')   || '0', 10) || 0;
  } catch (e) {}

  function reset() {
    t = 0; stage = 1; stageT = 0; gam = 0; items = []; puffs = [];
    lulu.x = W / 2; lulu.vx = 0; lulu.dir = 1; lulu.anim = 0;
    targetX = null; spawnTimer = 0.7; celebrate = false;
  }

  // 판을 넘길 때 받는 감귤 — 열 판마다 한 상자씩 더
  function rewardFor(st) { return 1 + (st % 10 === 0 ? 5 : 0); }

  // ── 판이 오를수록 어려워지는 정도 ───────────────────────
  function spawnGap()  { return Math.max(0.48, 1.00 - stage * 0.010); }
  function fallSpeed() { return H * (0.40 + stage * 0.0058); }
  function burstCount(){ return Math.min(3, 1 + Math.floor(stage / 22)); }

  function unlocked() {
    var out = [];
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i].from <= stage) out.push(KINDS[i]);
    return out;
  }

  function spawn() {
    var pool = unlocked(), n = burstCount();
    for (var i = 0; i < n; i++) {
      var k = pool[Math.floor(Math.random() * pool.length)];
      var base = H * 0.058 * (0.85 + Math.random() * 0.45);
      var iw = base * k.w, ih = base * k.h;
      items.push({
        kind: k.key,
        bx: Math.random() * (W - iw), x: 0, y: -ih - Math.random() * H * 0.3,
        iw: iw, ih: ih,
        vy: fallSpeed() * k.spd * (0.92 + Math.random() * 0.22),
        sway: k.sway * W * 0.05,
        rot: (Math.random() - 0.5) * 0.22,
        rotV: (Math.random() - 0.5) * 0.5,
        age: 0, phase: Math.random() * 6.283, tone: Math.floor(Math.random() * 3)
      });
    }
  }

  // ── 한 칸 나아가기 ──────────────────────────────────────
  function update(dt) {
    t += dt; stageT += dt;
    if (stageT >= STAGE_SEC) { clearStage(); return; }
    $('barFill').style.width = (stageT / STAGE_SEC * 100).toFixed(1) + '%';

    // 루루냥 좌우 이동
    var speed = W * 1.7, dirWant = 0;
    if (targetX !== null) {
      var d = targetX - lulu.x;
      if (Math.abs(d) > CHAR_W * 0.06) dirWant = d > 0 ? 1 : -1;
      speed = Math.min(speed, Math.abs(d) / Math.max(dt, 0.0001));  // 손가락에 딱 붙게
    }
    if (keyL) dirWant = -1;
    if (keyR) dirWant = 1;

    lulu.vx = dirWant * speed;
    lulu.x += lulu.vx * dt;
    var half = CHAR_W * 0.5;
    if (lulu.x < half) { lulu.x = half; lulu.vx = 0; }
    if (lulu.x > W - half) { lulu.x = W - half; lulu.vx = 0; }
    if (dirWant !== 0) lulu.dir = dirWant;
    lulu.anim += dt * (Math.abs(lulu.vx) > W * 0.02 ? 14 : 6);

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = spawnGap(); }

    // 떨어지는 것들
    var hbW = CHAR_W * 0.40, hbH = CHAR_H * 0.62;
    var hx = lulu.x - hbW / 2, hy = GROUND - hbH;
    for (var i = items.length - 1; i >= 0; i--) {
      var c = items[i];
      c.age += dt;
      c.y += c.vy * dt;
      c.rot += c.rotV * dt;
      c.x = c.bx + (c.sway ? Math.sin(c.age * 2.6 + c.phase) * c.sway : 0);
      if (c.x < 0) c.x = 0;
      if (c.x > W - c.iw) c.x = W - c.iw;

      if (c.x < hx + hbW && c.x + c.iw > hx && c.y < hy + hbH && c.y + c.ih > hy) {
        SFX.hit(); finish(false); return;
      }
      if (c.y + c.ih >= GROUND) {
        puffs.push({ x: c.x + c.iw / 2, y: GROUND, r: c.iw * 0.36, life: 0.42 });
        items.splice(i, 1);
        SFX.land();
      }
    }
    for (var j = puffs.length - 1; j >= 0; j--) {
      puffs[j].life -= dt; puffs[j].r += dt * H * 0.08;
      if (puffs[j].life <= 0) puffs.splice(j, 1);
    }
  }

  // 판과 판 사이 — 새로 떨어뜨리지 않고, 남은 것만 마저 내려보냅니다
  function coast(dt) {
    for (var i = items.length - 1; i >= 0; i--) {
      var c = items[i];
      c.age += dt; c.y += c.vy * dt; c.rot += c.rotV * dt;
      if (c.y + c.ih >= GROUND) {
        puffs.push({ x: c.x + c.iw / 2, y: GROUND, r: c.iw * 0.36, life: 0.42 });
        items.splice(i, 1);
      }
    }
    for (var j = puffs.length - 1; j >= 0; j--) {
      puffs[j].life -= dt; puffs[j].r += dt * H * 0.08;
      if (puffs[j].life <= 0) puffs.splice(j, 1);
    }
  }

  // ── 그리기 ──────────────────────────────────────────────
  // 모서리가 둥근 네모 — 말랑한 느낌의 바탕이 됩니다
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function draw() {
    drawSky(); drawClouds(); drawOreums(); drawGround();
    drawPuffs(); drawItems(); drawLulu();
  }

  // 우유 섞은 카라멜 같은 하늘
  function drawSky() {
    var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0,    '#fff8ef');
    sky.addColorStop(0.50, '#ffefdc');
    sky.addColorStop(1,    '#fde4c9');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);
  }

  // 동글동글한 구름 — 천천히 흘러갑니다
  var CLOUDS = [
    { x: 0.16, y: 0.11, s: 1.00, v: 0.009 },
    { x: 0.70, y: 0.19, s: 0.70, v: 0.015 },
    { x: 0.44, y: 0.30, s: 0.52, v: 0.021 }
  ];
  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    for (var i = 0; i < CLOUDS.length; i++) {
      var c = CLOUDS[i];
      var x = (((c.x + skyT * c.v) % 1.3) - 0.15) * W;
      var y = c.y * H, r = c.s * H * 0.034;
      ctx.beginPath();
      ctx.arc(x - r * 0.88, y,            r * 0.70, 0, 6.2832);
      ctx.arc(x,            y - r * 0.32, r,        0, 6.2832);
      ctx.arc(x + r * 0.98, y,            r * 0.64, 0, 6.2832);
      ctx.arc(x + r * 0.10, y + r * 0.30, r * 0.80, 0, 6.2832);
      ctx.fill();
    }
  }

  // 멀리 보이는 오름 — 카라멜·크림 빛으로 부드럽게 겹칩니다
  function drawOreums() {
    var base = GROUND + 4 * unit;
    var hills = [
      { cx: 0.17, w: 0.64, h: 0.120, c: '#f8e7d0' },
      { cx: 0.70, w: 0.78, h: 0.160, c: '#f3dbbc' },
      { cx: 0.96, w: 0.52, h: 0.098, c: '#eee6c9' },
      { cx: 0.36, w: 0.48, h: 0.074, c: '#e6eed3' }
    ];
    hills.forEach(function (o) {
      var cx = o.cx * W, hw = o.w * W / 2, hh = o.h * H;
      ctx.fillStyle = o.c;
      ctx.beginPath();
      ctx.moveTo(cx - hw, base);
      // 오름은 봉긋한 곡선 — 뾰족한 산이 아닙니다
      ctx.bezierCurveTo(cx - hw * 0.42, base - hh, cx + hw * 0.42, base - hh, cx + hw, base);
      ctx.closePath(); ctx.fill();
    });
  }

  // 말랑하게 물결치는 들판
  function drawGround() {
    var amp = 4.5 * unit, seg = 5, sw = W / seg, i;
    function edge() {
      ctx.beginPath(); ctx.moveTo(0, GROUND);
      for (i = 0; i < seg; i++) {
        ctx.quadraticCurveTo(sw * (i + 0.5), GROUND + (i % 2 ? amp : -amp), sw * (i + 1), GROUND);
      }
    }
    var g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#a9d698'); g.addColorStop(1, '#83bd77');
    edge(); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();

    edge();                                   // 윗동은 한 톤 밝게 — 폭신해 보이도록
    ctx.strokeStyle = '#c2e6b3'; ctx.lineWidth = 5 * unit;
    ctx.lineJoin = 'round'; ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.62)';  // 자잘한 네잎 꽃
    for (var f = 0; f < 15; f++) {
      var fx = (((f * 61.8) % 100) / 100) * W;
      var fy = GROUND + (14 + ((f * 37) % 56)) * unit;
      var rr = 2.1 * unit;
      ctx.beginPath();
      ctx.arc(fx - rr, fy, rr, 0, 6.2832); ctx.arc(fx + rr, fy, rr, 0, 6.2832);
      ctx.arc(fx, fy - rr, rr, 0, 6.2832); ctx.arc(fx, fy + rr, rr, 0, 6.2832);
      ctx.fill();
    }
  }

  function drawPuffs() {
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i];
      ctx.globalAlpha = Math.max(0, p.life / 0.42) * 0.55;
      ctx.fillStyle = '#f6e2c4';
      ctx.beginPath();
      ctx.arc(p.x - p.r * 0.55, p.y - p.r * 0.10, p.r * 0.46, 0, 6.2832);
      ctx.arc(p.x,              p.y - p.r * 0.22, p.r * 0.56, 0, 6.2832);
      ctx.arc(p.x + p.r * 0.58, p.y - p.r * 0.08, p.r * 0.42, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ── 떨어지는 것들 그리기 ────────────────────────────────
  function drawItems() {
    for (var i = 0; i < items.length; i++) {
      var c = items[i];
      var sq = 1 + Math.sin(c.age * 7 + c.phase) * 0.05;   // 말랑말랑
      ctx.save();
      ctx.translate(c.x + c.iw / 2, c.y + c.ih / 2);
      ctx.rotate(c.rot);
      ctx.scale(1 / sq, sq);
      if (c.kind === 'box')         drawBox(c.iw, c.ih, c.tone);
      else if (c.kind === 'carrot') drawCarrot(c.iw, c.ih);
      else if (c.kind === 'radish') drawRadish(c.iw, c.ih);
      else if (c.kind === 'net')    drawNet(c.iw, c.ih);
      else                          drawTewak(c.iw, c.ih);
      ctx.restore();
    }
  }

  function softShadow(w, h, r) {
    ctx.fillStyle = 'rgba(191,131,71,.15)';
    roundRect(-w / 2 + w * 0.06, -h / 2 + h * 0.10, w, h, r); ctx.fill();
  }
  function gloss(w, h) {                       // 왼쪽 위에 뽀얀 윤기
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    roundRect(-w / 2 + w * 0.16, -h / 2 + h * 0.12, w * 0.32, h * 0.15, w * 0.08);
    ctx.fill();
  }

  var CANDY = [
    { hi: '#ffd9a2', mid: '#f0b26a', lo: '#dd9448', edge: '#c07a34' },
    { hi: '#ffd097', mid: '#eaa75e', lo: '#d6883c', edge: '#b76f2c' },
    { hi: '#ffe2b6', mid: '#f6bf7e', lo: '#e3a055', edge: '#c8843c' }
  ];

  // 감귤상자 — 카라멜빛 나무 상자에 감귤이 소복이
  function drawBox(w, h, tone) {
    var k = CANDY[tone], r = w * 0.26, hw = w / 2, hh = h / 2;
    softShadow(w, h, r);

    // 감귤 세 알이 상자 위로 빼꼼
    var orR = w * 0.17;
    [[-w * 0.24, -hh - orR * 0.35], [w * 0.02, -hh - orR * 0.55], [w * 0.27, -hh - orR * 0.3]]
      .forEach(function (p, i) {
        var og = ctx.createRadialGradient(p[0] - orR * .3, p[1] - orR * .35, orR * .2, p[0], p[1], orR);
        og.addColorStop(0, '#ffc76b'); og.addColorStop(1, '#f08a2b');
        ctx.fillStyle = og;
        ctx.beginPath(); ctx.arc(p[0], p[1], orR, 0, 6.2832); ctx.fill();
        if (i === 1) {                                   // 가운데 감귤에만 잎사귀
          ctx.fillStyle = '#6faa5f';
          ctx.beginPath();
          ctx.ellipse(p[0] + orR * .55, p[1] - orR * .75, orR * .42, orR * .2, -0.6, 0, 6.2832);
          ctx.fill();
        }
      });

    var g = ctx.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, k.hi); g.addColorStop(0.45, k.mid); g.addColorStop(1, k.lo);
    ctx.fillStyle = g; roundRect(-hw, -hh, w, h, r); ctx.fill();

    var lw = Math.max(1, w * 0.05);
    ctx.strokeStyle = k.edge; ctx.lineWidth = lw;
    roundRect(-hw + lw / 2, -hh + lw / 2, w - lw, h - lw, r * 0.92); ctx.stroke();

    // 상자 허리에 두른 띠
    ctx.fillStyle = 'rgba(255,255,255,.34)';
    roundRect(-hw + w * 0.08, -h * 0.06, w * 0.84, h * 0.20, h * 0.08); ctx.fill();
    gloss(w, h);
  }

  // 당근 — 아래로 갈수록 뾰족한 동글동글 삼각
  function drawCarrot(w, h) {
    var hw = w / 2, hh = h / 2;
    ctx.fillStyle = 'rgba(191,131,71,.15)';
    ctx.beginPath();
    ctx.moveTo(-hw + w * .08, -hh + h * .28); ctx.quadraticCurveTo(w * .1, hh + h * .1, hw * .1, hh + h * .1);
    ctx.quadraticCurveTo(hw + w * .1, -hh + h * .2, hw * .1, -hh + h * .22);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#5f9e52';                            // 이파리 세 장
    [-0.55, 0, 0.55].forEach(function (a) {
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -hh + h * 0.10, w * 0.16, h * 0.15, 0, 0, 6.2832);
      ctx.fill(); ctx.restore();
    });

    var g = ctx.createLinearGradient(-hw, 0, hw, 0);
    g.addColorStop(0, '#ff9f45'); g.addColorStop(0.45, '#f3812a'); g.addColorStop(1, '#dd6d1c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.92, -hh + h * 0.22);
    ctx.quadraticCurveTo(-hw * 0.55, hh * 0.75, 0, hh);   // 왼쪽 옆선
    ctx.quadraticCurveTo(hw * 0.55, hh * 0.75, hw * 0.92, -hh + h * 0.22);
    ctx.quadraticCurveTo(0, -hh + h * 0.02, -hw * 0.92, -hh + h * 0.22);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.42)';            // 잔주름
    ctx.lineWidth = Math.max(1, w * 0.06); ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var yy = -hh + h * (0.36 + i * 0.18);
      ctx.beginPath(); ctx.moveTo(-hw * (0.42 - i * 0.09), yy);
      ctx.lineTo(-hw * (0.10 - i * 0.02), yy + h * 0.03); ctx.stroke();
    }
  }

  // 월동무 — 통통한 흰 무에 파란 어깨
  function drawRadish(w, h) {
    var hw = w / 2, hh = h / 2;
    softShadow(w * 0.9, h * 0.8, w * 0.4);

    ctx.fillStyle = '#5f9e52';                            // 무청
    [-0.6, -0.15, 0.35].forEach(function (a) {
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -hh + h * 0.09, w * 0.15, h * 0.14, 0, 0, 6.2832);
      ctx.fill(); ctx.restore();
    });

    var g = ctx.createLinearGradient(0, -hh + h * 0.16, 0, hh);
    g.addColorStop(0, '#cfe6bd'); g.addColorStop(0.30, '#f3f7ec');
    g.addColorStop(1, '#e2e6d8');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, hh);                                     // 아래 끝은 뾰족하게
    ctx.quadraticCurveTo(-hw, hh * 0.30, -hw * 0.86, -hh + h * 0.30);
    ctx.quadraticCurveTo(0, -hh + h * 0.06, hw * 0.86, -hh + h * 0.30);
    ctx.quadraticCurveTo(hw, hh * 0.30, 0, hh);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(150,165,140,.5)';
    ctx.lineWidth = Math.max(1, w * 0.045);
    ctx.beginPath(); ctx.moveTo(-hw * 0.30, -hh + h * 0.45);
    ctx.quadraticCurveTo(-hw * 0.10, h * 0.10, -hw * 0.02, hh * 0.72); ctx.stroke();
  }

  // 망사리 — 해녀가 쓰는 그물 주머니 (크림빛 그물에 소라가 비칩니다)
  function drawNet(w, h) {
    var r = Math.min(w, h) * 0.46;
    ctx.fillStyle = 'rgba(191,131,71,.15)';
    ctx.beginPath(); ctx.arc(w * 0.05, h * 0.08, r, 0, 6.2832); ctx.fill();

    var g = ctx.createRadialGradient(-r * .35, -r * .4, r * .2, 0, 0, r);
    g.addColorStop(0, '#fdf6e6'); g.addColorStop(1, '#e6d8bd');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();

    ctx.save();                                            // 그물코
    ctx.beginPath(); ctx.arc(0, 0, r * 0.99, 0, 6.2832); ctx.clip();
    ctx.fillStyle = '#e9a05a';                             // 안에 든 소라
    ctx.beginPath(); ctx.arc(-r * 0.30, r * 0.26, r * 0.27, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#d98a42';
    ctx.beginPath(); ctx.arc(r * 0.28, r * 0.06, r * 0.22, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(150,118,74,.42)';
    ctx.lineWidth = Math.max(1, r * 0.075);
    for (var i = -4; i <= 4; i++) {
      var o = i * r * 0.34;
      ctx.beginPath(); ctx.moveTo(o - r, -r); ctx.lineTo(o + r, r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o - r, r); ctx.lineTo(o + r, -r); ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(160,126,80,.55)';              // 주머니 테두리
    ctx.lineWidth = Math.max(1, r * 0.11);
    ctx.beginPath(); ctx.arc(0, 0, r - r * 0.055, 0, 6.2832); ctx.stroke();

    ctx.strokeStyle = '#c98a3e';                           // 아가리를 오므린 끈
    ctx.lineWidth = Math.max(1, r * 0.15); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -r * 0.88, r * 0.52, 0.3, Math.PI - 0.3); ctx.stroke();
  }

  // 테왁 — 해녀가 안고 다니는 동그란 주황 부표
  function drawTewak(w, h) {
    var r = Math.min(w, h) * 0.47;
    ctx.fillStyle = 'rgba(191,131,71,.15)';
    ctx.beginPath(); ctx.arc(w * 0.05, h * 0.08, r, 0, 6.2832); ctx.fill();

    var g = ctx.createRadialGradient(-r * .35, -r * .4, r * .15, 0, 0, r);
    g.addColorStop(0, '#ffc07a'); g.addColorStop(1, '#ef7f34');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.6)';              // 허리에 두른 흰 띠
    ctx.lineWidth = Math.max(1, r * 0.20);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.66, -0.5, 1.9); ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(-r * 0.36, -r * 0.40, r * 0.18, 0, 6.2832); ctx.fill();
  }

  function drawLulu() {
    var moving = Math.abs(lulu.vx) > W * 0.02;
    // 만세는 최고 기록을 세웠을 때만 — 그냥 맞고 끝났는데 좋아하면 이상합니다
    var sheet = (state === STATE.OVER || state === STATE.WIN)
      ? (celebrate ? SHEET.cheer : SHEET.idle)
      : (moving ? SHEET.walk : SHEET.idle);
    var w = CHAR_H * (sheet.fw / sheet.fh);
    var x = lulu.x - w / 2, y = GROUND - CHAR_H;

    ctx.globalAlpha = .16; ctx.fillStyle = '#4a3520';      // 발밑 그림자
    ctx.beginPath();
    ctx.ellipse(lulu.x, GROUND + 2 * unit, w * 0.30, CHAR_H * 0.055, 0, 0, 6.2832);
    ctx.fill(); ctx.globalAlpha = 1;

    if (!sheet.img) { return; }
    var f = Math.floor(lulu.anim) % sheet.frames;
    ctx.save();
    // 원본 walk_side 는 왼쪽을 봅니다 — 오른쪽으로 갈 때만 뒤집습니다
    if (moving && lulu.dir > 0) { ctx.translate(lulu.x, 0); ctx.scale(-1, 1); ctx.translate(-lulu.x, 0); }
    ctx.drawImage(sheet.img, f * sheet.fw, 0, sheet.fw, sheet.fh, x, y, w, CHAR_H);
    ctx.restore();
  }

  // ── 흐름 ────────────────────────────────────────────────
  function start() {
    reset(); state = STATE.PLAY;
    $('hudStage').textContent = T.stage(1);
    $('hudGam').textContent = '0';
    $('barFill').style.width = '0%';
    $('titleLayer').hidden = true; $('overLayer').hidden = true; $('brkLayer').hidden = true;
    $('hud').hidden = false; $('bar').hidden = false; $('langBtn').hidden = true;
    loadSfx(); SFX.start(); bgmPlay();
  }

  // 한 판을 버텨 냈을 때 — 잠깐 멈추고 감귤을 드립니다
  var brkTimer = null;
  function clearStage() {
    state = STATE.CLEAR;
    var got = rewardFor(stage);
    gam += got;
    $('hudGam').textContent = String(gam);
    $('barFill').style.width = '100%';
    $('bClear').textContent = T.clearWord;
    if (stage < LAST_STAGE) {                       // 마지막 판 뒤에는 다음이 없습니다
      $('bNext').textContent = T.stage(stage + 1);
      $('bNext').hidden = false;
    } else {
      $('bNext').hidden = true;
    }
    $('bReward').textContent = T.reward(got);

    // 다음 판에 새로 나오는 게 있으면 미리 알려 줍니다
    var coming = null;
    for (var i = 0; i < KINDS.length; i++) {
      if (KINDS[i].from === stage + 1) coming = KINDS[i];
    }
    if (coming) {
      $('bNew').textContent = T.nextNew(T.newThing[coming.key]);
      $('bNew').hidden = false;
      SFX.newThing();
    } else {
      $('bNew').hidden = true;
    }

    $('brkLayer').hidden = false;
    SFX.clear();
    if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }

    clearTimeout(brkTimer);
    brkTimer = setTimeout(nextStage, BREAK_MS);
  }

  function nextStage() {
    if (stage >= LAST_STAGE) { finish(true); return; }
    stage += 1; stageT = 0; items = []; spawnTimer = 0.55;
    $('hudStage').textContent = T.stage(stage);
    $('barFill').style.width = '0%';
    $('brkLayer').hidden = true;
    state = STATE.PLAY;
  }

  function finish(won) {
    clearTimeout(brkTimer);
    state = won ? STATE.WIN : STATE.OVER;
    var isNew = stage > bestStage || (stage === bestStage && gam > bestGam);
    if (stage > bestStage) bestStage = stage;
    if (gam > bestGam) bestGam = gam;
    try {
      localStorage.setItem('luluDodgeStage', String(bestStage));
      localStorage.setItem('luluDodgeGam', String(bestGam));
    } catch (e) {}
    celebrate = isNew || won;
    $('oCap').textContent = won ? T.capWin : T.capOver;
    $('oScore').textContent = won ? T.winTitle : T.stage(stage);
    $('oTime').textContent = T.gamTotal(gam);
    $('oBest').textContent = T.best + ' ' + T.stage(bestStage) + ' · ' + T.gamTotal(bestGam);
    $('oNew').hidden = !isNew; $('oNew').textContent = T.newrec;
    $('hud').hidden = true; $('bar').hidden = true;
    $('brkLayer').hidden = true; $('overLayer').hidden = false; $('langBtn').hidden = false;
    bgmStop();
    if (won) SFX.win();
    if (navigator.vibrate) { try { navigator.vibrate(won ? [30, 60, 30] : 35); } catch (e) {} }
  }

  // ── 조작 ────────────────────────────────────────────────
  function pointX(ev) {
    var r = cv.getBoundingClientRect();
    return (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
  }
  function onDown(ev) { if (state === STATE.PLAY) { targetX = pointX(ev); ev.preventDefault(); } }
  function onMove(ev) { if (state === STATE.PLAY && targetX !== null) { targetX = pointX(ev); ev.preventDefault(); } }
  function onUp() { targetX = null; }

  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyL = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyR = true;
    if (e.key === 'm' || e.key === 'M') { setSfx(!sfxOn); setBgm(sfxOn); }
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === STATE.TITLE || state === STATE.OVER || state === STATE.WIN) start();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyL = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyR = false;
  });

  setSfx(sfxOn); setBgm(bgmOn);
  $('sfxBtn').addEventListener('click', function (e) {
    e.stopPropagation(); loadSfx(); setSfx(!sfxOn); if (sfxOn) SFX.start();
  });
  $('bgmBtn').addEventListener('click', function (e) { e.stopPropagation(); setBgm(!bgmOn); });
  $('btnStart').addEventListener('click', start);
  $('btnRetry').addEventListener('click', start);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  // ── 되풀이 ──────────────────────────────────────────────
  var last = 0;
  function loop(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;   // 창을 벗어났다 와도 튀지 않게
    last = now;
    if (state === STATE.PLAY) update(dt);
    else if (state === STATE.CLEAR) { coast(dt); lulu.anim += dt * 6; }
    else if (state === STATE.OVER || state === STATE.WIN) lulu.anim += dt * 8;
    skyT += dt;
    draw();
    requestAnimationFrame(loop);
  }

  resize(); reset(); lulu.x = W / 2;
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', function () { last = 0; });
})();
</script>
<script src="/assets/game-home.js" defer></script>
