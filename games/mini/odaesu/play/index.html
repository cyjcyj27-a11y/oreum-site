<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11140f">
<title>오대수게임</title>
<style>
@font-face{font-family:'Brush';src:url('fonts/Brush-title.woff2?v=5') format('woff2');font-display:swap}   /* Nanum Brush Script (OFL) — 제목 글자 부분집합 */
@font-face{font-family:'Ria';src:url('fonts/RiaSans-ExtraBold.woff2') format('woff2');font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#11140f;
  font-family:'Ria',-apple-system,'Malgun Gothic',sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* ---------- 상단바 (스카이라이더 배치) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;pointer-events:none;
  padding:6px 8px 20px calc(104px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0))}
body.title #topbar .stat{visibility:hidden}
.stat{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);
  border-radius:999px;padding:5px 10px;font-size:15px}
.stat i{font-style:normal;font-size:13px}
.stat b{font-size:17px;font-weight:400;letter-spacing:.3px}
.bar{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>span{display:block;height:100%;width:100%;border-radius:3px}
#hbar{width:120px;height:9px;border-radius:5px}
#hbar>span{background:#e0473b;transition:width .15s}
#hstat.low{animation:low .45s ease-in-out infinite alternate}
@keyframes low{from{background:rgba(0,0,0,.35)}to{background:rgba(170,20,20,.75)}}
.spacer{flex:1 1 20px}
.tog{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(0,0,0,.4);color:#fff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;position:relative;font-family:inherit;touch-action:manipulation}
.tog.off{opacity:.4}
.tog.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;
  background:#fff;transform:rotate(-45deg);border-radius:1px}
@media (max-width:700px){.stat b{font-size:15px}.stat{padding:5px 8px;gap:5px}#hbar{width:80px}#topbar{gap:5px}}

/* 보스 체력 */
#boss{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;width:min(420px,50vw);display:none;pointer-events:none}
#boss.on{display:block}
#boss .bar{width:100%;height:10px;border-radius:5px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35)}
#boss .bar>span{background:linear-gradient(90deg,#b31d1d,#ff5a3a)}
body.touch #boss{bottom:auto;top:58px}

/* 콤보 */
#combo{position:fixed;right:calc(22px + env(safe-area-inset-right));top:64px;z-index:15;text-align:right;pointer-events:none;opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
#combo b{display:block;font-size:64px;line-height:.9;color:#fff;-webkit-text-stroke:2px #3a0c0c;text-shadow:0 5px 0 #3a0c0c}
#combo span{font-size:22px;color:#ffcf4a;letter-spacing:.12em}
#combo.pump b{animation:pump .16s ease-out}
@keyframes pump{0%{transform:scale(1.35)}100%{transform:scale(1)}}

/* GO ▶ */
#go{position:fixed;right:calc(40px + env(safe-area-inset-right));top:42%;z-index:15;font-size:54px;color:#ffe066;
  -webkit-text-stroke:2px #4a3000;text-shadow:0 4px 0 #4a3000;display:none;pointer-events:none;animation:go .6s steps(2) infinite}
#go.on{display:block}
@keyframes go{0%{opacity:1}100%{opacity:.15}}

/* ---------- 폰 조작: 왼쪽 패드 · 오른쪽 단추 ---------- */
#pad{position:fixed;z-index:25;left:calc(18px + env(safe-area-inset-left));bottom:64px;width:186px;height:186px;border-radius:50%;
  background:rgba(0,0,0,.38);display:none;touch-action:none;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;
  background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.55)}
body.touch #pad{display:block}
@media (max-height:420px){#pad{width:160px;height:160px;bottom:56px}}
.tbtn{position:fixed;z-index:25;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.32);
  display:none;place-items:center;color:#fff;touch-action:none;pointer-events:auto}
.tbtn.on{background:#ffd35a;border-color:#fff;color:#000}
body.touch .tbtn{display:grid}
#bHam{right:calc(18px + env(safe-area-inset-right));bottom:22px;width:96px;height:96px;font-size:44px}
#bKick{right:calc(126px + env(safe-area-inset-right));bottom:18px;width:64px;height:64px;font-size:28px}
#bThrow{right:calc(34px + env(safe-area-inset-right));bottom:132px;width:64px;height:64px;font-size:28px}
#bHam.charged{box-shadow:0 0 0 6px rgba(255,90,40,.6),0 0 30px rgba(255,90,40,.8)}
body.touch #keys{display:none}
#keys{position:fixed;right:12px;bottom:10px;z-index:20;font-size:13px;color:rgba(255,255,255,.45);pointer-events:none}
body.title #keys, body.title #pad, body.title .tbtn{visibility:hidden}

/* ---------- 큰 글자 판 ---------- */
.panel{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.panel.on{display:flex}
.panel h1{font-family:'Ria',sans-serif;font-weight:400;line-height:1;text-align:center;
  color:#fff;-webkit-text-stroke:2px #1a0606;text-shadow:0 6px 0 #1a0606,0 12px 30px rgba(0,0,0,.5)}
.panel .num{font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6);text-align:center;line-height:1.5}
.btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;font-size:30px;color:#fff;
  background:#b3261e;padding:12px 46px;border-radius:999px;letter-spacing:.06em;
  box-shadow:0 7px 0 #5e0f0b,0 14px 30px rgba(0,0,0,.35);touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #5e0f0b}
.btn.sub{font-size:20px;padding:9px 30px;background:#3d4436;box-shadow:0 5px 0 #1d2219,0 10px 24px rgba(0,0,0,.3)}
.btn.sub:active{box-shadow:0 1px 0 #1d2219}

#title{justify-content:flex-start;padding-top:9vh;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 55%)}
#title h1{font-family:'Brush','Ria',sans-serif;font-size:clamp(100px,19vw,240px);white-space:nowrap;line-height:.85;color:#e8e2d2;
  -webkit-text-stroke:0;text-shadow:0 6px 0 #5e0f0b,0 0 40px rgba(0,0,0,.8);letter-spacing:.02em}
#title .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#title .best{font-size:17px;color:#d8d0bf;opacity:.8;text-shadow:0 2px 0 #000}

#stage h1{font-size:clamp(70px,14vw,130px);color:#e8e2d2;animation:pop .35s ease-out}
#clear h1{font-size:clamp(80px,16vw,150px);color:#ffe066;animation:pop .35s ease-out}
#over h1{font-size:clamp(80px,16vw,150px);color:#e0473b;animation:pop .35s ease-out}
#ending h1{font-family:'Brush','Ria',sans-serif;font-size:clamp(110px,22vw,220px);color:#e8e2d2;-webkit-text-stroke:0;text-shadow:0 6px 0 #5e0f0b}
#over,#clear{background:rgba(10,4,4,.45)}
#ending{justify-content:flex-start;padding-top:8vh;background:linear-gradient(180deg,rgba(10,6,20,.35),rgba(0,0,0,0) 45%,rgba(0,0,0,.35));animation:fadein 1.6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#ending{gap:6px;padding-top:5vh}
#ending .num{font-size:20px}
#endNext{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}
#endNext:active{transform:translate(-50%,calc(-100% + 5px))}
#pause{background:rgba(10,10,10,.55)}
#pause .btn{font-size:40px;padding:10px 40px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* ---------- 떠오르는 글 ---------- */
#pops{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-size:26px;color:#fff;-webkit-text-stroke:1px #3a0c0c;text-shadow:0 3px 0 #3a0c0c;
  animation:up .9s ease-out forwards;white-space:nowrap}
.pop.heal{color:#9be15d;-webkit-text-stroke:1px #1d3a0a;text-shadow:0 3px 0 #1d3a0a}
.pop.big{font-size:60px;color:#ffe066;-webkit-text-stroke:2px #4a3000;text-shadow:0 5px 0 #4a3000;animation-duration:1.2s}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* ---------- 가로로 돌리기 (폰 세로일 때만) ---------- */
#rotate{position:fixed;inset:0;z-index:90;display:none;place-items:center;text-align:center;
  background:#1a1d16;color:#f2ede4;font-size:17px;line-height:1.8;padding:8vw;pointer-events:auto}
body.touch.portrait #rotate{display:grid}
#rotate button{margin:22px 0 16px;padding:15px 32px;border:0;border-radius:99px;cursor:pointer;
  font-family:inherit;font-size:17px;color:#fff;background:#b3261e}
#rotate .sub{font-size:14px;color:#b9b2a2;line-height:1.7}
#rotate .sub a{color:#e8e2d2}
</style>
</head>
<body class="title">

<canvas id="cv"></canvas>

<div id="topbar">
  <div class="stat"><b id="stg">STAGE 1</b></div>
  <div class="stat" id="hstat"><i>❤</i><span class="bar" id="hbar"><span></span></span></div>
  <div class="stat"><i>👊</i><b id="ko">0</b></div>
  <div class="spacer"></div>
  <button class="tog" id="tPause" title="일시정지">❚❚</button>
  <button class="tog" id="tMus" title="음악">♪</button>
  <button class="tog" id="tSnd" title="효과음">🔊</button>
</div>
<div id="boss"><div class="bar"><span></span></div></div>
<div id="combo"><b>0</b><span>HIT</span></div>
<div id="go">GO ▶</div>

<div id="pops"></div>
<div id="pad"><div id="knob"></div></div>
<button class="tbtn" id="bHam">🔨</button>
<button class="tbtn" id="bKick">🦶</button>
<button class="tbtn" id="bThrow">✊</button>
<div id="keys">←→ 이동 · J 망치(홀드) · K 발차기 · L 잡기</div>

<div class="panel" id="title">
  <h1 id="h1">오대수게임</h1>
  <div class="row">
    <button class="btn" id="start">START</button>
    <button class="btn sub" id="newgame" hidden>NEW GAME</button>
  </div>
  <div class="best" id="best"></div>
</div>
<div class="panel" id="stage"><h1 id="stageT">STAGE 1</h1></div>
<div class="panel" id="clear"><h1>CLEAR</h1><div class="num" id="clearN"></div><button class="btn" id="next">NEXT</button></div>
<div class="panel" id="over"><h1>GAME OVER</h1><div class="num" id="overN"></div><button class="btn" id="retry">RETRY</button></div>
<div class="panel" id="ending"><div class="num" id="endN"></div><button class="btn" id="endNext">THE END</button></div>
<div class="panel" id="pause"><button class="btn" id="resume">▶</button></div>

<div id="rotate">
  <div>
    <p id="rotTitle">가로 화면에서 하는 게임입니다</p>
    <button type="button" id="rotGo">가로로 돌리기</button>
    <p class="sub"><span id="rotHelp">단추가 안 먹으면 폰의 화면 회전 잠금을 풀고 눕혀 주세요</span><br>
      <a href="#" id="rotSkip">그래도 세로로 하기</a></p>
  </div>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="assets/landscape.js?v=4"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/art.js?v=8"></script>
<script src="js/game.js?v=19"></script>
<script src="/assets/visit.js?v=12" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
