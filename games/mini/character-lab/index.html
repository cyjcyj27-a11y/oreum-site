<script>
(()=>{
"use strict";

/* ── 말 두 벌 ── ?lang=en 이면 영어, 없으면 브라우저 언어를 따릅니다.
   주의: 직업·동작 이름은 코드 안에서 키로도 쓰이므로 키는 한국어 그대로 두고,
   화면에 보이는 글자만 STR로 바꾼다. ── */
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'ko') return q;
  return (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
})();
if (LANG === "en") document.querySelector('meta[name="description"]').setAttribute("content", "A 3D character lab with soft-vinyl figure vibes. Swap jobs, motions and proportions on a tiny swordsman.");
const STR = {
  ko: {
    title:'캐릭터 랩 — 소프비 칼잡이',
    capH:'소프비 · 1/12 스케일',
    h:['직업','동작','비율','표면'],
    sliders:['머리','몸통','팔다리','흐물거림','광택'],
    chips:{tJoint:'관절 볼',tSeam:'사출 자국',tSpin:'턴테이블',tGrid:'스케일 자'},
    shot:'정면 · 측면 · 후면',
    note:'드래그로 회전, 휠로 확대.<br><br><em>이 몸의 규칙</em> — 봉제 인형이 아니라 사출 피규어입니다. 관절 볼과 사출 자국이 보이고, 표면은 털이 아니라 비닐 광택입니다. 실루엣은 둥근 짐승이 아니라 각진 어깨의 사람입니다.',
    jobs:{'사원':'사원','알바':'알바','셰프':'셰프','노무자':'노무자','배달':'배달','경비':'경비'},
    descs:{'사원':'퇴근길에 칼을 들었다','알바':'교대 시간은 지났다','셰프':'주방에서 쓰던 손이다',
           '노무자':'현장에선 뭐든 연장이다','배달':'3분 남았다','경비':'교대 근무 27년차'},
    anims:{'대기':'대기','걷기':'걷기','찌르기':'찌르기','베기':'베기','백스텝':'백스텝','피격':'피격'},
    noEngine:'Three.js 로드 실패 — 네트워크 확인'
  },
  en: {
    title:'Character Lab — Vinyl Swordsman',
    capH:'Soft vinyl · 1/12 scale',
    h:['Job','Motion','Proportions','Surface'],
    sliders:['Head','Torso','Limbs','Wobble','Gloss'],
    chips:{tJoint:'Joint balls',tSeam:'Mold seams',tSpin:'Turntable',tGrid:'Scale ruler'},
    shot:'Front · Side · Back',
    note:'Drag to rotate, scroll to zoom.<br><br><em>Rules of this body</em> — This is a molded figure, not a plush toy. The joint balls and mold seams show, and the surface is vinyl gloss, not fur. The silhouette is a square-shouldered person, not a round beast.',
    jobs:{'사원':'Office worker','알바':'Part-timer','셰프':'Chef','노무자':'Laborer','배달':'Courier','경비':'Guard'},
    descs:{'사원':'Picked up a sword on the way home','알바':'The shift ended a while ago','셰프':'These hands ran a kitchen',
           '노무자':'On site, anything is a tool','배달':'3 minutes left','경비':'Year 27 of shift duty'},
    anims:{'대기':'Idle','걷기':'Walk','찌르기':'Stab','베기':'Slash','백스텝':'Backstep','피격':'Hit'},
    noEngine:'Failed to load Three.js — check your connection'
  }
}[LANG];
document.documentElement.lang = LANG;
document.title = STR.title;
document.querySelector('#cap .h').textContent = STR.capH;
document.querySelectorAll('#panel h2').forEach((el,i)=>{ el.textContent = STR.h[i]; });
document.querySelectorAll('#panel .row > label').forEach((el,i)=>{ el.textContent = STR.sliders[i]; });
Object.keys(STR.chips).forEach(id=>{ document.getElementById(id).textContent = STR.chips[id]; });
document.getElementById('shot').textContent = STR.shot;
document.querySelector('.note').innerHTML = STR.note;

if(!window.THREE){document.body.innerHTML='<div style="padding:40px;font:12px monospace;color:#888">'+STR.noEngine+'</div>';return;}

const glc=document.getElementById('gl'), view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();

/* ---------- 배경: 스튜디오 호리존 ---------- */
(()=>{ const c=document.createElement('canvas'); c.width=8;c.height=256;
  const g=c.getContext('2d'), grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#191519'); grd.addColorStop(0.55,'#100e11'); grd.addColorStop(1,'#08070a');
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  const t=new THREE.CanvasTexture(c); scene.background=t; })();

const cam=new THREE.PerspectiveCamera(34,1,0.05,60);
let orbA=0.5, orbP=0.14, orbR=3.5, target=new THREE.Vector3(0,0.62,0);

/* ---------- 조명: 피규어 촬영 세팅 ---------- */
scene.add(new THREE.HemisphereLight(0x3a3440,0x0d0c10,0.55));
const key=new THREE.DirectionalLight(0xfff0dc,1.25); key.position.set(-2.4,3.2,2.6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9fc4ff,0.42); fill.position.set(3.0,1.0,1.6); scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,1.0); rim.position.set(0.6,2.2,-3.4); scene.add(rim);
const kick=new THREE.PointLight(0xff9a4d,0.7,6,2); kick.position.set(1.6,0.4,1.2); scene.add(kick);

/* ---------- 바닥 + 스포트 풀 ---------- */
(()=>{ const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(256,256,10,256,256,250);
  rg.addColorStop(0,'#4a4247'); rg.addColorStop(0.5,'#221f24'); rg.addColorStop(1,'#0a090c');
  g.fillStyle=rg; g.fillRect(0,0,512,512);
  for(let i=0;i<9000;i++){ g.fillStyle=`rgba(255,255,255,${Math.random()*0.035})`;
    g.fillRect(Math.random()*512,Math.random()*512,1.4,1.4); }
  const t=new THREE.CanvasTexture(c);
  const f=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),
    new THREE.MeshPhongMaterial({map:t,shininess:14,specular:0x1a1a1e}));
  f.rotation.x=-Math.PI/2; scene.add(f); })();
// 접지 그림자
const shadow=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); const rg=g.createRadialGradient(64,64,2,64,64,62);
  rg.addColorStop(0,'rgba(0,0,0,0.75)'); rg.addColorStop(0.55,'rgba(0,0,0,0.28)');
  rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rg; g.fillRect(0,0,128,128);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.15,1.15),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.y=0.004; scene.add(m); return m; })();

/* ---------- 스케일 자 ---------- */
const ruler=new THREE.Group(); ruler.visible=false; scene.add(ruler);
(()=>{ const mat=new THREE.LineBasicMaterial({color:0x3a4a5a});
  for(let i=0;i<=13;i++){ const y=i*0.1, w=(i%5===0)?0.16:0.07;
    const g=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-0.9,y,-0.55), new THREE.Vector3(-0.9-w,y,-0.55)]);
    ruler.add(new THREE.Line(g,mat)); }
  const g2=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-0.9,0,-0.55), new THREE.Vector3(-0.9,1.3,-0.55)]);
  ruler.add(new THREE.Line(g2,mat)); })();

/* ---------- 재질 ---------- */
function vinyl(hex,shine){ return new THREE.MeshPhongMaterial({
  color:hex, shininess:shine===undefined?58:shine, specular:0x8a8a90, flatShading:false}); }
const M={
  skin:  vinyl(0xf2c9a6),
  skinD: vinyl(0xd9ab88),
  joint: vinyl(0xe0b48e,90),
  dark:  vinyl(0x2b2b33),
  eye:   new THREE.MeshBasicMaterial({color:0x14121a}),
  hi:    new THREE.MeshBasicMaterial({color:0xffffff}),
  blush: new THREE.MeshBasicMaterial({color:0xff9d8f,transparent:true,opacity:0.42}),
  seam:  new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.16}),
  blade: vinyl(0xdfe6ee,110),
  grip:  vinyl(0x33333c,40),
};

/* ---------- 캐릭터 조립 ---------- */
const HEAD_R=0.30;
const rig={};
const root=new THREE.Group(); scene.add(root);

function ball(r,mat,seg){ return new THREE.Mesh(new THREE.SphereGeometry(r,seg||20,seg?Math.round(seg*0.75):16),mat); }
function seamRing(r,axis){
  const t=new THREE.Mesh(new THREE.TorusGeometry(r*0.998,r*0.012,4,28),M.seam);
  if(axis==='y') t.rotation.x=Math.PI/2;
  return t;
}

// 몸통
const bodyPivot=new THREE.Group(); root.add(bodyPivot); rig.bodyPivot=bodyPivot;
const body=ball(1,M.dark,22); body.scale.set(0.30,0.27,0.255); body.position.y=0.50;
bodyPivot.add(body); rig.body=body;
const bodySeam=seamRing(1,'y'); bodySeam.scale.set(0.30,0.255,0.27); bodySeam.position.y=0.50;
bodyPivot.add(bodySeam); rig.bodySeam=bodySeam;
// 엉덩이 살짝
const hips=ball(1,M.dark,18); hips.scale.set(0.255,0.16,0.225); hips.position.y=0.30;
bodyPivot.add(hips); rig.hips=hips;

// 머리
const neck=new THREE.Group(); neck.position.y=0.71; bodyPivot.add(neck); rig.neck=neck;
const head=ball(HEAD_R,M.skin,26); head.scale.set(1.04,0.98,1.0); head.position.y=HEAD_R*0.86;
neck.add(head); rig.head=head;
const headSeam=seamRing(HEAD_R,'y'); headSeam.position.y=HEAD_R*0.86;
headSeam.scale.set(1.04,1.0,0.98); neck.add(headSeam); rig.headSeam=headSeam;
const faceG=new THREE.Group(); faceG.position.y=HEAD_R*0.86; neck.add(faceG); rig.faceG=faceG;
// 눈
function makeEye(sx){
  const g=new THREE.Group(); g.position.set(sx*0.115,0.028,-HEAD_R*0.955);
  const e=ball(0.052,M.eye,16); e.scale.set(0.82,1.06,0.42); g.add(e); g.userData.e=e;
  const h=ball(0.016,M.hi,10); h.position.set(-sx*0.016,0.020,-0.020); g.add(h);
  const x=new THREE.Group();
  for(let i=0;i<2;i++){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.014,0.012),M.eye);
    b.rotation.z=i?-0.75:0.75; x.add(b); }
  x.position.z=-0.012; x.visible=false; g.add(x); g.userData.x=x;
  return g;
}
const eyeL=makeEye(1), eyeR=makeEye(-1); faceG.add(eyeL,eyeR); rig.eyes=[eyeL,eyeR];
// 눈썹
function brow(sx){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.085,0.016,0.013),M.dark);
  b.position.set(sx*0.118,0.098,-HEAD_R*0.945); return b; }
const browL=brow(1), browR=brow(-1); faceG.add(browL,browR); rig.brows=[browL,browR];
// 입
const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.018,0.012),M.eye);
mouth.position.set(0,-0.075,-HEAD_R*0.95); faceG.add(mouth); rig.mouth=mouth;
// 볼터치
[1,-1].forEach(s=>{ const b=ball(0.05,M.blush,12); b.scale.set(1,0.62,0.3);
  b.position.set(s*0.175,-0.035,-HEAD_R*0.83); faceG.add(b); });
// 머리 액세서리 슬롯
const hatG=new THREE.Group(); hatG.position.y=HEAD_R*0.86; neck.add(hatG); rig.hatG=hatG;
const hairG=new THREE.Group(); hairG.position.y=HEAD_R*0.86; neck.add(hairG); rig.hairG=hairG;

// 팔
function makeArm(side){
  const sh=new THREE.Group(); sh.position.set(side*0.285,0.615,0); bodyPivot.add(sh);
  const jb=ball(0.075,M.joint,16); sh.add(jb); jb.name='joint';
  const upper=new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.052,0.24,14),M.skin);
  upper.position.y=-0.14; sh.add(upper);
  const elb=new THREE.Group(); elb.position.y=-0.26; sh.add(elb);
  const jb2=ball(0.056,M.joint,14); elb.add(jb2); jb2.name='joint';
  const fore=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.048,0.19,14),M.skin);

/* ---------- 애니메이션 ---------- */
const FD={ stab:{st:6,ac:3,rc:12}, slash:{st:12,ac:6,rc:26} };
const ANIMS=['대기','걷기','찌르기','베기','백스텝','피격'];
let anim='대기', af=0, t=0;
function lerp(a,b,k){return a+(b-a)*k;}
let headLag=0, headLagV=0, prevYaw=0, squash=1;

function pose(){
  t+=1/60; af++;
  const W=PROP.wb;
  // 초기화
  bodyPivot.position.set(0,0,0); bodyPivot.rotation.set(0,0,0);
  bodyPivot.scale.set(1,1,1);
  neck.rotation.set(0,0,0);
  armR.sh.rotation.set(0,0,0); armR.elb.rotation.set(0,0,0);
  armL.sh.rotation.set(0,0,0); armL.elb.rotation.set(0,0,0);
  legR.hip.rotation.set(0,0,0); legL.hip.rotation.set(0,0,0);
  legR.knee.rotation.set(0,0,0); legL.knee.rotation.set(0,0,0);
  rig.eyes.forEach(e=>{e.userData.x.visible=false; e.userData.e.visible=true; e.userData.e.scale.y=1.06;});
  rig.brows.forEach((b,i)=>{ b.rotation.z=(i?1:-1)*0.10; b.position.y=0.098; });
  mouth.scale.set(1,1,1); mouth.position.y=-0.075;
  knife.rotation.set(-Math.PI/2,0,0);
  root.rotation.z=0;

  const breathe=Math.sin(t*2.1)*0.012*W;
  let targetYaw=0;

  if(anim==='대기'){
    bodyPivot.position.y=Math.sin(t*2.1)*0.018*W;
    bodyPivot.rotation.y=Math.sin(t*0.9)*0.10*W;
    bodyPivot.scale.y=1+breathe; bodyPivot.scale.x=bodyPivot.scale.z=1-breathe*0.5;
    armR.sh.rotation.x=0.10+Math.sin(t*2.1+0.4)*0.09*W;
    armL.sh.rotation.x=0.10+Math.sin(t*2.1+0.7)*0.11*W;
    armR.sh.rotation.z=-0.16; armL.sh.rotation.z=0.16;
    armR.elb.rotation.x=-0.55; armL.elb.rotation.x=-0.20;
    targetYaw=bodyPivot.rotation.y;
  }
  else if(anim==='걷기'){
    const p=t*7.4, sw=Math.sin(p);
    bodyPivot.position.y=Math.abs(Math.sin(p))*0.035*W;
    bodyPivot.rotation.z=Math.sin(p)*0.07*W;
    bodyPivot.rotation.y=Math.sin(p)*0.13*W;
    legR.hip.rotation.x=sw*0.72; legL.hip.rotation.x=-sw*0.72;
    legR.knee.rotation.x=Math.max(0,-sw)*0.7; legL.knee.rotation.x=Math.max(0,sw)*0.7;
    armL.sh.rotation.x=sw*0.55; armL.sh.rotation.z=0.18;
    armR.sh.rotation.x=-sw*0.22+0.15; armR.sh.rotation.z=-0.25; armR.elb.rotation.x=-0.7;
    const land=Math.max(0,-Math.cos(p*2));
    bodyPivot.scale.y=1-land*0.05*W; bodyPivot.scale.x=bodyPivot.scale.z=1+land*0.03*W;
    targetYaw=bodyPivot.rotation.y;
  }
  else if(anim==='찌르기'||anim==='베기'){
    const k=anim==='찌르기'?'stab':'slash', d=FD[k], TOT=d.st+d.ac+d.rc+18;
    const f=af%TOT;
    let ph = f<d.st?'st' : f<d.st+d.ac?'ac' : f<d.st+d.ac+d.rc?'rc':'idle';
    if(k==='stab'){
      if(ph==='st'){ const u=f/d.st;
        armR.sh.rotation.x=lerp(0.1,-0.55,u); armR.elb.rotation.x=lerp(-0.5,-1.5,u);
        bodyPivot.rotation.y=lerp(0,0.34,u); bodyPivot.position.z=lerp(0,0.05,u);
        bodyPivot.scale.y=1+u*0.05; bodyPivot.scale.x=bodyPivot.scale.z=1-u*0.04;
        legR.hip.rotation.x=u*0.2; }
      else if(ph==='ac'){ const u=(f-d.st)/d.ac;
        armR.sh.rotation.x=lerp(-0.55,0.62,u); armR.elb.rotation.x=lerp(-1.5,-0.05,u);
        bodyPivot.rotation.y=lerp(0.34,-0.30,u); bodyPivot.position.z=lerp(0.05,-0.16,u);
        bodyPivot.scale.z=1+u*0.10; bodyPivot.scale.x=1-u*0.07;
        legL.hip.rotation.x=-u*0.5; legL.knee.rotation.x=u*0.4; }
      else if(ph==='rc'){ const u=(f-d.st-d.ac)/d.rc, e=1-Math.pow(1-u,2);
        armR.sh.rotation.x=lerp(0.62,0.1,e); armR.elb.rotation.x=lerp(-0.05,-0.5,e);
        bodyPivot.rotation.y=lerp(-0.30,0,e); bodyPivot.position.z=lerp(-0.16,0,e);
        bodyPivot.rotation.x=Math.sin(u*Math.PI)*0.10;
        rig.brows.forEach((b,i)=>{b.position.y=0.078;}); }
      armR.sh.rotation.z=-0.22; armL.sh.rotation.z=0.30; armL.sh.rotation.x=-0.25;
      targetYaw=bodyPivot.rotation.y;
    } else {
      if(ph==='st'){ const u=f/d.st;
        armR.sh.rotation.z=lerp(-0.2,-1.5,u); armR.sh.rotation.x=lerp(0.1,-0.5,u);
        armR.elb.rotation.x=lerp(-0.5,-1.0,u);
        bodyPivot.rotation.y=lerp(0,0.66,u);
        bodyPivot.scale.y=1+u*0.07; bodyPivot.scale.x=bodyPivot.scale.z=1-u*0.05;
        legR.hip.rotation.x=u*0.28; }
      else if(ph==='ac'){ const u=(f-d.st)/d.ac;
        armR.sh.rotation.z=lerp(-1.5,1.15,u); armR.sh.rotation.x=lerp(-0.5,0.25,u);
        armR.elb.rotation.x=lerp(-1.0,-0.15,u);
        bodyPivot.rotation.y=lerp(0.66,-0.70,u);
        bodyPivot.rotation.z=Math.sin(u*Math.PI)*0.16;
        bodyPivot.scale.x=1+u*0.09; bodyPivot.scale.y=1-u*0.06; }
      else if(ph==='rc'){ const u=(f-d.st-d.ac)/d.rc, e=1-Math.pow(1-u,2.2);
        armR.sh.rotation.z=lerp(1.15,-0.2,e); armR.sh.rotation.x=lerp(0.25,0.1,e);
        armR.elb.rotation.x=lerp(-0.15,-0.5,e);
        bodyPivot.rotation.y=lerp(-0.70,0,e);
        bodyPivot.rotation.x=Math.sin(u*Math.PI)*0.14;
        legL.hip.rotation.x=-Math.sin(u*Math.PI)*0.3;
        rig.brows.forEach(b=>{b.position.y=0.078;});
        mouth.scale.x=1.35; }
      armL.sh.rotation.z=0.42; armL.sh.rotation.x=-0.30;
      targetYaw=bodyPivot.rotation.y;
    }
  }
  else if(anim==='백스텝'){
    const TOT=8+15+22, f=af%TOT;
    if(f<8){ const u=f/8;
      bodyPivot.position.z=u*0.30; bodyPivot.rotation.x=-u*0.38;
      bodyPivot.position.y=Math.sin(u*Math.PI)*0.09;
      legR.hip.rotation.x=-u*0.9; legL.hip.rotation.x=-u*0.55;
      legR.knee.rotation.x=u*1.0; legL.knee.rotation.x=u*0.6;
      armR.sh.rotation.x=-u*0.5; armL.sh.rotation.x=-u*0.7; armL.sh.rotation.z=0.5;
      bodyPivot.scale.y=1+u*0.06; }
    else if(f<8+15){ const u=(f-8)/15, e=1-Math.pow(1-u,2);
      bodyPivot.position.z=lerp(0.30,0,e); bodyPivot.rotation.x=lerp(-0.38,0.10,e);
      bodyPivot.scale.y=lerp(1.06,0.93,Math.min(1,e*1.6));
      bodyPivot.scale.x=bodyPivot.scale.z=lerp(1,1.05,Math.min(1,e*1.6));
      legR.hip.rotation.x=lerp(-0.9,0,e); legL.hip.rotation.x=lerp(-0.55,0,e);
      legR.knee.rotation.x=lerp(1.0,0,e); legL.knee.rotation.x=lerp(0.6,0,e);
      armR.sh.rotation.x=lerp(-0.5,0.1,e); armL.sh.rotation.x=lerp(-0.7,0.1,e); }
    else { const u=(f-23)/22;
      bodyPivot.scale.y=lerp(0.93,1,u); bodyPivot.scale.x=bodyPivot.scale.z=lerp(1.05,1,u);
      bodyPivot.rotation.x=lerp(0.10,0,u); armR.sh.rotation.x=0.1; armL.sh.rotation.x=0.1; }
    targetYaw=0;
  }
  else if(anim==='피격'){
    const TOT=90, f=af%TOT;
    if(f<4){ // 히트스톱
      bodyPivot.scale.set(1.14,0.88,1.14);
      rig.eyes.forEach(e=>{e.userData.e.visible=false;e.userData.x.visible=true;});
      mouth.scale.set(1.6,1.9,1); mouth.position.y=-0.088;
    } else if(f<48){ const u=(f-4)/44, e=1-Math.pow(1-u,2);
      root.rotation.z=lerp(0,Math.PI*0.52,e);
      bodyPivot.position.y=Math.sin(u*Math.PI)*0.22;
      bodyPivot.position.z=e*0.34;
      bodyPivot.rotation.x=-e*0.5;
      legR.hip.rotation.x=-e*1.1; legL.hip.rotation.x=-e*0.75;
      legR.knee.rotation.x=e*0.9;
      armR.sh.rotation.x=-e*1.5; armL.sh.rotation.x=-e*1.8; armL.sh.rotation.z=0.9;
      bodyPivot.scale.set(lerp(1.14,1,e),lerp(0.88,1,e),lerp(1.14,1,e));
      rig.eyes.forEach(ey=>{ey.userData.e.visible=false;ey.userData.x.visible=true;});
      mouth.scale.set(1.4,1.6,1);
    } else { const u=(f-48)/42;
      root.rotation.z=Math.PI*0.52+Math.sin(u*Math.PI*3)*0.03*(1-u);
      bodyPivot.position.z=0.34; bodyPivot.rotation.x=-0.5;
      legR.hip.rotation.x=-1.1; legL.hip.rotation.x=-0.75; legR.knee.rotation.x=0.9;
      armR.sh.rotation.x=-1.5; armL.sh.rotation.x=-1.8; armL.sh.rotation.z=0.9;
      rig.eyes.forEach(ey=>{ey.userData.e.visible=false;ey.userData.x.visible=true;});
      mouth.scale.set(1.4,1.6,1);
    }
    targetYaw=0;
  }

  // 머리 지연 (통통한 캐릭터의 생명)
  const dy=targetYaw-prevYaw; prevYaw=targetYaw;
  headLagV += (-headLag*0.30 - headLagV*0.30) + (-dy*1.9);
  headLagV*=0.86; headLag+=headLagV;
  headLag=Math.max(-0.5,Math.min(0.5,headLag));
  neck.rotation.y+=headLag*PROP.wb;
  neck.rotation.z+=-headLag*0.35*PROP.wb;
  neck.rotation.x+=Math.sin(t*2.1+1.2)*0.02*PROP.wb;

  // 칼날 하이라이트
  const isActive = (anim==='찌르기'||anim==='베기') && (()=>{
    const k=anim==='찌르기'?FD.stab:FD.slash, TOT=k.st+k.ac+k.rc+18, f=af%TOT;
    return f>=k.st&&f<k.st+k.ac; })();
  knife.userData.blade.material = isActive ? M.hi : M.blade;

  shadow.position.set(bodyPivot.position.x*0.6, 0.004, bodyPivot.position.z*0.6);
  shadow.material.opacity = 0.55+bodyPivot.position.y*-0.6;
}

/* ---------- 카메라 조작 ---------- */
let drag=false, lx=0, ly=0;
view.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;optSpin=false;syncChips();});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{ if(!drag)return;
  orbA-=(e.clientX-lx)*0.008; orbP=Math.max(-0.5,Math.min(1.1,orbP+(e.clientY-ly)*0.006));
  lx=e.clientX;ly=e.clientY; });
view.addEventListener('wheel',e=>{e.preventDefault();
  orbR=Math.max(1.3,Math.min(7,orbR+e.deltaY*0.0022));},{passive:false});
view.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;optSpin=false;},{passive:true});
view.addEventListener('touchmove',e=>{ if(!drag)return;
  orbA-=(e.touches[0].clientX-lx)*0.01; orbP=Math.max(-0.5,Math.min(1.1,orbP+(e.touches[0].clientY-ly)*0.008));
  lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',()=>drag=false);

/* ---------- UI ---------- */
const jobsEl=document.getElementById('jobs'), animsEl=document.getElementById('anims');
Object.keys(JOBS).forEach(n=>{ const b=document.createElement('button');
  b.className='chip'+(n===jobName?' on':''); b.textContent=STR.jobs[n]; b.dataset.job=n;
  b.onclick=()=>{ setJob(n); [...jobsEl.children].forEach(c=>c.classList.toggle('on',c.dataset.job===n)); };
  jobsEl.appendChild(b); });
ANIMS.forEach(n=>{ const b=document.createElement('button');
  b.className='chip'+(n===anim?' on':''); b.textContent=STR.anims[n]; b.dataset.anim=n;
  b.onclick=()=>{ anim=n; af=0; headLag=0; headLagV=0;
    [...animsEl.children].forEach(c=>c.classList.toggle('on',c.dataset.anim===n)); };
  animsEl.appendChild(b); });

function bindProp(id,key){ const el=document.getElementById(id), v=document.getElementById('v_'+id);
  const set=()=>{ PROP[key]=+el.value/100; v.textContent=PROP[key].toFixed(1); applyProps(); };
  el.addEventListener('input',set); set(); }
bindProp('hd','hd'); bindProp('bw','bw'); bindProp('lb','lb'); bindProp('wb','wb');
const glS=document.getElementById('gl_s');
glS.addEventListener('input',()=>{ shine=+glS.value;
  document.getElementById('v_gl_s').textContent=shine; applySurface(); });

const chips={tJoint:'optJoint',tSeam:'optSeam',tSpin:'optSpin',tGrid:'optGrid'};
function syncChips(){ document.getElementById('tJoint').classList.toggle('on',optJoint);
  document.getElementById('tSeam').classList.toggle('on',optSeam);
  document.getElementById('tSpin').classList.toggle('on',optSpin);
  document.getElementById('tGrid').classList.toggle('on',optGrid); }
document.getElementById('tJoint').onclick=()=>{optJoint=!optJoint;applySurface();syncChips();};
document.getElementById('tSeam').onclick=()=>{optSeam=!optSeam;applySurface();syncChips();};
document.getElementById('tSpin').onclick=()=>{optSpin=!optSpin;syncChips();};
document.getElementById('tGrid').onclick=()=>{optGrid=!optGrid;applySurface();syncChips();};
let shotIdx=0;
document.getElementById('shot').onclick=()=>{ optSpin=false; syncChips();
  orbA=[0,Math.PI/2,Math.PI][shotIdx%3]; orbP=0.12; orbR=3.2; shotIdx++; };

/* ---------- 루프 ---------- */
function resize(){ const r=view.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false);
  cam.aspect=r.width/r.height; cam.updateProjectionMatrix(); }
addEventListener('resize',resize);

let last=performance.now(), acc=0;
function loop(now){ requestAnimationFrame(loop);
  acc+=Math.min(now-last,100); last=now;
  while(acc>=1000/60){ pose(); if(optSpin&&!drag) orbA+=0.0045; acc-=1000/60; }
  cam.position.set(target.x+Math.sin(orbA)*Math.cos(orbP)*orbR,
                   target.y+Math.sin(orbP)*orbR,
                   target.z+Math.cos(orbA)*Math.cos(orbP)*orbR);
  cam.lookAt(target);
  renderer.render(scene,cam); }

setJob('사원'); applyProps(); applySurface(); syncChips(); resize();
requestAnimationFrame(loop);
})();
</script>
