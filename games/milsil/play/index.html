<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>밀실</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Ria;src:url(fonts/RiaSans-ExtraBold.woff2) format('woff2');font-display:swap}
@font-face{font-family:Dokdo;src:url(fonts/EastSeaDokdo-title.woff2) format('woff2');font-display:block}
:root{--navy:#1b2a5a;--edge:#3d3d3d;--btn:linear-gradient(180deg,#6a4a2c 0%,#45301a 50%,#2a1b0d 100%);--ink:#140f0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0907;color:#fff;font-family:Ria,system-ui,sans-serif;overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0}
/* 장면 상자: 16:9 를 화면에 맞춰 넣는다(오른쪽은 소지품 칸) */
#view{position:absolute;overflow:hidden;background:#000}
#view .bg,#view .bg2{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#view .bg2{opacity:0;transition:opacity .9s}
#layer{position:absolute;inset:0}
.spot{position:absolute;cursor:pointer}
.spr{position:absolute;pointer-events:none;background-repeat:no-repeat}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
#lampdark{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,rgba(0,0,0,.55),rgba(0,0,0,.82));opacity:0;pointer-events:none;transition:opacity .15s}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
/* 이동 화살표 */
.nav{position:absolute;width:54px;height:84px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;opacity:.85}
.nav:hover{opacity:1}
.nav i{display:block;width:26px;height:26px;border-left:7px solid #fff;border-bottom:7px solid #fff;filter:drop-shadow(0 0 0 var(--navy)) drop-shadow(2px 3px 0 rgba(0,0,0,.6))}
.nav.l i{transform:rotate(45deg);margin-left:10px}
.nav.r i{transform:rotate(-135deg);margin-right:10px}
.nav.b{width:84px;height:50px}
.nav.b i{transform:rotate(-45deg);margin-top:-8px;width:20px;height:20px;border-width:0 0 6px 6px}
/* 상단바 */
#topbar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;z-index:20;
  padding:6px 10px 0 calc(104px + env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
#topbar>*{pointer-events:auto}
.stat{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;font-family:Dokdo,Ria,sans-serif;font-size:15px;
  background:var(--btn);border:3px solid var(--edge);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25),0 4px 0 var(--edge)}
.stat small{font-size:19px;opacity:.85;letter-spacing:.5px}
.stat b{font-size:25px;color:#fff;-webkit-text-stroke:4px var(--edge);paint-order:stroke fill;font-weight:normal}
.stat.tap{cursor:pointer}
.stat.tap:active{transform:translateY(3px)}
.spacer{flex:1}
.tog{width:54px;height:34px;border-radius:999px;border:3px solid var(--edge);cursor:pointer;font:20px/1 Dokdo,Ria,sans-serif;color:#fff;
  background:var(--btn);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 4px 0 var(--edge);
  -webkit-text-stroke:3px var(--edge);paint-order:stroke fill;display:flex;align-items:center;justify-content:center}
#topbar>.stat:not(.tap){pointer-events:none}   /* 누르는 단추가 아닌 알약(STAGE·시간)은 손가락을 아래 그림으로 통과 */
.tog.wide{width:auto;padding:0 12px;white-space:nowrap;display:flex;align-items:center;gap:5px}.tog.wide small{font-size:14px;opacity:.85}.tog.wide b{font-weight:400}
.stgrid{display:grid;grid-template-columns:repeat(4,68px);gap:10px;justify-content:center;margin:10px 0 4px}
.sbtn{height:52px;border-radius:14px;border:3px solid var(--edge);cursor:pointer;display:flex;align-items:center;justify-content:center;font:30px/1 Dokdo,Ria,sans-serif;color:#fff;
  background:var(--btn);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 0 var(--edge);-webkit-text-stroke:3px var(--edge);paint-order:stroke fill}
.sbtn.cur{box-shadow:0 0 0 4px #f0d890,inset 0 3px 0 rgba(255,255,255,.3),0 4px 0 var(--edge)}
.sbtn.lock{filter:grayscale(1) brightness(.5);opacity:.55;cursor:default}
@media (max-height:480px){.stgrid{grid-template-columns:repeat(4,54px);gap:6px;margin:4px 0 0}.sbtn{height:34px;font-size:22px;border-radius:10px}}
.tog.ico{position:relative;display:flex;align-items:center;justify-content:center}.tog.ico svg{width:22px;height:22px;filter:drop-shadow(0 1px 0 var(--edge))}
.tog.ico.off::after{content:'';position:absolute;left:26%;right:26%;top:50%;height:1.5px;margin-top:-.75px;background:#fff;border-radius:1px;transform:rotate(-40deg);box-shadow:0 0 0 .5px rgba(0,0,0,.5)}
.tog.off{filter:grayscale(1) brightness(.6);text-decoration:line-through}
.tog:active{transform:translateY(3px)}
/* 소지품 칸 */
#inv{position:absolute;top:0;bottom:0;right:0;width:92px;padding:58px 10px 10px;display:flex;flex-direction:column;gap:9px;align-items:center;
  background:linear-gradient(90deg,#15100b,#211810);border-left:3px solid var(--edge);z-index:10;overflow-y:auto;scrollbar-width:none}
.slot{width:70px;height:70px;flex:0 0 70px;border-radius:14px;border:3px solid var(--edge);position:relative;cursor:pointer;
  background:var(--btn);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 0 var(--edge)}
.slot img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.slot.sel{border-color:#d8d8d8;filter:brightness(1.35);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 4px 0 var(--edge),0 0 16px rgba(230,230,230,.55)}
.slot.empty{cursor:default;opacity:.45}
.slot.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
/* 말풍선 한 줄 */
#toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:15;padding:10px 20px;border-radius:14px;font-size:19px;
  background:rgba(12,8,5,.82);border:2px solid rgba(214,170,100,.5);color:#f4e6cc;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92%}
#toast.on{opacity:1}
/* 크게 보기·단서 창 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(4,3,2,.78);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.card{position:relative;width:min(100%,560px);max-height:96%;overflow:auto;border:5px solid var(--navy);border-radius:26px;padding:22px 22px 20px;text-align:center;
  background:linear-gradient(180deg,#f6ecd6 0%,#e8d7b4 60%,#d8c197 100%);color:#2b1d10;box-shadow:inset 0 5px 0 rgba(255,255,255,.7),0 8px 0 var(--navy),0 20px 50px rgba(0,0,0,.55);animation:askIn .18s ease-out}
@keyframes askIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card .pic{position:relative;height:min(46vh,300px);display:flex;align-items:center;justify-content:center}
.card .pic img{max-height:100%;max-width:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.card h3{margin:10px 0 6px;font-size:24px;color:#2b1d10}
.card p{margin:4px 0 0;font-size:19px;line-height:1.55;color:#3d2a17;font-family:'Nanum Myeongjo',Batang,serif;font-weight:700}
.x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;color:#fff;font:20px Ria;
  background:var(--btn);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--edge);-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;z-index:2}
.x::before,.x::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:4px;margin:-2px 0 0 -9px;border-radius:2px;background:#fff}
.x::before{transform:rotate(45deg)}.x::after{transform:rotate(-45deg)}
.x:active{transform:translateY(3px)}
/* 비밀 잉크 점 */
.inkdots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);display:flex;gap:4.2%;width:52%;justify-content:center}
.inkdots span{width:14%;aspect-ratio:1;opacity:.72;mix-blend-mode:multiply;filter:blur(.7px);
  border-radius:47% 53% 44% 56% / 52% 45% 55% 48%;box-shadow:0 0 6px 3px rgba(150,90,30,.45),inset 0 0 5px rgba(90,45,10,.6)}
.inkdots span:nth-child(2){border-radius:55% 45% 52% 48% / 45% 55% 47% 53%;transform:rotate(20deg)}
.inkdots span:nth-child(3){border-radius:50% 50% 44% 56% / 58% 46% 54% 42%}
.inkdots span:nth-child(4){border-radius:44% 56% 57% 43% / 50% 52% 48% 50%;transform:rotate(-15deg)}
/* 수첩 */
.notes{text-align:left}
.note{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;margin-top:10px;background:rgba(255,255,255,.4);border:2px solid rgba(43,29,16,.25);cursor:pointer}
.note img{width:54px;height:54px;object-fit:contain}
.note p{margin:0;font-size:16px}
.note.none{opacity:.35;cursor:default}
/* 다이얼 자물쇠 */
.dial{display:flex;gap:14px;justify-content:center;margin:8px 0 4px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel button{width:62px;height:40px;border-radius:12px;border:3px solid var(--edge);cursor:pointer;
  background:var(--btn);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 4px 0 var(--edge);position:relative}
.wheel button:active{transform:translateY(3px)}
.wheel button::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;border-left:5px solid #fff;border-top:5px solid #fff;transform:translate(-50%,-25%) rotate(45deg)}
.wheel button.dn::after{transform:translate(-50%,-75%) rotate(225deg)}
.wheel .num{width:62px;height:78px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:46px;color:#2b1d10;
  background:linear-gradient(180deg,#b89a5e,#f4e2b0 30%,#fff3cf 50%,#f4e2b0 70%,#b89a5e);border:3px solid #5a4020;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
/* 자물쇠 창: 누른 수 점, 방향 단추, 번호 단추 */
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 14px}
.dots i{width:18px;height:18px;border-radius:50%;background:rgba(43,29,16,.2);border:2px solid rgba(43,29,16,.45)}
.dots i.on{background:#5a3a1c;border-color:#2b1d10}
.kbtn{width:74px;height:62px;border-radius:14px;border:3px solid var(--edge);cursor:pointer;position:relative;font:34px/1 Dokdo,Ria,sans-serif;color:#fff;
  background:var(--btn);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 0 var(--edge);-webkit-text-stroke:3px var(--edge);paint-order:stroke fill}
.kbtn:active{transform:translateY(3px)}
.kbtn.blank{visibility:hidden}
.kgrid{display:grid;grid-template-columns:repeat(3,74px);gap:10px;justify-content:center}
.dpad{display:grid;grid-template-columns:repeat(3,74px);grid-template-rows:repeat(3,62px);gap:8px;justify-content:center}
.kbtn.dir.u{grid-area:1/2}.kbtn.dir.l{grid-area:2/1}.kbtn.dir.r{grid-area:2/3}.kbtn.dir.d{grid-area:3/2}
.kbtn.dir::after{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;border-left:6px solid #fff;border-top:6px solid #fff;margin:-6px 0 0 -11px}
.kbtn.dir.u::after{transform:rotate(45deg);margin-top:-4px}.kbtn.dir.d::after{transform:rotate(225deg);margin-top:-14px}
.kbtn.dir.l::after{transform:rotate(-45deg);margin-left:-6px;margin-top:-11px}.kbtn.dir.r::after{transform:rotate(135deg);margin-left:-16px;margin-top:-11px}
/* 거울 김 서림, 김 */
.fog{background:radial-gradient(ellipse at 50% 55%,rgba(226,234,240,.72),rgba(215,226,235,.55) 80%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity 2.4s;box-shadow:inset 0 0 30px rgba(255,255,255,.6)}
.steam{background:radial-gradient(circle,rgba(240,245,250,.55),rgba(240,245,250,0) 65%);animation:steam 4.2s ease-out infinite;opacity:0}
@media (max-height:480px){.kbtn{width:58px;height:44px;font-size:26px}.kgrid{grid-template-columns:repeat(3,58px);gap:6px}.dpad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,44px);gap:5px}.dots{margin:2px 0 8px}}
.namecard{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fbf5e6,#eadcbc);border:1px solid #a88f60;border-radius:3px;
  box-shadow:0 3px 5px rgba(0,0,0,.45);color:#2b1d10;font:700 calc(26px * var(--vs,1))/1 'Nanum Myeongjo',Batang,serif;transition:transform .2s,box-shadow .2s}
html.en .namecard{white-space:nowrap;font-size:calc(22px * var(--vs,1))}
.namecard.pick{transform:translateY(-12%);box-shadow:0 0 0 3px #f0d890,0 6px 14px rgba(0,0,0,.5)}
/* 20스테이지: 글자 바퀴, 그림 위 글씨, 분필 표시, 긁힌 숫자 */
.wheel.wide button,.wheel.wide .num{width:84px}
.onpic{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1;white-space:nowrap}
.onpic.ink{color:rgba(118,58,16,.82);font-family:'Nanum Myeongjo',Batang,serif;font-weight:700;transform:rotate(-7deg);filter:blur(.5px);text-shadow:0 0 6px rgba(150,80,20,.45)}
.onpic.photo{color:rgba(34,30,26,.86);font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.06em;filter:blur(.7px);
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(40,34,28,.35) 100%)}
.onpic.dent{color:rgba(110,100,86,.46);font-family:Dokdo,Ria,sans-serif;letter-spacing:.1em;text-shadow:1px 1px 0 rgba(255,255,255,.75),-1px -1px 0 rgba(0,0,0,.28)}
.chalk{opacity:.8;filter:blur(.8px);border-radius:46% 54% 40% 60% / 55% 42% 58% 45%;box-shadow:0 0 0 calc(4px * var(--vs,1)) rgba(226,218,196,.55),0 0 calc(10px * var(--vs,1)) calc(3px * var(--vs,1)) rgba(226,218,196,.25)}
.scratch{display:flex;align-items:center;justify-content:center;font:calc(84px * var(--vs,1))/1 Dokdo,Ria,sans-serif;letter-spacing:.16em;
  color:rgba(222,200,168,.62);text-shadow:0 calc(2px * var(--vs,1)) 0 rgba(0,0,0,.8);transform:rotate(-3deg)}
.chalknum{display:flex;align-items:center;justify-content:center;font:calc(64px * var(--vs,1))/1 Dokdo,Ria,sans-serif;letter-spacing:.06em;
  color:rgba(236,232,222,.8);filter:blur(.4px);transform:rotate(-5deg)}
.photoback{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e3d4b0,#c9b68c);border:calc(3px * var(--vs,1)) solid #3a2a1a;
  font:700 calc(15px * var(--vs,1))/1 'Nanum Myeongjo',Batang,serif;color:rgba(60,40,24,.8);box-shadow:0 4px 8px rgba(0,0,0,.6)}
.lock5{display:flex;gap:8%;align-items:center;justify-content:center;background:linear-gradient(180deg,#1c1b1a,#353230);border-radius:6%;box-shadow:inset 0 4px 8px rgba(0,0,0,.8)}
.lock5 i{width:22%;height:46%;border-radius:10%;background:linear-gradient(180deg,#8d7a58,#e8d9b2 50%,#8d7a58);box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
.fog.mist{border-radius:0 0 50% 50% / 0 0 62% 62%}
.pouring{animation:pourwob .18s ease-in-out infinite alternate}
@keyframes pourwob{from{transform:rotate(0)}to{transform:rotate(.8deg)}}
.fxsplash{animation:fxsplash .22s steps(2) infinite;transform-origin:50% 90%}
@keyframes fxsplash{0%{transform:scale(.8,1.1);opacity:.95}100%{transform:scale(1.15,.85) translateX(4%);opacity:.8}}
.fxdrop{animation:fxdrop .42s cubic-bezier(.5,0,1,.6) forwards}
@keyframes fxdrop{from{transform:translateY(0)}to{transform:translateY(calc(130px * var(--vs,1)));opacity:.3}}
.fxsteam{opacity:0;animation:fxsteam 2.3s ease-out forwards;transform-origin:50% 100%}
@keyframes fxsteam{0%{transform:translateY(30%) scale(.5);opacity:0}25%{opacity:.9}100%{transform:translateY(-55%) scale(1.25);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.card.okglow{animation:okglow .6s ease-out}
@keyframes okglow{0%{box-shadow:inset 0 5px 0 rgba(255,255,255,.7),0 8px 0 var(--navy),0 0 0 0 rgba(255,215,120,0)}40%{box-shadow:inset 0 5px 0 rgba(255,255,255,.7),0 8px 0 var(--navy),0 0 40px 18px rgba(255,215,120,.85);filter:brightness(1.12)}100%{box-shadow:inset 0 5px 0 rgba(255,255,255,.7),0 8px 0 var(--navy),0 20px 50px rgba(0,0,0,.55)}}
.nail{border-radius:50%;background:radial-gradient(circle at 35% 35%,#d8c49a 0,#7a6444 45%,#2a2016 80%);box-shadow:1px 2px 2px rgba(0,0,0,.7)}
.uvnum{display:flex;align-items:center;justify-content:center;font:calc(110px * var(--vs,1))/1 Dokdo,Ria,sans-serif;letter-spacing:.12em;color:#c8fff2;
  text-shadow:0 0 calc(8px * var(--vs,1)) #7fffe0,0 0 calc(22px * var(--vs,1)) #3fe0c0,0 0 calc(44px * var(--vs,1)) rgba(60,255,220,.5);opacity:.92;transform:rotate(-4deg);mix-blend-mode:screen}
/* 엔딩 */
#ending{position:fixed;inset:0;z-index:60;background:#000;display:none;cursor:pointer}
#ending.on{display:block}
#endImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s}
#endTxt{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:min(92%,900px);text-align:center;padding:14px 22px;border-radius:14px;
  background:rgba(8,5,3,.72);color:#f4e6cc;font:700 clamp(18px,2.6vw,28px)/1.5 'Nanum Myeongjo',Batang,serif;transition:opacity .5s}
#endFin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(0,0,0,.45)}
#endFin.on{display:flex}
#endFin b{font-family:Dokdo,Ria,sans-serif;font-weight:400;line-height:.9;color:#f3e2bd;text-shadow:0 0 24px rgba(255,200,120,.35),0 6px 0 #120c07,0 8px 30px rgba(0,0,0,.9);font-size:min(34vh,24vw)}
#endTime{font-size:22px;color:#f4e6cc}
.susp{box-shadow:0 6px 14px rgba(0,0,0,.6);transition:transform .3s}
.accuse{margin-top:12px;display:inline-block}
@media (max-height:480px){#endTxt{bottom:6%;font-size:16px;padding:8px 14px}#endFin b{font-size:34vh}}
/* 타이틀 */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;
  background:url(img/r1_s.webp) center/cover;transition:opacity .6s}
#title::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0),rgba(0,0,0,.55))}
#title h1{position:relative;margin:0;font-family:Dokdo,Ria,sans-serif;font-weight:400;font-size:min(46vh,34vw);line-height:.9;letter-spacing:.08em;color:#f3e2bd;
  text-shadow:0 0 24px rgba(255,200,120,.35),0 6px 0 #120c07,0 8px 30px rgba(0,0,0,.9)}
html.en #title h1{font-size:min(22vh,11vw);letter-spacing:.03em;text-align:center;line-height:.95}
.btns{position:relative;display:flex;gap:14px}
.btn{font:42px/1 Dokdo,Ria,sans-serif;letter-spacing:.04em;text-align:center;color:#fff;border-radius:999px;padding:12px 30px 10px;border:4px solid var(--edge);cursor:pointer;min-width:190px;
  background:var(--btn);
  box-shadow:inset 0 4px 0 rgba(255,235,200,.28),inset 0 -5px 0 rgba(0,0,0,.25),0 5px 0 var(--edge);-webkit-text-stroke:4px var(--edge);paint-order:stroke fill}
.btn.main{font-size:42px}
.btn:active{transform:translateY(3px)}
/* 방 탈출 */
#clear{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(0,0,0,.72)}
#clear.on{display:flex}
#clear b{font-family:Dokdo,Ria,sans-serif;font-weight:400;line-height:.9;color:#f3e2bd;text-shadow:0 0 24px rgba(255,200,120,.35),0 6px 0 #120c07,0 8px 30px rgba(0,0,0,.9);font-size:min(36vh,26vw);animation:pop .6s ease-out}
#clear .t{font-size:24px;color:#f4e6cc}
/* 세로 안내 */
#rotate{position:fixed;inset:0;z-index:90;background:#0b0907;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:auto}
@media (orientation:portrait) and (max-width:760px){#rotate{display:flex}}
html.ol-land #rotate{display:none!important}
/* 폰 가로 */
@media (max-height:480px){
  #topbar{height:44px;padding-top:4px}
  .stat{height:30px}.stat small{font-size:16px}.stat b{font-size:21px}
  .tog{width:48px;height:30px}
  #inv{width:76px;padding-top:48px;gap:6px}
  .slot{width:58px;height:58px;flex-basis:58px;border-radius:12px}
  #title{justify-content:flex-start;padding-top:9vh;padding-bottom:26vh;gap:3vh}
  #title h1{font-size:46vh}
  html.en #title h1{font-size:22vh}
  .btn{font-size:9.4vh;padding:1.4vh 4vh 1.1vh;min-width:0}
  .btn.main{font-size:9.4vh}
  #toast{font-size:15px;bottom:20%}
  .card{padding:14px;border-radius:20px}
  .card .pic{height:40vh}
  .card h3{font-size:19px;margin:6px 0 2px}.card p{font-size:15px}
  .wheel .num{height:58px;font-size:36px}.wheel button{height:32px}
  .nav i{width:22px;height:22px;border-width:0 0 6px 6px}
}
</style>
</head>
<body>
<div id="game">
  <div id="view">
    <img class="bg" id="bg" alt=""><img class="bg2" id="bg2" alt="">
    <div id="layer"></div>
    <div id="lampdark"></div>
    <div id="dim"></div>
    <div id="toast"></div>
    <div id="fade"></div>
  </div>
  <!-- 화살표는 그림 밖 전용 칸(양옆·아래 띠)에 둔다 — 그림을 덮지 않게(사장님 2026-09-27) -->
  <div class="nav l" id="navL"><i></i></div>
  <div class="nav r" id="navR"><i></i></div>
  <div class="nav b" id="navB"><i></i></div>
  <div id="topbar">
    <div class="stat"><small>STAGE</small><b id="stRoom">1/20</b></div>
    <div class="stat tap" id="stNote"><small>NOTE</small><b id="stClue">0/12</b></div>
    <div class="stat"><b id="stTime">00:00</b></div>
    <div class="spacer"></div>
    <div class="tog wide" id="tgStage"><small>CLEAR</small> <b id="stDone">0</b></div>
    <div class="tog ico" id="tgBgm" title="BGM"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.5l11-2.5v12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="6.3" cy="17.8" rx="3.4" ry="2.7" fill="#fff"/><ellipse cx="17.3" cy="15.3" rx="3.4" ry="2.7" fill="#fff"/></svg></div>
    <div class="tog ico" id="tgSfx" title="SFX"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
  </div>
  <div id="inv"></div>
</div>

<div class="modal" id="look"><div class="card" id="lookCard"><div class="x" data-close></div><div class="pic" id="lookPic"></div><h3 id="lookH"></h3><p id="lookP"></p></div></div>
<div class="modal" id="stageM"><div class="card"><div class="x" data-close></div><h3>STAGE</h3><div class="stgrid" id="stageList"></div></div></div>
<div class="modal" id="noteM"><div class="card notes"><div class="x" data-close></div><h3>NOTE</h3><div id="noteList"></div></div></div>
<div class="modal" id="dialM"><div class="card"><div class="x" data-close></div><div class="dial" id="dial"></div></div></div>

<div id="clear"><b>CLEAR</b><div class="t" id="clearT"></div><div class="btns"><div class="btn main" id="btnNext">NEXT</div></div></div>

<div id="ending"><img id="endImg" alt=""><div id="endTxt"></div>
  <div id="endFin"><b>THE END</b><div id="endTime"></div><div class="btns"><div class="btn main" id="endTitle">TITLE</div></div></div></div>

<div id="title">
  <h1>밀실</h1>
  <div class="btns" id="titleBtns"></div>
</div>
<div id="rotate"><div class="btn main" onclick="window.OL&&OL.go()">가로로 보기</div></div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/lang.js?v=5"></script>
<script src="assets/landscape.js"></script>
<script src="sounds/door.js?v=1"></script>
<script src="js/sound.js?v=10"></script>
<script src="js/game.js?v=56"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
