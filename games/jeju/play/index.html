     그 자리에 겹치는 매입·짓기 단추의 누름을 가로챘다 (사장님 2026-09-12 "급매 사기·짓기가 안 눌린다") */
  #title.hide { opacity: 0; visibility: hidden; transition: opacity .6s, visibility 0s .6s; }
  #title.hide .gob { pointer-events: none; }
  /* 모바일은 가로로 (사장님 2026-09-11) */
  #rotate { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; text-align: center; background: #0a1824; color: #f2ede4; font-family: 'Ria', 'Griun', 'Malgun Gothic', sans-serif; font-size: 26px; line-height: 1.8; padding: 8vw; }
  body.touch.portrait #rotate { display: grid; }
  #rotate button { margin: 26px 0 18px; padding: 20px 44px; border: 0; border-radius: 99px; cursor: pointer; font-family: inherit; font-size: 30px; font-weight: 800; color: #2a1c08; background: #ffd24a; }
  #rotate .sub { font-size: 21px; color: #b8ae9c; line-height: 1.7; } #rotate .sub a { color: #d8cfbc; }
  #title h1 { font-family: 'Gasoek', 'Ria', 'Griun', sans-serif; font-weight: 400; font-size: min(13.5vw, 30vh); white-space: nowrap; margin: 0; letter-spacing: 4px; color: #fff8ec; -webkit-text-stroke: 2px #2b3a4a; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,20,40,.45); }
  #title .tag { font-family: 'Gasoek', 'Ria', sans-serif; font-weight: 400; letter-spacing: 6px; font-size: clamp(16px, 3vw, 26px); margin-top: 4px; color: #fff; text-shadow: 0 0 6px rgba(0,20,40,.9), 0 2px 10px rgba(0,0,0,.7); }
  /* 세계가 다 만들어지기 전엔 단추를 내려 둔다. 예전엔 opacity:0 인데 blink 애니메이션이 그걸 덮어써서
     아직 눌러도 안 되는 '시작'이 깜빡이고 있었다 (사장님 2026-09-12 "몇 번 눌러도 한참 있다 시작된다") */
  #title .go { margin-top: 40px; font-size: 39px; letter-spacing: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.6); display: none; gap: 18px; }
  body.ready #title .go { display: flex; animation: blink 2.2s infinite; }
  #title .ld { margin-top: 44px; font-family: 'Gasoek', 'Ria', sans-serif; font-size: min(30px, 6.5vw); letter-spacing: 4px; color: #fff8ec; text-shadow: 0 2px 8px rgba(0,0,0,.7); text-align: center; }
  #title .ld i { display: block; width: min(260px, 62vw); height: 8px; margin: 12px auto 0; border-radius: 99px; background: rgba(255,248,236,.25); overflow: hidden; }
  #title .ld i b { display: block; height: 100%; width: 0; background: #fff8ec; border-radius: 99px; transition: width .2s linear; }

  #hint.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 홍보 영상 촬영용(?shot=1) — 화면 글자·단추를 감춘다. 전화창(#call)은 남긴다 */
body.shot #topbar, body.shot #dest, body.shot #task, body.shot #speed, body.shot #act, body.shot #act2,
body.shot #keys, body.shot #brake, body.shot #horn, body.shot #foot, body.shot #pad,
body.shot #hint, body.shot #card, body.shot #vig,

/* 시작 인트로 영상 */
#introv { position: fixed; inset: 0; background: #000; z-index: 120; display: none; }
#introv.on { display: block; }

  letter-spacing: 1px; cursor: pointer; }
body.shot #introv { display: none !important; }
  /* 라디오 급매 속보 — 목적지 알약 옆, 남은 시간이 줄어든다 */
  #deal { display: none; align-items: center; gap: 6px;

    padding: 8px 14px; border-radius: 22px; background: rgba(180,83,9,.92); color: #fff; font-family: 'Ria', 'Griun', 'Malgun Gothic', sans-serif;

  @media (max-width: 700px) { #deal { font-size: 17px; padding: 4px 9px; } #deal b { font-size: 18px; } }
  /* 여자친구·복덕방 대사 — 달리는 중에 나오므로 화면 아래 자막 띠로 (사장님 2026-09-12 "달리는 동안 화면을 다 가리면 어캄").
     전화(#call)는 멈춰 놓고 받는 거라 그대로 큰 창이다 */
  #gfsay { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: center;
    z-index: 26; pointer-events: none; }
  #gfsay.show { display: flex; }
  #gfsay .ph { width: min(94vw, 1000px); margin: 0 0 calc(14px + env(safe-area-inset-bottom)); padding: 10px 20px 12px; border-radius: 20px;
    background: rgba(12,14,20,.82); border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 10px 30px rgba(0,0,0,.5); color: #f2ede4; }
  #gfsay .who { font-size: 24px; letter-spacing: 1px; color: #ff9ec4; margin-bottom: 2px; }
  #gfsay .who.old { color: #ffd27a; }
  #gfsay .msg { font-size: 32px; line-height: 1.3; font-family: 'Griun', 'Ria', sans-serif; }
  @media (max-width: 900px) { #gfsay .who { font-size: 19px; } #gfsay .msg { font-size: 25px; } #gfsay .ph { padding: 8px 14px 10px; } }
  /* 눕힌 폰(화면이 낮을 때) — HUD 를 확 줄인다. 폭이 740px쯤이라 max-width:700px 규칙이 안 걸려서
     데스크톱용 큰 글씨가 그대로 나왔고, 급매 띠가 화면을 가로질러 앞이 안 보였다
     (사장님 2026-09-12 "뭐가 보여야 운전을 하지") */
  @media (max-height: 560px) {
    #topbar { height: calc(34px + env(safe-area-inset-top)); padding-left: calc(92px + env(safe-area-inset-left)); gap: 4px; }
    .stat { font-size: 14px; padding: 3px 7px; gap: 4px; } .stat b { font-size: 16px; } #gain { font-size: 14px; }
    .tog { height: 28px; min-width: 28px; padding: 0 7px; font-size: 16px; }
    body.touch #dest { font-size: 15px; padding: 4px 10px; gap: 6px; } body.touch #topline { top: calc(38px + env(safe-area-inset-top)); gap: 6px; }
    #dest svg { width: 18px; height: 18px; }
    #deal { font-size: 13px; padding: 3px 8px; gap: 4px; } #deal b { font-size: 14px; } #deal .t { padding: 1px 6px; }
    #rival { font-size: 15px; padding: 4px 9px; gap: 5px; top: calc(74px + env(safe-area-inset-top)); } #rival b { font-size: 16px; }
    body.touch #speed { font-size: 30px; bottom: calc(8px + env(safe-area-inset-bottom)); }
    body.touch #act { font-size: 19px; padding: 8px 16px; bottom: 40vh; } body.touch #act2 { font-size: 17px; padding: 7px 14px; bottom: calc(40vh - 42px); }
    #gfsay .ph { width: min(54vw, 560px); margin-bottom: calc(10px + env(safe-area-inset-bottom)); padding: 6px 12px 8px; border-radius: 14px; }
    #gfsay .who { font-size: 14px; } #gfsay .msg { font-size: 18px; }
    body.touch #gfsay.show ~ #speed { opacity: 0; }   /* 말하는 동안엔 속도 숫자를 비운다 */
    #card { width: 170px; padding: 9px 9px 13px; } #card .ph { height: 92px; font-size: 58px; } #card .nm { font-size: 19px; margin-top: 7px; } #card .cn { font-size: 16px; }
    #call .ph { padding: 14px 16px 12px; border-radius: 18px; } #call .who { font-size: 17px; margin-bottom: 8px; } #call .msg { font-size: 23px; min-height: 46px; } #call .nx { font-size: 16px; }
    body.touch #horn, body.touch #foot.show { width: 58px; height: 58px; font-size: 15px; }
    body.touch #brake { width: 74px; height: 74px; font-size: 15px; }
    .modal { padding: 8px; } .modal .head { margin-bottom: 4px; } .modal .head button { font-size: 20px; padding: 3px 11px; }
    #map { width: min(94vw, 1100px, calc((100dvh - 74px) * 4800 / 3650)); }
    #map .tools { right: 14px; top: 44px; gap: 4px; } #map .tools button { width: 32px; height: 32px; font-size: 22px; }
    #build .head, #assets .head, #shop .head, #map .head { font-size: 18px; }
  }
</style>

<script>
  // 불러오는 동안 얼마나 됐는지 — 스크립트·질감·세계 조립이 저마다 여기에 적는다
  window.__LOAD = (function () {
    var p = 0, t = null, bar = null;
    function paint() {
      if (!t) { t = document.getElementById('ld'); bar = document.getElementById('ldBar'); }
      if (!t) return;
      t.firstChild.nodeValue = 'LOADING ' + Math.round(p * 100) + '%';
      if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
    }
    return { set: function (v) { if (v > p) { p = v; paint(); } } };
  })();
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from './lib/addons/loaders/GLTFLoader.js';
  import { clone as skeletonClone } from './lib/addons/utils/SkeletonUtils.js';
  window.__LOAD.set(0.08);
  window.THREE = THREE;
  window.GLTFLoaderClass = GLTFLoader;
  window.SkeletonClone = skeletonClone;
  const V = '384';
  const names = ['lang','noise','textures','spots','island','sky','post','roads','city','glb','vehicles','landmarks','traffic','player','audio','activity','blds','estate','npc','people','pet','game'];
  (async () => {
    let done = 0;
    for (const n of names) {
      await new Promise((res, rej) => {
        const el = document.createElement('script');
        el.src = 'js/' + n + '.js?v=' + V;
        el.onload = () => { window.__LOAD.set(0.08 + 0.5 * (++done / names.length)); res(); };
        el.onerror = () => rej(new Error('load fail ' + n));
        document.body.appendChild(el);
      });
    }
  })();
</script>
