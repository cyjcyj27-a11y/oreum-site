<script>
  // 단추 글자가 칸을 넘치면 배치는 그대로 두고 글자만 줄여 맞춘다 — 러시아어·영어는 낱말이 길다
  //   (사장님 2026-10-01 "러시아어 버튼글자넘침 영문판도 전체 검수해 글자크기를 줄여서 조정해")
  (function () {
    var SEL = '.tbtn, #bFire, #title button, #over button, #dead button, #sellGo, #sellAll, #shopClose, #sellClose, #bagClose, .item button, .tab, #act, #praise, #skip, #talk b, #rotGo';
    var cv = document.createElement('canvas').getContext('2d');
    function fit(el) {
      if (!el.offsetWidth) return;
      var key = el.textContent + '|' + innerWidth + '|' + innerHeight;
      if (el.__fit === key) return;
      el.__fit = key; el.style.fontSize = '';
      var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), txt = el.textContent;
      cv.font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
      var need = cv.measureText(txt).width + (parseFloat(cs.letterSpacing) || 0) * txt.length, k = 1;
      if (el.classList.contains('tbtn') || el.id === 'bFire') k = el.clientWidth * 0.82 / need;   // 둥근 단추: 지름의 82% 안
      else {   // 길쭉한 단추: 화면 밖으로 나간 만큼
        var W = innerWidth, x = el.offsetLeft, p = el.offsetParent;
        while (p) { x += p.offsetLeft; p = p.offsetParent; }
        if (cs.transform !== 'none') x -= el.offsetWidth / 2;   // 가운데 맞춤(translateX(-50%))
        var over = Math.max(0, x + el.offsetWidth - (W - 8)) + Math.max(0, 8 - x);
        if (over > 0) k = (need - over) / need;
      }
      if (k < 1) el.style.fontSize = Math.max(fs * 0.45, fs * k).toFixed(1) + 'px';
    }
    function run() { var a = document.querySelectorAll(SEL); for (var i = 0; i < a.length; i++) fit(a[i]); }
    window.__fitAll = run;
    setInterval(run, 250); addEventListener('resize', run);
  })();
</script>
