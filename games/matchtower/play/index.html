<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>초원다방</title>
<style>
@font-face{font-family:'Title';src:url('fonts/title.woff2?v=3') format('woff2');font-display:block}
@font-face{font-family:'Ria';src:url('fonts/RiaSans-ExtraBold.woff2') format('woff2');font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0f0a;
  font-family:'Ria',-apple-system,'Malgun Gothic',sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(20,8,2,.55) 100%)}

/* ---------- 70년대 다방 간판 단추: 청록·주황·겨자 판 + 크림 안쪽 테 + 밤색 그림자 글자 ---------- */
:root{--brn:#3b1d0e;--crm:#f6e7c1;--teal:#2c7c77;--ora:#d9622b;--mus:#d9a23a;--wal:#5a2e16}
.btn{pointer-events:auto;cursor:pointer;font-family:inherit;color:var(--crm);font-size:23px;border-radius:14px;padding:12px 24px;
  border:3px solid var(--brn);background:var(--teal);
  box-shadow:inset 0 0 0 3px var(--teal),inset 0 0 0 5px var(--crm),inset 0 -8px 0 rgba(0,0,0,.12),0 5px 0 var(--brn);
  text-shadow:2px 2px 0 var(--brn);letter-spacing:.04em;white-space:nowrap}
.btn.main{background:var(--ora);font-size:32px;
  box-shadow:inset 0 0 0 3px var(--ora),inset 0 0 0 5px var(--crm),inset 0 -9px 0 rgba(0,0,0,.12),0 6px 0 var(--brn),0 0 24px rgba(255,150,60,.35)}
.btn.cont{background:var(--mus);box-shadow:inset 0 0 0 3px var(--mus),inset 0 0 0 5px var(--crm),inset 0 -8px 0 rgba(0,0,0,.12),0 5px 0 var(--brn)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px var(--teal),inset 0 0 0 5px var(--crm),0 2px 0 var(--brn)}
.btn:disabled{filter:grayscale(.8);opacity:.7}

#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:7px;flex-wrap:wrap;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 10px calc(104px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
body:not(.playing) #topbar .game{display:none}
.stat{display:flex;align-items:baseline;gap:6px;border-radius:10px;padding:4px 13px;background:var(--wal);border:3px solid var(--brn);
  box-shadow:inset 0 0 0 2px var(--wal),inset 0 0 0 3.5px rgba(246,231,193,.75),0 4px 0 var(--brn)}
.stat i{font-style:normal;font-size:14px;color:var(--mus);text-shadow:1px 1px 0 var(--brn)}
.stat b{font-size:19px;font-weight:400;color:var(--crm);text-shadow:2px 2px 0 var(--brn)}
.stat u{text-decoration:none;font-size:13px;color:var(--mus);text-shadow:1px 1px 0 var(--brn)}
.spacer{flex:1 1 10px}
.tog{pointer-events:auto;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;position:relative;
  font-family:inherit;color:var(--crm);font-size:15px;border:3px solid var(--brn);background:var(--wal);text-shadow:1px 1px 0 var(--brn);
  box-shadow:inset 0 0 0 2px var(--wal),inset 0 0 0 3.5px rgba(246,231,193,.75),0 4px 0 var(--brn)}
.tog svg{width:20px;height:20px;filter:drop-shadow(1px 1px 0 var(--brn))}
.tog:active{transform:translateY(2px)}
.tog.off{opacity:.45}
.tog.off::after{content:'';position:absolute;left:7px;right:7px;top:50%;height:2.5px;background:var(--crm);transform:rotate(-45deg);box-shadow:1px 1px 0 var(--brn)}
@media (max-width:700px){
  #topbar{gap:5px;padding-left:calc(8px + env(safe-area-inset-left))}
  #topbar>.stat:first-child{margin-left:96px}
  body:not(.playing) #topbar{padding-left:calc(104px + env(safe-area-inset-left))}
  .stat{padding:3px 9px}.stat b{font-size:16px}.stat i,.stat u{font-size:12px}
  .tog{width:36px;height:36px}}

/* ---------- 오른쪽 아래 손 단추 ---------- */
#ctl{position:fixed;z-index:22;right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:end;pointer-events:none}
body:not(.playing) #ctl{display:none}
.rb{pointer-events:auto;cursor:pointer;font-family:inherit;color:var(--crm);border-radius:50%;display:grid;place-items:center;
  border:3px solid var(--brn);background:var(--teal);text-shadow:2px 2px 0 var(--brn);
  box-shadow:inset 0 0 0 3px var(--teal),inset 0 0 0 5px var(--crm),inset 0 -8px 0 rgba(0,0,0,.12),0 5px 0 var(--brn)}
.rb:active{transform:translateY(3px)}
.rb.big{width:96px;height:96px;font-size:27px;background:var(--ora);
  box-shadow:inset 0 0 0 3px var(--ora),inset 0 0 0 5px var(--crm),inset 0 -9px 0 rgba(0,0,0,.12),0 5px 0 var(--brn),0 0 20px rgba(255,150,60,.35)}
.rb.mid{width:64px;height:64px;font-size:30px}
.rb.sm{width:50px;height:50px;font-size:20px;background:var(--wal);box-shadow:inset 0 0 0 3px var(--wal),inset 0 0 0 5px var(--crm),0 4px 0 var(--brn)}
.rb:disabled{opacity:.5}
#bClear{grid-column:2;grid-row:2;font-size:20px;line-height:1.1;text-align:center}
#bDrop{grid-column:2;grid-row:2}
#bRot{grid-column:1;grid-row:2;align-self:center}
#bPut{grid-column:2;grid-row:1;justify-self:center}
body:not(.holding) #bDrop,body:not(.holding) #bRot,body:not(.holding) #bPut{display:none}
body.holding #bClear{display:none}
#keys{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  font-size:14px;color:rgba(255,236,200,.62);text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
#keys .h{display:none}
body.holding #keys .n{display:none}
body.holding #keys .h{display:inline}
body:not(.playing) #keys{display:none}
@media (pointer:coarse){#keys{display:none}}

/* ---------- 가운데 큰 글자 ---------- */
#word{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.5);z-index:26;pointer-events:none;
  font-size:clamp(40px,8vw,80px);color:#ffd65a;opacity:0;white-space:nowrap;
  text-shadow:.05em .05em 0 #3b1d0e,.08em .08em 0 #d9622b,0 0 26px rgba(255,190,80,.45);
  transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .25s}
#word.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- 타이틀 ---------- */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:60px 16px calc(24px + env(safe-area-inset-bottom))}
/* 제목 = 옛 간판: 초록 칠한 철판 + 은빛 테, 파랑·빨강 입체 글자 (도현체) */
#logo{font-family:'Title','Ria',sans-serif;font-weight:400;font-size:clamp(66px,17vw,200px);line-height:1;text-align:center;white-space:nowrap;
  letter-spacing:.06em;padding:.16em .26em .2em .32em;border-radius:.05em;
  background:
    linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18)),
    repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 .02em,rgba(0,0,0,0) .02em .11em),
    linear-gradient(90deg,#2f6a3c,#3c7d48 40%,#347443 70%,#2b633a);
  border:.055em solid #d9d6cb;
  box-shadow:0 0 0 .02em #3a3a30,inset 0 0 0 .02em rgba(0,0,0,.35),inset 0 .03em .12em rgba(0,0,0,.35),.03em .06em 0 #1d1a12,0 .12em .3em rgba(0,0,0,.55)}
#logo span{-webkit-text-stroke:.05em #f3efe2;paint-order:stroke fill;
  text-shadow:.035em .045em 0 #d9d4c4,.06em .08em 0 #1c2016,.09em .12em .08em rgba(0,0,0,.45)}
#logo .b{color:#2d4f92}
#logo .r{color:#cc3438}
.menu{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(80vw,300px)}
@media (min-aspect-ratio:1/1){
  #title{align-items:flex-start;padding-left:calc(13vw + env(safe-area-inset-left))}
  #logo{font-size:clamp(76px,11.5vw,220px)}
  #title .menu{margin-left:calc(min(62vw,760px) / 2 - min(80vw,300px) / 2)}}
@media (max-aspect-ratio:3/4){
  #title{justify-content:space-between;padding-top:calc(90px + env(safe-area-inset-top));padding-bottom:calc(70px + env(safe-area-inset-bottom))}}
/* 폰 가로: 단추는 아래 26vh 위에, 한 줄로 */
@media (max-height:480px){
  #title{justify-content:flex-start;gap:4vh;padding-top:calc(15vh + env(safe-area-inset-top));padding-bottom:26vh;padding-left:calc(13vw + env(safe-area-inset-left))}
  #logo{font-size:23vh}
  #title .menu{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:auto;gap:12px;margin-left:0}
  #title .menu .btn,#title .menu .btn.main{font-size:6.8vh;padding:2vh 4vh}
  .rb.big{width:80px;height:80px;font-size:23px}.rb.mid{width:56px;height:56px}.rb.sm{width:44px;height:44px}
  #keys{font-size:12px}}
/* 영문 간판 MATCHTOWER 는 열 글자 — 한국어 간판과 비슷한 폭이 되게 줄인다 */
html[lang=en] #logo{font-size:clamp(34px,9vw,120px)}
@media (min-aspect-ratio:1/1){html[lang=en] #logo{font-size:clamp(46px,6.6vw,128px)}}
@media (max-height:480px){html[lang=en] #logo{font-size:13vh}}
/* 영문 단추 글자는 한글보다 길다 — 동그란 단추 안에 들게 (사장님 2026-09-28 "영문글씨 삐져나갔다") */
html[lang=en] #bSubmit{font-size:13px;letter-spacing:0}
html[lang=en] #bClear{font-size:15px;letter-spacing:0}
html[lang=en] #bDrop{font-size:21px;letter-spacing:0}
html[lang=en] .jr{grid-template-columns:6.2em 1fr 3em}
html[lang=en] .jr .jl{font-size:.72em}
@media (max-width:460px){html[lang=en] .jr{font-size:16px;grid-template-columns:6.2em 1fr 2.4em}}
html[lang=en] #bSubmit{font-size:13px;width:78px;height:78px}
@media (max-height:480px){html[lang=en] #bSubmit{font-size:11px;width:70px;height:70px}html[lang=en] #bClear{font-size:13px}html[lang=en] #bDrop{font-size:18px}}


/* ---------- 제출·심사 ---------- */
#bSubmit{grid-column:1;grid-row:2;align-self:center;font-size:21px}
body.holding #bSubmit,body.judging #ctl,body.judging #keys{display:none}
#judge{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,8,2,.45)}
.jBox{width:min(100%,440px);border:5px solid #3b1d0e;border-radius:22px;padding:20px 22px 20px;text-align:center;background:#f6e7c1;
  box-shadow:inset 0 0 0 4px #f6e7c1,inset 0 0 0 7px #d9622b,inset 0 0 0 9px #f6e7c1,inset 0 0 0 11px #2c7c77,0 8px 0 #3b1d0e,0 20px 50px rgba(0,0,0,.45);animation:askIn .2s ease-out}
.jRows{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.jr{display:grid;grid-template-columns:4.2em 1fr 3em;align-items:center;gap:8px;font-size:22px;color:#3b1d0e}
.jr .jl{text-align:left}
.jr b{font-weight:400;text-align:right;color:#8e1e24}
.st{display:flex;gap:2px;justify-content:center;font-size:30px;line-height:1}
.st i{font-style:normal;color:#d8c8a4;text-shadow:1px 1px 0 #3b1d0e}
.st i.on{color:#ffc21c}
.st i.half{background:linear-gradient(90deg,#ffc21c 50%,#d8c8a4 50%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(1px 1px 0 #3b1d0e)}
.jTot{display:flex;align-items:baseline;justify-content:center;gap:6px;border-top:3px dashed #c9a868;padding-top:8px}
.jTot b{font-family:'Title','Ria',sans-serif;font-weight:400;font-size:64px;line-height:1;color:#cc3438;text-shadow:.04em .05em 0 #3b1d0e}
.jTot i{font-style:normal;font-size:24px;color:#3b1d0e}
#jBest{min-height:26px;font-size:20px;color:#2c7c77;margin:4px 0 12px}
#jBest.nb{color:#d9622b;animation:pop .45s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (max-height:480px){
  .jBox{display:grid;grid-template-columns:1fr auto;gap:0 18px;align-items:center;width:min(100%,640px);padding:14px 18px}
  .jRows{grid-row:1/3;margin:0}.jr{font-size:18px}.st{font-size:24px}
  .jTot{border-top:0;padding-top:0}.jTot b{font-size:52px}
  #jBest{margin:0 0 6px}.jBox .askRow{grid-column:1/3;margin-top:8px}}
.jBox .askRow{justify-content:center}.jBox .askRow .btn{flex:0 1 200px}
@media (max-width:460px){.jBox{padding:16px 14px}.jr{font-size:18px;grid-template-columns:3.4em 1fr 2.2em;gap:4px}.st{font-size:23px}.jTot b{font-size:54px}}
/* ---------- 확인 창 ---------- */
#ask{position:fixed;inset:0;z-index:60;background:rgba(20,8,2,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.askBox{width:min(100%,420px);border:5px solid #2a1206;border-radius:28px;padding:24px 24px 22px;text-align:center;
  background:#f6e7c1;border-color:#3b1d0e;
  box-shadow:inset 0 0 0 4px #f6e7c1,inset 0 0 0 7px #d9622b,inset 0 0 0 9px #f6e7c1,inset 0 0 0 11px #2c7c77,0 8px 0 #3b1d0e,0 20px 50px rgba(0,0,0,.45);animation:askIn .18s ease-out}
@keyframes askIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.askBox b{display:block;font-size:clamp(30px,5vw,40px);color:#8e1e24;font-weight:400;margin-bottom:20px}
.askRow{display:flex;gap:14px}.askRow .btn{flex:1;font-size:22px}
.askRow .btn.main{font-size:22px}

#pauseCover{position:fixed;inset:0;z-index:35;background:rgba(20,8,2,.8);display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;
  font-size:70px;cursor:pointer}
#loading{position:fixed;inset:0;z-index:100;background:#1a0f0a;display:grid;place-items:center;font-size:18px;color:rgba(255,226,168,.6)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<div id="topbar">
  <div class="stat game"><i>성냥</i><b id="nN">0</b></div>
  <div class="stat game"><i>높이</i><b id="hN">0.0</b><u>cm</u></div>
  <div class="stat" id="bestPill"><i>BEST</i><b id="bN">0.0</b><u>cm</u></div>
  <div class="spacer"></div>
  <button class="tog game" id="tClear" aria-label="clear">↺</button>
  <button class="tog game" id="tPause" aria-label="pause">❚❚</button>
  <button class="tog" id="tBgm" aria-label="music">♪</button>
  <button class="tog" id="tSnd" aria-label="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l6-5v16l-6-5H3z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.8 5.8a8.6 8.6 0 0 1 0 12.4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
</div>

<div id="word"></div>

<div id="ctl">
  <button class="rb sm" id="bPut" aria-label="put back">✕</button>
  <button class="rb mid" id="bRot" aria-label="rotate">⟳</button>
  <button class="rb big" id="bClear">전부<br>치우기</button>
  <button class="rb mid" id="bSubmit">제출</button>
  <button class="rb big" id="bDrop">놓기</button>
</div>
<div id="keys"><span class="n">클릭 집기 · 끌기 시점 · 휠 확대 · 스페이스 성냥</span><span class="h">마우스 휠 방향 돌리기 · R 90도 · 클릭 놓기 · 우클릭 넣기</span></div>

<div id="title" hidden>
  <div id="logo"><span class="b">초</span><span class="b">원</span><span class="r">다</span><span class="r">방</span></div>
  <div class="menu">
    <button class="btn cont" id="bContinue" hidden>이어하기</button>
    <button class="btn main" id="bStart">START</button>
  </div>
</div>

<div id="ask" hidden>
  <div class="askBox"><b>다 치울까요?</b><div class="askRow"><button class="btn" id="askNo">취소</button><button class="btn main" id="askOk">확인</button></div></div>
</div>

<div id="judge" hidden>
  <div class="jBox">
    <div class="jRows">
      <div class="jr"><span class="jl">높이</span><span class="st" id="st0"></span><b id="jp0"></b></div>
      <div class="jr"><span class="jl">예술성</span><span class="st" id="st1"></span><b id="jp1"></b></div>
      <div class="jr"><span class="jl">창의성</span><span class="st" id="st2"></span><b id="jp2"></b></div>
    </div>
    <div class="jTot"><b id="jTotal">0</b><i>점</i></div>
    <div id="jBest"></div>
    <div class="askRow"><button class="btn" id="jGo">계속</button><button class="btn main" id="jNew">NEW</button></div>
  </div>
</div>
<div id="pauseCover" hidden>❚❚<button class="btn" id="pHome">홈</button></div>
<div id="loading">LOADING</div>

<script src="js/lang.js?v=6"></script>
<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="lib/three.min.js"></script>
<script src="lib/rapier.js"></script>
<script src="js/audio.js?v=5"></script>
<script src="js/pile.js?v=2"></script>
<script src="js/scene.js?v=16"></script>
<script src="js/game.js?v=18"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
