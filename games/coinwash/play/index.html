<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>코인빨래방 — 오름게임즈</title>
<style>
  @font-face { font-family: 'Griun'; src: url('fonts/Griun_Fromsol-Rg.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Ria'; src: url('fonts/RiaSans-ExtraBold.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a26; font-family: 'Griun', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #fff8ec; user-select: none; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #c { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; background: #141a26; }
  @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }
  [hidden] { display: none !important; }
  #rotate { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; text-align: center; background: #141a26; color: #f2ede4; font-size: 17px; line-height: 1.8; padding: 8vw; }
  body.touch.portrait #rotate { display: grid; }
  #rotate button { margin: 22px 0 16px; padding: 15px 32px; border: 0; border-radius: 99px; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 800; color: #2a1c08; background: #ffd24a; }
  #rotate .sub { font-size: 14px; color: #b8ae9c; line-height: 1.7; } #rotate .sub a { color: #d8cfbc; }

  /* ── HUD — 스카이라이더 기본 UI ── */
  #topbar { position: fixed; left: 0; right: 0; top: 0; min-height: calc(44px + env(safe-area-inset-top)); padding: calc(6px + env(safe-area-inset-top)) calc(112px + env(safe-area-inset-right)) 6px calc(112px + env(safe-area-inset-left)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; background: linear-gradient(180deg, rgba(10,14,20,.5), rgba(10,14,20,0)); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .8s; }
  #topbar.show { opacity: 1; }
  .stat { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); font-size: 15px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .stat b { font-weight: normal; font-size: 17px; font-family: 'Ria', 'Griun', sans-serif; letter-spacing: 1px; } .stat .ic { font-size: 13px; }
  #debt b { color: #ff9a8a; } #debt.free b { color: #7fe08a; }
  #clock.dawn { border-color: rgba(255,170,90,.7); }
  .tog { position: absolute; top: calc(4px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; font-family: inherit; font-size: 17px; line-height: 1; padding: 0; touch-action: manipulation; cursor: pointer; }
  #btnBgm { right: calc(52px + env(safe-area-inset-right)); }
  .tog.off { opacity: .4; text-decoration: line-through; }
  @media (max-width: 700px) { #topbar { padding-left: calc(104px + env(safe-area-inset-left)); padding-right: calc(92px + env(safe-area-inset-right)); gap: 4px 5px; } .stat { font-size: 13px; padding: 3px 7px; gap: 4px; } .stat b { font-size: 15px; } .tog { width: 32px; height: 32px; font-size: 15px; } #btnBgm { right: calc(46px + env(safe-area-inset-right)); } }

  #toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); font-family: 'Ria', sans-serif; font-size: clamp(34px, 7vw, 76px); letter-spacing: 4px; color: #ffd24a; -webkit-text-stroke: 2px #5a2a10; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.5); opacity: 0; pointer-events: none; z-index: 8; text-align: center; white-space: nowrap; transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast.red { color: #ff7a5a; }
  #keys { position: fixed; right: 22px; bottom: 20px; font-size: 13px; opacity: 0; text-align: right; line-height: 1.7; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.7); transition: opacity .8s; z-index: 5; }
  #keys.show { opacity: .6; } body.touch #keys { display: none; } body.playing #keys { right: 124px; }

  /* 오른쪽 아래 상점 단추 — 살 수 있는 게 있으면 노랗게 */
  .tbtn { display: none; position: fixed; width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.32); color: #fff; font-family: inherit; font-size: 18px; letter-spacing: 1px; touch-action: manipulation; z-index: 6; text-shadow: 0 1px 2px rgba(0,0,0,.6); padding: 0; right: calc(14px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); cursor: pointer; }
  .tbtn.on { background: rgba(255,210,74,.8); color: #2a1c08; border-color: #ffd24a; text-shadow: none; animation: blink 2.4s infinite; }
  body.playing .tbtn { display: block; }
  body.morning .tbtn { display: none !important; }
  @media (max-height: 520px) { .tbtn { width: 72px; height: 72px; font-size: 15px; bottom: calc(16px + env(safe-area-inset-bottom)); } }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s; z-index: 9; } #fade.show { opacity: .7; }

  /* 타이틀 */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7vh; background: linear-gradient(180deg, rgba(10,14,26,.35), rgba(10,14,26,0) 45%, rgba(10,14,26,0) 70%, rgba(10,14,26,.5)); transition: opacity 1s; text-align: center; z-index: 10; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-family: 'Ria', 'Griun', sans-serif; font-weight: 900; font-size: clamp(40px, 9vw, 96px); margin: 8px 0 0; letter-spacing: 6px; color: #fff4dc; text-shadow: 0 4px 0 #2a5a8a, 0 8px 24px rgba(0,0,0,.5); -webkit-text-stroke: 1.5px #14304a; paint-order: stroke fill; line-height: 1.1; }
  html[lang="en"] #title h1 { font-size: clamp(30px, 7.2vw, 80px); letter-spacing: 3px; white-space: nowrap; }
  #title .tag { font-family: 'Ria', sans-serif; letter-spacing: 8px; font-size: 18px; opacity: .9; margin-top: 8px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #title .brand { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: rgba(255,253,247,.92); color: #2e6b39; font-size: 14px; letter-spacing: 1px; }
  #title .brand img { width: 30px; height: 15px; }
  #title .btns { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10vh; display: flex; gap: 14px; }
  #title .go { font-family: 'Ria', sans-serif; font-size: 26px; letter-spacing: 6px; text-indent: 6px; padding: 12px 36px 14px; border-radius: 20px; background: rgba(10,20,40,.72); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 8px 26px rgba(0,0,0,.35); cursor: pointer; white-space: nowrap; }
  #title .go.main { animation: blink 2.4s infinite; }
  #title .go small { display: block; font-family: 'Griun', sans-serif; font-size: 13px; letter-spacing: 1px; text-indent: 0; opacity: .75; margin-top: 2px; }
  @media (max-width: 700px) { #title .go { font-size: 20px; padding: 10px 22px 12px; letter-spacing: 3px; } }

  /* 아침 — 정산·상점·단골 */
  #morning { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(10,16,28,.55); opacity: 0; pointer-events: none; transition: opacity .35s; padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  #morning.show { opacity: 1; pointer-events: auto; }
  #morning .panel { width: min(960px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 18px; background: rgba(14,26,40,.94); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 16px 48px rgba(0,0,0,.5); overflow: hidden; }
  #morning .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #morning .head h2 { font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 2px; color: #ffd24a; margin: 0; flex: 1; }
  #morning .tabs { display: flex; gap: 6px; }
  #morning .tabs button { font-family: inherit; font-size: 15px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.3); color: #fff; cursor: pointer; touch-action: manipulation; }
  #morning .tabs button.on { background: #ffd24a; color: #2a1c08; border-color: #ffd24a; }
  #morning .body { padding: 14px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 200px; }
  #morning .foot { display: flex; align-items: center; gap: 14px; padding: 10px 18px 12px; border-top: 1px solid rgba(255,255,255,.1); }
  #morning .foot .money { font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 1px; flex: 1; } #morning .foot .money small { font-family: 'Griun', sans-serif; font-size: 14px; opacity: .7; margin-left: 12px; }
  #morning .pay { font-family: 'Ria', sans-serif; font-size: 17px; letter-spacing: 1px; padding: 9px 18px 10px; border-radius: 16px; background: rgba(255,120,100,.25); color: #ffb0a0; border: 1px solid rgba(255,140,120,.5); cursor: pointer; touch-action: manipulation; } #morning .pay b { color: #fff; font-weight: normal; } #morning .pay:disabled { opacity: .35; cursor: default; }
  @media (max-width: 700px) { #morning .pay { font-size: 14px; padding: 7px 10px; } #morning .foot { gap: 8px; } }
  #morning .next { font-family: 'Ria', sans-serif; font-size: 20px; letter-spacing: 4px; text-indent: 4px; padding: 10px 28px 12px; border-radius: 16px; background: #ffd24a; color: #2a1c08; border: 0; cursor: pointer; touch-action: manipulation; animation: blink 2.4s infinite; }
  .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .sum .card { border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: 12px 10px; text-align: center; }
  .sum .card .k { font-size: 13px; opacity: .7; letter-spacing: 1px; } .sum .card .v { font-family: 'Ria', sans-serif; font-size: 26px; margin-top: 4px; } .sum .card .v.up { color: #7fe08a; } .sum .card .v.dn { color: #ff8a7a; }
  .clerk { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.05); }
  .clerk img { height: 54px; image-rendering: pixelated; cursor: pointer; } .clerk .say { flex: 1; font-size: 15px; line-height: 1.5; } .clerk .hs { color: #ff6a7a; letter-spacing: 1px; font-size: 14px; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .shop .item { display: flex; align-items: center; gap: 10px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: 10px 12px; cursor: pointer; touch-action: manipulation; }
  .shop .item.no { opacity: .45; cursor: default; } .shop .item.max { border-color: rgba(127,224,138,.5); cursor: default; }
  .shop .item .ic { font-size: 26px; width: 34px; text-align: center; }
  .shop .item .n { flex: 1; font-size: 15px; } .shop .item .n small { display: block; font-size: 12px; opacity: .6; margin-top: 2px; }
  .shop .item .p { font-family: 'Ria', sans-serif; font-size: 17px; color: #ffd24a; white-space: nowrap; } .shop .item.max .p { color: #7fe08a; }
  .debt { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); }
  .debt .d { font-family: 'Ria', sans-serif; font-size: 22px; color: #ff9a8a; flex: 1; } .debt .d small { font-family: 'Griun', sans-serif; font-size: 14px; opacity: .7; margin-right: 8px; color: #fff; }
  .debt button { font-family: 'Ria', sans-serif; font-size: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.3); color: #fff; cursor: pointer; touch-action: manipulation; } .debt button:disabled { opacity: .35; }
  .reg { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .reg .card { border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: 10px 6px; text-align: center; }
  .reg .card img { height: 84px; image-rendering: pixelated; } .reg .card.none img { filter: brightness(0); opacity: .35; }
  .reg .card .nm { font-size: 15px; margin-top: 4px; } .reg .card .hs { color: #ff6a7a; letter-spacing: 1px; font-size: 14px; margin-top: 2px; } .reg .card .cnt { font-size: 12px; opacity: .6; }
  @media (max-width: 700px) { #morning .body { padding: 10px; } #morning .head h2 { font-size: 18px; } #morning .tabs button { font-size: 13px; padding: 5px 10px; } .sum .card .v { font-size: 20px; } .reg .card img { height: 64px; } }

  /* 엔딩 */
  #ending { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(6,10,20,.5); opacity: 0; pointer-events: none; transition: opacity .8s; text-align: center; }
  #ending.show { opacity: 1; pointer-events: auto; }
  #ending h2 { font-family: 'Ria', sans-serif; font-size: min(8vw, 72px); font-weight: 900; margin: 0 0 10px; letter-spacing: 4px; color: #ffd24a; -webkit-text-stroke: 2px #5a2a10; paint-order: stroke fill; }
  #ending p { font-size: 22px; margin: 4px 0; font-family: 'Ria', sans-serif; letter-spacing: 1px; } #ending p small { font-size: 14px; opacity: .7; margin-right: 8px; font-family: 'Griun', sans-serif; }
  #ending .again { margin-top: 30px; opacity: .8; animation: blink 2.4s infinite; font-family: 'Ria', sans-serif; letter-spacing: 6px; font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>

<div id="topbar">
  <div class="stat" id="dayH"><b id="dayN">🌸 1</b></div>
  <div class="stat"><span class="ic">🪙</span><b id="coinN">0</b></div>
  <div class="stat" id="debt"><span class="ic">💸</span><b id="debtN">3000</b></div>
  <div class="stat" id="clock"><span class="ic">⏰</span><b id="clockN">22:00</b></div>
  <button id="btnBgm" class="tog" title="음악">♪</button>
  <button id="btnSfx" class="tog" title="효과음">🔊</button>
</div>
<div id="toast"></div>
<div id="keys" data-en="Click act · B shop<br>M music · K sound">클릭 행동 · B 상점<br>M 음악 · K 효과음</div>
<button id="btnShop" class="tbtn" data-en="SHOP">상점</button>
<div id="rotate">
  <div>
    <p data-en="This game plays in landscape">가로 화면에서 하는 게임입니다</p>
    <button type="button" id="rotGo" data-en="Turn to landscape">가로로 돌리기</button>
    <p class="sub"><span data-en="If the button does nothing, turn off your phone's rotation lock and lay it sideways">단추가 안 먹으면 폰의 화면 회전 잠금을 풀고 눕혀 주세요</span><br>
      <a href="#" id="rotSkip" data-en="Play in portrait anyway">그래도 세로로 하기</a></p>
  </div>
</div>
<div id="fade"></div>

<div id="title">
  <div class="brand"><img src="assets/logo-oreum.svg" alt="">OREUM GAMES</div>
  <h1 data-en="COIN LAUNDRY 24">코인빨래방</h1>
  <div class="tag">OPEN 24 HOURS</div>
  <div class="btns">
    <div class="go main" id="btnCont" hidden><span data-en="CONTINUE">계속하기</span><small id="contInfo"></small></div>
    <div class="go" id="btnNew"><span data-en="NEW GAME">새로 시작</span></div>
  </div>
</div>

<div id="morning">
  <div class="panel">
    <div class="head"><h2 id="mHead">DAY 1</h2>
      <div class="tabs" id="tabs"><button data-tab="shop" class="on" data-en="SHOP">상점</button><button data-tab="reg" data-en="REGULARS">단골</button></div>
    </div>
    <div class="body" id="mBody"></div>
    <div class="foot"><div class="money">🪙 <span id="mMoney">0</span><small>💸 <span id="mDebt">0</span></small></div><button class="pay" id="btnPay"><span data-en="PAY DEBT">빚 갚기</span> <b id="payN">−0</b></button><button class="next" id="btnNext" data-en="CLOSE">닫기</button></div>
  </div>
</div>

<div id="ending">
  <h2>DEBT FREE</h2>
  <p><small>DAY</small><span id="endDay">1</span></p>
  <p><small>🪙</small><span id="endCoin">0</span></p>
  <p class="again" id="endGo" data-en="CONTINUE">계속하기</p>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="assets/landscape.js?v=48"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/game.js?v=22"></script>
<script src="/assets/visit.js?v=11" defer></script>
<script src="/assets/game-events.js?v=1" defer></script>
</body>
</html>
