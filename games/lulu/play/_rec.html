<!doctype html>
<meta charset="utf-8">
<title>녹화</title>
<!-- 홍보 영상 찍을 때만 쓰는 내부 도구입니다. 검색에 잡히지 않게 막아둡니다. -->
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  iframe{border:0;width:960px;height:540px;display:block}
  #log{position:fixed;right:4px;bottom:4px;color:#0f0;font:11px monospace;z-index:9}
</style>
<iframe id="g" src="./?rec=1"></iframe>
<div id="log">…</div>
<script>
const P = new URLSearchParams(location.search);
const CLIP = P.get('clip') || 'test';
const SECS = +(P.get('secs') || 8);
const g = document.getElementById('g');
const logEl = document.getElementById('log');
let logAll = '';
const log = (m) => {
  logEl.textContent = m; document.title = m;
  logAll += m + '\n';
  try { fetch('/log-' + CLIP + '.txt', { method: 'POST', body: logAll }); } catch (e) {}
};
const wait = (ms) => new Promise(r => setTimeout(r, ms));
addEventListener('error', (e) => log('ERROR ' + e.message));
addEventListener('unhandledrejection', (e) => log('REJECT ' + e.reason));

// 게임 창 안에 조종 장치를 심습니다 (같은 출처라 됩니다)
function inject() {
  return new Promise((res, rej) => {
    const d = g.contentDocument;
    const s = d.createElement('script');
    s.src = '_drive.js';
    s.onload = res; s.onerror = rej;
    d.body.appendChild(s);
  });
}

async function ready(cond, ms = 40000, step = 200) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    try { if (cond()) return true; } catch (e) {}
    await wait(step);
  }
  return false;
}

// ---- 장면들 ----
const SCENES = {
  // 시험용 — 밭길을 걸으며 둘러봅니다
  async test(D) {
    D.cam(undefined, 0.30, 13);
    D.key('ArrowUp', true);
    await wait(2600);
    D.key('KeyA', true); await wait(900); D.key('KeyA', false);
    await wait(1800);
    D.key('KeyD', true); await wait(900); D.key('KeyD', false);
    await wait(1500);
    D.key('ArrowUp', false);
  },
};

(async function main() {
  log('시작');
  // 이 스크립트가 도는 시점에 iframe이 이미 다 읽혔을 수도 있습니다
  if (!(g.contentDocument && g.contentDocument.readyState === 'complete')) {
    await new Promise(r => g.addEventListener('load', r, { once: true }));
  }
  log('게임 불러오는 중');
  await inject();
  const W = g.contentWindow;
  if (!await ready(() => W.__drive && W.__drive.ready())) { log('FAIL: 게임 준비 안 됨'); return; }

  W.__drive.skipIntro();
  W.__drive.begin();
  await wait(1200);

  const cv = g.contentDocument.querySelector('canvas');
  if (!cv || cv.width < 400) { log('FAIL: 캔버스 ' + (cv ? cv.width + 'x' + cv.height : '없음')); return; }

  const stream = cv.captureStream(30);
  const chunks = [];
  const mr = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 6000000 });
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise(r => { mr.onstop = r; });
  mr.start(500);
  log('녹화 시작 ' + cv.width + 'x' + cv.height);

  const scene = SCENES[CLIP] || SCENES.test;
  const t0 = Date.now();
  await scene(W.__drive);
  const left = SECS * 1000 - (Date.now() - t0);
  if (left > 0) await wait(left);

  mr.stop();
  await done;
  const blob = new Blob(chunks, { type: 'video/webm' });
  log('보내는 중 ' + Math.round(blob.size / 1024) + 'KB');
  await fetch('/clip-' + CLIP + '.webm', { method: 'POST', body: blob });
  log('DONE ' + Math.round(blob.size / 1024) + 'KB ' + JSON.stringify(W.__drive.info()));
})();
</script>
