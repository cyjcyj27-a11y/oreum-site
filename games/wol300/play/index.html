  html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  #c{position:absolute;inset:0;margin:auto;width:100vw;height:100vh;object-fit:contain;display:block}
  /* 폰 조작 — 왼쪽 아래 패드, 오른쪽 아래 E. 흑백 세상이라 단추도 흑백 */
  #pad,#ebtn{display:none;position:fixed;z-index:5;touch-action:none;-webkit-user-select:none;user-select:none}
  body.touch #pad,body.touch #ebtn{display:block}
  #pad{left:calc(18px + env(safe-area-inset-left));bottom:18px;width:160px;height:160px;border-radius:50%;
    background:rgba(0,0,0,.38);border:2px solid rgba(255,255,255,.35)}
  #knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
    background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.6)}
  #ebtn{right:calc(22px + env(safe-area-inset-right));bottom:30px;width:88px;height:88px;border-radius:50%;
    background:rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.55);color:#fff;font:bold 34px/84px sans-serif;text-align:center}
  #ebtn.on{background:rgba(255,255,255,.88);color:#000}
  #keys{position:fixed;right:14px;bottom:10px;z-index:4;color:rgba(255,255,255,.45);font:13px sans-serif;pointer-events:none}
  body.touch #keys{display:none}
  /* 캠코더 녹화 단추 — 밖에 나가면 나온다. 한 번 누르면 녹화(시간이 빨리 흐름), 다시 누르면 납품 */
  #recb{display:none;position:fixed;z-index:5;left:0;top:0;transform:translate(-50%,-100%);height:44px;min-width:44px;padding:0 13px 0 10px;box-sizing:border-box;   /* 주인공 머리 위를 따라다닌다(사장님 9/26) */
    border-radius:999px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.6);color:#fff;font:bold 16px/40px sans-serif;
    align-items:center;gap:8px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
  body.outside #recb{display:flex}
  #recb i{width:14px;height:14px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 0 3px rgba(255,255,255,.85)}
  #recb.on{background:rgba(255,255,255,.9);color:#000} #recb.on i{border-radius:3px;animation:recb 1s steps(2) infinite}
  @keyframes recb{50%{opacity:.25}}
  @media (max-height:480px){ #recb{height:38px;font-size:14px;line-height:34px} }
  body.titling #recb,body.ending #recb,body.mini #recb,body.settling #recb{display:none!important}
  /* 데이터 부스 창 — 부스 화면이니까 컬러. 왼쪽 3x3 칸, 오른쪽 문제·확인 */
  #mini{position:fixed;inset:0;z-index:18;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
  #mini.on{display:flex}
  body.mini #pad,body.mini #ebtn{display:none!important}
  .kbox{position:relative;display:flex;gap:18px;align-items:flex-start;background:#fff;border-radius:14px;padding:16px;box-shadow:0 0 0 6px #1d3fa8,0 16px 50px rgba(0,0,0,.6)}
  .kbox.good{animation:kgood .45s} .kbox.bad{animation:kbad .4s}
  @keyframes kgood{0%{box-shadow:0 0 0 6px #2fbf5a,0 0 60px #2fbf5a}100%{box-shadow:0 0 0 6px #1d3fa8,0 16px 50px rgba(0,0,0,.6)}}
  @keyframes kbad{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .kgrid{display:grid;grid-template-columns:repeat(3,min(22vh,118px));gap:4px}
  .kcell{position:relative;cursor:pointer;line-height:0;border-radius:4px;overflow:hidden}
  .kcell canvas{width:100%;height:auto;display:block}
  .kcell.on::after{content:'';position:absolute;inset:0;border:5px solid #2a6df4;border-radius:4px;background:rgba(42,109,244,.25)}
  .kside{width:190px;display:flex;flex-direction:column;gap:12px;font-family:sans-serif}
  .khead{background:#2a6df4;color:#fff;font:bold 14px sans-serif;letter-spacing:.1em;padding:8px 10px;border-radius:6px}
  .kq{font-size:21px;line-height:1.35;color:#222} .kq b{display:block;font-size:30px;color:#1d3fa8}
  .kbtn{font:bold 22px sans-serif;color:#fff;background:linear-gradient(180deg,#5b93ff,#2a6df4 60%,#1d52c7);border:3px solid #173d8f;border-radius:999px;padding:10px 0;cursor:pointer;box-shadow:0 4px 0 #173d8f}
  .kbtn:active{transform:translateY(3px)}
  .kx{position:absolute;top:-16px;right:-16px;width:40px;height:40px;border-radius:50%;border:3px solid #173d8f;background:#fff;font:bold 20px sans-serif;cursor:pointer}
  @media (max-height:480px){ .kbox{padding:2.4vh;gap:3vh} .kside{width:170px;gap:2vh} .kq{font-size:4.8vh} .kq b{font-size:6.6vh} .kbtn{font-size:5.4vh;padding:1.6vh 0} .khead{font-size:3.6vh} }
  /* 시작 화면 — 포스터: 가라앉은 방 위에 붉은 붓글씨. 단추는 흑백 */
  #title{position:fixed;inset:0;z-index:15;transition:opacity .55s}
  #title.out{opacity:0;pointer-events:none}
  #tcv{position:absolute;inset:0;margin:auto;width:100vw;height:100vh;object-fit:contain;display:block}
  #tBtns{position:absolute;left:50%;top:60%;transform:translate(-50%,0);display:flex;gap:.7em;font-size:26px}
  #tBtns .mbtn{margin:0;font-size:1em;padding:.5em 1.8em;letter-spacing:.22em;white-space:nowrap;       /* 시작 단추 — 입체 없이 가라앉게(사장님 9/26 "너무 명랑해 보여") */
    background:rgba(0,0,0,.45);color:#f2f2ee;border:1.5px solid rgba(255,255,255,.7);border-radius:2px;box-shadow:none;font-weight:600;transition:background .2s,color .2s}
  #tBtns .mbtn:hover{background:rgba(255,255,255,.92);color:#0a0a0a} #tBtns .mbtn:active{transform:none;background:#fff;color:#000}
  #tCont{display:none} #tBtns.has #tCont{display:block}
  body.titling #pad,body.titling #ebtn,body.titling #topbar,body.titling #keys{display:none!important}
  body:not(.titling) #oreumFs{display:none}   /* 게임 중엔 왼쪽 아래 패드와 겹친다 */
  /* 폰 세로 — 가로로 돌려 달라는 안내(oreum-game-ui 규칙 6, 단추는 landscape.js 의 OL.go) */
  #rotate{display:none;position:fixed;inset:0;z-index:80;background:#000;color:#f2f2ee;font:600 22px sans-serif;flex-direction:column;gap:22px;align-items:center;justify-content:center;text-align:center;padding:20px}
  #rotate .mbtn{margin:0;background:rgba(0,0,0,.45);color:#f2f2ee;border:1.5px solid rgba(255,255,255,.7);border-radius:2px;box-shadow:none;font-weight:600;letter-spacing:.12em}
  @media (orientation:portrait){ body.touch #rotate{display:flex} html.ol-land body.touch #rotate{display:none} }
  /* 상단바 — 스카이라이더 배치, 흑백 */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;gap:8px;align-items:center;pointer-events:none;
    padding:8px calc(10px + env(safe-area-inset-right)) 18px calc(104px + env(safe-area-inset-left));   /* 왼쪽 위 오름 알약 자리 */
    background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
  .stat{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;

/*═══════════ 바깥 — 화면 좌표, 겹마다 천천히 흐른다(늘 흑백) ═══════════*/
function ridge(y0,amp,seed,col,f1,f2,off){
  x.fillStyle=col; x.beginPath(); x.moveTo(0,H);
  for(let px=0;px<=W;px+=8){ const q=px+off;
    x.lineTo(px,y0-amp*(.55+.3*Math.sin(q*f1+seed)+.18*Math.sin(q*f2+seed*2.1))); }
  x.lineTo(W,H); x.closePath(); x.fill();
}
function fog(y,h,a){const g=x.createLinearGradient(0,y-h,0,y+h);
  g.addColorStop(0,'rgba(250,250,247,0)');g.addColorStop(.5,'rgba(250,250,247,'+a+')');
  g.addColorStop(1,'rgba(250,250,247,0)');x.fillStyle=g;x.fillRect(0,y-h,W,h*2);}
const TOWERS=[];
for(let i=0,px=-40;px<2700;i++){ const w=40+rnd(i*3.1)*70, h=50+rnd(i*1.7)*110;
  TOWERS.push({x:px,w,h,s:i}); px+=w+8+rnd(i*5.3)*30; }
const BOARDS=[{x:420,y:26},{x:1800,y:40},{x:3180,y:30},{x:4560,y:34}];   // 먼 전광판 — 바깥에서 유일하게 색이 있는 것
function bgOutside(t){
  x.fillStyle=vg(0,260,'#c9c9c5','#f5f5f2'); x.fillRect(0,0,W,H);
  const gl=x.createRadialGradient(900,60,20,900,60,520);
  gl.addColorStop(0,'rgba(255,255,255,.95)');gl.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gl;x.fillRect(0,0,W,H);
  const o1=camX*S*.12, o2=camX*S*.3;
  ridge(150,80,1.3,'#d0d0cc',.0031,.0077,o1);            fog(140,40,.6);
  for(const tw of TOWERS){ const tx=tw.x-o2; if(tx>W||tx+tw.w<0) continue;
    const by=175, top=by-tw.h;
    x.fillStyle='#c2c2be'; x.fillRect(tx,top,tw.w,by-top);
    x.fillStyle='rgba(255,255,255,.22)';
    for(let wy=top+8;wy<by-6;wy+=12) for(let wx=tx+6;wx<tx+tw.w-7;wx+=10) x.fillRect(wx,wy,4,6);
    if(rnd(tw.s*7.7)>.7){ x.fillStyle='#c2c2be'; x.fillRect(tx+tw.w/2-1,top-30,2,30); } }
  billboards(t);
  fog(150,50,.45);
}
function fgScreenInView(){
  const inV=(a,w)=>a+w>camX&&a<camX+VW;
  for(const k in SCR){ const q=SCR[k]; if(inV(q.x,q.w)) return true; }
  return inV(SO+1304+SH.store,52)||inV(SO+2914+SH.bus,120)||inV(BEACH+BSCR.x,BSCR.w);
}
function billboards(t,noPole){
  if(fgScreenInView()) return;                     // 밤엔 판만 다시 밝힌다(기둥까지 그리면 지붕 위로 겹친다)
  const o2=camX*S*.3, k=(Math.sin(t*.0009)+1)/2;
  for(const b of BOARDS){ const bx=b.x-o2, by=b.y, bw=118, bh=64; if(bx>W||bx+bw<0) continue;
    if(!noPole){ x.fillStyle='#9a9a96'; x.fillRect(bx+bw/2-3,by+bh,6,90); }
    x.fillStyle='#6e6e6a'; x.fillRect(bx-4,by-4,bw+8,bh+8);
    const g=x.createLinearGradient(bx,by,bx+bw,by+bh);
    g.addColorStop(0,k>.5?'#ff3d8b':'#2fd3ff'); g.addColorStop(1,k>.5?'#7a3dff':'#ffd23a');
    x.fillStyle=g; x.fillRect(bx,by,bw,bh);
    x.fillStyle='rgba(255,255,255,.92)'; x.font='bold 18px sans-serif'; x.textAlign='center';
    if(G.score){ x.fillStyle='rgba(0,0,0,.35)'; x.fillRect(bx,by,bw,bh); x.textAlign='left'; freshBadge(bx+(bw-freshW(34))/2,by+15,34); x.textAlign='center'; }
    else { x.fillText('₩3,000,000',bx+bw/2,by+bh/2+3);
    x.font='bold 9px sans-serif'; x.fillText('SELL YOUR DATA',bx+bw/2,by+bh/2+18); }
    x.fillStyle='rgba(255,255,255,.2)'; for(let yy=by;yy<by+bh;yy+=2) x.fillRect(bx,yy,bw,1);
    x.textAlign='left'; }
}

  x.fillStyle=vg(CEIL,CEIL+60,'rgba(0,0,0,.30)','rgba(0,0,0,0)'); x.fillRect(0,CEIL,RW,60);
  x.fillStyle=vg(FLOOR-70,FLOOR,'rgba(0,0,0,0)','rgba(0,0,0,.28)'); x.fillRect(0,FLOOR-70,RW,70);
  x.fillStyle=hg(0,50,'rgba(0,0,0,.22)','rgba(0,0,0,0)'); x.fillRect(0,CEIL,50,FLOOR-CEIL);
  x.fillStyle=hg(RW-50,RW,'rgba(0,0,0,0)','rgba(0,0,0,.22)'); x.fillRect(RW-50,CEIL,50,FLOOR-CEIL);
  x.fillStyle=c(P,'#8a6a4c'); x.fillRect(0,FLOOR-9,RW,9);                        // 걸레받이
}
function windowOn(P,x0,y0,w,h,t){
  x.save(); x.beginPath(); x.rect(x0,y0,w,h); x.clip();
  x.fillStyle=vg(y0,y0+h,P.sky0,P.sky1); x.fillRect(x0,y0,w,h);
  x.fillStyle=P.hill; x.beginPath(); x.moveTo(x0,y0+h);
  for(let px=0;px<=w;px+=4) x.lineTo(x0+px,y0+h*.72-Math.sin(px*.035+x0)*h*.08-Math.sin(px*.011)*h*.1);
  x.lineTo(x0+w,y0+h); x.fill();
  x.restore();
  const gl=x.createRadialGradient(x0+w/2,y0+h/2,10,x0+w/2,y0+h/2,w*1.3);
  gl.addColorStop(0,P.mono?'rgba(255,255,255,.28)':'rgba(255,245,215,.35)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gl; x.fillRect(x0-w,y0-h,w*3,h*3);
  x.fillStyle=c(P,'#f4f1ea'); x.fillRect(x0-6,y0-6,w+12,6); x.fillRect(x0-6,y0+h,w+12,8);
  x.fillRect(x0-6,y0,6,h); x.fillRect(x0+w,y0,6,h); x.fillRect(x0+w/2-2,y0,4,h);
  for(const side of [-1,1]){
    const cx=side<0?x0-14:x0+w-6, cw=20;
    x.fillStyle=P.curtain; x.beginPath();
    x.moveTo(cx,y0-14); x.lineTo(cx+cw,y0-14);
    for(let yy=y0-14;yy<=y0+h+30;yy+=6) x.lineTo(cx+cw+Math.sin(yy*.09+side)*2.5,yy);
    x.lineTo(cx,y0+h+30); x.closePath(); x.fill();
    x.strokeStyle=P.mono?'rgba(0,0,0,.25)':shade(P.curtain,-.3); x.lineWidth=1.4;
    for(let k=1;k<4;k++){ x.beginPath(); x.moveTo(cx+k*5,y0-12); x.quadraticCurveTo(cx+k*5+2,y0+h/2,cx+k*5-1,y0+h+28); x.stroke(); }
  }
  x.fillStyle=c(P,'#3b3b3b'); x.fillRect(x0-22,y0-18,w+44,4);
}
function contact(x0,x1,a){
  const g=x.createRadialGradient((x0+x1)/2,FLOOR,2,(x0+x1)/2,FLOOR,(x1-x0)*.6);
  g.addColorStop(0,'rgba(0,0,0,'+(a||.35)+')'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(x0-(x1-x0)*.2,FLOOR-30,(x1-x0)*1.4,30);
}
function pendant(P,px,len){
  x.strokeStyle=c(P,'#222'); x.lineWidth=1.5; x.beginPath(); x.moveTo(px,CEIL); x.lineTo(px,CEIL+len); x.stroke();
  x.beginPath(); x.moveTo(px-8,CEIL+len); x.lineTo(px+8,CEIL+len); x.lineTo(px+22,CEIL+len+18); x.lineTo(px-22,CEIL+len+18); x.closePath();
  fillObj(P,'#e9e2cf',CEIL+len,CEIL+len+18);
  const g=x.createRadialGradient(px,CEIL+len+20,4,px,CEIL+len+60,120);
  g.addColorStop(0,P.mono?'rgba(255,255,250,.30)':'rgba(255,230,170,.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(px-130,CEIL+len-60,260,260);
}
/* 천장 CCTV — 방구석에서 아래로 비스듬히 본다. 불은 흰빛(흑백 세상) */
function cam(P,px,dir,t,ph){
  if(G.broken[CURK]){ brokenCam(P,px,CEIL+4,dir,t,ph); return; }
  x.save(); x.translate(px,CEIL+4);
  x.fillStyle=c(P,'#e8e8e8'); x.fillRect(-5,-4,10,5); x.fillRect(-1.5,0,3,12);
  x.translate(0,14); x.rotate(dir*.45); x.scale(dir,1);
  rr(-4,-6,30,12,4); fillObj(P,'#f1f1ef',-6,6);
  x.fillStyle=c(P,'#cfcfcf'); x.fillRect(22,-7,7,14);
  x.fillStyle=P.mono?'#000':'#111'; x.beginPath(); x.arc(28,0,3.4,0,7); x.fill();
  if(G.cams[CURK]){ const lc='255,32,32', bl=((t*.001+ph)%1.6)<1.0?1:.45;     // 켜짐 = 빨간불(사장님 지정 — 흑백 세상의 예외)
    const g=x.createRadialGradient(4,-2,0,4,-2,16); g.addColorStop(0,'rgba('+lc+','+(.95*bl)+')'); g.addColorStop(1,'rgba('+lc+',0)');
    x.fillStyle=g; x.fillRect(-14,-20,36,36);
    x.fillStyle='rgb('+lc+')'; x.beginPath(); x.arc(4,-2,2.4,0,7); x.fill(); }
  else { x.fillStyle=P.mono?'#2a2a27':'#444'; x.beginPath(); x.arc(4,-2,2.2,0,7); x.fill(); }
  x.restore();
}
/* 총 맞은 CCTV — 받침만 남고 몸통이 전선에 매달려 늘어진다. 렌즈는 깨지고 불은 꺼졌다 */
function brokenCam(P,px,py,dir,t,ph){
  x.save(); x.translate(px,py);
  x.fillStyle=c(P,'#e8e8e8'); x.fillRect(-5,-4,10,5); x.fillRect(-1.5,0,3,8);
  x.strokeStyle='#000'; x.lineWidth=1.3; x.beginPath(); x.moveTo(0,8); x.quadraticCurveTo(dir*6,20,dir*3,30); x.stroke();
  const sw=Math.sin(t*.002+ph)*.08;
  x.translate(dir*3,30); x.rotate(dir*1.35+sw); x.scale(dir,1);
  rr(-2,-6,28,12,4); fillObj(P,'#f1f1ef',-6,6);
  x.fillStyle=P.mono?'#000':'#111'; x.beginPath(); x.arc(24,0,3.4,0,7); x.fill();
  x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=.7; x.beginPath(); x.moveTo(22,-2.5); x.lineTo(25,.5); x.lineTo(23,2.6); x.moveTo(25,.5); x.lineTo(27,-1.8); x.stroke();
  x.fillStyle='#000'; x.beginPath(); x.moveTo(8,-6); x.lineTo(12,-2); x.lineTo(9,1); x.lineTo(14,6); x.lineTo(6,6); x.lineTo(4,-6); x.fill();   // 구멍
  x.restore();
}

function bike(P,x0,x1,wy,t){
  const r=40, col=c(P,'#1a1a1a');
  x.strokeStyle=col; x.lineCap='round';
  for(const wx of [x0+r,x1-r]){ x.lineWidth=4; x.beginPath(); x.arc(wx,wy,r,0,7); x.stroke();
    x.lineWidth=1; for(let k=0;k<8;k++){ const a=k*Math.PI/4; x.beginPath(); x.moveTo(wx,wy); x.lineTo(wx+Math.cos(a)*r,wy+Math.sin(a)*r); x.stroke(); } }
  const rx=x0+r, fx=x1-r, cx=(rx+fx)/2-6;
  x.lineWidth=4; x.strokeStyle=c(P,'#c0392b');
  x.beginPath(); x.moveTo(rx,wy); x.lineTo(cx,wy); x.lineTo(cx-8,wy-58); x.lineTo(rx,wy); x.stroke();
  x.beginPath(); x.moveTo(cx,wy); x.lineTo(fx-10,wy-54); x.lineTo(cx-8,wy-58); x.stroke();
  x.beginPath(); x.moveTo(fx-10,wy-54); x.lineTo(fx,wy); x.stroke();
  x.strokeStyle=col; x.lineWidth=4;
  x.beginPath(); x.moveTo(fx-10,wy-54); x.lineTo(fx-14,wy-70); x.lineTo(fx+4,wy-74); x.stroke();
  x.beginPath(); x.moveTo(cx-8,wy-58); x.lineTo(cx-10,wy-66); x.stroke();
  rr(cx-24,wy-72,28,7,3); x.fillStyle=col; x.fill();
  x.beginPath(); x.arc(cx,wy,7,0,7); x.fill();
}

function catRoute(){ return [{hop:[SILL.x-30,FLOOR]},{run:BX+262},{hop:[BX+150,494]},{face:1},{wait:.5},{swat:1},{wait:2.4},   // 창턱 → 바닥 → 책상 위 → 컵을 툭
  {hop:[BX+262,FLOOR]},{run:SILL.x-30},{hop:[SILL.x,SILL.y],end:1}]; }
function catUpdate(dt){
  const C=G.cat;
  if(C.st==='pet'){ C.t+=dt; if(C.t>1.1) C.st='go'; return; }
  if(C.st!=='go') return;
  const s=C.steps[0];
  if(!s){ C.st='sill'; C.x=SILL.x; C.y=SILL.y; C.pose='sit'; return; }
  s.t=(s.t||0)+dt;
  if(s.hop){ if(!s.from){ s.from=[C.x,C.y]; C.face=s.hop[0]>=C.x?1:-1; }
    const k=Math.min(1,s.t/.45);
    C.x=s.from[0]+(s.hop[0]-s.from[0])*k; C.y=s.from[1]+(s.hop[1]-s.from[1])*k-Math.sin(k*Math.PI)*42; C.pose='leap';
    if(k>=1){ C.steps.shift(); if(s.end){ C.st='sill'; C.x=SILL.x; C.y=SILL.y; C.pose='sit'; } } }
  else if(s.run!==undefined){ const dir=Math.sign(s.run-C.x)||1; C.face=dir; C.x+=dir*320*dt; C.pose='run'; C.ph+=dt*17;
    if((s.run-C.x)*dir<=0){ C.x=s.run; C.steps.shift(); } }
  else if(s.swat){ C.pose='swat';
    if(s.t>.28&&!s.done){ s.done=1; const pl=G.plant; pl.st='fall'; pl.vx=120; pl.vy=-110; pl.va=7; }
    if(s.t>.55) C.steps.shift(); }
  else if(s.wait){ C.pose='sit'; if(s.t>s.wait) C.steps.shift(); }
  else if(s.face){ C.face=s.face; C.steps.shift(); }
}

/*═══════════ 시작 화면 — 영화 포스터처럼: 어둡게 가라앉은 방 + 붉은 붓글씨 제목 ═══════════
   제목 글자는 글꼴이 아니라 붓질을 코드로 그린다(털 자국·마른 붓 끊김·끝 튐).
   ⚠ 세상은 흑백 — 제목의 붉은색만 예외(사장님이 준 포스터 느낌) */
let TITLE=true;
const TCV=document.getElementById('tcv'); TCV.width=W; TCV.height=H; const TX=TCV.getContext('2d');
function crSample(P,step){                                 // 점들을 부드럽게 잇는다(캣멀롬)
  const out=[];
  for(let i=0;i<P.length-1;i++){ const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
    const n=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let k=0;k<n;k++){ const t=k/n,t2=t*t,t3=t2*t, f=j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);
      out.push([f(0),f(1)]); } }
  out.push(P[P.length-1]); return out;
}
function ellPts(cx,cy,rx,ry,a0,span,slant){               // 붓으로 그리는 동그라미(기울임)
  const P=[]; for(let k=0;k<=40;k++){ const a=a0+span*k/40, y=cy+Math.sin(a)*ry; P.push([cx+Math.cos(a)*rx-(y-cy)*slant,y]); } return P;
}
const INK=['#a80f18','#b3121a','#8e0d14','#9c0e16','#c0151e','#7d0b12'];
function brush(g,ctrl,w,seed,step){
  const pts=crSample(ctrl,step||2.2), N=pts.length; if(N<2) return;
  const nor=pts.map((p,i)=>{ const a=pts[Math.max(0,i-1)], b=pts[Math.min(N-1,i+1)]; const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [-dy/l,dx/l]; });
  const pres=i=>{ const u=i/(N-1); const a=Math.min(1,.3+u*7); const b=1-Math.pow(Math.max(0,(u-.6)/.4),1.5)*.8;
    return a*b*(.9+.1*Math.sin(u*17+seed)); };
  g.fillStyle='#a50f17';                                    // 먹이 가장 짙은 가운데 — 거의 붓 폭 전체
  for(let i=0;i<N;i++){ const r=w*pres(i)*.44; g.beginPath(); g.arc(pts[i][0],pts[i][1],r,0,7); g.fill(); }
  const B=40;                                               // 털 자국
  for(let j=0;j<B;j++){ const o=j/(B-1)-.5, rs=seed*31+j*7.7;
    let ink=1; const dry=.003+rnd(rs)*.011*(Math.abs(o)*2+.25);
    g.strokeStyle=INK[Math.floor(rnd(rs+2)*INK.length)]; g.lineWidth=1.1+rnd(rs+1)*2.8; g.lineCap='round';
    let prev=null;
    for(let i=0;i<N;i++){ ink-=dry*(1+rnd(rs+i*.37)*.5);
      const edge=Math.abs(o)>.4, off=o*w*pres(i)*(1+(edge?rnd(rs+i)*.3:0));
      const q=[pts[i][0]+nor[i][0]*off, pts[i][1]+nor[i][1]*off];
      const gap=ink<rnd(rs+i*1.3)*.55 || rnd(rs+i*2.1)<(edge?.2:.015);
      if(prev&&!gap){ g.globalAlpha=(edge?.75:.4)*Math.min(1,.4+Math.max(0,ink)*.7); g.beginPath(); g.moveTo(prev[0],prev[1]); g.lineTo(q[0],q[1]); g.stroke(); }
      prev=gap?null:q; } }
  g.globalAlpha=1;
  const e=pts[N-1], dp=pts[Math.max(0,N-8)], dx=e[0]-dp[0], dy=e[1]-dp[1], l=Math.hypot(dx,dy)||1;   // 끝에서 튀는 방울
  g.fillStyle='#b3121a';
  for(let k=0;k<12;k++){ const t=rnd(seed+k*3.1)*w*2.4, s=(rnd(seed+k*5.7)-.5)*w*1.3;
    g.beginPath(); g.arc(e[0]+dx/l*t-dy/l*s, e[1]+dy/l*t+dx/l*s, .8+rnd(seed+k)*w*.08,0,7); g.fill(); }
}
function splat(g,cx,cy,r,seed){                             // 튄 자국 — 가운데 덩이 + 둘레 방울
  g.fillStyle='#9e1018';
  g.beginPath(); for(let k=0;k<=18;k++){ const a=k/18*6.283, rr2=r*(.7+rnd(seed+k)*.5); k?g.lineTo(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2):g.moveTo(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2); } g.fill();
  for(let k=0;k<22;k++){ const a=rnd(seed+k*2.3)*6.283, d=r*(1.1+rnd(seed+k*4.1)*2.6);
    g.beginPath(); g.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,.6+rnd(seed+k)*r*.16,0,7); g.fill(); }
}

function fontArt(){
  const c0=document.createElement('canvas'); c0.width=1060; c0.height=540; const g=c0.getContext('2d');   // 아래 120 은 밑줄 붓질 자리
  /* "300" 은 "월" 보다 크게(사장님 9/26). 아랫줄을 맞추고 둘을 합친 폭을 980 에 맞춘다 */
  const BIG=1.3*1.3, GAP=.04;                                 // 9/26 "30%더키워" → 1.3 에서 30% 더
  const T1=EN?'300':'월', T2=EN?'A MONTH':'300', B1=EN?BIG:1, B2=EN?1:BIG;          // 영문판 — 큰 300 뒤에 A MONTH(사장님 9/26)
  g.font=(100*B1)+'px WolDokdo'; const w1=g.measureText(T1).width;
  g.font=(100*B2)+'px WolDokdo'; const w2=g.measureText(T2).width;
  let fs=Math.min(100*980/(w1+w2+100*GAP),330);
  g.font=(fs*BIG)+'px WolDokdo'; let m=g.measureText('300');                   // 글자 실제 높이가 틀(420)에 들어가게(큰 300 기준)
  const hh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent; if(hh>370) fs*=370/hh;
  let f1=(fs*B1)+'px WolDokdo', f2=(fs*B2)+'px WolDokdo';
  g.font=f1; const a1=g.measureText(T1).width; g.font=f2; const a2=g.measureText(T2).width; g.font=(fs*BIG)+'px WolDokdo'; m=g.measureText('300');
  let x1=530-(a1+a2+fs*GAP)/2, x2=x1+a1+fs*GAP, base=210+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2, base2=base;
  if(EN){ fs=(285/((m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)/(fs*BIG)))/BIG;   // 영문 — 큰 300 을 위에, A MONTH 를 그 아래 오른쪽에 받친다
    g.font=(fs*BIG)+'px WolDokdo'; m=g.measureText('300'); const w300=m.width, h300=m.actualBoundingBoxAscent;
    g.font=(fs*.62)+'px WolDokdo'; const mm=g.measureText('A MONTH');
    x1=530-w300/2; base=14+h300; x2=x1+w300-mm.width+fs*.1; base2=Math.min(412,base+mm.actualBoundingBoxAscent*.95);
    f1=(fs*BIG)+'px WolDokdo'; f2=(fs*.62)+'px WolDokdo'; }
  g.textAlign='left'; g.textBaseline='alphabetic';
  const gr=g.createLinearGradient(0,20,0,400); gr.addColorStop(0,'#d11f26'); gr.addColorStop(.55,'#b3121a'); gr.addColorStop(1,'#860b12');
  g.fillStyle=gr; g.strokeStyle=gr; g.lineJoin='round';
  g.font=f1; g.lineWidth=fs*B1*.035; g.strokeText(T1,x1,base); g.fillText(T1,x1,base);           // 테를 같은 색으로 한 겹 — 가는 획을 굵게
  g.font=f2; g.lineWidth=fs*(EN?.62:B2)*.035; g.strokeText(T2,x2,base2); g.fillText(T2,x2,base2);
  { /* 300 밑 가로 붓줄 — 영화 「300」 포스터처럼 왼쪽 밖에서 들어와 오른쪽으로 쓱(사장님 9/26) */
    const ux0=EN?x1:x2, ux1=EN?x2+g.measureText(T2).width:x2+a2, uy=(EN?base2:base)+fs*.13, L=ux1-ux0, bw=fs*.17;
    brush(g,[[ux0-L*.28,uy+bw*.35],[ux0+L*.15,uy+bw*.05],[ux0+L*.6,uy-bw*.12],[ux1+L*.06,uy-bw*.32]],bw,7,2.2);
    const vy=uy+bw*1.25, vw=bw*.62;                                                      // 그 밑에 짧은 줄 하나(사장님 9/26)
    brush(g,[[ux0+L*.17,vy+vw*.2],[ux0+L*.5,vy-vw*.05],[ux0+L*.95,vy-vw*.35]],vw,19,2.2); g.fillStyle=gr; g.strokeStyle=gr; }   // 짧은 줄 — 시작은 그대로, 오른쪽으로 더 길게(9/26)
  g.globalCompositeOperation='destination-out';               // 마른 붓 결 — 가로로 긁힌 틈
  for(let k=0;k<260;k++){ const y=rnd(k*1.3)*540, x0=rnd(k*2.7)*1060, len=30+rnd(k*3.9)*220;
    g.strokeStyle='rgba(0,0,0,'+(.25+rnd(k*5.1)*.5)+')'; g.lineWidth=.6+rnd(k*7.3)*1.8;
    g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+len,y-len*.06); g.stroke(); }
  g.globalCompositeOperation='source-atop';                  // 획 안쪽 짙은 결
  for(let k=0;k<120;k++){ const y=rnd(k*4.3+1)*540, x0=rnd(k*6.1+2)*1060, len=40+rnd(k*8.7)*260;
    g.strokeStyle=INK[k%INK.length]; g.globalAlpha=.35; g.lineWidth=1+rnd(k*9.9)*2.5;
    g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+len,y-len*.06); g.stroke(); }
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  splat(g,96,300,5,23);
  return c0;
}

const EVSLOTS=['back','beachA','beachB','swing','play','bus','store'];
G.out={}; G.outPrev={};
function rollOut(){                                               // 나갈 때마다 자리마다 사건 하나(놀이터는 둘 중 한 곳만)
  const pick=slot=>{ const ids=Object.keys(EVENTS).filter(k=>EVENTS[k].slot===slot&&k!==G.outPrev[slot]); return ids[Math.floor(Math.random()*ids.length)]; };
  G.out={}; for(const sl of ['back','beachA','beachB','bus','store']) G.out[sl]=pick(sl);
  if(Math.random()<.5) G.out.swing='swingman'; else G.out.play=pick('play');
  for(const sl in G.out) G.outPrev[sl]=G.out[sl];
}
rollOut();
const outHere=()=>G.hour>=DAY_H0&&G.hour<24;                     // 아침 8시부터 자정까지 사람이 있다("밖에 나가면 할 게 없다")
function drawSlot(slot,P,t){ const id=G.out[slot]; if(!id||!outHere()) return;
  if(P.mono){ rimmed(EVX[slot],470,.5,()=>{ x.fillStyle='#000'; EVENTS[id].draw(P,t,EVX[slot]); }); return; }   // 바깥 사람도 주인공처럼 흰 테 — 검은 벽 앞에서 묻히지 않게("아저씨 안 보임")
  x.fillStyle='#000'; EVENTS[id].draw(P,t,EVX[slot]); }
function beachPeople(P,t){ drawSlot('beachA',P,t); drawSlot('beachB',P,t); }
function drawBeach(P,t){
  const B=BEACH, M=P.mono, L=B-40, R=B+SEG+40;
  x.fillStyle=M?'#8d8d89':vg(430,520,'#2f8fd0','#4fb6e0'); x.fillRect(L,432,R-L,90);                       // 바다
  x.fillStyle=M?'rgba(255,255,255,.55)':'rgba(255,255,255,.8)';
  for(let k=0;k<4;k++){ const yy=450+k*18, ph=t*.0012+k*1.7; x.beginPath();
    for(let px=L;px<=R;px+=12) x.lineTo(px,yy+Math.sin(px*.03+ph)*2.2); x.lineTo(R,yy+2); x.lineTo(L,yy+2); x.fill(); }
  x.fillStyle=M?'#c9c9c3':vg(516,FLOOR,'#f3dfae','#e2c68c'); x.beginPath(); x.moveTo(L,522);                  // 모래
  for(let px=L;px<=R;px+=20) x.lineTo(px,518+Math.sin(px*.02+t*.001)*3); x.lineTo(R,FLOOR); x.lineTo(L,FLOOR); x.fill();
  x.fillStyle=M?'rgba(0,0,0,.12)':'rgba(150,110,50,.25)'; for(let k=0;k<40;k++) x.fillRect(L+rnd(k*3.3)*(R-L),530+rnd(k*5.1)*56,2,1.4);
  const pole=(px,c0)=>{ x.fillStyle=M?'#0d0d0c':'#555'; x.fillRect(px-2,420,4,FLOOR-420);                      // 파라솔
    x.beginPath(); x.moveTo(px-70,436); x.quadraticCurveTo(px,380,px+70,436); x.closePath(); x.fillStyle=M?'#0d0d0c':c0; x.fill();
    if(!M){ x.fillStyle='#fff'; for(const d of [-35,14]){ x.beginPath(); x.moveTo(px,404); x.lineTo(px+d,433); x.lineTo(px+d+21,433); x.closePath(); x.fill(); } } };
  pole(B+110,'#ff5a4a');
  x.fillStyle=M?'#0d0d0c':'#2fb8a8'; x.fillRect(B+60,584,110,5);                                            // 수건
  if(M){ x.fillStyle='#0d0d0c'; x.fillRect(B+BSCR.x+BSCR.w/2-3,BSCR.y+BSCR.h,6,FLOOR-BSCR.y-BSCR.h);  /* 화면 기둥 — 화면 속엔 안 비친다 */ rr(B+BSCR.x-5,BSCR.y-5,BSCR.w+10,BSCR.h+10,3); x.fillStyle='#0d0d0c'; x.fill(); }
  beachPeople(P,t);
}

function tomBadge(bx,by,h,v,al){
  x.save(); x.globalAlpha*=al==null?1:al;
  const txt=v+'%'; x.font='bold '+(h*.62)+'px sans-serif'; const w=h*1.4+x.measureText(txt).width;
  x.fillStyle='rgba(0,0,0,.62)'; rr(bx,by,w,h,h*.3); x.fill();
  tomato(bx+h*.55,by+h*.52,h*.36,v>=60);
  x.fillStyle='#fff'; x.textAlign='left'; x.fillText(txt,bx+h*1.05,by+h*.73);
  x.restore(); return w;
}
function beachScreen(t){
  const sx=BEACH+BSCR.x, sy=BSCR.y, sw=BSCR.w, sh=BSCR.h;
  if(sx+sw<camX-20||sx>camX+VW+20) return;
  const X0=BEACH+60, Y1=FLOOR+6, k=sw/680, Y0=Y1-sh/k;                                                         // 화면에 담는 해변 범위
  x.save(); x.beginPath(); x.rect(sx,sy,sw,sh); x.clip();
  x.save(); x.translate(sx,sy); x.scale(k,k); x.translate(-X0,-Y0);
  x.fillStyle=vg(Y0,432,'#7cc3ee','#d9f0fb'); x.fillRect(X0-20,Y0,720,432-Y0);
  drawBeach(COLOR,t);
  x.restore();
  const nk=nightK(); if(nk>0){ x.fillStyle='rgba(10,14,44,'+(.55*nk)+')'; x.fillRect(sx,sy,sw,sh); }
  if(beachHere()){                                                                                              // AI 인식 네모 + 점수
    for(const sl of ['beachA','beachB']){ const id=G.out[sl]; if(!id) continue; const v=evScore(id), wx=EVX[sl], cl=v>=60?'#6dff9a':'#ffe14a';
      const bx=sx+(wx-34-X0)*k, by=sy+(FLOOR-218-Y0)*k, bw=70*k, bh=(218)*k;

  const v=o.vol==null?.3:o.vol, at=o.at||.003;

  /* 할머니 이야기 — 7초 녹음하면 돈 */

  if(G.endWait){ G.endWait-=dt; if(G.endWait<=0){ G.endWait=0; G.end={t:0}; document.body.classList.add('ending'); SFX.swell(); } }
  if(G.end){ G.end.t+=dt; if(G.end.t>9&&!G.end.card){ G.end.card=1; showEnd(); } }
  if(G.twin){ G.twin.t+=dt; if(G.twin.t>8&&!G.twin.card){ G.twin.card=1; showEnd(); } }
  /* 포장마차 · 취중 고백 */
  const Br=G.bar;
  if(Br.st==='drink'){ Br.t+=dt; if(Br.t>1.3){ Br.poured++; G.drunk+=1; SFX.hic(); Br.st='sit'; Br.t=0; if(Br.poured>=2){ Br.st='out'; Br.ang=0; } } }
  else if(Br.st==='confess'){ Br.t+=dt;
    if(Br.t>7.8){ const px=Br.px, cm=nearCam(px); accident('confess',px+60,300,'street'); camFlash(cm+59,318);
      G.drunk=0; Br.st='slump'; Br.t=0; Br.story++; { const R=px-camX>VW/2; HERO.face=R?-1:1; HERO.x=R?px-30:px+24; }   /* 화면 오른쪽(가로등 등)이면 왼쪽으로 주저앉아 화면 안에(9/26) */ HERO.po={}; } }
  else if(Br.st==='slump'){ Br.t+=dt; if(Br.t>3.2){ Br.st='idle'; HERO.po={}; } }
  else if(Br.st==='out'){ Br.t+=dt; Br.ang=Math.min(1.5,Br.ang+dt*4); if(Br.ang>=1.5&&!Br.thud){ Br.thud=1; G.shake=9; SFX.crash(); } if(Br.t>1.8){ Br.thud=0; startSleep(); } }   /* 두 잔 — 바로 뒤로 자빠진다 */   // 필름 끊김 — 눈 떠 보면 내 침대
  if(Br.st!=='drink'&&Br.st!=='out'&&!G.sleeping) G.drunk=Math.max(0,G.drunk-dt/60);   /* 한 잔이 1분쯤 간다 */
  if(G.bar.st==='confess'&&Math.random()<dt*7) SFX.blip(1);
  if(G.drunk>=4&&G.bar.st==='idle'&&Math.random()<dt*.12) SFX.hic();
  if(G.cf){ G.cf.t-=dt*1.6; if(G.cf.t<=0) G.cf=null; }
  /* 가스레인지 — 켜고 5초 두면 넘친다(9/26 사장님 "끓는 시간 줄여" — 14초에서) */
  const St=G.stove;
  if(St.on){ St.t+=dt;
    if(St.t>5){ St.spill=Math.min(1,St.spill+dt*.6);
      if(!St.hit){ St.hit=1; SFX.boilOver(); accident('ramen',KX+150,410,'kitchen'); } } }
  else { St.cool=Math.max(0,St.cool-dt*.25); if(St.spill>0) St.spill=Math.max(0,St.spill-dt*.05); }
  /* 고양이 · 화분 */
  catUpdate(dt);
  const pl=G.plant;
  if(pl.st==='fall'){ pl.vy+=1500*dt; pl.x+=pl.vx*dt; pl.y+=pl.vy*dt; pl.ang+=pl.va*dt;
    if(pl.y>=FLOOR-4){ pl.st='broken'; pl.y=FLOOR; G.shake=Math.max(G.shake,4); SFX.shatter(); accident('cat',pl.x,470,'bed');
      for(let i=0;i<16;i++){ const a2=-Math.PI*(.1+.8*Math.random()), v=120+Math.random()*220; G.sparks.push({x:pl.x,y:FLOOR-8,vx:Math.cos(a2)*v,vy:Math.sin(a2)*v,life:.4+Math.random()*.5}); } } }   // 와장창 — 사기 조각이 튄다
  /* 의자 — 까딱까딱 커지다가 넘어간다 */
  const CH=G.chair;
  if(CH.st==='sit'){ CH.t+=dt; const lean=Math.min(.3,.06+CH.t*.09), sw=Math.sin(CH.t*3.2);   /* 9/26 "넘어지기까지 너무 오래" — 7.5초 → 약 3초 */
    CH.ang=lean*(.55+.45*sw); if(sw>.97&&!CH.cr){ CH.cr=1; SFX.creak(); } if(sw<0) CH.cr=0; if(CH.t>2.6&&sw>.92){ CH.st='tip'; CH.va=.9; } }
  else if(CH.st==='tip'){ CH.va+=7*dt; CH.ang+=CH.va*dt;
    if(CH.ang>=1.05){ CH.ang=1.05; CH.st='down'; CH.t=0; SFX.crash(); accident('chair',SITX+70,440,'bed'); } }
  else if(CH.st==='down'){ CH.t+=dt; if(CH.t>2.2){ CH.st='idle'; CH.ang=0; HERO.x=STANDX; HERO.face=-1; HERO.po={}; } }
  /* 냉장고 */
  const F=G.fridge;
  if(F.st==='peek'){ F.t+=dt; F.open=Math.min(1,F.open+dt*4); if(F.t>1.4) F.st='close'; }
  else if(F.st==='sneak'){ F.t+=dt; HERO.face=[-1,1,-1,1][Math.min(3,Math.floor(F.t/.5))];   // 두리번두리번 — 아무도 없지?
    if(F.t>2){ F.st='eat'; F.t=0; HERO.face=1; HERO.po={}; } }
  else if(F.st==='eat'){ F.t+=dt; F.open=Math.min(1,F.open+dt*4);
    if(F.t>1.3&&!F.hit){ F.hit=1; if(F.day){ accident('snack',KX+484,400,'kitchen'); } else { accident('fridge',KX+484,400,'kitchen'); if(G.cams.kitchen) camFlash(KX+RW-64-26,322); } } if(F.t>3.6) F.st='close'; }   // 한 입 무는 순간 천장 CCTV 가 번쩍
  else if(F.st==='close'){ F.open=Math.max(0,F.open-dt*3); if(F.open<=0) F.st='shut'; }
  /* 욕실 — 샤워 5초 → 나와서 비누 밟고 미끄러짐 → 누웠다 일어남 */
  const Bt=G.bath;
  if(Bt.st==='shower'){ Bt.t+=dt; if(Bt.t>5){ SFX.slip(); Bt.st='slip'; Bt.t=0; Bt.ang=0; HERO.x=RBX+452; HERO.face=-1; HERO.po={}; } }
  else if(Bt.st==='slip'){ Bt.t+=dt; Bt.ang=Math.min(1.42,Bt.ang+dt*5.5); Bt.soap=Math.min(90,Bt.soap+dt*320);
    if(Bt.ang>=1.42){ Bt.st='down'; Bt.t=0; G.shake=8; accident('bath',HERO.x+70,440,'bath'); } }
  else if(Bt.st==='down'){ Bt.t+=dt; if(Bt.t>1.8){ Bt.st='idle'; Bt.ang=0; HERO.po={}; } }
  /* 하루 — 08시에 일어나 밤 12시면 모든 게 끝나고 다음 날 아침(침실) */
  if(!G.sleeping&&!TITLE&&!G.end&&!G.twin){ G.hour+=dt*(G.rec?REC_SPEED:1)/SEC_PER_H; if(G.hour>=DAY_H1){ G.hour=DAY_H1; startSleep(); } }
  /* CCTV 일상 — 가만 있어도 조금씩. AI 가 날마다 더 배워서 줄어든다(하루 6만 원에서 시작) */
  if(!G.sleeping&&!TITLE&&!G.end&&!G.twin) camHours(dt*(G.rec?REC_SPEED:1)/SEC_PER_H);
  /* 잠 — 어두워졌다가 다음 날. 30일째 밤이면 정산 */
  if(G.sleeping===1){ G.fade+=dt*1.4;
    if(G.fade>=1){ G.fade=1; if(G.day>=30){ G.sleeping=3; openSettle(); } else { newDay(); G.sleeping=2; } } }
  else if(G.sleeping===2){ G.fade-=dt*1.1; if(G.fade<=0){ G.fade=0; G.sleeping=0; } }

  for(const c0 of G.coins){ c0.vy+=2.2*dt; c0.x+=c0.vx*dt*.5; c0.y+=c0.vy*dt*.5; c0.spin+=dt*9; c0.life-=dt; }
  G.coins=G.coins.filter(c0=>c0.life>0&&c0.y<1.1);
  for(const p of G.pops) p.t+=dt;
  G.pops=G.pops.filter(p=>p.t<1.8);
}
