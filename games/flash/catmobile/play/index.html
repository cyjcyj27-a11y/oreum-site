<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe9a8">
<title>고양이용 게임 — Game for Cat</title>
<style>
  @font-face { font-family: 'Ria'; src: url('fonts/RiaSans-ExtraBold.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Bagel'; src: url('fonts/BagelFatOne-sub.woff2') format('woff2'); font-display: swap; }   /* Bagel Fat One (OFL) — 제목 전용 부분집합 */
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#ffe9a8;
    font-family:'Ria', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ── 상단바 (스카이라이더 규칙) ── */
  #topbar { position:fixed; left:0; right:0; top:0; height:48px; display:flex; align-items:center; gap:8px;
    padding:6px 10px 6px calc(104px + env(safe-area-inset-left)); box-sizing:border-box; pointer-events:none; z-index:20;
    background:linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,0)); }
  #topbar .stat { background:rgba(0,0,0,.35); color:#fff; border-radius:999px; padding:5px 10px; font-size:15px; display:flex; align-items:center; gap:6px; }
  #topbar .stat b { font-size:17px; font-weight:800; }
  #topbar .spacer { flex:1; }
  #topbar .tog { pointer-events:auto; width:36px; height:36px; border-radius:50%; border:0; background:rgba(0,0,0,.4); color:#fff; font-size:16px; cursor:pointer; touch-action:manipulation; }
  #topbar .tog.off { opacity:.4; text-decoration:line-through; }

  /* ── 타이틀 ── */
  #title { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; pointer-events:none; }
  #title h1 { margin:0; font-family:'Bagel', 'Ria', sans-serif; font-size:min(16vw, 104px); font-weight:400; color:#ff8a1f; letter-spacing:0; text-align:center; line-height:1.05;
    -webkit-text-stroke:2px #5a3a1a; text-shadow:0 6px 0 #5a3a1a, 0 10px 24px rgba(0,0,0,.25); transform:rotate(-4deg); animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform:rotate(-4deg) translateY(0) } 50%{ transform:rotate(-2deg) translateY(-10px) } }
  #start { pointer-events:auto; border:0; cursor:pointer; font-family:inherit; font-weight:900; font-size:min(9vw, 44px); color:#fff;
    background:#ff5f7e; padding:.35em 1.3em; border-radius:999px; box-shadow:0 8px 0 #b8324d, 0 14px 30px rgba(0,0,0,.25);
    -webkit-text-stroke:1px #b8324d; letter-spacing:.06em; transition:transform .08s; touch-action:manipulation; }
  #start:active { transform:translateY(6px); box-shadow:0 2px 0 #b8324d; }
  #title.hide { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <div class="stat">🐾 <b id="cnt">0</b></div>
  <div class="spacer"></div>
  <button class="tog" id="sndTog" title="효과음">🔊</button>
</div>

<div id="title">
  <h1 id="h1">고양이용<br>게임</h1>
  <button id="start">START</button>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/audio.js?v=2"></script>
<script src="js/game.js?v=2"></script>
<script src="/assets/visit.js?v=11" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
