  #flash { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.6); font-family: 'Ria', Arial, sans-serif; font-size: min(16vw, 96px); letter-spacing: 4px; color: #ffe066; -webkit-text-stroke: 4px #1d2a44; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.45); opacity: 0; pointer-events: none; z-index: 8; transition: opacity .18s, transform .3s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
  #flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #flash.small { font-size: min(9vw, 54px); top: 30%; }
  #flash.go { color: #7ee08a; }

  /* 타이틀 */
  .scr { position: fixed; inset: 0; z-index: 10; display: none; }
  .scr.show { display: flex; }
  #title { flex-direction: column; align-items: center; justify-content: space-between; padding: calc(64px + env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom)); pointer-events: none; }

  .btn { pointer-events: auto; display: inline-block; padding: 16px 70px; border-radius: 999px; border: 3px solid #fff; background: #e8483c; color: #fff; font-family: 'Ria', sans-serif; font-size: 30px; letter-spacing: 3px; cursor: pointer; box-shadow: 0 6px 0 #8a2418, 0 10px 24px rgba(0,0,0,.35); touch-action: manipulation; text-shadow: 0 2px 0 rgba(0,0,0,.25); }

  .card .medal { position: absolute; left: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); box-shadow: 0 2px 6px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; font-size: 15px; color: #5a3a00; }

  .chip { position: relative; flex: 1; max-width: 46px; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); background: rgba(14,21,40,.78); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,.4); touch-action: manipulation; }

  #roster { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 4px; width: min(1080px, 100%); }
  .rp { width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); cursor: pointer; overflow: hidden; background: #0e1528; touch-action: manipulation; }

  @media (max-width: 820px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }

  #selBack { margin-top: 16px; }

  /* 결과 */

  #rNew { color: #7ee08a; font-size: 22px; min-height: 28px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  #rUnlock { display: flex; gap: 10px; justify-content: center; min-height: 10px; margin: 4px 0 12px; }

  /* 엔딩 */

  body.racing #oreumFs, body.counting #oreumFs { display: none !important; }
  /* 첫 화면 모드 고르기 */

  #btnNew.warn { background: #e8483c; box-shadow: 0 5px 0 #8a2418; }

  .mode { width: min(40vw, 230px); padding: 18px 10px 16px; border-radius: 26px; border: 4px solid #fff; background: linear-gradient(#3f8fe0, #2566b8); box-shadow: 0 7px 0 #173f78, 0 12px 26px rgba(0,0,0,.35); cursor: pointer; text-align: center; touch-action: manipulation; }

    /* 가로로 든 낮은 폰(360px)에서 모드 단추가 화면 아래로 잘려 나갔다 — 제목과 여백을 줄인다. 왼쪽 아래 전체화면 알약보다 위에 오게 (2026-09-19 점검) */

  #pmenu { flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: rgba(12,20,40,.72); padding: 60px 16px 24px; overflow-y: auto; }

  .ky.bump::after { content: ''; position: absolute; bottom: 6px; width: 12px; height: 2px; border-radius: 1px; background: #1d2a44; opacity: .5; }
  .ky.hl { background: var(--fc); color: #1d2a44; transform: translateY(-2px); box-shadow: 0 0 0 3px #fff, 0 0 18px var(--fc); z-index: 1; }
  .ky.hls { background: var(--fc); box-shadow: 0 0 0 2px #fff; }
  .ky.okf { animation: okf .25s; } .ky.badf { animation: badf .3s; }
  @keyframes okf { 0% { transform: translateY(3px); filter: brightness(.85); } }
  @keyframes badf { 0%, 60% { background: #ff7a6a; } }
  #hands { display: flex; align-items: flex-end; gap: 7px; height: 70px; }
  .fg { width: 26px; border-radius: 13px 13px 8px 8px; background: var(--fc); opacity: .28; transition: opacity .1s, transform .1s; }
  .fg.gapL { margin-left: 26px; } .fg.gapR { margin-right: 26px; }
  .fg.on { opacity: 1; transform: translateY(-8px); box-shadow: 0 0 14px var(--fc); }
  @media (max-width: 700px), (max-height: 560px) { #kbWrap { display: none; } #pLine { font-size: 34px; } #pSeat { font-size: 80px; } #pText { min-height: 110px; } }
  body.touch #kbWrap { display: none; }

  @media (max-height: 780px) { #hands { display: none; } .ky { height: 34px; font-size: 17px; border-bottom-width: 4px; } #pText { min-height: 100px; padding: 8px 12px; } #pSeat { font-size: 72px; } #pLine { font-size: 42px; } #pinp { font-size: 28px; padding: 6px 16px; } #pNext { font-size: 19px; min-height: 26px; max-height: 29px; overflow: hidden; } #prac { gap: 6px; padding-top: calc(46px + env(safe-area-inset-top)); } .plv { padding: 3px 10px; font-size: 15px; } #pLv b { font-size: 20px; } .pst span { padding: 3px 10px; } .pst b { font-size: 20px; } #pQuit { padding: 4px 16px; font-size: 16px; } #kb { padding: 7px; gap: 4px; } .kr { gap: 4px; } }
  .plv, #pLv b { white-space: nowrap; }
  @media (max-width: 700px) { #pLv { flex-basis: 100%; } .pst { flex: 1; } .pst span { padding: 3px 9px; font-size: 14px; } .pst b { font-size: 19px; } }
  /* 연습 결과 */
  #pres { flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(10,16,34,.8); text-align: center; }
  .prBig b { font-weight: normal; font-size: min(30vw, 160px); line-height: 1; color: #ffd84a; -webkit-text-stroke: 7px #1d2a44; paint-order: stroke fill; }
  .prBig small { font-size: 40px; margin-left: 8px; }
  .prRow { display: flex; gap: 30px; font-size: 36px; }
  .prRow b { font-weight: normal; }
  #prNew { color: #7ee08a; font-size: 24px; min-height: 30px; }
  .prBtns { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .prBtns .row { display: flex; gap: 10px; }
  body.shot #topbar, body.shot #oreumHome, body.shot #oreumFs, body.shot #title .btn, body.shot .rec { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <span class="stat" id="stCourse">🏁 <b id="vCourse">1</b></span>
  <span class="stat">⌨ <b id="vCpm">0</b><small id="uCpm" data-en="WPM">타</small></span>
  <span class="stat" id="stAcc">🎯 <b id="vAcc">100</b><small>%</small></span>
  <span class="spacer"></span>
  <button class="tog" id="tgPause">❚❚</button>
  <button class="tog" id="tgBgm">♪</button>
  <button class="tog" id="tgSnd">🔊</button>
</div>

<div id="panel">
  <div id="next"></div>
  <div id="word"></div>
  <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" inputmode="text">
</div>

<div id="flash"></div>

<div class="scr show" id="title">
  <div>
    <h1 data-en="TYPING RACE">타자연습<br><em>달리기</em></h1>
    <div class="rec" id="rec"></div>
  </div>
  <div class="modes">
    <div class="mode" id="btnPrac"><i>⌨️</i><b data-en="PRACTICE">타자연습</b></div>
    <div class="mode run" id="btnStart"><i>🏃</i><b data-en="RACE">달리기</b></div>
  </div>
</div>

<div class="scr" id="select">
  <div id="grid"></div>
  <div id="roster"></div>
  <div class="selBtns">
    <div class="btn cont" id="btnCont" hidden data-en="CONTINUE">이어하기</div>
    <div class="btn sub" id="btnNew" hidden data-en="NEW GAME">처음부터 하기</div>
    <div class="btn sub" id="selBack" data-en="TITLE">처음으로</div>
  </div>
</div>

<div class="scr" id="result">
  <div id="rRank" data-en="1ST">1등</div>
  <div id="rStats"><span>⌨ <b id="rCpm">0</b><small id="rUnit" data-en="WPM">타</small></span><span>🎯 <b id="rAcc">0</b><small>%</small></span></div>
  <div id="rNew"></div>
  <div id="rUnlock"></div>
  <div id="rBtns">
    <div class="btn" id="btnNext" data-en="NEXT">다음 코스</div>
    <div class="row"><div class="btn sub" id="btnRetry" data-en="RETRY">다시</div><div class="btn sub" id="btnCourses" data-en="COURSES">코스</div></div>
  </div>
</div>

<div class="scr" id="pause">
  <h2>PAUSE</h2>
  <div class="btn" id="btnResume" data-en="RESUME">계속</div>
  <div class="btn sub" id="btnQuit" data-en="COURSES">코스</div>
</div>

<div class="scr" id="pmenu">
  <div class="plang"><span id="plKo">한글</span><span id="plEn" data-en="English">영어</span></div>
  <div id="pmGrid">
    <div class="pm" data-m="seat"><i>⌨️</i><b data-en="Keys">자리 연습</b></div>
    <div class="pm" data-m="word"><i>🍎</i><b data-en="Words">낱말 연습</b></div>
    <div class="pm" data-m="short"><i>✏️</i><b data-en="Sentences">짧은 글 연습</b></div>
    <div class="pm" data-m="long"><i>📖</i><b data-en="Stories">긴 글 연습</b></div>
  </div>
  <div class="btn sub" id="pmBack" data-en="TITLE">처음으로</div>
</div>

<div class="scr" id="prac">
  <div id="pHead">
    <div id="pLv"></div>
    <div class="pst"><span>⌨ <b id="pCpm">0</b><small id="pUnit" data-en="WPM">타</small></span><span>🎯 <b id="pAcc">100</b><small>%</small></span><span><b id="pProg">0/0</b></span></div>
    <div class="btn sub" id="pQuit" data-en="MENU">연습</div>
  </div>
  <div id="pBar"><i id="pBarFill"></i></div>
  <div id="pText">
    <div id="pSeatWrap"><div id="pSeat"></div><div id="pSeatNext"></div></div>
    <div id="pLineWrap"><div id="pPrev"></div><div id="pLine"></div></div>
  </div>
  <input id="pinp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next">
  <div id="pNext"></div>
  <div id="kbWrap"><div id="kb"></div><div id="hands"></div></div>
</div>

<div class="scr" id="pres">
  <div class="prBig"><b id="prSpeed">0</b><small id="prUnit" data-en="WPM">타</small></div>
  <div class="prRow"><span>🎯 <b id="prAcc">0</b>%</span><span>⏱ <b id="prTime">0:00</b></span></div>
  <div id="prNew"></div>
  <div class="prBtns">
    <div class="btn" id="prNext" data-en="NEXT">다음 단계</div>
    <div class="row"><div class="btn sub" id="prRetry" data-en="RETRY">다시</div><div class="btn sub" id="prMenu" data-en="MENU">연습</div></div>
  </div>
</div>

<div class="scr" id="ending">
  <div class="btn sub" id="btnEndOk" data-en="COURSES">코스</div>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/hangul.js?v=1"></script>
<script src="js/words.js?v=3"></script>
<script src="js/art.js?v=2"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/game.js?v=5"></script>
<script src="js/practice.js?v=2"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
