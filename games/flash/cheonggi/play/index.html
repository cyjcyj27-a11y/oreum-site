<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5aa8e6">
<meta name="robots" content="noindex">
<title>청기백기</title>
<style>
@font-face{font-family:'Gugi';src:url('fonts/Gugi-title.woff2?v=2') format('woff2');font-display:swap}   /* Gugi (OFL) — 제목·큰 글자 부분집합 */
@font-face{font-family:'Ria';src:url('fonts/RiaSans-ExtraBold.woff2') format('woff2');font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* 폰이 글자를 멋대로 키우지 않게 */
html,body{width:100%;height:100%;overflow:hidden;background:#9fd0f2;
  font-family:'Ria',-apple-system,'Malgun Gothic',sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
body.hit #cv{animation:hit .35s}
@keyframes hit{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

/* ---------- 상단바 (스카이라이더 배치) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;pointer-events:none;
  padding:6px 8px 20px calc(104px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,0))}
.stat{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);
  border-radius:999px;padding:5px 10px;font-size:15px}
.stat i{font-style:normal;font-size:13px}
.stat b{font-size:17px;font-weight:400;letter-spacing:.3px}
#hearts{font-size:16px;letter-spacing:1px;color:#ff5a6e}
#hearts .lost{color:rgba(255,255,255,.25)}
.bar{width:84px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>span{display:block;height:100%;width:0;border-radius:4px;background:#8fd3ff;transition:width .25s}
.spacer{flex:1 1 20px}
.tog{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(0,0,0,.4);color:#fff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;position:relative;font-family:inherit;touch-action:manipulation}
.tog.off{opacity:.4}
.tog.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;
  background:#fff;transform:rotate(-45deg);border-radius:1px}
@media (max-width:700px){.stat b{font-size:15px}.stat{padding:5px 8px;gap:5px}.bar{width:48px}#topbar{gap:5px}}
@media (orientation:portrait){#topbar{padding:calc(30px + env(safe-area-inset-top)) 8px 16px 8px;gap:5px}   /* 폰 세로: 전면 카메라 구멍을 피해 내리고, 오름 알약 아래라 왼쪽 여백 없이 */
  #topbar .stat{padding:4px 9px;gap:5px}#topbar .stat b{font-size:15px}#topbar .bar{width:40px}#topbar .tog{width:34px;height:34px}}

/* ---------- 선생님 말풍선 ---------- */
#bubble{position:fixed;z-index:18;left:50%;top:calc(var(--tb,46px) + 6px);transform:translateX(-50%) scale(.85);
  opacity:0;transition:opacity .12s,transform .12s;pointer-events:none;
  background:#fff;color:#2a2a2a;border-radius:22px;border:4px solid #2a3a5a;
  padding:.18em .7em .12em;font-size:clamp(28px,min(6.6vw,10.5vh),84px);line-height:1.25;white-space:nowrap;
  box-shadow:0 6px 0 rgba(42,58,90,.35),0 12px 28px rgba(0,0,0,.18)}
#bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
#btxt .cb{color:#1f56c4}
#btxt .cw{color:#fff;-webkit-text-stroke:.07em #2a2a2a;paint-order:stroke fill}
#btxt .hid{opacity:0}
#btxt .pbr{display:none}
@media (orientation:portrait){#btxt .pbr{display:inline}#bubble{white-space:normal;width:max-content;max-width:92vw;text-align:center;top:calc(var(--tb,106px) + 10px);font-size:clamp(28px,8.6vw,48px)}}

/* ---------- 깃발 단추(왼쪽 청기, 오른쪽 백기) ---------- */
.fbtns{position:fixed;z-index:25;bottom:calc(54px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#fbB{left:calc(14px + env(safe-area-inset-left))}
#fbW{right:calc(14px + env(safe-area-inset-right))}
.fb{width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.75);cursor:pointer;
  font-size:30px;line-height:1;display:grid;place-items:center;touch-action:none;font-family:inherit;position:relative;
  box-shadow:0 5px 0 rgba(0,0,0,.25)}
.fb small{position:absolute;bottom:3px;font-size:11px;opacity:.7}
body:not(.touch) .fb{padding-bottom:9px}
body.touch .fb small{display:none}
#fbB .fb{background:#2d63c8;color:#fff}
#fbW .fb{background:#f6f6f1;color:#2a3a5a;border-color:#2a3a5a}
.fb.on{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.25);filter:brightness(1.15)}
body:not(.touch) .fb{width:62px;height:62px;font-size:24px}
@media (orientation:portrait){   /* 세로: 청기 ▲▼·백기 ▲▼ 두 줄 — 자리는 game.js 가 아이 다리 양옆으로 잡는다(사장님 9/19) */
  .fbtns{flex-direction:column;gap:8px;bottom:calc(50px + env(safe-area-inset-bottom))}
  .fb,body:not(.touch) .fb{width:68px;height:68px;font-size:27px}
}

/* ---------- 큰 글자 판 ---------- */
.panel{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.panel.on{display:flex}
.panel h1{font-family:'Gugi','Ria',sans-serif;font-weight:400;line-height:1;text-align:center;
  color:#fff;-webkit-text-stroke:3px #1d2c55;paint-order:stroke fill;text-shadow:0 7px 0 #1d2c55,0 12px 30px rgba(0,0,0,.3)}
.panel .num{font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.35)}
.btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;font-size:30px;color:#fff;
  background:#2d63c8;padding:12px 46px;border-radius:999px;letter-spacing:.06em;
  box-shadow:0 7px 0 #173b85,0 14px 30px rgba(0,0,0,.25);touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #173b85}
.btn.sub{font-size:20px;padding:9px 30px;background:#f6f6f1;color:#2a3a5a;box-shadow:0 5px 0 #9aa3b5,0 10px 24px rgba(0,0,0,.2)}
.btn.sub:active{box-shadow:0 1px 0 #9aa3b5}

#title{justify-content:flex-start;padding-top:7vh;gap:6px}
@media (orientation:portrait){#title{padding-top:calc(var(--tb,100px) + 14px);transform-origin:50% 0}   /* 세로: 제목을 메뉴 아래로 */
  #title .btn{font-size:22px;padding:9px 30px;white-space:nowrap}#title .btn.sub{font-size:15px;padding:7px 22px}#title .best{font-size:15px}}   /* 세로: START 를 작게 한 줄로 — 아이 얼굴을 가리지 않게(game.js fitTitle 이 넘치면 더 줄인다) */
#title h1{font-size:clamp(72px,min(16vw,21vh),170px);letter-spacing:.02em;transform:rotate(-3deg);animation:bob 2.2s ease-in-out infinite;-webkit-text-stroke:5px #1d2c55}
#title h1 .t1{color:#2d63c8}
#title h1 .t2{color:#fff}
@keyframes bob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-10px)}}
#title .best{font-size:18px;color:#1d2c55;text-shadow:0 1px 0 rgba(255,255,255,.7)}
@media (orientation:landscape) and (max-height:500px){#title{padding-top:9vh;gap:8px}#title h1{font-size:clamp(64px,17vh,120px)}}

#stage h1{font-size:clamp(80px,16vw,160px);color:#ffe066;animation:pop .35s ease-out}
#clear h1{font-size:clamp(84px,17vw,170px);color:#ffe066;animation:pop .35s ease-out}
#over h1{font-size:clamp(76px,15vw,160px);color:#ff6b6b;animation:pop .35s ease-out}
#clearStars{font-size:54px;letter-spacing:6px;color:#ffd23a;text-shadow:0 4px 0 #9a6a00}
#clearStars .off{color:rgba(255,255,255,.35);text-shadow:none}
#ending .crown{font-size:90px;animation:pop .5s ease-out}
#ending h1{font-size:clamp(56px,min(10vw,13vh),130px);line-height:1.1;color:#ffe066;animation:pop .5s ease-out}
#ending .congrats{font-family:'Gugi','Ria',sans-serif;font-size:clamp(34px,min(6vw,8vh),72px);color:#fff;-webkit-text-stroke:2px #1d2c55;paint-order:stroke fill;text-shadow:0 5px 0 #1d2c55;animation:pop .45s ease-out}
#over,#clear,#ending{background:rgba(10,20,40,.25)}
#pause{background:rgba(10,20,40,.45)}
#pause .btn{font-size:40px;padding:10px 40px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* ---------- 떠오르는 글 ---------- */
#pops{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.pop{position:absolute;white-space:nowrap;animation:up 1.1s ease-out forwards;font-family:'Gugi','Ria',sans-serif;
  font-size:clamp(40px,7vw,72px);color:#ffe066;-webkit-text-stroke:3px #6b4a00;paint-order:stroke fill;text-shadow:0 5px 0 #6b4a00}
.pop.great{color:#8fe36b;-webkit-text-stroke-color:#2c5e14;text-shadow:0 5px 0 #2c5e14}
.pop.nice{color:#8fd3ff;-webkit-text-stroke-color:#1d4d7a;text-shadow:0 5px 0 #1d4d7a}
.pop.miss{color:#ff6b6b;-webkit-text-stroke-color:#6a1010;text-shadow:0 5px 0 #6a1010}
.pop.combo{font-size:clamp(26px,4vw,40px);color:#fff;-webkit-text-stroke-color:#1d2c55;text-shadow:0 3px 0 #1d2c55}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-8px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
/* ---------- 세로로 돌리기 (폰을 가로로 눕혔을 때만 — 폰은 세로 전용, 사장님 9/19) ---------- */
#rotate{position:fixed;inset:0;z-index:90;display:none;place-items:center;text-align:center;
  background:#1d2c55;color:#f2ede4;font-size:30px;line-height:1.6;padding:6vw}
#rotate .ph{display:inline-block;width:48px;height:80px;border:5px solid #f2ede4;border-radius:10px;margin-bottom:18px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:540px){body.touch #rotate{display:grid}}
</style></head>
<body>

<canvas id="cv"></canvas>

<div id="topbar">
  <div class="stat"><b id="stg">STAGE 1</b></div>
  <div class="stat"><span id="hearts"></span></div>
  <div class="stat"><span class="bar" id="pbar"><span></span></span></div>
  <div class="stat"><i>⭐</i><b id="score">0</b></div>
  <div class="spacer"></div>
  <button class="tog" id="tPause" title="일시정지">❚❚</button>
  <button class="tog" id="tBgm" title="음악">♪</button>
  <button class="tog" id="tSnd" title="효과음">🔊</button>
</div>

<div id="bubble"><span id="btxt"></span></div>
<div id="pops"></div>

<div class="fbtns" id="fbB">
  <button class="fb" id="bU">▲<small>W</small></button>
  <button class="fb" id="bD">▼<small>S</small></button>
</div>
<div class="fbtns" id="fbW">
  <button class="fb" id="wU">▲<small>↑</small></button>
  <button class="fb" id="wD">▼<small>↓</small></button>
</div>

<div class="panel" id="title">
  <h1><span class="t1">청기</span><span class="t2">백기</span></h1>
  <button class="btn" id="start">START</button>
  <button class="btn sub" id="newgame" hidden>NEW GAME</button>
  <div class="best" id="best"></div>
</div>
<div class="panel" id="stage"><h1 id="stageT">STAGE 1</h1></div>
<div class="panel" id="clear"><h1>CLEAR</h1><div id="clearStars"></div><div class="num" id="clearN"></div><button class="btn" id="next">NEXT</button></div>
<div class="panel" id="ending"><div class="crown">👑</div><div class="congrats">축하드립니다!</div><h1>당신은<br>순발력왕입니다</h1><div class="num" id="endN"></div><button class="btn" id="endNext">HOME</button></div>
<div class="panel" id="over"><h1>GAME OVER</h1><div class="num" id="overN"></div><button class="btn" id="retry">RETRY</button><button class="btn sub" id="home2">HOME</button></div>
<div class="panel" id="pause"><button class="btn" id="resume">▶</button></div>

<div id="rotate"><div><span class="ph"></span><p>세로 화면에서 하는 게임입니다</p></div></div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="voice/voice.js?v=4"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/art.js?v=11"></script>
<script src="js/game.js?v=12"></script>
<script src="/assets/visit.js?v=14" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
