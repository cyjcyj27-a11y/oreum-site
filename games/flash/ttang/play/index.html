<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>땅따먹기</title>
<style>
  @font-face { font-family: 'Gamja'; src: url('fonts/GamjaFlower-title.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Ria'; src: url('fonts/RiaSans-ExtraBold.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5a4230; font-family: 'Ria', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #fbf4e6; user-select: none; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* 상단 바 — 오름 알약(왼쪽 위) 오른쪽부터 */
  #topbar { position: fixed; left: 0; right: 0; top: 0; height: calc(46px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) calc(10px + env(safe-area-inset-right)) 0 calc(104px + env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0)); }
  .stat { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.14); font-size: 15px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .stat b { font-weight: normal; font-size: 19px; min-width: 38px; text-align: center; font-family: 'Ria', Arial, sans-serif; }
  .tm { display: inline-flex; align-items: center; gap: 5px; font-family: Arial, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; opacity: .5; transition: opacity .25s; }
  .tm.on { opacity: 1; }
  .tm i { width: 14px; height: 14px; border-radius: 4px; transform: rotate(12deg); background: #3f8fd6; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .tm.r i { background: #e0573f; transform: rotate(-14deg); }
  .tm.on i { box-shadow: 0 0 0 2px rgba(255,255,255,.45), 0 0 10px rgba(255,255,255,.6); }
  .tm span:empty { display: none; }
  #round, #stage { font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  body:not(.playing) #topbar .stat { visibility: hidden; }
  .spacer { flex: 1; }
  .tog { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; font-family: inherit; font-size: 17px; line-height: 1; padding: 0; touch-action: manipulation; }
  .tog.off { opacity: .4; text-decoration: line-through; }
  @media (max-width: 560px) {
    #topbar { padding-left: calc(96px + env(safe-area-inset-left)); padding-right: 6px; gap: 4px; }
    .stat { padding: 4px 7px; font-size: 12px; gap: 3px; } .stat b { font-size: 15px; min-width: 30px; }
    .tm span { display: none; } .tm i { width: 11px; height: 11px; }
    #round, #stage { font-size: 11px; letter-spacing: 0; }
    .tog { width: 30px; height: 30px; font-size: 14px; }
  }
  @media (max-width: 400px) { #stage { display: none !important; } }

  #flash { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); font-family: 'Ria', Arial, sans-serif; font-weight: 900; font-size: min(18vw, 88px); letter-spacing: 8px; color: #ffe066; -webkit-text-stroke: 3px #3a2410; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.55); opacity: 0; pointer-events: none; z-index: 8; transition: opacity .2s, transform .35s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
  #flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #flash.bad { color: #ff8a70; }

  #keys { position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; opacity: .45; text-align: right; line-height: 1.5; pointer-events: none; z-index: 5; font-family: Arial, sans-serif; }
  body.touch #keys { display: none; }

  #title, #over { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; }
  #title { pointer-events: none; }
  #title h1 { font-family: 'Gamja', 'Ria', sans-serif; font-weight: 400; font-size: min(30vw, 190px, 30vh); margin: 0 0 18px; line-height: 1; color: #fff; -webkit-text-stroke: 12px #3a2410; paint-order: stroke fill; text-shadow: 0 10px 30px rgba(0,0,0,.5); letter-spacing: -6px; }
  body.en #title h1 { font-size: min(20vw, 150px); }
  .rec { font-family: Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; color: #ffe066; text-shadow: 0 1px 4px rgba(0,0,0,.7); margin: 0 0 22px; min-height: 18px; }
  .rec:empty { display: none; }
  #title .go, #over .again { pointer-events: auto; display: inline-block; padding: 14px 54px; border-radius: 999px; border: 2px solid #fff; background: rgba(50,30,14,.8); color: #fff; font-size: 24px; letter-spacing: 3px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); touch-action: manipulation; }
  #title .go:active, #over .again:active { transform: scale(.96); }
  #title .p2 { pointer-events: auto; margin-top: 14px; padding: 8px 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.6); background: rgba(50,30,14,.6); color: #fff; font-family: Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; cursor: pointer; touch-action: manipulation; }
  #title .p2:active { transform: scale(.96); }
  #title .bot { display: flex; flex-direction: column; align-items: center; }
  #title.hide { display: none; }
  @media (max-aspect-ratio: 4/5) {
    #title { justify-content: space-between; padding: calc(60px + env(safe-area-inset-top)) 0 calc(64px + env(safe-area-inset-bottom)); }
  }
  body.shot #topbar, body.shot #keys, body.shot #oreumHome, body.shot #oreumFs, body.shot #btnStart, body.shot #btn2p, body.shot .rec { display: none !important; }

  #over { display: none; background: rgba(30,16,6,.55); }
  #over.show { display: flex; }
  #over h2 { font-family: Arial, sans-serif; font-weight: 900; font-size: min(6vw, 26px); letter-spacing: 6px; margin: 0 0 10px; opacity: .85; }
  #over .res { font-family: 'Ria', Arial, sans-serif; font-weight: 900; font-size: min(16vw, 92px); line-height: 1; letter-spacing: 6px; -webkit-text-stroke: 3px #3a2410; paint-order: stroke fill; margin-bottom: 14px; }
  #over .res.win { color: #ffe066; } #over .res.lose { color: #ff7a6a; }
  #over .pct { display: flex; gap: 22px; justify-content: center; align-items: center; font-family: 'Ria', Arial, sans-serif; font-size: 30px; margin-bottom: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #over .pct span { display: inline-flex; align-items: center; gap: 8px; }
  #over .pct i { width: 20px; height: 20px; border-radius: 5px; background: #3f8fd6; transform: rotate(12deg); }
  #over .pct span.r i { background: #e0573f; transform: rotate(-14deg); }
  #over .again { font-family: Arial, sans-serif; letter-spacing: 4px; font-size: 20px; }
  #over .home { pointer-events: auto; margin-top: 16px; font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; opacity: .7; cursor: pointer; padding: 6px 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <span class="stat" id="score"><span class="tm on" id="tm0"><i></i><span id="lb0">YOU</span></span><b id="s0">4%</b>:<b id="s1">4%</b><span class="tm r" id="tm1"><span id="lb1"></span><i></i></span></span>
  <span class="stat" id="round">1/10</span>
  <span class="stat" id="stage">STAGE 1</span>
  <span class="spacer"></span>
  <button class="tog" id="tgSnd" title="K">🔊</button>
</div>

<div id="flash">NICE</div>
<div id="keys" data-en="K sound">K 효과음</div>

<div id="over">
  <h2 id="oh">STAGE 1</h2>
  <div class="res win" id="ores">CLEAR</div>
  <div class="pct"><span><i></i><b id="op0">0%</b></span><span class="r"><b id="op1">0%</b><i></i></span></div>
  <div class="rec" id="orec"></div>
  <div class="again" id="btnRetry">NEXT</div>
  <div class="home" id="btnHome">TITLE</div>
</div>

<div id="title">
  <div class="top">
    <h1 data-en="LAND GRAB">땅따먹기</h1>
    <div class="rec" id="rec"></div>
  </div>
  <div class="bot">
    <div class="go" id="btnStart" data-en="START">시작</div>
    <div class="p2" id="btn2p">2 PLAYERS</div>
  </div>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/audio.js?v=1"></script>
<script src="js/game.js?v=2"></script>
<script src="/assets/visit.js?v=11" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
