<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>색깔섞기 퍼즐게임</title>
<style>
@font-face{font-family:'Star';src:url(fonts/star.woff2) format('woff2');font-display:block}
@font-face{font-family:'Pj';src:url(fonts/pj.woff2) format('woff2');font-display:block}
:root{--red:#d8473a;--redD:#7d2219;--cream:#f4ead2;--creamD:#a8946c;--ink:#3a2a1e;--paper:#fbf6ea;--cap:#2b2522}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Pj',sans-serif;color:var(--ink);touch-action:none;background:#b9864c url(assets/desk.webp) center/cover no-repeat}
.hide{display:none!important}
/* ── 주 단추: 짜다 만 물감 튜브(왼쪽 접힌 끝 + 오른쪽 돌림 뚜껑) ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:170px;min-height:58px;padding:8px 46px 8px 34px;border:0;cursor:pointer;
  font:400 27px/1 'Star',sans-serif;color:#fff;letter-spacing:.5px;-webkit-text-stroke:5px var(--redD);paint-order:stroke fill;
  border-radius:10px 16px 16px 10px/10px 20px 20px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.38) 0 10%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.22) 100%),
    linear-gradient(90deg,transparent 0 22%,rgba(255,250,235,.9) 22% 25%,transparent 25% 75%,rgba(255,250,235,.9) 75% 78%,transparent 78%),var(--red);
  box-shadow:0 5px 0 var(--redD),0 8px 12px rgba(40,20,5,.35),inset 0 0 0 2px rgba(0,0,0,.15);
  transition:transform .24s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,filter .15s}
.btn::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:16px;border-radius:2px;
  background:repeating-linear-gradient(180deg,#e9e4da 0 3px,#a9a196 3px 5px);box-shadow:0 3px 0 #7b736a,inset -2px 0 0 rgba(0,0,0,.2)}
.btn::after{content:'';position:absolute;right:-14px;top:50%;width:22px;height:34px;margin-top:-17px;border-radius:5px;
  background:repeating-linear-gradient(90deg,#3c3430 0 3px,#231d1a 3px 6px);box-shadow:0 4px 0 #120e0c,inset 0 2px 0 rgba(255,255,255,.18)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px) scale(1.04,.9);box-shadow:0 2px 0 var(--redD),0 3px 6px rgba(40,20,5,.3),inset 0 0 0 2px rgba(0,0,0,.15);transition-duration:.05s}
.btn.alt{color:var(--ink);-webkit-text-stroke:0;font-size:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0 10%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 62%,rgba(80,50,10,.18) 100%),
    linear-gradient(90deg,transparent 0 22%,var(--c,#5b8fd0) 22% 25%,transparent 25% 75%,var(--c,#5b8fd0) 75% 78%,transparent 78%),var(--cream);
  box-shadow:0 5px 0 var(--creamD),0 8px 12px rgba(40,20,5,.3),inset 0 0 0 2px rgba(0,0,0,.1)}
.btn.alt:active{box-shadow:0 2px 0 var(--creamD),0 3px 6px rgba(40,20,5,.25),inset 0 0 0 2px rgba(0,0,0,.1)}
.btn.sm{min-width:0;min-height:44px;padding:6px 32px 6px 24px;font-size:19px}
.btn.sm::after{height:26px;margin-top:-13px;width:17px;right:-11px}.btn.sm::before{width:12px;left:-9px}
/* ── 둥근 단추: 위에서 본 물감 튜브 뚜껑(톱니 테) ── */
.tog{position:relative;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;padding:0;flex:0 0 auto;
  background:radial-gradient(circle at 50% 50%,#4a403b 0 54%,transparent 55%),repeating-conic-gradient(#3a3230 0 6deg,#1e1917 6deg 12deg);
  box-shadow:0 3px 0 #0f0b0a,0 5px 9px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.15);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.tog svg{position:absolute;left:26%;top:26%;width:48%;height:48%}
.tog:active{transform:translateY(2px) rotate(-20deg) scale(.95)}
.tog.off{opacity:.6}
.tog.off::after{content:'';position:absolute;left:24%;right:24%;top:50%;height:2px;margin-top:-1px;background:#fff;border-radius:1px;transform:rotate(-40deg)}
.tog::before{content:'';position:absolute;inset:-4px}
/* ── 상단바: 색 견본 카드(왼쪽 색 띠) ── */
#topbar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 10px calc(104px + env(safe-area-inset-left))}
#topbar>*{pointer-events:auto}
.stat{display:inline-flex;align-items:center;gap:7px;height:36px;padding:4px 12px 4px 16px;font:400 18px/1 'Star',sans-serif;color:var(--ink);white-space:nowrap;
  background:linear-gradient(90deg,var(--c,#d8473a) 0 6px,transparent 6px),var(--paper);border-radius:3px;
  box-shadow:0 3px 0 #c8b892,0 4px 8px rgba(40,20,5,.3),inset 0 0 0 1px rgba(0,0,0,.08)}
.stat .k{font:700 12px/1 'Pj',sans-serif;opacity:.6}
.stat b{font-weight:400;font-variant-numeric:tabular-nums}
#topbar .spacer{flex:1}
/* ── 놀이 화면 ── */
#play{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:2.4vw;padding:0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
#lhs{display:flex;flex-direction:column;align-items:center;gap:14px;flex:0 1 46vw;min-width:0}
#rhs{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto}
.paper{position:relative;padding:9px;background:var(--paper);border-radius:2px;box-shadow:0 6px 14px rgba(40,20,5,.4),0 1px 0 #d9ccaa;transform:rotate(-.6deg)}
.paper::before,.paper::after{content:'';position:absolute;top:-9px;width:70px;height:22px;background:rgba(236,220,170,.85);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.paper::before{left:-14px;transform:rotate(-30deg)}.paper::after{right:-14px;transform:rotate(30deg)}
#pc{display:block;width:100%;aspect-ratio:1024/572;background:#eee6d6}
#pcw{width:100%}
#goal{display:flex;align-items:center;gap:12px}
#chip{position:relative;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;background:var(--paper);border-radius:4px;box-shadow:0 4px 0 #c8b892,0 6px 12px rgba(40,20,5,.3)}
#gc{width:74px;height:74px;display:block}
#chip .lb{display:flex;flex-direction:column;gap:6px}
#chip .lb span{font:400 18px/1 'Star',sans-serif;opacity:.75}
#mv{font:400 34px/1 'Star',sans-serif;font-variant-numeric:tabular-nums}
#mv.low{color:#c2362a}
#mv small{font:700 12px/1 'Pj',sans-serif;opacity:.6;margin-left:4px}
#ctl{display:flex;gap:10px}
#bUndo.alert{animation:undoA 1s ease-in-out infinite}
@keyframes undoA{0%,100%{box-shadow:0 3px 0 #0f0b0a,0 0 0 3px rgba(216,71,58,.9),0 0 14px 4px rgba(216,71,58,.55)}50%{box-shadow:0 3px 0 #0f0b0a,0 0 0 3px rgba(216,71,58,.3),0 0 4px 1px rgba(216,71,58,.2)}}
#bc{display:block;touch-action:none}
#items{display:flex;gap:8px;min-height:58px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:92vw}
.itm{position:relative;width:52px;height:58px;border:0;padding:0;cursor:pointer;border-radius:4px;background:var(--paper);box-shadow:0 3px 0 #c8b892,0 4px 8px rgba(40,20,5,.3);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.itm canvas{width:44px;height:44px;margin-top:2px}
.itm i{position:absolute;right:-5px;top:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font:700 12px/20px 'Pj',sans-serif;font-style:normal;color:#fff;background:var(--ink)}
.itm.gold{background:linear-gradient(160deg,#fff4cf,#f0cf72);box-shadow:0 3px 0 #a5781a,0 0 0 2px #e8c25a,0 4px 10px rgba(200,150,30,.5)}
.itm.on{transform:translateY(-6px);box-shadow:0 3px 0 #c8b892,0 0 0 3px var(--red),0 8px 12px rgba(40,20,5,.35)}
.itm:active{transform:translateY(2px)}
/* 큰 글자 */
#big{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:8;pointer-events:none;font:400 min(15vw,110px)/1 'Star',sans-serif;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;opacity:0}
#big.on{animation:pop 1.2s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}18%{opacity:1;transform:scale(1.08) rotate(-4deg)}30%{transform:scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.04) rotate(-4deg)}}
/* ── 창: 집게로 집은 도화지 ── */
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(50px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
.scr.dim{background:rgba(40,24,10,.5)}
.sheet{position:relative;max-width:min(940px,96vw);max-height:100%;overflow-x:hidden;overflow-y:auto;padding:30px 26px 24px;background:var(--paper);
  border-radius:3px 6px 4px 7px;background-image:radial-gradient(rgba(150,120,80,.06) 1px,transparent 1.5px);background-size:7px 7px;
  box-shadow:0 7px 0 #d8c9a2,0 16px 30px rgba(30,15,5,.45);animation:sh .2s cubic-bezier(.34,1.56,.64,1)}
.clip{position:absolute;left:50%;top:-3px;width:84px;height:22px;margin-left:-42px;border-radius:3px 3px 8px 8px;z-index:2;
  background:linear-gradient(180deg,#4a4f57,#23272d);box-shadow:0 3px 4px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25)}
.clip::after{content:'';position:absolute;left:10px;right:10px;top:-10px;height:14px;border:3px solid #9aa1aa;border-bottom:0;border-radius:8px 8px 0 0}
@keyframes sh{from{transform:scale(.88);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 14px;font:400 32px/1.1 'Star',sans-serif;text-align:center}
.row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}.hd h2{margin:0;flex:1;text-align:left}.hb{display:flex;gap:22px;padding-right:14px}
/* 타이틀: 장면 그대로, 제목은 아래 */
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
#tPaint{position:absolute;left:50%;top:35%;width:min(56vw,80vh);transform:translate(-50%,-50%) rotate(-1.2deg)}
#title .btns{display:flex;gap:30px;position:relative}
#logo{position:relative;font:400 min(16vw,128px)/1 'Star',sans-serif;color:#fff;-webkit-text-stroke:13px var(--ink);paint-order:stroke fill;letter-spacing:2px;
  text-shadow:0 9px 0 var(--ink),0 16px 26px rgba(0,0,0,.35)}
#logo i{display:block;font-style:normal;font-size:.48em;letter-spacing:4px;margin-top:.12em;-webkit-text-stroke-width:.11em;text-shadow:0 .08em 0 var(--ink)}
#logo{text-align:center}
/* 갤러리·그림 고르기 */
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.frm{position:relative;border:0;padding:7px;cursor:pointer;background:#8a5a2e;border-radius:2px;box-shadow:inset 0 0 0 2px #5c3a1a,inset 0 0 0 5px #b9864c,0 4px 8px rgba(40,20,5,.35);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.frm canvas{display:block;width:100%;aspect-ratio:1024/572;background:#eee6d6}
.frm:active{transform:translateY(2px)}
.frm .st{position:absolute;left:0;right:0;bottom:-20px;font:400 15px/1 'Star',sans-serif;text-align:center}
.frm.gold{background:#c99a2e;box-shadow:inset 0 0 0 2px #7a5a12,inset 0 0 0 5px #f2d27a,0 0 18px 4px rgba(255,210,90,.6),0 4px 8px rgba(40,20,5,.35)}
#end .frm{cursor:default}
#end .gal{row-gap:34px}
#endH.gold{color:#c79a1c}
.frm.lock{cursor:default;filter:saturate(.5) brightness(.92)}
.frm.lock canvas{background:#ece4d2}
.frm.lock::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 42px/1 'Star',sans-serif;color:#c9b996}
#sel .sheet{width:min(860px,96vw)}
#selPc{display:block;width:100%;aspect-ratio:1024/572;background:#eee6d6;border-radius:2px;box-shadow:0 3px 8px rgba(40,20,5,.3)}
.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:14px}
.sw{position:relative;border:0;padding:0;cursor:pointer;aspect-ratio:1/1.25;border-radius:4px;background:var(--paper);box-shadow:0 3px 0 #c8b892,inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.sw canvas{width:100%;aspect-ratio:1;display:block}
.sw b{display:block;font:400 13px/1 'Star',sans-serif;color:#c79a1c;margin-top:-2px;letter-spacing:-1px}
.sw.lock{cursor:default;opacity:.45}
.sw.next{box-shadow:0 3px 0 #c8b892,0 0 0 3px var(--red)}
.sw:active{transform:translateY(2px)}
/* 카드 셋 */
.cards{display:flex;gap:18px;justify-content:center;perspective:900px}
.card{position:relative;width:160px;height:224px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.34,1.3,.64,1)}
.card .f,.card .b{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.card .b{background:#e9dcbc;box-shadow:0 5px 0 #b7a377,0 8px 16px rgba(40,20,5,.35);
  background-image:radial-gradient(circle at 30% 30%,#d8473a 0 11%,transparent 12%),radial-gradient(circle at 70% 34%,#f2c230 0 11%,transparent 12%),radial-gradient(circle at 50% 66%,#2f63b8 0 11%,transparent 12%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.4),transparent 70%)}
.card .f{transform:rotateY(180deg);background:var(--paper);box-shadow:0 5px 0 #c8b892,0 8px 16px rgba(40,20,5,.35);padding:12px}
.card .f canvas{width:110px;height:110px}
.card .f .n{font:400 19px/1.1 'Star',sans-serif;text-align:center}
.card .f .e{font:700 14px/1 'Pj',sans-serif;color:#fff;background:var(--ink);padding:5px 9px;border-radius:12px}
.card.open{transform:rotateY(180deg)}
.card.gold .f{background:linear-gradient(160deg,#fff6d0,#f2d27a);box-shadow:0 5px 0 #a5781a,0 0 0 4px #e8c25a,0 0 26px 6px rgba(255,210,90,.75)}
.card.gold .b{box-shadow:0 5px 0 #b7a377,0 0 22px 6px rgba(255,210,90,.85)}
.card.new .f::before{content:'NEW';position:absolute;top:8px;right:8px;padding:3px 6px;font:400 13px/1 'Star',sans-serif;color:#fff;background:var(--red);border-radius:2px}
.card:hover{transform:translateY(-6px)}
.card.open:hover{transform:rotateY(180deg) translateY(-6px)}
.card.dimmed .f{opacity:.35}
#stars{display:flex;gap:10px;justify-content:center;margin:-4px 0 14px}
#stars i{width:38px;height:38px;background:#d9ccaa;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transform:scale(.6);opacity:.5;transition:transform .35s cubic-bezier(.34,1.8,.64,1),opacity .2s}
#stars i.on{background:#f2b81e;transform:scale(1);opacity:1}
/* 도감 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;max-width:820px}
.it{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 10px;border-radius:4px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);font:700 13px/1.15 'Pj',sans-serif;text-align:center}
.it canvas{width:64px;height:64px}
.it.unk canvas{filter:brightness(0) opacity(.22)}
.it.gold{background:rgba(255,226,140,.55);box-shadow:inset 0 0 0 2px #e8c25a}
.cnt{font:400 22px/1 'Star',sans-serif;opacity:.8}
#dexG{grid-template-columns:repeat(6,minmax(0,1fr));max-width:none;width:min(820px,86vw)}
#dexG .it canvas{width:min(64px,72%);height:auto;aspect-ratio:1}
#mixes{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px;margin-top:14px}
#mixes i{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.25)}
#mixes i.unk{background:#e3d9c2!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sub{font:400 22px/1 'Star',sans-serif;margin:18px 0 0}
/* 가로: 가방은 판 오른쪽 세로 줄 */
@media (min-aspect-ratio:1/1){
  #rhs{flex-direction:row;align-items:center;gap:12px}
  #items{flex-direction:column;flex-wrap:wrap;max-height:100%;min-height:0;min-width:58px;max-width:none;align-content:flex-start}
}
/* 게임 설명(처음 한 번 + ? 단추) */
#how .sheet{width:min(1040px,96vw)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.steps.one{grid-template-columns:minmax(0,420px);justify-content:center}
.steps.one .step:not(#step4){display:none}
.steps.one .step b{display:none}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.step canvas{width:100%;max-width:100%;aspect-ratio:11/8;display:block;border-radius:4px;background:#f1e6cc;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.step p{margin:0;font:700 17px/1.35 'Pj',sans-serif;text-align:center;word-break:keep-all}
.step b{font:400 22px/1 'Star',sans-serif;color:var(--red)}
.tog .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 22px/1 'Star',sans-serif;color:#fff}
/* 폰 세로 */
@media (max-aspect-ratio:1/1){
  #play{flex-direction:column;justify-content:flex-start;gap:12px;top:calc(56px + env(safe-area-inset-top))}
  #lhs{flex:0 0 auto;width:100%;flex-direction:row;align-items:center;gap:10px}
  #pcw{flex:1;min-width:0}
  #goal{flex-direction:column;gap:8px}
  #chip{flex-direction:column;padding:8px;gap:6px}#gc{width:58px;height:58px}#chip .lb{align-items:center}
  #mv{font-size:26px}
  .gal{grid-template-columns:repeat(2,1fr);gap:24px 14px}
  #dexG{gap:6px;width:auto}#dexG .it{padding:6px 2px 7px;font-size:10px;gap:4px}
  .steps{grid-template-columns:minmax(0,1fr);gap:12px}.step{flex-direction:row;gap:12px}.step canvas{width:46%;flex:0 0 46%}.step p{text-align:left;font-size:15px}
  .chips{grid-template-columns:repeat(5,1fr)}
  .cards{gap:8px}.card{width:29vw;height:42vw}.card .f canvas{width:20vw;height:20vw}.card .f .n{font-size:3.8vw}.card .f .e{font-size:3vw}
  #topbar{padding-left:calc(104px + env(safe-area-inset-left))}
}
/* 폰 가로 */
@media (max-height:480px) and (min-aspect-ratio:1/1){
  #title{padding-bottom:0;justify-content:flex-start;padding-top:calc(16vh + env(safe-area-inset-top))}
  #title .btns{order:1}
  #logo{order:2;font-size:20vh;-webkit-text-stroke:9px var(--ink);margin-top:3vh}
  #tPaint{top:auto;bottom:-22vh;width:70vh;transform:translate(-50%,0) rotate(-1.2deg);opacity:.95}
  .btn{min-height:12vh;font-size:5.4vh;min-width:22vh}
  .btn.alt{font-size:4.6vh}
  .btn.sm{min-height:10vh;font-size:4.2vh}
  .scr{padding:calc(40px + env(safe-area-inset-top)) 12px calc(46px + env(safe-area-inset-bottom))}
  .sheet{padding:4vh 18px 3.4vh}
  .sheet h2{font-size:7vh;margin-bottom:2vh}
  .row{margin-top:2.6vh}
  .card{width:28vh;height:40vh}.card .f canvas{width:17vh;height:17vh}.card .f .n{font-size:4vh}.card .f .e{font-size:3vh}
  #stars i{width:7vh;height:7vh}
  .gal{gap:5vh 14px}
  #dexG{width:min(560px,74vw);gap:1.2vh 8px}#dexG .it{padding:.6vh 2px .8vh;gap:.4vh;font-size:2.8vh}#dexG .it canvas{width:8.5vh}
  #mixes{grid-template-columns:repeat(auto-fill,minmax(5vh,1fr));gap:1vh}.sub{font-size:4.4vh;margin-top:2vh}
  .step p{font-size:3.3vh}.step b{font-size:4.6vh}.step canvas{width:auto;height:27vh}.steps{gap:2vh}
  .frm .st{font-size:3.4vh;bottom:-4.4vh}
  #play{top:calc(46px + env(safe-area-inset-top))}
  #chip{padding:5px 12px 5px 5px}#gc{width:13vh;height:13vh}#mv{font-size:7vh}#chip .lb span{font-size:4vh}
  .itm{width:11vh;height:12vh}.itm canvas{width:9vh;height:9vh}
  #items{min-width:11vh}
  .stat{height:30px;font-size:15px}
  .tog{width:36px;height:36px}
}
</style>
</head>
<body>
<div id="title">
  <div class="paper" id="tPaint"><canvas id="tPc" width="1024" height="572" style="display:block;width:100%"></canvas></div>
  <div class="btns" id="tBtns"></div>
  <div id="logo">색깔섞기<i>퍼즐게임</i></div>
</div>
<div id="topbar" class="hide">
  <span class="stat" id="sStage" style="--c:#2f63b8"><b id="stgN">1-1</b></span>
  <span class="spacer"></span>
  <button class="tog" id="tHow" aria-label="how to play"><span class="q">?</span></button>
  <button class="tog" id="tPause" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#fff"/></svg></button>
  <button class="tog" id="tBgm" aria-label="music"><svg viewBox="0 0 24 24"><path d="M9 17.5V5.5l11-2.5v12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="6.3" cy="17.8" rx="3.4" ry="2.7" fill="#fff"/><ellipse cx="17.3" cy="15.3" rx="3.4" ry="2.7" fill="#fff"/></svg></button>
  <button class="tog" id="tSfx" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</div>
<div id="play" class="hide">
  <div id="lhs">
    <div class="paper" id="pcw"><canvas id="pc" width="1024" height="572"></canvas></div>
    <div id="goal">
      <div id="chip"><canvas id="gc" width="148" height="148"></canvas><div class="lb"><span>MOVES</span><b id="mv">5</b></div></div>
      <div id="ctl">
        <button class="tog" id="bUndo" aria-label="undo"><svg viewBox="0 0 24 24"><path d="M9 7H4.5V2.5M4.8 7A8 8 0 1 1 4 13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="tog" id="bRe" aria-label="retry"><svg viewBox="0 0 24 24"><path d="M15 7h4.5V2.5M19.2 7A8 8 0 1 0 20 13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
  <div id="rhs">
    <canvas id="bc"></canvas>
    <div id="items"></div>
  </div>
</div>
<div id="big"></div>

<div class="scr dim hide" id="gal"><div class="sheet"><i class="clip"></i><div class="hd"><h2>GALLERY</h2><div class="hb"><button class="btn alt sm" id="bDex" style="--c:#f2c230">도감</button><button class="btn alt sm" id="bGalX" style="--c:#2f63b8">처음으로</button></div></div><div class="gal" id="galG"></div><div style="height:24px"></div></div></div>
<div class="scr dim hide" id="sel"><div class="sheet"><i class="clip"></i><div class="hd"><h2 id="selH">1</h2><div class="hb"><button class="btn sm" id="bSelGo">START</button><button class="btn alt sm" id="bSelX" style="--c:#2f63b8">GALLERY</button></div></div><canvas id="selPc" width="1024" height="572"></canvas><div class="chips" id="chips"></div></div></div>
<div class="scr dim hide" id="pick"><div class="sheet"><i class="clip"></i><h2 id="pickH">CLEAR</h2><div id="stars"><i></i><i></i><i></i></div><div class="cards" id="cards"></div><div class="row"><button class="btn hide" id="bPickOk">NEXT</button></div></div></div>
<div class="scr dim hide" id="dex"><div class="sheet"><i class="clip"></i><div class="hd"><h2>도감</h2><span class="cnt" id="dexN"></span><div class="hb"><button class="btn sm" id="bDexX">OK</button></div></div><div class="grid" id="dexG"></div><div class="sub" id="mixH"></div><div id="mixes"></div></div></div>
<div class="scr dim hide" id="how"><div class="sheet"><i class="clip"></i><div class="hd"><h2>HOW TO PLAY</h2><div class="hb"><button class="btn sm" id="bHowOk">OK</button></div></div><div class="steps">
  <div class="step"><canvas width="440" height="320"></canvas><p><b>1</b><br>방울을 밀면 미끄러져 가다가 부딪힌 방울과 섞여요</p></div>
  <div class="step"><canvas width="440" height="320"></canvas><p><b>2</b><br>견본과 같은 색을 MOVES 안에 만들어요<br>아래 점은 들어갈 물감이에요</p></div>
  <div class="step"><canvas width="440" height="320"></canvas><p><b>3</b><br>만든 색으로 그림이 칠해져요</p></div>
  <div class="step" id="step4"><canvas width="440" height="320"></canvas><p><b>4</b><br>받은 카드는 판 옆 가방에 들어가요<br>카드를 누르고 방울을 눌러 써요<br>물 컵·황금 붓은 누르면 바로 써져요</p></div>
</div></div></div>
<div class="scr dim hide" id="pause"><div class="sheet"><i class="clip"></i><h2>PAUSE</h2><div class="row"><button class="btn" id="bResume">RESUME</button><button class="btn alt" id="bQuit" style="--c:#2f63b8">GALLERY</button></div></div></div>
<div class="scr dim hide" id="over"><div class="sheet"><i class="clip"></i><h2>GAME OVER</h2><div class="row"><button class="btn" id="bRetry">RETRY</button><button class="btn alt" id="bOverUndo" style="--c:#f2c230">UNDO</button></div></div></div>
<div class="scr dim hide" id="done"><div class="sheet"><i class="clip"></i><h2>COMPLETE</h2><div class="paper" style="transform:rotate(1deg)"><canvas id="donePc" width="1024" height="572" style="display:block;width:min(720px,80vw)"></canvas></div><div class="row"><button class="btn" id="bDoneOk">NEXT</button></div></div></div>

<div class="scr hide" id="end" style="background:rgba(30,18,8,.65)"><div class="sheet"><i class="clip"></i><div class="hd"><h2 id="endH">THE END</h2><div class="hb"><button class="btn sm" id="bEndOk">OK</button></div></div><div class="gal" id="endG"></div><div style="height:22px"></div></div></div>

<script src="js/levels.js?v=2"></script>
<script src="js/masks.js?v=2"></script>
<script src="js/data.js?v=2"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/art.js?v=2"></script>
<script src="js/game.js?v=12"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js" defer></script>
</body>
</html>
