<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c2a1a">
<title>병아리 일이병구하기</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Melody';src:url('fonts/HiMelody-title.woff2?v=3') format('woff2');font-display:swap}   /* Hi Melody (OFL) — 제목 글자 부분집합 */
@font-face{font-family:'Ria';src:url('fonts/RiaSans-ExtraBold.woff2') format('woff2');font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1c2a1a;
  font-family:'Ria',-apple-system,'Malgun Gothic',sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* ---------- 상단바 (스카이라이더 배치) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;pointer-events:none;
  padding:6px 8px 20px calc(104px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
body.title #topbar .stat{visibility:hidden}
.stat{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);
  border-radius:999px;padding:5px 10px;font-size:15px}
.stat i{font-style:normal;font-size:13px}
.stat b{font-size:17px;font-weight:400;letter-spacing:.3px}
.bar{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>span{display:block;height:100%;width:100%;border-radius:3px}
#fbar{width:56px;height:7px;border-radius:4px}
#fbar>span{background:#ff8266;transition:width .3s}
#hearts{letter-spacing:2px;font-size:16px;color:#ff5a5a}
.spacer{flex:1 1 20px}
.tog{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(0,0,0,.4);color:#fff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;position:relative;font-family:inherit;touch-action:manipulation}
.tog.off{opacity:.4}
.tog.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;
  background:#fff;transform:rotate(-45deg);border-radius:1px}
@media (max-width:700px){.stat b{font-size:15px}.stat{padding:5px 8px;gap:5px}#topbar{gap:5px}}

/* ---------- 폰 조작: 왼쪽 패드 · 오른쪽 단추 ---------- */
#pad{position:fixed;z-index:25;left:calc(18px + env(safe-area-inset-left));bottom:64px;width:186px;height:186px;border-radius:50%;
  background:rgba(0,0,0,.38);display:none;touch-action:none;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;
  background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.55)}
body.touch #pad{display:block}
@media (max-height:420px){#pad{width:160px;height:160px;bottom:56px}}
.tbtn{position:fixed;z-index:25;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.32);
  display:none;place-items:center;color:#fff;touch-action:none;pointer-events:auto;font-family:inherit}
.tbtn.on{background:#ffd35a;border-color:#fff;color:#000}
body.touch .tbtn{display:grid}
#bJump{right:calc(18px + env(safe-area-inset-right));bottom:22px;width:88px;height:88px;font-size:22px}
#bPeck{right:calc(118px + env(safe-area-inset-right));bottom:18px;width:60px;height:60px;font-size:18px}
body.touch #keys{display:none}
#keys{position:fixed;right:12px;bottom:10px;z-index:20;font-size:13px;color:rgba(255,255,255,.5);pointer-events:none}
body.title #keys, body.title #pad, body.title .tbtn{visibility:hidden}

/* ---------- 큰 글자 판 ---------- */
.panel{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.panel.on{display:flex}
.panel h1{font-family:'Ria',sans-serif;font-weight:400;line-height:1;text-align:center;
  color:#fff;-webkit-text-stroke:2px #2a1a06;text-shadow:0 6px 0 #2a1a06,0 12px 30px rgba(0,0,0,.5)}
.panel .num{font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6);text-align:center;line-height:1.5}
.btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;font-size:30px;color:#fff;
  background:#d9432c;padding:12px 46px;border-radius:999px;letter-spacing:.06em;
  box-shadow:0 7px 0 #6e1a0e,0 14px 30px rgba(0,0,0,.35);touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #6e1a0e}
.btn.sub{font-size:20px;padding:9px 30px;background:#3d5a36;box-shadow:0 5px 0 #1d2e19,0 10px 24px rgba(0,0,0,.3)}
.btn.sub:active{box-shadow:0 1px 0 #1d2e19}

#title{justify-content:flex-start;padding-top:7vh;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 55%)}
#title h1{font-family:'Melody','Ria',sans-serif;font-size:clamp(64px,11vw,150px);white-space:nowrap;line-height:.95;color:#fff7e6;
  -webkit-text-stroke:9px #7a2e12;paint-order:stroke fill;text-shadow:0 5px 0 #7a2e12,0 0 40px rgba(0,0,0,.6);letter-spacing:.02em;font-weight:700}
#title .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#title .best{font-size:17px;color:#ffe9c2;opacity:.9;text-shadow:0 2px 0 #000}

#stage h1{font-size:clamp(70px,14vw,130px);color:#fff7e6;animation:pop .35s ease-out}
#clear h1{font-size:clamp(80px,16vw,150px);color:#ffe066;animation:pop .35s ease-out}
#over h1{font-size:clamp(80px,16vw,150px);color:#ff5a3a;animation:pop .35s ease-out}
#ending h1{font-family:'Melody','Ria',sans-serif;font-size:clamp(80px,14vw,170px);color:#fff7e6;-webkit-text-stroke:9px #7a2e12;paint-order:stroke fill;text-shadow:0 6px 0 #7a2e12}
#over,#clear{background:rgba(10,8,4,.4)}
#ending{justify-content:flex-start;padding-top:6vh;background:linear-gradient(180deg,rgba(10,6,20,.3),rgba(0,0,0,0) 45%,rgba(0,0,0,.3));animation:fadein 1.6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#pause{background:rgba(10,10,10,.55)}
#pause .btn{font-size:40px;padding:10px 40px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.found{font-size:22px;letter-spacing:.05em}
.found span{margin:0 8px}

/* 지도(스테이지 고르기) */
#map{background:rgba(12,18,10,.82);justify-content:flex-start;padding-top:64px;gap:8px;pointer-events:auto;overflow:auto}
#map h2{font-size:26px;font-weight:400;color:#ffe9c2;text-shadow:0 2px 0 #000}
#grid{display:grid;grid-template-columns:repeat(10,44px);gap:6px}
.cell{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;
  font-size:15px;color:#fff;border:2px solid transparent;cursor:pointer;position:relative;font-family:inherit}
.cell.done{background:#3d5a36}
.cell.cur{border-color:#ffd35a}
.cell.lock{opacity:.35;cursor:default}
.cell em{position:absolute;right:-3px;top:-6px;font-style:normal;font-size:12px}
.cell em.miss{opacity:.35;filter:grayscale(1)}
@media (max-width:560px){#grid{grid-template-columns:repeat(10,32px);gap:4px}.cell{width:32px;height:32px;font-size:12px;border-radius:8px}}

/* ---------- 떠오르는 글 ---------- */
#pops{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-size:26px;color:#fff;-webkit-text-stroke:1px #2a1a06;text-shadow:0 3px 0 #2a1a06;
  animation:up .9s ease-out forwards;white-space:nowrap}
.pop.big{font-size:56px;color:#ffe066;-webkit-text-stroke:2px #4a3000;text-shadow:0 5px 0 #4a3000;animation-duration:1.2s}
.pop.heal{color:#9be15d;-webkit-text-stroke:1px #1d3a0a;text-shadow:0 3px 0 #1d3a0a}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* ---------- 가로로 돌리기 (폰 세로일 때만) ---------- */
#rotate{position:fixed;inset:0;z-index:90;display:none;place-items:center;text-align:center;
  background:#1c2a1a;color:#f2ede4;font-size:17px;line-height:1.8;padding:8vw;pointer-events:auto}
body.touch.portrait #rotate{display:grid}
#rotate button{margin:22px 0 16px;padding:15px 32px;border:0;border-radius:99px;cursor:pointer;
  font-family:inherit;font-size:17px;color:#fff;background:#d9432c}
#rotate .sub{font-size:14px;color:#b9b2a2;line-height:1.7}
#rotate .sub a{color:#e8e2d2}
</style>
</head>
<body class="title">

<canvas id="cv"></canvas>

<div id="topbar">
  <div class="stat"><b id="stg">STAGE 1</b></div>
  <div class="stat"><b id="hearts">❤❤❤</b></div>
  <div class="stat" id="fstat"><i>🍗</i><span class="bar" id="fbar"><span></span></span></div>
  <div class="stat"><i>🐥</i><b id="chk">0</b></div>
  <div class="spacer"></div>
  <button class="tog" id="tPause" title="일시정지">❚❚</button>
  <button class="tog" id="tMus" title="음악">♪</button>
  <button class="tog" id="tSnd" title="효과음">🔊</button>
</div>

<div id="pops"></div>
<div id="pad"><div id="knob"></div></div>
<button class="tbtn" id="bJump">JUMP</button>
<button class="tbtn" id="bPeck">PECK</button>
<div id="keys">←→ 이동 · Shift 달리기 · 스페이스 점프(누르면 활강) · X 쪼기</div>

<div class="panel" id="title">
  <h1 id="h1">병아리 일이병구하기</h1>
  <div class="row">
    <button class="btn" id="start">START</button>
    <button class="btn sub" id="mapBtn">지도</button>
  </div>
  <div class="best" id="best"></div>
</div>
<div class="panel" id="stage"><h1 id="stageT">STAGE 1</h1></div>
<div class="panel" id="clear"><h1>CLEAR</h1><div class="num" id="clearN"></div><div class="found" id="clearF"></div><button class="btn" id="next">NEXT</button></div>
<div class="panel" id="over"><h1>GAME OVER</h1><div class="num" id="overN"></div><button class="btn" id="retry">RETRY</button></div>
<div class="panel" id="ending"><h1 id="endH">집</h1><div class="num" id="endN"></div><button class="btn" id="endNext">THE END</button></div>
<div class="panel" id="pause"><button class="btn" id="resume">▶</button></div>
<div class="panel" id="map"><h2 id="mapH">지도</h2><div id="grid"></div><button class="btn sub" id="mapClose">닫기</button></div>

<div id="rotate">
  <div>
    <p id="rotTitle">가로 화면에서 하는 게임입니다</p>
    <button type="button" id="rotGo">가로로 돌리기</button>
    <p class="sub"><span id="rotHelp">단추가 안 먹으면 폰의 화면 회전 잠금을 풀고 눕혀 주세요</span><br>
      <a href="#" id="rotSkip">그래도 세로로 하기</a></p>
  </div>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="assets/landscape.js?v=4"></script>
<script src="js/sheet.js?v=1"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/art.js?v=11"></script>
<script src="js/game.js?v=26"></script>
<script src="/assets/visit.js?v=17" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
