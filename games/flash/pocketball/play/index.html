<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>포켓볼</title>
<style>
/* 단추 소재 = 당구장 물건
   주 단추: 파란 초크 큐브(가루 묻은 네모, 윗면 가운데가 닳아 파임) · 보조: 큐 끝 메이플 나무(흑단 V 끼움 + 흰 링)
   상단 알약: 짙은 호두나무 점수판 · 둥근 단추: 흰 수구(빨간 점) · 창: 마호가니 레일 테 + 초록 펠트 + 자개 다이아몬드 */
@font-face{font-family:'Ttl';src:url('fonts/title.woff2?v=7') format('woff2');font-display:block}
@font-face{font-family:'Ui';src:url('fonts/ui.woff2?v=7') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Ui';src:url('fonts/uib.woff2?v=7') format('woff2');font-weight:900;font-display:swap}
:root{--chalk:#2f6fd0;--chalkD:#1a3f86;--chalkL:#7fb0ff;--maple:#e9cf9c;--mapleD:#b98e52;--ebony:#16100c;--maho:#5a2414;--mahoD:#2e0f06;--felt:#1f6a42;--feltD:#124a2d;--pearl:#f4efe6;--gold:#f2c75a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0807;color:#fff;font-family:'Ui',-apple-system,'Malgun Gothic',sans-serif;font-weight:700;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- 주 단추: 파란 초크 큐브 ---------- */
.btn{position:relative;border:0;cursor:pointer;font:900 24px/1 'Ui',sans-serif;white-space:nowrap;color:#fff;padding:14px 30px;min-width:150px;border-radius:9px;
  background:radial-gradient(ellipse 46% 40% at 50% 46%,rgba(10,30,80,.45),rgba(10,30,80,0) 70%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,0) 2px 6px),
    linear-gradient(180deg,#5a94ec 0%,var(--chalk) 46%,#2459b4 100%);
  text-shadow:0 2px 0 #102a5e,0 0 6px rgba(160,200,255,.4);
  box-shadow:inset 0 0 0 3px #173a7a,inset 0 4px 0 rgba(200,225,255,.55),inset 0 -5px 0 rgba(0,0,40,.25),0 5px 0 #0f2856,0 9px 14px rgba(0,0,0,.45);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,filter .15s}
.btn::before{content:'';position:absolute;inset:3px;border-radius:7px;pointer-events:none;opacity:.55;   /* 초크 가루 얼룩 */
  background:radial-gradient(circle at 18% 30%,rgba(255,255,255,.35) 0 2px,transparent 3px),radial-gradient(circle at 76% 70%,rgba(255,255,255,.3) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 60% 22%,rgba(255,255,255,.25) 0 1px,transparent 2px),radial-gradient(circle at 30% 78%,rgba(255,255,255,.22) 0 1px,transparent 2px)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:inset 0 0 0 3px #173a7a,inset 0 4px 0 rgba(200,225,255,.55),inset 0 -5px 0 rgba(0,0,40,.25),0 2px 0 #0f2856;transition-duration:.04s}
/* 보조 단추: 큐 끝 메이플(오른쪽에 흑단 V 끼움 + 흰 링) */
.btn.wood{color:#3a220c;text-shadow:0 1px 0 rgba(255,240,210,.7);padding-right:46px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.12)),
    repeating-linear-gradient(92deg,rgba(150,100,40,.08) 0 3px,rgba(0,0,0,0) 3px 9px),var(--maple);
  box-shadow:inset 0 0 0 3px #6a4320,inset 0 4px 0 rgba(255,255,255,.5),0 5px 0 #4a2c12,0 9px 14px rgba(0,0,0,.45)}
.btn.wood::before{opacity:1;inset:3px 3px 3px auto;width:40px;border-radius:0 6px 6px 0;   /* 큐 앞쪽: 흑단이 메이플 안으로 뾰족하게 파고든 포인트 + 흰 링 */
  background:linear-gradient(90deg,transparent 0 62%,#f6f1e4 62% 68%,transparent 68%),linear-gradient(180deg,#2a1c14,var(--ebony));clip-path:polygon(100% 0,100% 100%,52% 100%,0 50%,52% 0)}
.btn.wood:active{box-shadow:inset 0 0 0 3px #6a4320,inset 0 4px 0 rgba(255,255,255,.5),0 2px 0 #4a2c12}
.btn.sm{font-size:19px;padding:10px 18px;min-width:96px}
.btn.wood.sm{padding-right:40px}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:default}

/* ---------- 상단바: 호두나무 점수판 ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(104px + env(safe-area-inset-left))}
.plate{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;min-height:38px;border-radius:8px;white-space:nowrap;min-width:0;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,0) 50%),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,rgba(0,0,0,0) 2px 7px),linear-gradient(180deg,#4a2a18,#2a170c);
  box-shadow:inset 0 0 0 2px #1a0c05,inset 0 0 0 3px #7a4a28,0 3px 0 #120802;transition:box-shadow .2s,transform .2s}
.plate .nm{font-size:16px;color:#f2e2c8;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.plate .wins{font:400 19px/1 'Ttl',sans-serif;color:var(--gold);min-width:1.2em;text-align:center}
.plate.on{box-shadow:inset 0 0 0 2px #1a0c05,inset 0 0 0 3px var(--gold),0 3px 0 #120802,0 0 14px rgba(242,199,90,.55)}
.plate.on::after{content:'';position:absolute;left:50%;bottom:-6px;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.rack{display:flex;gap:2px}
.rack i{width:15px;height:15px;border-radius:50%;display:block;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45),inset 1px 1px 2px rgba(255,255,255,.5)}
.rack i.gone{opacity:.18;filter:grayscale(1)}
.rack i.st{background-clip:padding-box}
#race{font:400 15px/1 'Ui',sans-serif;color:#d8c8a8;padding:0 2px;white-space:nowrap}
.sp{flex:1 1 4px}
.tog{pointer-events:auto;position:relative;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 36% 30%,#fff 0 12%,#f2eee4 38%,#c9c2b2 78%,#8a8274 100%);box-shadow:0 3px 0 #3a3228,0 5px 8px rgba(0,0,0,.4)}
.tog::before{content:'';position:absolute;right:7px;bottom:8px;width:5px;height:5px;border-radius:50%;background:#c8202a}
.tog svg{width:20px;height:20px}
.tog .q{font:900 21px/1 'Ui',sans-serif;color:#2a2a30}
.tog:active{transform:translateY(2px);box-shadow:0 1px 0 #3a3228}
.tog.off{opacity:.6}
.tog.off::after{content:'';position:absolute;left:24%;right:24%;top:50%;height:2px;margin-top:-1px;background:#2a2a30;border-radius:1px;transform:rotate(-40deg)}
body:not(.playing) #hud,body:not(.playing) .ctl{display:none!important}
body.playing #oreumFs{display:none}

/* ---------- 조작: 왼쪽 미세 바퀴 · 오른쪽 힘 막대(큐) · 회전 공 ---------- */
.ctl{position:fixed;z-index:6;touch-action:none}
#fine{left:calc(10px + env(safe-area-inset-left));top:50%;width:46px;height:min(58vh,270px);transform:translateY(-40%);border-radius:23px;cursor:ns-resize;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.12) 45%,rgba(0,0,0,.6)),repeating-linear-gradient(180deg,#2a1d14 0 5px,#0e0906 5px 9px);
  box-shadow:inset 0 0 0 3px #0a0604,0 0 0 2px #7a4a28,0 4px 10px rgba(0,0,0,.6)}
#fine::before,#fine::after{content:'';position:absolute;left:50%;width:0;height:0;margin-left:-7px;border:7px solid transparent}
#fine::before{top:-18px;border-bottom-color:#d8c8a8}#fine::after{bottom:-18px;border-top-color:#d8c8a8}
#powerW{right:calc(12px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#power{position:relative;width:56px;height:min(56vh,280px);border-radius:12px;cursor:ns-resize;overflow:hidden;
  background:linear-gradient(90deg,#0a0604,#241812 50%,#0a0604);box-shadow:inset 0 0 0 3px #0a0604,0 0 0 2px #7a4a28,0 4px 10px rgba(0,0,0,.6)}
#pfill{position:absolute;left:6px;right:6px;top:6px;height:0;border-radius:6px;background:linear-gradient(180deg,#5ad06a,#f2c75a 55%,#e8502a)}
#pcue{position:absolute;left:50%;top:6px;width:14px;margin-left:-7px;height:calc(100% - 12px);border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,#2f6fd0 0 4%,#f4f0e6 4% 8%,var(--maple) 8% 62%,#c8c0b0 62% 64%,#5a2a14 64% 82%,#1a1a1a 82%);
  box-shadow:inset -3px 0 4px rgba(0,0,0,.35),inset 2px 0 2px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.6)}
#pnum{font:400 17px/1 'Ttl',sans-serif;color:var(--gold);min-height:17px}
#spin{width:62px;height:62px;border-radius:50%;cursor:pointer;position:relative;flex:none;outline:3px solid rgba(242,199,90,.75);outline-offset:3px;
  background:radial-gradient(circle at 36% 30%,#fff 0 12%,#f2eee4 40%,#c9c2b2 80%,#8a8274 100%);box-shadow:0 3px 0 #3a3228,0 5px 8px rgba(0,0,0,.5)}
#spin::before,#spinBig::before{content:'';position:absolute;left:50%;top:12%;bottom:12%;width:1px;background:rgba(0,0,0,.18)}
#spin::after,#spinBig::after{content:'';position:absolute;top:50%;left:12%;right:12%;height:1px;background:rgba(0,0,0,.18)}
#sdot,#sdotB{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#d8202a;left:50%;top:50%;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.5);z-index:1}
#spinPop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#spinBig{position:relative;width:min(240px,62vmin);height:min(240px,62vmin);border-radius:50%;cursor:crosshair;
  background:radial-gradient(circle at 36% 30%,#fff 0 12%,#f2eee4 42%,#c9c2b2 82%,#8a8274 100%);box-shadow:0 8px 0 #3a3228,0 12px 30px rgba(0,0,0,.6)}
#sdotB{width:26px;height:26px;margin:-13px 0 0 -13px;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.5)}
body.port #fine{left:auto;right:auto;top:auto;transform:none;left:calc(12px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:calc(38vw - 34px);height:46px;cursor:ew-resize;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(255,255,255,.12) 45%,rgba(0,0,0,.6)),repeating-linear-gradient(90deg,#2a1d14 0 5px,#0e0906 5px 9px)}
body.port #fine::before,body.port #fine::after{display:none}
body.port #powerW{top:auto;transform:none;right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));flex-direction:row-reverse;gap:8px}
body.port #power{width:calc(62vw - 64px);height:54px;cursor:ew-resize}
body.port #pfill{top:6px;bottom:6px;right:6px;left:auto;width:0;height:auto;background:linear-gradient(270deg,#5ad06a,#f2c75a 55%,#e8502a)}
body.port #pcue{left:6px;top:50%;width:calc(100% - 12px);height:14px;margin:-7px 0 0 0;border-radius:3px 7px 7px 3px;
  background:linear-gradient(90deg,#1a1a1a 0 18%,#5a2a14 18% 36%,#c8c0b0 36% 38%,var(--maple) 38% 92%,#f4f0e6 92% 96%,#2f6fd0 96%)}
body.port #pnum{position:absolute;right:6px;top:-22px;text-align:right}
body.port #spin{width:50px;height:50px;align-self:center}
.ctl.dim{opacity:.35;pointer-events:none}
/* 흰 공 옮기기 표시(10/15 사장님 "상대파울일때 흰공을 움직일수있는걸 화면에 표시해줘"): 흰 공 둘레 네 방향 화살표 + 끌어서 옮겨요 */
#hand{position:fixed;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none}
#hand i{position:absolute;left:0;top:0;font:900 20px/1 'Ui',sans-serif;color:#f2c75a;text-shadow:0 0 4px #000,0 0 2px #000;font-style:normal;animation:hpulse .9s ease-in-out infinite}
#hand .u{transform:translate(-50%,calc(-100% - var(--r)))}#hand .d{transform:translate(-50%,var(--r))}
#hand .l{transform:translate(calc(-100% - var(--r)),-50%)}#hand .r{transform:translate(var(--r),-50%)}
@keyframes hpulse{50%{opacity:.35}}
#hand b{position:absolute;left:0;top:0;transform:translate(-50%,calc(var(--r) + 26px));white-space:nowrap;padding:6px 10px;border-radius:8px;font:900 15px/1 'Ui',sans-serif;color:#2a1a08;
  background:linear-gradient(180deg,#ffe59a,#f2c75a);box-shadow:0 3px 0 #8a6410,0 5px 10px rgba(0,0,0,.45)}
#hand.up b{transform:translate(-50%,calc(-100% - var(--r) - 30px))}

/* 큐 막대 가리키기(10/15 사장님 "이거를 더 잘보이게 가리켜줘"): 처음 다섯 번 칠 때까지 금색으로 깜빡 + 아래로 흐르는 화살표 + 당겨서 쳐요 알림 */
#ptip,#parrow{display:none}
#powerW.hint #power{animation:pglow 1.1s ease-in-out infinite}
@keyframes pglow{50%{box-shadow:inset 0 0 0 3px #0a0604,0 0 0 3px #f2c75a,0 0 22px 6px rgba(242,199,90,.85)}}
#parrow .h{display:none}body.port #parrow .v{display:none}body.port #parrow .h{display:inline}
#powerW.hint #parrow{display:block;position:absolute;left:0;right:0;top:12%;text-align:center;font:900 24px/1 'Ui',sans-serif;color:#f2c75a;text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:none;animation:pdown 1.1s ease-in infinite}
@keyframes pdown{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(120px);opacity:0}}
#powerW.hint #ptip{display:block;position:absolute;right:calc(100% + 12px);top:36%;white-space:nowrap;padding:8px 12px;border-radius:9px;font:900 16px/1 'Ui',sans-serif;color:#2a1a08;pointer-events:none;
  background:linear-gradient(180deg,#ffe59a,#f2c75a);box-shadow:0 3px 0 #8a6410,0 6px 14px rgba(0,0,0,.5);animation:pnudge 1.1s ease-in-out infinite}
#powerW.hint #ptip::after{content:'';position:absolute;left:100%;top:50%;margin-top:-7px;border:7px solid transparent;border-left-color:#f2c75a}
@keyframes pnudge{50%{transform:translateX(6px)}}
#powerW{position:fixed}
body.port #powerW.hint #parrow{top:50%;margin-top:-12px;left:auto;right:8%;animation:pleft 1.1s ease-in infinite}
@keyframes pleft{0%{transform:translateX(0);opacity:0}25%{opacity:1}100%{transform:translateX(-140px);opacity:0}}
body.port #powerW.hint #ptip{right:auto;left:50%;top:auto;bottom:calc(100% + 26px);transform:translateX(-50%);animation:pnudgeY 1.1s ease-in-out infinite}
body.port #powerW.hint #ptip::after{left:50%;top:100%;margin:0 0 0 -7px;border-left-color:transparent;border-top-color:#f2c75a}
@keyframes pnudgeY{50%{transform:translate(-50%,6px)}}


#msg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(1);font:400 76px/1 'Ttl',sans-serif;color:#fff;white-space:nowrap;
  -webkit-text-stroke:7px #12301e;paint-order:stroke fill;text-shadow:0 6px 0 #0a1c10,0 0 26px rgba(242,199,90,.75);pointer-events:none;z-index:8;opacity:0}
#msg.show{animation:msgIn 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes msgIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}24%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#msg.gold{color:var(--gold)}#msg.red{color:#ff7a5a}
.pop{position:fixed;z-index:7;pointer-events:none;font:400 30px/1 'Ttl',sans-serif;color:#fff;-webkit-text-stroke:5px #12301e;paint-order:stroke fill;white-space:nowrap;
  transform:translate(-50%,-50%);animation:popUp 1s ease-out forwards}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#think{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;font-size:16px;color:#e8dcc4;pointer-events:none;
  padding:6px 14px;border-radius:8px;background:rgba(20,10,4,.7);box-shadow:inset 0 0 0 1px #7a4a28}

/* ---------- 창: 마호가니 레일 테 + 초록 펠트 + 자개 다이아몬드 ---------- */
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,4,2,.55)}
.sheet{position:relative;width:min(820px,100%);max-height:100%;overflow:auto;padding:22px 24px 22px;border-radius:16px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.07),rgba(0,0,0,.18) 80%),linear-gradient(180deg,var(--felt),var(--feltD));
  box-shadow:inset 0 0 0 4px #1a0a04,inset 0 0 0 12px var(--maho),inset 0 0 0 13px #7a3a1c,inset 0 0 22px 14px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.7);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.sheet{scrollbar-width:thin;scrollbar-color:#b98e52 rgba(0,0,0,.25)}
.sheet::-webkit-scrollbar{width:8px}.sheet::-webkit-scrollbar-thumb{background:#b98e52;border-radius:4px}.sheet::-webkit-scrollbar-track{background:rgba(0,0,0,.25);border-radius:4px}
.sheet>.dia{position:absolute;width:7px;height:11px;background:var(--pearl);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:.9}
.dia.a{left:30%;top:2px}.dia.b{left:50%;top:2px}.dia.c{left:70%;top:2px}.dia.d{left:30%;bottom:2px}.dia.e{left:50%;bottom:2px}.dia.f{left:70%;bottom:2px}
.hd{display:flex;align-items:center;gap:12px;margin:2px 6px 14px}
.hd h2{font:400 32px/1 'Ttl',sans-serif;color:#fff;-webkit-text-stroke:5px #0b2a18;paint-order:stroke fill;text-shadow:0 3px 0 #08200f}
.hd .cnt{font-size:18px;color:#d8efd8;flex:1}
.hd .hb{margin-left:auto;display:flex;gap:8px}

/* 타이틀 */
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px calc(4vh + env(safe-area-inset-bottom));pointer-events:none;
  background:linear-gradient(180deg,rgba(10,6,3,0) 50%,rgba(10,6,3,.6) 100%)}
#title .btn{pointer-events:auto}
#title .row{display:flex;gap:12px;justify-content:center}
#logo{font:400 clamp(64px,12vw,140px)/1 'Ttl',sans-serif;color:#fff;white-space:nowrap;letter-spacing:.02em;
  -webkit-text-stroke:10px #0b2a18;paint-order:stroke fill;text-shadow:0 8px 0 #06160c,0 0 40px rgba(242,199,90,.55)}
#logo b{color:var(--gold);font-weight:400}
html[lang=en] #logo{font-size:clamp(36px,11vw,130px);-webkit-text-stroke-width:7px}   /* 영문 POCKET BALL 은 길어서 폰 세로에서 넘치지 않게 */
body.playing #title,body.modal #title{display:none}
body.lesson #pl1,body.lesson #race,body.lesson #rk0{display:none}

/* 상대 고르기(STAGE) */
#mapGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opp{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 10px 9px 12px;border-radius:9px;text-align:left;cursor:default;border:0;color:#f2e2c8;font:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,0) 50%),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,rgba(0,0,0,0) 2px 7px),linear-gradient(180deg,#4a2a18,#2a170c);
  box-shadow:inset 0 0 0 2px #1a0c05,inset 0 0 0 3px #7a4a28,0 3px 0 #120802}
.opp .no{font:400 22px/1 'Ttl',sans-serif;color:var(--gold)}
.opp .nm{font-size:16px;line-height:1.15;word-break:keep-all}
.opp .ra{font-size:13px;color:#c8b090}
.opp.done{opacity:.72}
.opp.done::after{content:'WIN';position:absolute;right:8px;top:8px;font:400 15px/1 'Ttl',sans-serif;color:#7fe08a;transform:rotate(8deg);padding:3px 5px;border:2px solid #7fe08a;border-radius:4px}
.opp.lock{filter:grayscale(.7) brightness(.55)}
.opp.lock::after{content:'';position:absolute;right:12px;top:12px;width:14px;height:11px;border-radius:2px;background:#a89880;box-shadow:0 -7px 0 -2px transparent}
.opp.lock::before{content:'';position:absolute;right:14px;top:4px;width:10px;height:10px;border:2px solid #a89880;border-bottom:0;border-radius:6px 6px 0 0}
.opp.cur{cursor:pointer;box-shadow:inset 0 0 0 2px #1a0c05,inset 0 0 0 3px var(--gold),0 3px 0 #120802,0 0 16px rgba(242,199,90,.6);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px #1a0c05,inset 0 0 0 3px var(--gold),0 3px 0 #120802,0 0 26px rgba(242,199,90,.9)}}
.opp.cur:active{transform:translateY(2px)}

/* 결과 */
#res .sheet{width:min(560px,100%);text-align:center}
#resBig{font:400 84px/1 'Ttl',sans-serif;color:var(--gold);-webkit-text-stroke:8px #0b2a18;paint-order:stroke fill;text-shadow:0 6px 0 #06160c;margin:4px 0 10px}
#resBig.lose{color:#ff8a6a}
#resSub{font-size:22px;color:#e8f4e8;margin-bottom:6px}
#resScore{font:400 40px/1 'Ttl',sans-serif;color:#fff;margin:6px 0 16px}
#resBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* 엔딩 */
#end{background:rgba(6,4,2,.35)}
#end .sheet{width:min(640px,100%);text-align:center}
#endBig{font:400 76px/1 'Ttl',sans-serif;color:var(--gold);-webkit-text-stroke:8px #0b2a18;paint-order:stroke fill;text-shadow:0 6px 0 #06160c,0 0 30px rgba(255,210,90,.8);margin:6px 0 12px}
#endTxt{font-size:20px;line-height:1.55;color:#eaf6ea;word-break:keep-all;margin-bottom:16px}
#endTxt b{color:var(--gold)}

/* HOW TO PLAY */
#how .sheet{width:min(1000px,100%)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.step canvas{width:100%;aspect-ratio:11/8;display:block;border-radius:10px;background:#123f28;box-shadow:inset 0 0 0 3px #1a0a04,inset 0 0 0 6px var(--maho)}
.step p{font-size:17px;line-height:1.4;text-align:center;word-break:keep-all;color:#f0f8f0}
.step p b{font:400 24px/1 'Ttl',sans-serif;color:var(--gold);font-weight:400}
@media (max-aspect-ratio:1/1){
  .steps{grid-template-columns:1fr}
  .step{flex-direction:row;align-items:center;gap:12px}
  .step canvas{width:46%;flex:none}
  .step p{text-align:left}
  #mapGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hd{flex-wrap:wrap;row-gap:8px}.hd h2{font-size:min(30px,8vw)}
}
@media (max-width:760px){
  #hud{gap:5px}.plate{padding:3px 7px;min-height:34px;gap:5px}.plate .nm{font-size:13px;max-width:5.5em}.plate .wins{font-size:16px}
  .rack i{width:11px;height:11px}.tog{width:32px;height:32px}.tog svg{width:17px;height:17px}#race{font-size:12px}
}
@media (max-width:560px) and (orientation:portrait){
  #hud{flex-wrap:wrap;row-gap:6px;padding-left:calc(8px + env(safe-area-inset-left))}
  #hud::before{content:'';flex:0 0 92px;height:1px}
  #hud .sp{order:1;flex:0 0 100%;height:0}
  #hud .plate,#race{order:2}#hud .plate{flex:1 1 0}
}
@media (max-width:560px){   /* 폰 세로: 타이틀 단추 넷을 두 줄로 */
  #title .row{flex-wrap:wrap;width:min(340px,100%);gap:10px}
  #title .btn{flex:1 1 calc(50% - 10px);min-width:0;font-size:20px;padding:13px 10px}
  #title .btn.wood{padding-right:42px}
}
/* 폰 가로: 창은 높이에 맞춰 줄이고, 누를 것은 아래 26vh 위에 */
@media (max-height:480px){
  .scr{padding:36px 10px 40px calc(10px + env(safe-area-inset-left))}
  .sheet{padding:14px 18px 14px}
  .hd{margin:0 4px 8px}.hd h2{font-size:7vh}
  .btn{font-size:5.6vh;padding:2.4vh 5vh;min-width:0}.btn.sm{font-size:4.6vh;padding:2vh 3.4vh}.btn.wood{padding-left:4.6vh;padding-right:12vh}.btn.wood::before{width:6.4vh}.btn.wood.sm{padding-left:3.4vh;padding-right:9vh}
  #title{gap:1.6vh;padding-bottom:8vh}
  #logo{font-size:17vh;-webkit-text-stroke:7px #0b2a18}
  #title .btn{font-size:6vh;padding:2.6vh 6vh}#title .btn.wood{padding-left:4.6vh;padding-right:12vh}
  #mapGrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:1.8vh}.opp{padding:1.6vh 2vh}.opp .no{font-size:5vh}.opp .nm{font-size:3.9vh}.opp .ra{font-size:3.2vh}
  .step canvas{width:min(100%,40vh)}.step p{font-size:3.7vh;line-height:1.25}.steps{gap:10px}.step{gap:4px}.step p b{font-size:5vh}
  #resBig{font-size:17vh;margin:0 0 1vh}#resSub{font-size:4.6vh}#resScore{font-size:8vh;margin:1vh 0 2.6vh}
  #endBig{font-size:14vh}#endTxt{font-size:4.4vh;margin-bottom:2.4vh}
  #fine{height:min(50vh,240px)}#power{height:min(44vh,200px)}#spin{width:50px;height:50px}
  #msg{font-size:15vh}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="plate" id="pl0"><span class="nm" id="nm0">나</span><span class="rack" id="rk0"></span><span class="wins" id="w0">0</span></div>
  <div id="race"></div>
  <div class="plate" id="pl1"><span class="wins" id="w1">0</span><span class="rack" id="rk1"></span><span class="nm" id="nm1">상대</span></div>
  <div class="sp"></div>
  <button class="tog" id="howBtn" aria-label="how to play"><span class="q">?</span></button>
  <button class="tog" id="bgmBtn" aria-label="music"><svg viewBox="0 0 24 24"><path d="M9 17.5V5.5l11-2.5v12" fill="none" stroke="#2a2a30" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="6.3" cy="17.8" rx="3.4" ry="2.7" fill="#2a2a30"/><ellipse cx="17.3" cy="15.3" rx="3.4" ry="2.7" fill="#2a2a30"/></svg></button>
  <button class="tog" id="sndBtn" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="#2a2a30"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="#2a2a30" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</div>
<div class="ctl" id="fine"></div>
<div class="ctl" id="powerW"><span id="pnum"></span><div id="power"><div id="pfill"></div><div id="pcue"></div><i id="parrow"><span class="v">▼<br>▼</span><span class="h">◀ ◀</span></i></div><b id="ptip">당겨서 쳐요</b><div id="spin"><i id="sdot"></i></div></div>
<div id="spinPop" hidden><div id="spinBig"><i id="sdotB"></i></div></div>
<div id="hand" hidden><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><b>끌어서 옮겨요</b></div>
<div id="msg"></div>

<div id="title">
  <div class="row">
    <button class="btn" id="startBtn">플레이</button>
    <button class="btn wood" id="lessonBtn">레슨</button>
    <button class="btn wood" id="vsBtn">2P</button>
  </div>
  <div id="logo">포켓<b>볼</b></div>
</div>

<div class="scr" id="map" hidden><div class="sheet"><i class="dia a"></i><i class="dia b"></i><i class="dia c"></i><i class="dia d"></i><i class="dia e"></i><i class="dia f"></i>
  <div class="hd"><h2>STAGE</h2><span class="cnt" id="mapN"></span><div class="hb"><button class="btn wood sm" id="mapHome">홈</button></div></div>
  <div id="mapGrid"></div>
</div></div>

<div class="scr" id="res" hidden><div class="sheet"><i class="dia a"></i><i class="dia b"></i><i class="dia c"></i><i class="dia d"></i><i class="dia e"></i><i class="dia f"></i>
  <div id="resBig">WIN</div><div id="resSub"></div><div id="resScore"></div>
  <div id="resBtns"></div>
</div></div>

<div class="scr" id="end" hidden><div class="sheet"><i class="dia a"></i><i class="dia b"></i><i class="dia c"></i><i class="dia d"></i><i class="dia e"></i><i class="dia f"></i>
  <div id="endBig">CHAMPION</div><div id="endTxt"></div>
  <div id="resBtns2"><button class="btn" id="endOk">THE END</button></div>
</div></div>

<div class="scr" id="how" hidden><div class="sheet"><i class="dia a"></i><i class="dia b"></i><i class="dia c"></i><i class="dia d"></i><i class="dia e"></i><i class="dia f"></i>
  <div class="hd"><h2>HOW TO PLAY</h2><div class="hb"><button class="btn sm" id="howOk">OK</button></div></div>
  <div class="steps">
    <div class="step"><canvas width="440" height="320"></canvas><p><b>1</b><br>당구대를 끌어 큐 방향을 정해요<br>바퀴를 돌리면 조금씩 움직여요</p></div>
    <div class="step"><canvas width="440" height="320"></canvas><p><b>2</b><br>옆에 세운 큐 막대를 당겼다 놓으면 쳐요<br>많이 당길수록 세게 나가요<br>흰 공 단추를 누르면 회전을 줘요</p></div>
    <div class="step"><canvas width="440" height="320"></canvas><p><b>3</b><br>내 공(1~7 또는 9~15)을 다 넣고 8번을 넣으면 이겨요<br>흰 공이 빠지면 상대가 흰 공을 놓아요</p></div>
  </div>
</div></div>
