<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>알까기 — Alkkagi</title>
<style>
  @font-face { font-family: 'Griun'; src: url('fonts/Griun_Fromsol-Rg.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Ria'; src: url('fonts/RiaSans-ExtraBold.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e1f12; font-family: 'Griun', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #f2ede4; user-select: none; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* 상단 바 — 오름 알약(왼쪽 위) 오른쪽부터 */
  #topbar { position: fixed; left: 0; right: 0; top: 0; height: calc(46px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) calc(10px + env(safe-area-inset-right)) 0 calc(104px + env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
  .stat { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.14); font-size: 15px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .stat b { font-weight: normal; font-size: 20px; min-width: 14px; text-align: center; font-family: 'Ria', Arial, sans-serif; }
  .tm { display: inline-flex; align-items: center; gap: 5px; font-family: Arial, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; opacity: .5; transition: opacity .25s; }
  .tm.on { opacity: 1; }
  .tm i { width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #666, #000 70%); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .tm.w i { background: radial-gradient(circle at 35% 30%, #fff, #c9c5b8 75%); }
  .tm.on i { box-shadow: 0 0 0 2px rgba(255,255,255,.4), 0 0 10px rgba(255,255,255,.6); }
  .tm span:empty { display: none; }
  #stage { font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  .spacer { flex: 1; }
  .tog { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; font-family: inherit; font-size: 17px; line-height: 1; padding: 0; touch-action: manipulation; }
  .tog.off { opacity: .4; text-decoration: line-through; }
  @media (max-width: 520px) {
    #topbar { padding-left: calc(96px + env(safe-area-inset-left)); padding-right: 6px; gap: 4px; }
    .stat { padding: 4px 7px; font-size: 12px; gap: 3px; } .stat b { font-size: 16px; min-width: 10px; }
    .tm span { display: none; } .tm i { width: 12px; height: 12px; }
    #stage { font-size: 11px; letter-spacing: 1px; }
    .tog { width: 30px; height: 30px; font-size: 14px; }
  }

  #flash { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); font-family: 'Ria', Arial, sans-serif; font-weight: 900; font-size: min(18vw, 84px); letter-spacing: 8px; color: #ffe066; -webkit-text-stroke: 3px #3a2810; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.55); opacity: 0; pointer-events: none; z-index: 8; transition: opacity .2s, transform .35s cubic-bezier(.2,1.6,.4,1); }
  #flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #keys { position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; opacity: .45; text-align: right; line-height: 1.5; pointer-events: none; z-index: 5; }
  body.touch #keys { display: none; }

  #title, #over { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; }
  #title { pointer-events: none; }
  #title h1 { font-family: 'Ria', Arial, sans-serif; font-weight: 900; font-size: min(24vw, 128px); margin: 0 0 4px; line-height: 1; color: #fff; -webkit-text-stroke: 3px #3a2810; paint-order: stroke fill; text-shadow: 0 8px 30px rgba(0,0,0,.55); letter-spacing: 4px; }
  body.en #title h1 { font-size: min(14vw, 96px); letter-spacing: 3px; }
  #title .tag { font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 8px; font-size: 16px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); margin-bottom: 14px; }
  .rec { font-family: Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; color: #ffe066; text-shadow: 0 1px 4px rgba(0,0,0,.7); margin: 0 0 22px; min-height: 18px; }
  .rec:empty { display: none; }
  #title .go, #over .again { pointer-events: auto; display: inline-block; padding: 14px 54px; border-radius: 999px; border: 2px solid #fff; background: rgba(40,24,10,.78); color: #fff; font-size: 24px; letter-spacing: 3px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); touch-action: manipulation; }
  #title .go:active, #over .again:active { transform: scale(.96); }
  #title .p2 { pointer-events: auto; margin-top: 14px; padding: 8px 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.6); background: rgba(40,24,10,.55); color: #fff; font-family: Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; cursor: pointer; touch-action: manipulation; }
  #title .p2:active { transform: scale(.96); }
  #title.hide { display: none; }
  /* 세로 폰: 판이 화면 가운데 작게 놓이므로 제목은 판 위, 단추는 판 아래 빈 자리로 */
  @media (max-aspect-ratio: 4/5) {
    #title { justify-content: space-between; padding: calc(56px + env(safe-area-inset-top)) 0 calc(64px + env(safe-area-inset-bottom)); }
    #title h1 { font-size: min(22vw, 96px); }
    #title .tag { margin-bottom: 6px; }
  }
  body.shot #topbar, body.shot #keys, body.shot #oreumHome, body.shot #oreumFs, body.shot #btnStart, body.shot #btn2p, body.shot .rec { display: none !important; }

  #over { display: none; background: rgba(20,10,4,.55); }
  #over.show { display: flex; }
  #over h2 { font-family: Arial, sans-serif; font-weight: 900; font-size: min(6vw, 26px); letter-spacing: 6px; margin: 0 0 10px; opacity: .85; }
  #over .res { font-family: 'Ria', Arial, sans-serif; font-weight: 900; font-size: min(16vw, 92px); line-height: 1; letter-spacing: 6px; -webkit-text-stroke: 3px #3a2810; paint-order: stroke fill; margin-bottom: 14px; }
  #over .res.win { color: #ffe066; } #over .res.lose { color: #ff7a6a; }
  #over .again { font-family: Arial, sans-serif; letter-spacing: 4px; font-size: 20px; }
  #over .home { pointer-events: auto; margin-top: 16px; font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; opacity: .7; cursor: pointer; padding: 6px 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <span class="stat" id="score"><span class="tm b on" id="tmB"><i></i><span id="lbB">YOU</span></span> <b id="s0">5</b> : <b id="s1">5</b> <span class="tm w" id="tmW"><span id="lbW"></span><i></i></span></span>
  <span class="stat" id="stage">STAGE 1</span>
  <span class="spacer"></span>
  <button class="tog" id="tgSnd" title="K">🔊</button>
</div>

<div id="flash">NICE</div>
<div id="keys" data-en="K sound">K 효과음</div>

<div id="over">
  <h2 id="oh">STAGE 1</h2>
  <div class="res win" id="ores">CLEAR</div>
  <div class="rec" id="orec"></div>
  <div id="osub"></div>
  <div class="again" id="btnRetry">NEXT</div>
  <div class="home" id="btnHome">TITLE</div>
</div>

<div id="title">
  <div class="top">
    <h1 data-en="ALKKAGI">알까기</h1>
    <div class="tag" data-en="FLICK STONES">ALKKAGI</div>
    <div class="rec" id="rec"></div>
  </div>
  <div class="bot">
    <div class="go" id="btnStart" data-en="START">시작</div>
    <div class="p2" id="btn2p">2 PLAYERS</div>
  </div>
</div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<script src="js/audio.js?v=1"></script>
<script src="js/game.js?v=2"></script>
<script src="/assets/visit.js?v=11" defer></script>
<script src="/assets/game-events.js?v=2" defer></script>
</body>
</html>
