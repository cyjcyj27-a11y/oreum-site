<style>
  :root{
    --bg:#0d0e10; --ink:#e6e4e0; --dim:#8b8f96; --faint:#5a5f66;
    --line:#24272c; --warn:#e0b83a; --accent:#7fb0d8;
    --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --serif:"Noto Serif KR","본명조","HANBatang","Batang",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:#000;color:var(--ink);font-family:var(--serif);
       overscroll-behavior:none;user-select:none;-webkit-user-select:none}

  #stage{position:fixed;inset:0;background:var(--bg);overflow:hidden;cursor:pointer}

  /* ── 영상 레이어 ── */
  #vlayer{position:absolute;inset:0;background:#000;display:none}
  #vlayer.on{display:block}
  #vlayer video{position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;background:#000;opacity:0;transition:opacity .45s ease}
  #vlayer video.on{opacity:1}

  /* 영상 위 대사 자막 */
  #cue{position:absolute;left:0;right:0;bottom:calc(7% + env(safe-area-inset-bottom));
    padding:0 22px;text-align:center;font-family:var(--sans);font-weight:300;
    font-size:clamp(15px,4.1vw,20px);line-height:1.62;letter-spacing:-.01em;
    color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9);
    opacity:0;transition:opacity .28s ease;pointer-events:none;z-index:3}
  #cue.on{opacity:1}
  #cue b{display:block;font-weight:300}

  /* 방송 화면 좌상단 슬레이트 */
  #chyron{position:absolute;left:16px;top:calc(20px + env(safe-area-inset-top));
    font-family:var(--sans);font-size:11px;font-weight:300;letter-spacing:.3em;
    color:#cfd4da;background:rgba(0,0,0,.55);border-left:2px solid var(--warn);
    padding:7px 13px 7px 11px;opacity:0;transition:opacity .5s ease;z-index:3}
  #chyron.on{opacity:1}

  /* ── 자막 카드 레이어 ── */
  #txtwrap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    padding:6vh 20px calc(7vh + env(safe-area-inset-bottom));z-index:2}
  #txtwrap.on{display:flex}
  #txt{max-width:700px;width:100%;text-align:center;transition:opacity .55s ease}
  #txt.out{opacity:0}
  .ln{opacity:0;animation:fin 1.05s cubic-bezier(.2,.6,.2,1) forwards}
  @keyframes fin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* 검은 화면 자막 — 큰자막과 내레이션 모두 같은 크기·굵기·색 */
  #txt.big .ln, #txt.nar .ln{font-size:clamp(22px,6.4vw,34px);font-weight:500;line-height:1.6;
    letter-spacing:-.025em;color:#f2efe9;margin:.3em 0}

  /* 맨 처음 한 장만 훨씬 크게 — 시작을 여는 문장 */
  #txt.xl{max-width:860px}
  #txt.xl .ln{font-size:clamp(40px,12vw,66px);line-height:1.34;letter-spacing:-.04em;margin:.14em 0}

  /* 연호 슬레이트 */
  #txt.slate .ln{font-family:var(--sans);font-size:clamp(16px,4.4vw,21px);font-weight:300;
    letter-spacing:.24em;color:#c7ccd3;line-height:2.1}
  #txt.slate{border-top:1px solid #2e3238;border-bottom:1px solid #2e3238;padding:26px 10px}

  /* LIFE PAY 브랜드 카드 */
  #txt.brand .ln{font-family:var(--sans);font-weight:500;color:#f2efe9;line-height:1.5}
  #txt.brand .ln:nth-child(1){font-size:clamp(20px,5.6vw,30px);letter-spacing:.2em}
  #txt.brand .ln:nth-child(2){font-size:clamp(30px,9vw,52px);letter-spacing:.16em;
    color:var(--warn);margin-top:.24em}
  #txt.brand .ln:nth-child(3){font-family:var(--serif);font-weight:300;
    font-size:clamp(13px,3.4vw,15px);letter-spacing:.06em;color:var(--dim);margin-top:1.5em}

  /* ── 화면 위 장식 ── */
  #vig{position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}

  #bar{position:absolute;left:0;top:0;height:2px;width:0;z-index:6;
    background:linear-gradient(90deg,#4a5058,var(--warn));transition:width .5s ease;opacity:.75}

  #langbtn{position:absolute;left:14px;top:calc(16px + env(safe-area-inset-top));z-index:8;
    opacity:0;transition:opacity .4s ease}
  #langbtn.on{opacity:1}
  #langbtn button{font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.1em;
    color:#e8eaed;background:rgba(255,255,255,.10);border:1px solid #6b727b;border-radius:18px;
    padding:10px 18px;cursor:pointer}
  #langbtn button:hover{color:#fff;border-color:#9aa1a9;background:rgba(255,255,255,.18)}
  /* 시작 화면에서는 항상 보이게 */
  #langbtn.gateon{opacity:1}

  #topbtns{position:absolute;right:14px;top:calc(16px + env(safe-area-inset-top));z-index:7;
    display:flex;gap:8px;opacity:0;transition:opacity .4s ease}
  #topbtns.on{opacity:1}
  #topbtns button{font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.1em;
    color:#e8eaed;background:rgba(255,255,255,.10);border:1px solid #6b727b;border-radius:18px;
    padding:10px 18px;cursor:pointer}
  #topbtns button:hover{color:#fff;border-color:#9aa1a9;background:rgba(255,255,255,.18)}

  /* 아주 좁은 폰(아이폰 SE 등)에서는 위쪽 버튼들이 서로 닿는다 — 조금 줄인다 */
  @media (max-width:370px){
    #topbtns{gap:6px}
    #topbtns button,#langbtn button{font-size:12px;padding:9px 12px;letter-spacing:.03em}
  }

  #hint{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;
    font-family:var(--sans);font-size:11px;font-weight:300;letter-spacing:.24em;color:#818790;
    opacity:0;transition:opacity .5s ease;pointer-events:none}
  #hint.on{opacity:1;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ── 시작 화면 ── */
  #gate{position:absolute;inset:0;z-index:20;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    padding:0 28px;text-align:center;transition:opacity .8s ease}
  #gate.gone{opacity:0;pointer-events:none}
  #gTitle{font-size:clamp(28px,8.4vw,44px);font-weight:500;letter-spacing:.1em;color:#f2efe9}
  #gEn{font-family:var(--sans);font-size:clamp(11px,3.1vw,14px);font-weight:300;
    letter-spacing:.3em;color:#8d949c;margin-top:16px;white-space:nowrap}
  #gSub{font-family:var(--sans);font-size:13px;font-weight:300;letter-spacing:.42em;
    color:#b3b8bf;margin-top:30px;padding-top:22px;border-top:1px solid #2a2e34}
  #gBtn{margin-top:52px;font-family:var(--sans);font-size:13px;font-weight:300;letter-spacing:.26em;
    color:#cfd4da;border:1px solid #3a4048;border-radius:24px;padding:15px 34px;
    background:rgba(255,255,255,.03);cursor:pointer}
  #gBtn:hover{border-color:#5b626b;color:#fff}
  #gNote{font-family:var(--sans);font-size:14px;font-weight:300;letter-spacing:.02em;
    color:#a7adb5;margin-top:30px;line-height:2.05}

  /* ── 종료 화면 ── */
  #end{position:absolute;inset:0;z-index:15;background:#000;display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:0 28px;text-align:center}
  #end.on{display:flex}
  #eTitle{font-size:clamp(19px,5.2vw,26px);font-weight:500;letter-spacing:.14em;color:#f2efe9}
  #eSub{font-family:var(--sans);font-size:12px;font-weight:300;letter-spacing:.34em;
    color:var(--dim);margin-top:20px}
  #eBtns{display:flex;gap:12px;margin-top:46px;flex-wrap:wrap;justify-content:center}
  #eBtns button{font-family:var(--sans);font-size:12px;font-weight:300;letter-spacing:.2em;
    color:#cfd4da;border:1px solid #3a4048;border-radius:22px;padding:13px 26px;
    background:rgba(255,255,255,.03);cursor:pointer}
  #eBtns button:hover{border-color:#5b626b;color:#fff}
</style>
</head>

/* ═══════════ 한국어 · English ═══════════
   화면에 나오는 자막은 위 SCENES 의 lines(한국어) / en(영어) 을 쓰고,
   버튼·제목 같은 짧은 글씨는 아래 표를 쓴다. */
const UI = {
  ko:{ title:"영생의 가격", sub:"THE PRICE OF IMMORTALITY", part:"1부 · 프롤로그",
       start:"시작하기", musicOff:"음악 끄기", musicOn:"음악 켜기",
       pause:"일시정지", resume:"다시재생", hint:"탭하여 넘기기", endTitle:"1부 · 프롤로그 끝", endSub:"2부에서 계속",
       demo:"오름게임즈", other:"ENGLISH" },
  en:{ title:"The Price of Immortality", sub:"영생의 가격", part:"Part 1 · Prologue",
       start:"Start", musicOff:"Music off", musicOn:"Music on",
       pause:"Pause", resume:"Resume", hint:"Tap to continue", endTitle:"End of Part 1 · Prologue", endSub:"To be continued in Part 2",
       demo:"Oreum Games", other:"한국어" }
};

/* 언어 정하기: 주소의 ?lang= > 지난번 선택 > 브라우저 언어 */
let lang = "ko";
try{
  const q = new URLSearchParams(location.search).get("lang");
  if(q === "en" || q === "ko"){ lang = q; localStorage.setItem("tpoi_lang", q); }
  else{
    const saved = localStorage.getItem("tpoi_lang");
    if(saved === "en" || saved === "ko") lang = saved;
    else lang = (navigator.language || "ko").toLowerCase().indexOf("ko") === 0 ? "ko" : "en";
  }
}catch(e){}

/* 장면 하나에서 지금 언어에 맞는 줄을 꺼낸다 (영어가 없으면 한국어 그대로) */
function linesOf(sc){ return (lang === "en" && sc.en) ? sc.en : sc.lines; }
/* 영상 자막 한 줄에서 지금 언어에 맞는 글을 꺼낸다 */
function cueText(c){ return (lang === "en" && c[3]) ? c[3] : c[2]; }

/* ═══════════════ 재생 엔진 ═══════════════ */

const $ = id => document.getElementById(id);
const stage=$("stage"), vlayer=$("vlayer"), txtwrap=$("txtwrap"), txt=$("txt"),
      cue=$("cue"), chyron=$("chyron"), bar=$("bar"), hint=$("hint"),
      topbtns=$("topbtns"), soundBtn=$("sound"), pauseBtn=$("pause"),
      gate=$("gate"), endScr=$("end");

/* ═══════════ 배경음악 ═══════════
   글자 자막이 나올 때는 BGM_TEXT 크기로,
   영상이 나올 때는 영상 소리에 안 묻히게 BGM_VIDEO 크기로 줄인다.
   0 = 무음, 1 = 최대. 소리가 크거나 작으면 이 두 숫자만 고치면 된다. */
const BGM_TEXT  = 0.20;
const BGM_VIDEO = 0.05;
const BGM_FADE  = 900;    // 크기가 바뀌는 데 걸리는 시간(밀리초)

const bgm = document.getElementById("bgm");
let bgmFade = 0;
let soundOff = false;      // 음악 끄기 버튼 상태

/* ═══════════ 넘기는 소리 ═══════════
   직접 녹음한 "녹음 (9).m4a" 의 1.17~1.72초 구간이다.
   파일을 따로 읽지 않고 이 HTML 안(<script id="pageSnd">)에 통째로 넣어 뒀다.
   그래서 서버 없이 파일을 그냥 열어도, 캐시가 끼어도 항상 이 소리가 난다.
   CLICK_VOL 이 크기(0 = 무음), 숫자를 키우면 커진다. */
const CLICK_VOL = 0.315;   // 0.45 에서 30% 줄임
let actx = null;
let clickBuf = null;

function loadClick(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(clickBuf) return;
    const b64 = document.getElementById("pageSnd").textContent.trim();
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    actx.decodeAudioData(bytes.buffer).then(b=>{ clickBuf = b; }).catch(()=>{});
  }catch(e){}
}

function clickSound(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    if(!clickBuf){ loadClick(); return; }          // 준비 전이면 그냥 조용히 넘어간다
    const src = actx.createBufferSource();
    src.buffer = clickBuf;
    src.playbackRate.value = 0.93 + Math.random()*0.14;   // 넘길 때마다 살짝 다르게
    const amp = actx.createGain();
    amp.gain.value = CLICK_VOL;
    src.connect(amp); amp.connect(actx.destination);
    src.start();
  }catch(e){}
}

function bgmTo(target, ms){
  clearInterval(bgmFade);
  const from = bgm.volume, steps = Math.max(1, Math.round((ms||BGM_FADE)/40));
  let n = 0;
  bgmFade = setInterval(()=>{
    n++;
    bgm.volume = Math.max(0, Math.min(1, from + (target-from)*(n/steps)));
    if(n >= steps) clearInterval(bgmFade);
  }, 40);
}

const VIDS = {};
["ann1","chip1","ann2","chip2","seoul1","logi1","logi2","logi3","luxury"]
  .forEach(k => VIDS[k] = $("v_"+k));

let idx = -1;          // 현재 장면 번호
let timer = null;      // 글자 카드 자동 넘김 타이머
let ticker = 0;        // 영상 자막 감시 루프 (setInterval — 화면이 가려져도 계속 돈다)
let curVid = null;
let busy = false;      // 전환 중 중복 입력 방지
let started = false;

const LINE_STAGGER = 280;   // 줄이 한 줄씩 떠오르는 간격(밀리초)

/* 아래는 재생시간을 어림잡을 때만 쓴다. 자막은 눌러야 넘어가므로
   실제 진행 속도와는 관계없다. (READ_MS_PER_CHAR = 한 글자 읽는 시간) */
const READ_MS_PER_CHAR = 95;

function holdOf(sc){
  if(sc.hold) return sc.hold;
  const L = linesOf(sc);
  const chars  = L.join("").length;
  const reveal = (L.length-1)*LINE_STAGGER + 900;   // 마지막 줄이 다 뜰 때까지
  const read   = 650 + chars*READ_MS_PER_CHAR;             // 다 뜬 뒤 읽는 시간
  return Math.max(2900, Math.min(13000, reveal + read));
}

function clearAll(){
  clearTimeout(timer); timer=null;
  clearInterval(ticker); ticker=0;
  if(curVid){ curVid.pause(); curVid.classList.remove("on"); curVid=null; }
  cue.classList.remove("on");
  chyron.classList.remove("on");
}

/* byUser = 사람이 눌러서 넘어가는 경우. 이때만 넘기는 소리를 낸다.
   (영상이 저절로 끝나서 넘어갈 때는 소리가 나지 않는다) */
function next(byUser){
  if(busy) return;                 // 연달아 눌러도 한 번만 넘어간다
  if(byUser) clickSound();
  busy = true;
  clearAll();
  txt.classList.add("out");
  setTimeout(()=>{ busy=false; play(idx+1); }, 380);
}

function play(i){
  idx = i;
  bar.style.width = (i / SCENES.length * 100) + "%";

  if(i >= SCENES.length){ finish(); return; }
  const sc = SCENES[i];

  if(sc.k === "vid") playVideo(sc);
  else playText(sc);
}

function playText(sc){
  vlayer.classList.remove("on");
  txtwrap.classList.add("on");
  pauseBtn.hidden = true;
  bgmTo(BGM_TEXT);
  txt.className = sc.k;
  if(sc.xl) txt.classList.add("xl");   // 유난히 크게 띄울 한 장
  txt.classList.remove("out");
  txt.innerHTML = linesOf(sc)
    .map((l,n)=>`<div class="ln" style="animation-delay:${(n*LINE_STAGGER/1000).toFixed(2)}s">${l}</div>`)
    .join("");

  /* 저절로 넘어가지 않는다. 화면을 눌러야 다음으로 간다.
     줄이 다 떠오른 뒤에 "탭하여 넘기기" 안내를 띄운다. */
  hint.classList.remove("on");
  const reveal = (linesOf(sc).length-1)*LINE_STAGGER + 1050;
  timer = setTimeout(()=>hint.classList.add("on"), reveal);
}

/* 세로 화면에서는 영상이 가운데 띠처럼 들어간다(위아래가 검다).
   그럴 때 자막과 슬레이트를 화면 끝이 아니라 영상 바로 옆에 붙인다. */
function placeOverlays(v){
  const cw = innerWidth, ch = innerHeight;
  const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const drawH = Math.min(ch, cw * vh / vw);   // 실제로 그려지는 영상 높이
  const margin = (ch - drawH) / 2;            // 위아래 검은 여백

  if(margin > 100){                            // 여백이 넉넉하면 영상에 붙인다
    cue.style.top = Math.round(ch - margin + 16) + "px";
    cue.style.bottom = "auto";
    chyron.style.top = Math.round(margin + 14) + "px";
  }else{                                       // 화면을 거의 채우면 기본 위치
    cue.style.top = "auto";
    cue.style.bottom = "";
    chyron.style.top = "";
  }
}

function playVideo(sc){
  txtwrap.classList.remove("on");
  vlayer.classList.add("on");
  bgmTo(BGM_VIDEO, 500);         // 영상 소리에 안 묻히게 배경음악을 낮춘다
  hint.classList.add("on");      // 영상 중에도 언제든 눌러서 넘길 수 있다
  pauseBtn.hidden = false;

  const v = VIDS[sc.id];
  /* 다른 영상이 혹시라도 돌고 있으면 확실히 멈춘다 (소리 겹침 방지) */
  Object.values(VIDS).forEach(o=>{ if(o!==v && !o.paused){ o.pause(); o.currentTime = 0; } });

  curVid = v;
  v.muted = false;               // 영상 소리는 음악 끄기와 무관하게 항상 나온다
  try{ v.currentTime = sc.in || 0; }catch(e){}
  v.classList.add("on");
  placeOverlays(v);
  v.play().catch(()=>{ /* 자동재생이 막히면 탭으로 넘어간다 */ });

  const cues = sc.cues || [];
  let shown = -1;

  const tick = ()=>{
    const t = v.currentTime;

    if(sc.chyron){
      chyron.textContent = (lang==="en" && sc.chyron.en) ? sc.chyron.en : sc.chyron.text;
      chyron.classList.toggle("on", t < sc.chyron.until);
    }

    let hit = -1;
    for(let n=0;n<cues.length;n++){
      if(t >= cues[n][0] && t < cues[n][1]){ hit = n; break; }
    }
    if(hit !== shown){
      shown = hit;
      if(hit === -1) cue.classList.remove("on");
      else { cue.innerHTML = cueText(cues[hit]); cue.classList.add("on"); }
    }

    if(sc.out && t >= sc.out){ next(); }   // out 을 정해두면 그 초에서 끊고 다음으로
  };
  tick();
  ticker = setInterval(tick, 60);

  /* 버튼 글씨는 영상이 실제로 돌기 시작/멈출 때 맞춘다.
     play() 직후에 정하면 브라우저가 아직 "멈춤"이라 답해서 글씨가 뒤집힌다. */
  v.onplay  = setPauseLabel;
  v.onpause = setPauseLabel;
  v.onended = ()=>{ next(); };
  pauseBtn.textContent = UI[lang].pause;
}

function finish(){
  clearAll();
  bgmTo(0, 1800);
  setTimeout(()=>bgm.pause(), 1900);
  txtwrap.classList.remove("on");
  vlayer.classList.remove("on");
  hint.classList.remove("on");
  topbtns.classList.remove("on");
  langWrap.classList.remove("on"); langWrap.classList.add("gateon");
  bar.style.width = "100%";
  endScr.classList.add("on");
}

/* ── 한국어 / English 전환 ── */
const langBtn = $("lang"), langWrap = $("langbtn");

function applyLang(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  $("gTitle").textContent = t.title;
  $("gEn").textContent    = t.sub;
  $("gSub").textContent   = t.part;
  $("gBtn").textContent   = t.start;
  soundBtn.textContent    = soundOff ? t.musicOn : t.musicOff;
  hint.textContent        = t.hint;
  $("eTitle").textContent = t.endTitle;
  $("eSub").textContent   = t.endSub;
  $("eDemo").textContent  = t.demo;
  langBtn.textContent     = t.other;
  setPauseLabel();
  /* 영문 제목은 고딕, 한글 제목은 명조가 어울린다 */
  $("gTitle").style.fontFamily = (lang === "en") ? "var(--sans)" : "var(--serif)";
}

langBtn.addEventListener("click", e=>{
  e.stopPropagation();
  clickSound();
  lang = (lang === "ko") ? "en" : "ko";
  try{ localStorage.setItem("tpoi_lang", lang); }catch(err){}
  applyLang();
  /* 보고 있던 장면을 그 언어로 다시 그린다 */
  if(started && !endScr.classList.contains("on") && idx >= 0 && idx < SCENES.length){
    const sc = SCENES[idx];
    if(sc.k === "vid"){
      const cs = sc.cues || [];
      const t = curVid ? curVid.currentTime : 0;
      for(const c of cs){ if(t >= c[0] && t < c[1]){ cue.innerHTML = cueText(c); break; } }
      if(sc.chyron) chyron.textContent = (lang==="en" && sc.chyron.en) ? sc.chyron.en : sc.chyron.text;
    }else{
      txt.innerHTML = linesOf(sc)
        .map((l,n)=>`<div class="ln" style="animation-delay:${(n*LINE_STAGGER/1000).toFixed(2)}s">${l}</div>`)
        .join("");
    }
  }
});

applyLang();
langWrap.classList.add("gateon");   // 시작 화면에서도 보이게

/* ── 입력 ── */
stage.addEventListener("click", e=>{
  if(!started) return;
  if(endScr.classList.contains("on")) return;
  if(e.target.closest("#topbtns") || e.target.closest("#langbtn") || e.target.closest("#eBtns")) return;
  next(true);
});
document.addEventListener("keydown", e=>{
  if(!started) return;
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); next(true); }
  if(e.key==="m"||e.key==="M"){ soundOff = !soundOff; applySound(); }
});

/* ── 음악 끄기 / 켜기 ──
   배경음악만 끈다. 영상 소리와 클릭음은 그대로 나온다. */
function applySound(){
  bgm.muted = soundOff;
  soundBtn.textContent = soundOff ? UI[lang].musicOn : UI[lang].musicOff;
}
/* ── 영상 일시정지 ──
   화면을 탭하면 "다음"이므로, 멈추는 건 이 버튼으로만 한다.
   영상 장면일 때만 버튼이 나타난다. */
function setPauseLabel(){
  pauseBtn.textContent = (curVid && curVid.paused) ? UI[lang].resume : UI[lang].pause;
}
pauseBtn.addEventListener("click", e=>{
  e.stopPropagation();
  clickSound();
  if(!curVid) return;
  if(curVid.paused) curVid.play().catch(()=>{});
  else curVid.pause();
  setPauseLabel();
});

soundBtn.addEventListener("click", e=>{
  e.stopPropagation();
  clickSound();
  soundOff = !soundOff;
  applySound();
});

/* ── 창을 다른 데로 옮기면 소리와 영상을 멈춘다 ──
      돌아오면 보던 자리에서 다시 이어진다 */
let pausedByBlur = false;
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    if(!bgm.paused){ bgm.pause(); pausedByBlur = true; }
    if(curVid && !curVid.paused){ curVid.pause(); pausedByBlur = true; }
  }else if(started && pausedByBlur && !endScr.classList.contains("on")){
    pausedByBlur = false;
    bgm.play().catch(()=>{});
    if(curVid && curVid.currentTime < curVid.duration) curVid.play().catch(()=>{});
  }
});
$("eDemo").addEventListener("click", e=>{ e.stopPropagation(); location.href="https://oreumgames.com"; });

/* 전체 재생시간 (화면에는 안 띄운다 — 개발 중 확인용)
   콘솔에서 totalSeconds() 를 치면 초 단위로 나온다 */
function totalSeconds(){
  let s = 0;
  for(const sc of SCENES){
    if(sc.k === "vid"){
      const v = VIDS[sc.id];
      const dur = sc.out || (isFinite(v.duration) ? v.duration : 8);
      s += dur - (sc.in || 0) + 0.4;
    } else {
      s += (holdOf(sc) + 380) / 1000;
    }
  }
  return s;
}

window.addEventListener("resize", ()=>{ if(curVid) placeOverlays(curVid); });
window.addEventListener("load", loadClick);   // 책장 소리를 미리 받아 둔다

/* ── 시작: 첫 탭에서 모든 영상의 재생 잠금을 푼다
       (모바일은 사용자가 누른 순간에만 소리 있는 재생을 허용한다) ── */
$("gBtn").addEventListener("click", e=>{
  e.stopPropagation();
  /* 음소거 상태로 잠깐 재생했다 멈춘다.
     소리를 켠 채로 하면 8개 영상 소리가 한꺼번에 터진다. */
  Object.values(VIDS).forEach(v=>{
    v.muted = true;
    const unlock = ()=>{ v.pause(); v.currentTime = 0; v.muted = false; };
    const p = v.play();
    if(p && p.then) p.then(unlock).catch(()=>{ v.muted = false; });
    else unlock();
  });
  clickSound();   // 여기서 클릭음 장치도 함께 깨어난다

  /* 배경음악도 이 순간에 틀어야 폰에서 막히지 않는다.
     0에서 시작해 서서히 올라온다. */
  bgm.volume = 0;
  bgm.play().then(()=>bgmTo(BGM_TEXT, 2500)).catch(()=>{});

  started = true;
  gate.classList.add("gone");
  topbtns.classList.add("on");
  langWrap.classList.add("on");
  setTimeout(()=>{ gate.style.display="none"; play(0); }, 700);
});
</script>
