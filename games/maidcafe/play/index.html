<style>

  #topbar { position: fixed; left: 0; right: 0; top: 0; min-height: calc(44px + env(safe-area-inset-top)); padding: calc(6px + env(safe-area-inset-top)) calc(112px + env(safe-area-inset-right)) 6px calc(112px + env(safe-area-inset-left)); display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 6px 8px; background: linear-gradient(180deg, rgba(40,10,30,.45), rgba(40,10,30,0)); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .8s; }

  .stat b { font-weight: normal; font-size: 17px; font-family: 'Ria', 'Griun', sans-serif; letter-spacing: 1px; font-variant-numeric: tabular-nums; } .stat .ic { font-size: 13px; }

  /* 오른쪽 아래 단추: 주 행동(스카우트) 88px 구석, 나머지 60px 왼쪽으로 */

  #title .go { font-family: 'Ria', sans-serif; font-size: 26px; letter-spacing: 6px; text-indent: 6px; padding: 12px 36px 14px; border-radius: 20px; background: rgba(70,15,45,.75); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 8px 26px rgba(0,0,0,.35); cursor: pointer; white-space: nowrap; }

  /* 창(상점·스카우트·도감·미션) */
  #panel { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(40,10,30,.55); opacity: 0; pointer-events: none; transition: opacity .3s; padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  #panel.show { opacity: 1; pointer-events: auto; }
  #panel .box { width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 20px; background: rgba(48,16,40,.95); border: 1px solid rgba(255,180,210,.25); box-shadow: 0 16px 48px rgba(0,0,0,.5); overflow: hidden; }

  #panel .tabs button.on { background: #ff8ab8; color: #4a1030; border-color: #ff8ab8; }
  #panel .tabs button.new::after { content: ''; position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: #ff3a6a; border: 2px solid #fff; }
  #panel .body { padding: 14px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 220px; }
  #panel .foot { display: flex; align-items: center; gap: 14px; padding: 10px 18px 12px; border-top: 1px solid rgba(255,255,255,.1); }

  #panel .close { font-family: 'Ria', sans-serif; font-size: 20px; letter-spacing: 4px; text-indent: 4px; padding: 10px 28px 12px; border-radius: 16px; background: #ff8ab8; color: #4a1030; border: 0; cursor: pointer; touch-action: manipulation; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

  /* 스카우트 */

  .scout .rates { display: flex; gap: 12px; font-size: 13px; opacity: .85; } .scout .rates i { font-style: normal; } .scout .rates .r1 { color: #b8c8ff; } .scout .rates .r2 { color: #d8a8ff; } .scout .rates .r3 { color: #ffd24a; }
  .scout .pull { font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 3px; padding: 14px 44px 16px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #ffb0d0, #ff6aa0); color: #4a1030; cursor: pointer; touch-action: manipulation; box-shadow: 0 6px 0 #a83a6a, 0 12px 24px rgba(0,0,0,.35); }

  /* 도감 */

  /* 스카우트 연출 */

  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  #gacha .card .face { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; transition: transform .9s cubic-bezier(.2,.8,.2,1); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #gacha .card .back { background: linear-gradient(160deg, #ff8ab8, #b04a90 55%, #5a2060); display: grid; place-items: center; font-family: 'Ria', sans-serif; font-size: 44px; color: rgba(255,255,255,.85); letter-spacing: 2px; border: 4px solid rgba(255,255,255,.5); }
  #gacha .card .front { transform: rotateY(180deg); background: linear-gradient(180deg, #fff0f6, #ffd0e0); border: 4px solid #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; color: #4a1030; }
  #gacha.open .card .back { transform: rotateY(180deg); } #gacha.open .card .front { transform: rotateY(360deg); }
  #gacha.r3 .card .front { border-color: #ffd24a; box-shadow: 0 0 40px #ffd24a, 0 20px 60px rgba(0,0,0,.5); }
  #gacha.r2 .card .front { border-color: #d8a8ff; box-shadow: 0 0 30px #c88aff, 0 20px 60px rgba(0,0,0,.5); }
  #gacha .card canvas { width: 100%; flex: 1; min-height: 0; }
  #gacha .card .nm { font-family: 'Ria', sans-serif; font-size: 26px; letter-spacing: 3px; margin-top: 2px; }
  #gacha .card .st { color: #d8a020; letter-spacing: 2px; font-size: 16px; margin-bottom: 8px; }
  #gacha .card .tag { position: absolute; top: 10px; left: 10px; font-family: 'Ria', sans-serif; font-size: 16px; letter-spacing: 2px; padding: 4px 10px; border-radius: 999px; background: #ff3a6a; color: #fff; transform: rotate(-8deg); }
  #gacha .card .tag.dup { background: #7a5aff; }
  #gacha .msg { position: absolute; left: 50%; bottom: 12vh; transform: translateX(-50%); font-family: 'Ria', sans-serif; font-size: 22px; letter-spacing: 4px; color: #fff; opacity: 0; transition: opacity .5s; text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; }
  #gacha.open .msg { opacity: .9; animation: blink 2s infinite 1s; }
  #gacha .spk { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; pointer-events: none; animation: spk 1.4s ease-out forwards; }
  @keyframes spk { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

  /* 엔딩 */
  #ending { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(40,5,30,.45); opacity: 0; pointer-events: none; transition: opacity .8s; text-align: center; }
  #ending.show { opacity: 1; pointer-events: auto; }
  #ending h2 { font-family: 'Ria', sans-serif; font-size: min(9vw, 80px); font-weight: 900; margin: 0 0 6px; letter-spacing: 4px; color: #ffd24a; -webkit-text-stroke: 2px #5a1a3a; paint-order: stroke fill; }
  #ending p { font-size: 22px; margin: 4px 0; font-family: 'Ria', sans-serif; letter-spacing: 1px; } #ending p small { font-size: 14px; opacity: .7; margin-right: 8px; font-family: 'Griun', sans-serif; }
  #ending .again { margin-top: 26px; opacity: .85; animation: blink 2.4s infinite; font-family: 'Ria', sans-serif; letter-spacing: 6px; font-size: 22px; cursor: pointer; }
