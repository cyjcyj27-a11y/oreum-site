<script>
const c=document.getElementById('c'),W=1280,H=720;
let x=c.getContext('2d');
const rnd=s=>{let v=Math.sin(s*127.1)*43758.5453;return v-Math.floor(v)};
const lerp=(a,b,k)=>a+(b-a)*(k<0?0:k>1?1:k);
const ease=k=>{k=k<0?0:k>1?1:k; return k*k*(3-2*k);};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const OC=document.createElement('canvas'); OC.width=W; OC.height=H;
const OX=OC.getContext('2d');
let cam=0, shake=0, NOW=0;
/* 세로 카메라 — 1편은 좌우로만 흘렀다. 2편은 위아래로도 따라간다.
   EYE 는 화면에서 사람이 서 있길 바라는 높이(땅 y=600 에 섰을 때의 몸 중심).
   위아래 BAND 안에서는 화면이 가만히 있는다 — 조금 뛴다고 화면이 출렁이면 멀미가 난다 */
let camY=0;
/* 개발용 손잡이 — ?test=1 로 바로 들어가고, ?band=0 이면 화면이 바로바로 따라온다.
   ?x= ?y= 로 시작 자리도 정한다. 아무것도 안 붙이면 평소와 똑같다 */
const DEV=new URLSearchParams(location.search);
const EYE=565, DEVBAND=DEV.has('band')?+DEV.get('band'):null;   // BAND 는 구역 섞는 데 이미 쓴다
const BAND_UP=DEVBAND===null?150:DEVBAND, BAND_DN=DEVBAND===null?120:DEVBAND;
let zoom=1, zx=W*.44, zy=560;      // 눈뜨는 장면에서만 화면을 당긴다

/*═══════════════════════════════════════════════════════════════════════
  PHYSICS LAYER — Matter.js 위에 얇게 얹은 층.
  여기서는 몸체·충돌·관절·힘만 다룬다. 게임 규칙은 한 줄도 넣지 않는다.
═══════════════════════════════════════════════════════════════════════*/
const {Engine,Composite,Bodies,Body,Constraint,Query,Vector,Events,Sleeping}=Matter;

const DT=1000/60, DT2=DT*DT;              // 한 걸음 = 16.7ms
const engine=Engine.create();
engine.gravity.y=2.232;                    // 0.62 px/걸음² — 손으로 만들던 그 무게
engine.positionIterations=8;
engine.velocityIterations=6;                // 마찰 impulse가 반복마다 쌓인다 — 많이 돌리면 끈적해진다
engine.constraintIterations=4;
const world=engine.world;

/* 부딪히는 편 가르기 */
const CAT={TERRAIN:0x0001, PLAYER:0x0002, PROP:0x0004, ROPE:0x0008, GHOST:0x0010, DECK:0x0020};

/* 재질 — 밀도가 곧 무게다. 데이터로만 바꾼다 */
/* ⚠ Matter의 마찰은 힘이 아니라 속도에서 깎아내는 impulse이고, 그걸 velocityIterations
   횟수만큼 반복한다. 그래서 현실의 마찰계수(0.6 같은)를 그대로 넣으면 물체가 붙박이가 된다.
   여기 값은 전부 실제로 재 보고 맞춘 것이다 */
/* 무게 비율이 곧 체감이다. 사람 70을 기준으로 잡았다 —
   나무 상자 13, 큰 상자 17, 현무암 85~145, 널판 15.
   ⚠ 사람과 물체 무게가 비슷하면 Matter의 접촉 해결기가 둘을 반씩 나눠 세워 버려서
   가벼운 상자조차 기어가듯 밀린다. 비율을 벌려야 밀리는 맛이 산다 */
const MAT={
  stone :{density:.030, friction:.08, frictionStatic:.11, restitution:.02, frictionAir:.010, mu:.30},
  wood  :{density:.006, friction:.06, frictionStatic:.09, restitution:.08, frictionAir:.008, mu:.28},
  /* 널판 — 2026-08-22 무게를 2.5배로. .004 는 널판이 깃털 같아 툭 치면 구덩이로 미끄러졌다.
     .010 이면 다리널판(520x18)이 94, 사람(70)보다 무겁다. 들면 느려지고 놓으면 눌러앉는다.
     마찰도 올려서 걸쳐 둔 다리가 안 밀린다 */
  plank :{density:.010, friction:.14, frictionStatic:.20, restitution:.02, frictionAir:.008, mu:.34},
  rope  :{density:.030, friction:.06, frictionStatic:.09, restitution:.00, frictionAir:.020, mu:.20},
  land  :{friction:.30, frictionStatic:.42, restitution:0},
  person:{density:.042, friction:.006, frictionStatic:0, restitution:0, frictionAir:0}
};
const G=0.62;                        // 중력 가속(px/걸음²)
/* Matter가 아니라 우리가 직접 재우는 마찰·완력.
   ⚠ Matter의 마찰은 무게와 무관한 '속도 깎기'라서, 그대로 두면 100kg 바위가
   10kg 상자만큼 쉽게 밀린다. 그래서 쿨롱 마찰(F=μmg)을 손으로 얹는다 */
function mu(b){ return b.plugin&&b.plugin.mu||.3; }
function coulomb(){
  for(const e of ENTS){
    if(!has(e,'weigh')) continue;
    for(const b of e.bodies){
      if(b.isStatic) continue;
      if(!rayDown({x:b.position.x,y:b.bounds.max.y-2},7,b)) continue;   // 땅에 닿아 있을 때만
      const a=mu(b)*G, v=b.velocity.x;
      if(!v) continue;
      accel(b,-Math.sign(v)*Math.min(Math.abs(v),a));
    }
  }
}
/* ⚠ Matter는 isStatic 을 켤 때 friction을 1, restitution을 0으로 되돌린다.
   그래서 고정 물체는 만든 뒤에 재질을 다시 입혀야 한다 */
function mat(b,m){ for(const k in m) if(k!=='density'&&k!=='mu') b[k]=m[k]; return b; }
function tag(b,m){ b.plugin.mu=m.mu; return b; }

/* px/걸음² 단위로 가속시킨다 — Matter의 힘 단위를 매번 계산하지 않으려고 */
function accel(b,ax,ay){ b.force.x+=ax*b.mass/DT2; if(ay) b.force.y+=ay*b.mass/DT2; }
/* 힘에 한계를 두고 목표 속도로 밀어붙인다. 한계가 있어야 무거운 걸 못 민다 */
function driveX(b,targetVx,gain,maxAccel){
  const a=clamp((targetVx-b.velocity.x)*gain,-maxAccel,maxAccel);
  accel(b,a);
  return Math.abs(a)>=maxAccel-1e-6;       // 한계까지 썼다 = 버겁다
}
function addBody(b){ Composite.add(world,b); return b; }
function addJoint(j){ Composite.add(world,j); return j; }
function dropJoint(j){ if(j) Composite.remove(world,j); }
function jointLen(j){
  const a=j.bodyA?Vector.add(j.bodyA.position,j.pointA||{x:0,y:0}):j.pointA;
  const b=j.bodyB?Vector.add(j.bodyB.position,j.pointB||{x:0,y:0}):j.pointB;
  return Vector.magnitude(Vector.sub(a,b));
}
/* 발밑에 무엇이 있는지 — 짧은 광선 셋 */
function rayDown(from,len,skip){
  const hits=Query.ray(Composite.allBodies(world),from,{x:from.x,y:from.y+len},2);
  for(const h of hits){ const b=h.body;
    if(b===skip||b.isSensor||b.plugin.noStand) continue;
    return b; }
  return null;
}
/* 위에 올라타 있는 것들의 무게 합 — 발판·저울이 쓴다 */
function loadOn(body,pad){
  let m=0; const seen=new Set();
  for(const p of engine.pairs.list){
    if(!p.isActive) continue;
    const other = p.bodyA===body?p.bodyB : p.bodyB===body?p.bodyA : null;
    if(!other||other.isStatic||seen.has(other.id)) continue;
    if(other.position.y > body.position.y) continue;      // 위에 있는 것만
    seen.add(other.id); m+=other.mass;
  }
  return m;
}

/*═══════════════════════════════════════════════════════════════════════
  GAMEPLAY LAYER — 물체는 전부 데이터로 정의한다.
  새 물체를 넣을 때 아래 FACTORY 에 한 종류를 더할 뿐, 나머지는 손대지 않는다.
═══════════════════════════════════════════════════════════════════════*/
const ENTS=[];                       // 살아 있는 모든 물체
const BYID={};
let SEQ=0;

function ent(o){ o.id=o.id||('e'+(++SEQ)); ENTS.push(o); BYID[o.id]=o;
  /* 빠뜨렸을 때 돌아올 자리. 몸체마다 하나씩이라 배열이다.
     ⚠ 무게판·돌문은 제 자리를 {x,y} 로 직접 들고 온다(눌리고 올라가는 기준점이다).
        여기서 배열로 덮어쓰면 e.home.x 가 undefined 가 돼 Body.setPosition 이 NaN 을 받고,
        무게판도 돌문도 좌표가 NaN 이 돼 안 그려지고 아무것과도 부딪히지 않았다
        (=2500 무게판과 2680 돌문이 통째로 없었다). 오름길.html 은 이미 고쳐 둔 것을 옮겼다 */
  if(!o.home) o.home=o.bodies.map(b=>({x:b.position.x,y:b.position.y}));
  return o; }
function has(e,tag){ return e.tags&&e.tags.indexOf(tag)>=0; }

const FACTORY={
  /* 땅 — 움직이지 않는다 */
  land(d){
    const b=mat(addBody(Bodies.rectangle(d.x+d.w/2, d.y+d.h/2, d.w, d.h,
      {isStatic:true, collisionFilter:{category:CAT.TERRAIN}})), MAT.land);
    return ent({type:'land', tags:[], bodies:[b], box:d, draw:drawLand});
  },
  /* 나무 상자 — 가볍다. 밀리고, 끌리고, 쌓인다 */
  crate(d){
    const s=d.s||46;
    const b=addBody(Bodies.rectangle(d.x,d.y,s,s,Object.assign({
      collisionFilter:{category:CAT.PROP,mask:0xffff}, chamfer:{radius:3}},MAT.wood)));
    tag(b,MAT.wood);
    return ent({type:'crate', tags:['grab','weigh','link'], bodies:[b], s:s, draw:drawCrate});
  },
  /* 현무암 — 무겁다. 밀리긴 하는데 힘들다 */
  boulder(d){
    const r=d.r||30;
    const b=addBody(Bodies.polygon(d.x,d.y,9,r,Object.assign({
      collisionFilter:{category:CAT.PROP,mask:0xffff}},MAT.stone)));
    Body.setInertia(b,Infinity);                   // 울퉁불퉁한 바위는 구르지 않는다
    tag(b,MAT.stone);
    return ent({type:'boulder', tags:['grab','weigh','link'], bodies:[b], r:r, seed:d.x, draw:drawBoulder});
  },
  /* 널판 — 다리도 되고 지렛대도 된다 */
  plank(d){
    const b=addBody(Bodies.rectangle(d.x,d.y,d.w||240,d.h||16,Object.assign({
      collisionFilter:{category:CAT.PROP,mask:0xffff}},MAT.plank)));
    tag(b,MAT.plank); b.plugin.carry=true;          // 긴 널판은 수평으로 든다
    const e=ent({type:'plank', tags:['grab','weigh','link'], bodies:[b], w:d.w||240, h:d.h||16, draw:drawPlank});
    if(d.pivot){                                     // 가운데를 박아 두면 시소가 된다
      e.joints=[addJoint(Constraint.create({
        pointA:{x:d.x,y:d.y}, bodyB:b, pointB:{x:0,y:0}, length:0, stiffness:1, damping:.06}))];
      e.pivot={x:d.x,y:d.y};
    }
    return e;
  },
  /* 밧줄 — 마디를 이어 붙인다. 매달리면 실제로 흔들린다 */
  rope(d){
    const n=d.links||14, seg=d.seg||18, bodies=[], joints=[];
    for(let i=0;i<n;i++){
      const b=addBody(Bodies.rectangle(d.x, d.y+i*seg, 6, seg-3, Object.assign({
        collisionFilter:{category:CAT.ROPE, mask:CAT.PLAYER|CAT.PROP},
        slop:.02},MAT.rope)));
      b.plugin.noStand=true;
      bodies.push(b);
      joints.push(addJoint(Constraint.create(
        i===0 ? {pointA:{x:d.x,y:d.y-seg/2}, bodyB:b, pointB:{x:0,y:-seg/2}, length:0, stiffness:1, damping:.1}
              : {bodyA:bodies[i-1], pointA:{x:0,y:seg/2}, bodyB:b, pointB:{x:0,y:-seg/2}, length:0, stiffness:.98, damping:.08})));
    }
    return ent({type:'rope', tags:['hang','ropeEnd'], bodies:bodies, joints:joints,
                anchor:{x:d.x,y:d.y-seg/2}, seg:seg, draw:drawRope});
  },
  /* 줄에 매달린 널판 — 올라타면 무게로 기울고 흔들린다 */
  swing(d){
    const w=d.w||210;
    const p=addBody(Bodies.rectangle(d.x,d.y,w,14,Object.assign({
      collisionFilter:{category:CAT.PROP,mask:0xffff}},MAT.plank)));
    const j=[];
    for(const s of[-1,1]) j.push(addJoint(Constraint.create({
      pointA:{x:d.x+s*(w/2-10), y:d.y-(d.len||150)}, bodyB:p, pointB:{x:s*(w/2-10),y:0},
      length:d.len||150, stiffness:.9, damping:.04})));
    return ent({type:'swing', tags:['weigh'], bodies:[p], joints:j, w:w, len:d.len||150, draw:drawSwing});
  },
  /* 한 방향 발판 — 아래에서 뛰어 올라오면 통과하고, 위에 서면 딛는다. ↓ 로 내려간다.
     물건(상자·돌)에게는 그냥 단단한 발판이다 — 사람만 통과시킨다 */
  deck(d){
    const b=mat(addBody(Bodies.rectangle(d.x+ (d.w||160)/2, d.y+7, d.w||160, 14,
      {isStatic:true, collisionFilter:{category:CAT.DECK}})), MAT.land);
    b.plugin.oneway=true;
    return ent({type:'deck', tags:[], bodies:[b], box:{x:d.x,y:d.y,w:d.w||160,h:14}, draw:drawDeck});
  },
  /* 사다리 — 몸체가 없다. 지나가는 물건은 그냥 통과하고, 사람만 붙잡고 오르내린다 */
  ladder(d){
    return ent({type:'ladder', tags:[], bodies:[], x:d.x, y:d.y, h:d.h||200, w:d.w||34, draw:drawLadder});
  },
  /* 무게판 — 위에 올라온 것들의 무게를 잰다. 사람이 올라서도 눌린다 */
  /* 손잡이 — 바위벽에서 튀어나온 턱. 여기 매달렸다가 다음 손잡이로 뛰어 옮긴다(2026-08-27).
     몸체가 없다 — 잡히는 자리 하나일 뿐이다.
     crumble 을 주면 잡고 있는 동안 부스러진다 — 오래 매달리지 못한다 */
  grip(d){
    return ent({type:'grip', tags:[], bodies:[], x:d.x, y:d.y, w:d.w||30,
                crumble:d.crumble||0, life:0, gone:0, draw:drawGrip});
  },
  /* 벽 — 손잡이가 박힌 암벽. 붙으면 상하좌우로 기어간다(2026-08-27).
     몸체가 없다 — 사다리처럼 '사람만 아는 자리'다.
     그려지는 건 배경보다 진한 회색 바위면이라 검은 사람이 그 앞에서 뚜렷하다 */
  wall(d){
    return ent({type:'wall', tags:[], bodies:[], x:d.x, y:d.y, w:d.w||60, h:d.h||300, draw:drawWall});
  },
  plate(d){
    const b=mat(addBody(Bodies.rectangle(d.x,d.y,d.w||96,10,{
      isStatic:true, collisionFilter:{category:CAT.TERRAIN}})), MAT.land);
    return ent({type:'plate', tags:[], bodies:[b], need:d.need||8, w:d.w||96,
                home:{x:d.x,y:d.y}, sink:0, load:0, on:false, sig:d.sig,
                update:updPlate, draw:drawPlate});
  },
  /* 돌문 — 신호를 받으면 올라간다. 올라가며 물체를 밀어 올린다 */
  gate(d){
    const b=mat(addBody(Bodies.rectangle(d.x,d.y,d.w||44,d.h||150,{
      isStatic:true, collisionFilter:{category:CAT.TERRAIN}})), MAT.land);
    return ent({type:'gate', tags:[], bodies:[b], w:d.w||44, h:d.h||150,
                home:{x:d.x,y:d.y}, lift:d.lift||150, open:0, by:d.by,
                update:updGate, draw:drawGate});
  }
};
function spawn(d){ return FACTORY[d.t](d); }

/* ── 신호: 무게판이 눌리면 문이 열린다. 관계는 문자열로만 이어 둔다 ── */
const SIG={};
function updPlate(e,dt){
  const b=e.bodies[0];
  e.load=loadOn(b);
  const want=clamp(e.load/e.need,0,1)*9;              // 무거울수록 더 내려앉는다
  e.sink=lerp(e.sink,want,.18);
  Body.setPosition(b,{x:e.home.x, y:e.home.y+e.sink});
  e.on = e.load>=e.need;
  if(e.sig) SIG[e.sig]=e.on;
}
function updGate(e,dt){
  const want=(e.by&&SIG[e.by])?1:0;
  e.open=lerp(e.open,want,.055);
  const b=e.bodies[0];
  Body.setPosition(b,{x:e.home.x, y:e.home.y-e.lift*e.open});
}

/*═══════════════════════════════════════════════════════════════════════
  주인공 — 강체다. 몸으로 밀고, 손으로 잡는다.
═══════════════════════════════════════════════════════════════════════*/
const P={body:null, grounded:null, coyote:0, buf:0, face:1, ph:0, st:'idle',
         hold:null, holdJoint:null, hang:null, hangJoint:null, dead:0, spawn:{x:0,y:0}};
/* JUMP 8.3 = 55px 뜬다. 키 108px 를 170cm 로 치면 87cm — 사람이 뛸 수 있는 높이다.
   (예전 11.6 은 103px = 163cm 였다. 자기 키만큼 뛰었으니 공처럼 보일 수밖에)
   ⚠ 이 높이로는 상자(83px) 위에 못 올라간다. 손으로 기어오르는 tryLedge 가 그 몫을 한다 */
const SPEED=2.95, JUMP=8.3;
const GRAV=.62;                      // engine.gravity.y=2.232 를 px/걸음² 로 환산한 값
/* 인물 크기 — LIMBO 10.4% · INSIDE 9.6% · 예전 오름길 20.4%(화면 높이 대비).
   작아야 같은 움직임이 차분해 보인다. 1.5로 낮추니 12.6%가 되고,
   덤으로 그린 발끝이 물리 몸체 바닥과 맞아떨어진다(2.1일 땐 13px 파묻혔다) */
const FIG=1.5, FEET=23*FIG;
const PUSH_MAX=1.55;                 // 제 몸을 움직이는 힘의 한계(px/걸음²)
/* ⚠ Matter의 접촉 해결기는 밀어 옮기는 힘을 잘 전달하지 못한다(반복 횟수를 아무리 올려도
   0.5px/걸음에서 막힌다). 그래서 닿아 있는 물체에는 사람의 완력을 직접 실어 준다.
   힘이지 속도가 아니므로 무거운 물체일수록 느리게 움직인다 — 원하던 그대로다 */
const STRENGTH=0.55;                 // 제 몸무게의 55%까지 밀 수 있다. 그 이상은 안 밀린다
const REACH=104;

function makePlayer(px,py){
  P.body=addBody(Bodies.rectangle(px,py,24,70,Object.assign({
    chamfer:{radius:9}, collisionFilter:{category:CAT.PLAYER,mask:0xffff}},MAT.person)));
  Body.setInertia(P.body,Infinity);                   // 넘어지지는 않는다
  P.spawn={x:px,y:py};
}
function handPoint(){
  const b=P.body;
  return {x:b.position.x+P.face*17, y:b.position.y+(P.crouch?22:-4)};   // 앉으면 손이 내려간다
}
function grabbables(){
  const out=[];
  for(const e of ENTS) if(has(e,'grab')) for(const b of e.bodies) out.push({e:e,b:b});
  return out;
}
function nearestGrab(){
  const h=handPoint(); let best=null,bd=REACH;
  for(const g of grabbables()){
    /* ⚠ 물체의 '중심'까지 재면 290짜리 널판은 한가운데 서야만 잡힌다.
       끝자락에 앉아서 아무리 눌러도 안 잡혔다(2026-08-23 신고).
       몸통에서 손에 가장 가까운 점까지 잰다 */
    const bb=g.b.bounds;
    const cx=clamp(h.x,bb.min.x,bb.max.x), cy=clamp(h.y,bb.min.y,bb.max.y);
    const d=Math.hypot(h.x-cx,h.y-cy);
    if(d<bd){bd=d;best=g;}
  }
  return best;
}
function grab(){
  const g=nearestGrab(); if(!g) return;
  const b=g.b, h=handPoint();
  /* 긴 널판은 몸을 숙여야 든다(사용자 지시 2026-08-23).
     서서 툭 집어드는 것보다 무게가 실려 보이고, 실수로 집는 일도 없다 */
  if(b.plugin.carry&&!P.crouch) return;
  if(b.isStatic){ Body.setStatic(b,false); mat(b,MAT.plank); tag(b,MAT.plank); b.plugin.bridged=0; }   // 굳은 다리를 도로 뜯어낸다
  /* 긴 널판은 한쪽 끝을 잡으면 대롱대롱 돌아 다리로 못 놓는다.
     가운데 근처를 잡되 몸 쪽으로 조금 치우쳐 잡아 널판이 앞으로 뻗게 한다
     (정가운데를 잡으면 널판이 몸을 관통해 보인다) */
  const local = b.plugin.carry
    ? {x:-P.face*(g.e.w||220)*0.30, y:0}
    : Vector.rotate(Vector.sub(h,b.position), -b.angle);
  /* 손과 물체를 용수철로 잇는다. 순간이동시키지 않는다.
     같은 뻣뻣함이라도 무거운 물체는 덜 끌려온다 — 그게 무게의 체감이다 */
  P.holdJoint=addJoint(Constraint.create({
    bodyA:P.body, pointA:{x:P.face*13, y: b.plugin.carry?-20:(P.crouch?10:-20)},   // 앉았으면 낮게 잡는다(널판은 늘 손 높이)
    bodyB:b, pointB:local,
    length: b.plugin.carry?8:12,          // 널판은 손 높이에 붙여 든다(26이면 발치에 끌듯 보였다)
    /* 널판을 들 때 물렁하면 앞끝이 처져 구덩이로 처박힌다(2026-08-22 영상으로 확인).
       .06 → .16 으로 단단히 쥔다 */
    /* 널판은 용수철로 매달지 않는다. 아래 playerStep 에서 손 위치에 그대로 박아 넣는다.
       이 관절은 '들고 있다'는 표시일 뿐이다.
       ⚠ 그렇다고 stiffness 를 0 으로 주면 안 된다 — Matter 는 `stiffness || 기본값` 으로 읽어서
         0 을 주면 오히려 1(꽉 묶인 막대)이 된다. 그 바람에 앉아서 집은 뒤 일어서면
         손 높이가 34 어깼나면서 막대가 사람을 계속 잡아채고,
         널판을 들면 사람이 하늘로 솔아올랐다(2026-08-27 신고 · 봇으로 재현).
         아주 작은 값을 줘서 힘을 안 쓰는 관절로 만든다 */
    stiffness: b.plugin.carry?1e-6:.035, damping: b.plugin.carry?0:.10}));
  P.hold=g.e; P.holdBody=b;
  /* ⚠ 긴 널판을 들고 걸으면 앞에 있던 상자·현무암을 죄다 밀어 구덩이로 쓸어 넣었다
     (2026-08-22 영상). 들고 있는 동안은 물건·사람을 통과하고, 땅에만 걸린다 */
  if(b.plugin.carry){
    b.collisionFilter.mask = CAT.TERRAIN|CAT.DECK;
    /* 무거운 널판은 용수철만으론 못 들어올려 땅에 끌린다. 집는 순간 들어 올린다 —
       사람도 각목을 끌고 가지 않고 한 번에 든다 */
    Body.setAngle(b,0); Body.setAngularVelocity(b,0); Body.setVelocity(b,{x:0,y:0});
    Body.setPosition(b,{ x:P.body.position.x+P.face*(13+(g.e.w||240)*.30),
                         y:P.body.position.y-20+8 });
  }
}
/* 발끝에 걸린 낮은 턱(널판 끝·돌부리)은 걸음으로 넘는다.
   ⚠ 이게 없으면 걸쳐 놓은 널판의 17px 모서리에 막혀 다리를 못 건넌다.
     사람은 그 정도 턱에서 멈춰 서지 않는다 */
const STEP_MAX=24;
function stepUp(dir){
  const b=P.body;
  if(!dir||!P.grounded||P.onLadder||P.ledge) return;
  /* '속도'가 아니라 '실제로 나아갔는지'로 본다 — 모서리에 붙어 헛도는 동안에도
     속도는 0.6 씩 찍혀서 속도로 재면 영영 못 넘는다 */
  const prog=(b.position.x-(P.lastX===undefined?b.position.x:P.lastX))*dir;
  P.lastX=b.position.x;
  if(prog>.45){ P.blockT=0; return; }
  const feet=b.bounds.max.y, fx=b.position.x+dir*16;
  /* ⚠ 첫 번째로 맞는 것만 보면 안 된다 — 널판 밑의 땅이 먼저 잡혀서 늘 퇴짜였다.
     걸린 것들 중 '가장 높은 윗면'을 골라야 널판 모서리를 넘는다 */
  const hits=Query.ray(Composite.allBodies(world), {x:fx,y:feet-STEP_MAX-2}, {x:fx,y:feet+4}, 2);
  let top=null;
  for(const h of hits){
    const q=h.body;
    if(q===b||q.isSensor||q.plugin.noStand) continue;
    const t=q.bounds.min.y;
    if(t>feet-3||t<feet-STEP_MAX) continue;              // 넘을 만한 높이만
    if(top===null||t<top) top=t;
  }
  if(top===null){ P.blockT=0; return; }
  if(rayDown({x:fx,y:top-66}, 44, b)) return;            // 머리 위가 막혔으면 못 넘는다
  /* ⚠ 조금씩 밀어올리면 모서리에 낀 채 위아래로 떨린다.
     몇 칸 막혀 있으면 한 번에 올라선다 — 사람이 턱을 넘는 것도 한 걸음이다 */
  P.blockT=(P.blockT||0)+1;
  if(P.blockT<5) return;
  P.blockT=0;
  Body.setPosition(b,{x:b.position.x+dir*13, y:top-36});
  Body.setVelocity(b,{x:dir*1.2, y:0});
}

/* 구덩이 목록 — 땅 사이의 빈 곳 */
function gaps(){
  const L=ENTS.filter(e=>e.type==='land').map(e=>e.box).sort((a,b)=>a.x-b.x), out=[];
  for(let i=0;i<L.length-1;i++){
    const a=L[i], b=L[i+1], g=b.x-(a.x+a.w);
    if(g>40&&Math.abs(a.y-b.y)<8) out.push({L:a.x+a.w, R:b.x, y:a.y, w:g});
  }
  return out;
}
/* 널판을 놓을 때, 구덩이에 걸칠 만하면 걸쳐 준다.
   ⚠ 물리에만 맡기면 손에서 미끄러져 구덩이로 빠진다 — 사람은 그렇게 다리를 놓지 않는다.
     "걸칠 만한 자리"에서 놓았을 때만 도와주고, 엉뚱한 데서 놓으면 그냥 떨어진다 */
function snapBridge(e,q,auto){
  if(!q||!e||e.pivot) return;
  for(const g of gaps()){
    if(e.w < g.w+24) continue;                       // 널판이 구덩이보다 짧으면 못 놓는다
    const px=P.body.position.x;
    if(px < g.L-190 || px > g.R+190) continue;       // 구덩이 근처에서만 도와준다
    if(Math.abs(q.position.y-g.y) > 130) continue;
    /* 양쪽에 12씩 걸치는 자리의 범위. 지금 자리에서 제일 가까운 데로 붙인다 —
       가운데로 순간이동시키면 손에서 튀어나간 것처럼 보인다 */
    const lo=g.R-(e.w/2-12), hi=g.L+(e.w/2-12);
    const slack = auto ? 46 : e.w*.55;               // 들고 대면 바짝, 던져 놓으면 넉넉히
    if(q.position.x < lo-slack || q.position.x > hi+slack) continue;
    /* 윗면을 지면 높이에 맞춘다. 위에 얹으면 양끝에 17px 턱과 낙차가 생겨 오르내릴 때 걸린다 */
    const at={x:clamp(q.position.x,lo,hi), y:g.y+(e.h||16)/2};
    Body.setAngle(q,0); Body.setAngularVelocity(q,0); Body.setVelocity(q,{x:0,y:0});
    Body.setPosition(q,at);
    /* 굳혀서 땅으로 만든다. ⚠ Matter 는 isStatic 을 켤 때 friction 을 1,
       restitution 을 0 으로 되돌린다 — 재질을 다시 입혀야 한다 */
    Body.setStatic(q,true); mat(q,MAT.plank); tag(q,MAT.plank);
    q.plugin.bridged=1; q.plugin.bridgeAt=at;
    return true;
  }
}
/* 잡기 / 놓기 — 키보드도 손가락도 봇도 이 하나를 쓴다 */
function useHand(){
  if(P.grip){ P.gripFrom=P.grip; P.grip=null; P.gripCool=10; return; }   // 손잡이를 잡고 있으면 E 는 '손 놓기'다
  if(P.holdJoint) letGo();
  else if(P.hangJoint) letGoRope();
  else if(!tryTie()) if(!hangOn()) grab();
}
function letGo(){
  const e=P.hold, q=P.holdBody;
  dropJoint(P.holdJoint); P.holdJoint=null; P.hold=null; P.holdBody=null;
  const bridged = q && (q.plugin.bridged || (e&&e.type==='plank'&&snapBridge(e,q)));
  if(!q) return;
  if(q.plugin.carry&&!bridged){
    /* 들고 있는 널판은 절반이 몸 속에 걸쳐 있다.
       놓는 순간 충돌을 되살리면 파묻힌 둘이 서로를 밀어낸다 —
       몸에서 빠져나올 때까지는 땅과만 부딪히고 사람은 그냥 통과시킨다 */
    q.collisionFilter.mask = CAT.TERRAIN|CAT.DECK|CAT.PROP;
    q.plugin.ghost = 1;
  } else q.collisionFilter.mask=0xffff;
}
/* 놓은 널판이 몸에서 완전히 빠져나오면 그제서야 사람과도 부딪힌다 */
function clearGhost(){
  const B=P.body.bounds;
  for(const e of ENTS) for(const q of e.bodies){
    if(!q.plugin.ghost) continue;
    const A=q.bounds;
    if(A.min.x<B.max.x&&A.max.x>B.min.x&&A.min.y<B.max.y&&A.max.y>B.min.y) continue;
    q.plugin.ghost=0; q.collisionFilter.mask=0xffff;
  }
}
/* 널판은 '가만히 놓인 것'과 '든 것' 둘뿐이다.
   ⚠ 바닥에 누운 널판을 물렁하게 두면 몸으로 밀려 구덩이에 빠진다(2026-08-23 영상).
     널판은 무거워서 사람이 걷다 밀 수 있는 물건이 아니다 — 멈춰 서면 그 자리에 굳는다.
     들려면 앉아서(↓) E. 그때만 풀린다 */
function holdBridges(){
  for(const e of ENTS){
    if(e.type!=='plank'||e.pivot) continue;
    const q=e.bodies[0];
    if(P.holdBody===q){ q.plugin.bridged=0; continue; }
    if(q.isStatic) continue;
    if(Math.abs(q.velocity.x)+Math.abs(q.velocity.y)+Math.abs(q.angularVelocity)*24 > .5) continue;
    if(!rayDown({x:q.position.x, y:q.bounds.max.y-2}, 10, q)) continue;   // 땅에 닿아 멈췄을 때만
    Body.setStatic(q,true); mat(q,MAT.plank); tag(q,MAT.plank);
  }
}
function hangOn(){
  let best=null,bd=REACH*.8; const h={x:P.body.position.x,y:P.body.position.y-30};
  for(const e of ENTS) if(has(e,'hang')) for(const b of e.bodies){
    const d=Vector.magnitude(Vector.sub(b.position,h));
    if(d<bd){bd=d;best=b;}
  }
  if(!best) return false;
  P.hangJoint=addJoint(Constraint.create({
    bodyA:P.body, pointA:{x:0,y:-32}, bodyB:best, pointB:{x:0,y:0},
    length:6, stiffness:.85, damping:.12}));
  P.hang=best; return true;
}
function letGoRope(){ dropJoint(P.hangJoint); P.hangJoint=null; P.hang=null; }

let TIE=null;
/* 밧줄 끝을 물체에 묶는다 — 이것도 E 하나로 한다(사용자 지시 2026-08-27. 예전엔 F 였다).
   손이 밧줄 끝에 닿고, 그 끝 곁(70)에 상자·돌 같은 게 있을 때만 묶인다.
   그 외엔 예전처럼 매달리거나 집는다 — 묶을 자리가 아니면 E 는 아무것도 달라지지 않는다 */
function tryTie(){
  const h=handPoint();
  if(TIE){
    const p=TIE.bodyA.position;
    if(Math.hypot(h.x-p.x,h.y-p.y)>REACH) return false;      // 멀리서는 안 풀린다
    dropJoint(TIE); TIE=null; return true;
  }
  /* ⚠ 예전엔 세상의 첫 번째 밧줄을 집었다 — 밧줄이 둘이 되면서
     멀리 떨어진 2막 밧줄이 묶였다. 손에서 가까운 끝을 고른다 */
  /* 묶는 건 집는 것보다 팔을 더 뻗는다 — 물건을 밀고 있으면 사람은 그것만큼 뒤에 있다.
     REACH 그대로는 벼랑 끝에서 104.3 이 나와 간신하게 안 닿았다(봇으로 확인) */
  let end=null,bd=REACH*1.5;
  for(const e of ENTS){
    if(e.type!=='rope') continue;
    const q=e.bodies[e.bodies.length-1];
    const d=Math.hypot(h.x-q.position.x, h.y-q.position.y);
    if(d<bd){ bd=d; end=q; }
  }
  if(!end) return false;
  /* 끝과 물건이 얼마나 가까워야 묶이는가 — 70 은 너무 빡빡해서
     벼랑 끝까지 밀고 와도 안 묶이고 대신 들려 버렸다(봇으로 확인). 100 으로 늘렸다 */
  let link=null;
  for(const e of ENTS) if(has(e,'link')) for(const b of e.bodies){
    if(Vector.magnitude(Vector.sub(b.position,end.position))<100){ link=b; break; }
  }
  if(!link) return false;
  TIE=addJoint(Constraint.create({bodyA:end,pointA:{x:0,y:8},bodyB:link,pointB:{x:0,y:0},
    length:14, stiffness:.9, damping:.1}));
  return true;
}


const DEAD=980;
function respawn(){
  /* 처음부터 다시가 아니라 마지막으로 발 붙였던 자리에서 다시 시작한다.
     아직 한 번도 땅을 밟은 적이 없으면(시작하자마자 죽으면) 원래 시작 자리로 */
  const at = P.safe || P.spawn;
  Body.setPosition(P.body, at); Body.setVelocity(P.body,{x:0,y:0});
  Body.setAngle(P.body,0); Body.setAngularVelocity(P.body,0);
  letGo(); letGoRope(); P.ledge=null; P.climb=0; P.grip=null; P.gripFrom=null; P.onLadder=null; P.dead=0;
  for(const e of ENTS) if(e.type==='grip'){ e.gone=0; e.life=0; }   // 부서졌던 손잡이도 돌아온다
  cam=P.body.position.x-W*.42;                       // 화면도 그 자리로 — 옆으로 주욱 흐르지 않게
}
function playerStep(){
  PHYS++;
  const b=P.body;
  if(P.dead){ P.dead++; if(P.dead>34) respawn(); return; }

  const dir=(RIGHT()?1:0)-(LEFT()?1:0);
  /* 무언가를 잡고 있으면 그걸 계속 마주 본다.
     손으로 잡은 채 등을 돌리면 팔이 물건에서 떨어져 보인다 — 사람은 그렇게 안 든다.
     멀어지는 쪽으로 가면 마주 본 채 뒷걸음질로 끌고 온다.
     (널판처럼 앞으로 안고 가는 물건은 예외 — 그건 몸을 돌려야 방향을 바꾼다) */
  const dragging = P.holdJoint&&P.holdBody&&!P.holdBody.plugin.carry;
  if(dragging){
    const dx=P.holdBody.position.x-b.position.x;
    if(Math.abs(dx)>6) P.face = dx>0?1:-1;          // 바로 옆에서 떨릴 땐 그대로 둔다
    P.turn=0;
  }
  else if(dir&&dir!==P.face){ P.turn=(P.turn||0)+1; if(P.turn>3){ P.face=dir; P.turn=0; } }
  else P.turn=0;

  /* 사다리 — 오르내리는 동안은 중력도 걸음도 멈춘다.
     ↑ 가 뛰기와 겹치므로, 사다리에 몸이 닿아 있으면 뛰기 대신 오르기가 된다.
     내리려면 ↓, 벗어나려면 ← → 를 누른다 */
  b.collisionFilter.mask = deckPass(b) ? (0xffff & ~CAT.DECK) : 0xffff;   // 한 방향 발판 통과 여부
  /* ── 손잡이 매달리기(2026-08-27) ──
     예전엔 범 칸 안을 상하좌우 자유롭게 기어다녔다 — 사용자 말대로 벌레처럼 보였다.
     이젠 바위벽에서 튀어나온 손잡이에만 매달린다.
     ← → ↑ 을 누르면 그쪽 손잡이로 **뛰어** 오른다 — 난간난간 건너가는 그 맛이다.
     매달릴 수 있는 범위 밖이면 그쪽으로는 못 간다(헛발 디딛고 떨어지지는 않는다) */
  if(P.gripCool>0) P.gripCool--;
  if(P.grip && P.grip.gone) P.grip=null;
  /* 공중에서 손이 닿는 손잡이가 있으면 저절로 잡는다 */
  if(!P.grip && !P.grounded && !P.holdJoint && !P.hangJoint && !P.ledge && !P.onLadder && !(P.gripCool>0)){   /* ⚠ P.gripCool<=0 으로 쓰면 안 된다 — 아직 없는 값(undefined)과의 비교는 항상 거짓이라 영영 안 잡혔다 */
    const g=gripNear(b.position.x, b.position.y-30, GRIP_R, P.gripFrom);
    if(g){ P.grip=g; P.gripFrom=null; g.life=0; }
  }
  if(P.grip){
    const g=P.grip;
    Body.setVelocity(b,{x:0,y:0});
    Body.setPosition(b,{x:g.x, y:g.y+30});
    Body.setAngle(b,0); Body.setAngularVelocity(b,0);
    P.grounded=null; P.st='grip'; P.wasAir=0; P.landT=0;
    P.gripT=(P.gripT||0)+1;
    if(g.crumble){                                   // 부스러지는 손잡이
      g.life++;
      if(g.life>g.crumble){ g.gone=1; P.grip=null; P.gripFrom=null; shake=8;
        Body.setVelocity(b,{x:0,y:1}); }
    }
    if(P.grip){
      if(DOWN()){ P.grip=null; P.gripFrom=g; P.gripCool=10; Body.setVelocity(b,{x:0,y:1.5}); }
      else if(dir||UP()){
        const t=gripTarget(g, dir, UP());
        if(t) leapTo(g, t);
        else if(UP()){                          // 더 잡을 게 없으면 그냥 몸을 끌어올린다 — 꾭대기 발판으로
          P.grip=null; P.gripFrom=g; P.gripCool=14; P.leapT=8;
          Body.setVelocity(b,{x:(dir||P.face)*2.0, y:-JUMP*1.02});
        }
      }
      if(P.grip||P.gripFrom){ if(b.position.y>DEAD) die(); return; }
    }
  }

  const lad=ladderAt(b);
  if(P.onLadder&&(!lad||P.holdJoint)) P.onLadder=null;
  if(lad&&!P.holdJoint&&!P.hangJoint&&!P.ledge&&(UP()||DOWN())) P.onLadder=lad;
  if(P.onLadder&&dir) P.onLadder=null;                   // 옆으로 가면 손을 놓는다
  if(P.onLadder){
    const L=P.onLadder, top=L.y+18, bot=L.y+L.h+10;
    let vy=UP()?-2.3:DOWN()?2.6:0;
    if(b.position.y<=top&&vy<0) vy=0;                    // 꼭대기에서 더 안 올라간다
    if(b.position.y>=bot&&vy>0) vy=0;
    Body.setVelocity(b,{x:0,y:vy});
    Body.setPosition(b,{x:lerp(b.position.x,L.x,.35), y:clamp(b.position.y,top,bot)});
    Body.setAngle(b,0); Body.setAngularVelocity(b,0);
    P.lph=(P.lph||0)+Math.abs(vy)*.10;                   // 오른 만큼 팔다리가 바뀐다
    P.grounded=null; P.st='ladder'; P.wasAir=0; P.landT=0;
    if(b.position.y>DEAD) die();
    return;
  }

  /* 밧줄에 매달렸을 때 — 발은 땅에 없고, 좌우로 힘을 주면 그네가 된다 */
  if(P.hangJoint){
    P.grounded=null;
    if(dir) accel(b,dir*.42);                  // 몸을 흔들어 그네를 키운다
    if(UP()&&P.buf===0){ letGoRope(); Body.setVelocity(b,{x:b.velocity.x,y:-JUMP*.78}); P.buf=12; }
    if(P.buf>0)P.buf--;
    P.st='hang';
    if(b.position.y>DEAD) die();
    return;
  }

  /* 모서리에 매달렸을 때 */
  if(P.ledge){
    const L=P.ledge;
    if(L.body){                                      // 상자에 매달렸다 — 오르는 동안 상자를 붙잡아 둔다
      Body.setVelocity(L.body,{x:0,y:0}); Body.setAngularVelocity(L.body,0);
      L.x = L.side>0 ? L.body.bounds.min.x : L.body.bounds.max.x;
      L.y = L.body.bounds.min.y;
    }
    Body.setVelocity(b,{x:0,y:0}); Body.setAngle(b,0);
    if(P.climb>0){
      P.climb+=1/LEDGE_UP;
      const k=Math.min(1,P.climb), c=ease(clamp((k-.30)/.70,0,1));
      Body.setPosition(b,{ x:lerp(L.x-L.side*14, L.x+L.side*22, c),
                           y:lerp(L.y+34, L.y-35, c) });
      if(k>=1){ P.ledge=null; P.climb=0; }
    } else {
      Body.setPosition(b,{x:L.x-L.side*14, y:L.y+34});
      if(UP()) P.climb=.001;
      else if(DOWN()){ P.ledge=null; Body.setVelocity(b,{x:0,y:1.5}); }
    }
    P.grounded=null; P.st='ledge';
    return;
  }

  const gC=rayDown({x:b.position.x,    y:b.bounds.max.y-3}, 8, b),
        gL=rayDown({x:b.position.x-8,  y:b.bounds.max.y-3}, 8, b),
        gR=rayDown({x:b.position.x+8,  y:b.bounds.max.y-3}, 8, b);
  P.grounded = gC||gL||gR;

  /* 죽은 자리 근처에서 다시 시작하려고, 마지막으로 발 붙였던 자리를 적어 둔다(2026-08-27).
     ⚠ 움직이는 것 위는 안 적는다 — 그네 널판이나 밀리는 상자 자리에 되살아나면 또 떨어진다.
       굳지 않은 물건도 마찬가지다. 땅·발판·걸쳐 굳은 널판(전부 isStatic)만 인정한다.
     들고 있던 널판은 죽을 때 놓게 되므로, 되살아나면 널판은 제 자리에 남아 있다 */
  /* ⚠ 발 한쪽만 걸쳐도 '땅을 밟았다'가 되기 때문에, 벼랑 밖으로 10쯤 나간 자리가
     안전한 자리로 적혔 되살아나자마자 또 떨어졌다(봇으로 확인).
     세 줄기 전부 땅에 닿을 때만 — 즉 몸 양쪽으로 땅이 있을 때만 적는다 */
  if(gC&&gL&&gR && gC.isStatic&&gL.isStatic&&gR.isStatic && !P.dead && Math.abs(b.velocity.y)<4)
    P.safe={x:b.position.x, y:b.position.y-2};

  /* 걷기 — 목표 속도로 밀어붙이되 완력에 한계가 있다.
     무거운 걸 밀고 있으면 그 한계에 먼저 걸려서 느려진다 */
  /* 미는 힘을 먼저 셈한다 — 버거운 만큼 내 걸음도 느려져야 하니까 */
  const pushedMass=bodyPush(dir);
  coulomb();
  const carry=P.holdBody?P.holdBody.mass:0;
  const load=clamp(P.strain,0,1.5);
  const want = P.strain>=1 ? 0                          // 꿈쩍도 안 하는 걸 밀 때는 제자리
             : dir*SPEED*(1-load*.9)*(carry>40?.62:1);
  const gain=P.grounded?.20:.10;                        // 천천히 붙고
  /* 널판을 들면 제 몸 + 널판을 함께 움직여야 한다. 힘의 한계를 늘려 주지 않으면
     목표 속도(이미 0.62배로 줄여 둔)에 영영 못 닿아 진창을 걷는 것처럼 느리다 */
  const cap =P.grounded?(P.holdBody&&P.holdBody.plugin.carry?PUSH_MAX*2.4:PUSH_MAX):PUSH_MAX*.34;
  const strained=driveX(b,want,gain,cap);
  if(!dir&&P.grounded) driveX(b,0,.10,.28);             // 미끄러지듯 선다

  /* 뛰기 — 코요테 시간과 선입력은 그대로.
     ⚠ 예전엔 ↑ 를 누르고만 있어도 딛는 즉시 다시 떴다. 공처럼 통통 튀었다.
       사람은 착지를 한 번 받아내고 다시 뛴다 — 새로 누른 순간에만 받고, 딛고 나서 잠깐 못 뛴다 */
  const upNow=UP()?1:0;
  if(upNow&&!P.upWas) P.buf=8; else if(P.buf>0) P.buf--;
  P.upWas=upNow;
  if(P.grounded) P.coyote=7; else if(P.coyote>0) P.coyote--;
  // landT 는 처음엔 없다 — (P.landT||0) 으로 읽어야 첫 점프가 막히지 않는다
  if(P.buf>0&&P.coyote>0&&(P.landT||0)<5){ Body.setVelocity(b,{x:b.velocity.x,y:-JUMP}); P.buf=0; P.coyote=0; P.grounded=null; }
  if(!upNow&&b.velocity.y<-4) accel(b,0,.55);           // 짧게 누르면 낮게 뛴다

  /* 오를 때보다 내릴 때가 무겁다. 정점 높이는 그대로라 오르던 지형은 그대로 오른다 */
  if(!P.grounded&&b.velocity.y>0){
    accel(b,0,GRAV*.5);
    if(b.velocity.y>20) Body.setVelocity(b,{x:b.velocity.x,y:20});   // 얇은 널판을 뚫지 않게
  }

  /* 널판을 들고 있으면 **아예 안 기운다**.
     용수철로 수평을 잡아 봤지만 앞끝이 구덩이 위로 나가는 순간 기울어 처박혔다(사용자 영상).
     사람이 각목을 들면 각목은 사람 손에서 안 돈다 — 각도를 그냥 0 으로 못 박는다 */
  if(P.holdBody&&P.holdBody.plugin.carry){
    const q=P.holdBody, w=(P.hold&&P.hold.w)||240;
    /* 손 위치에 그대로 박아 넣는다 — 흔들림도 처짐도 없다.
       앉으면 같이 내려온다(앉아서 드는데 널판만 가슴 높이면 몸을 뚫은 것처럼 보인다) */
    Body.setAngle(q,0); Body.setAngularVelocity(q,0);
    Body.setPosition(q,{ x:b.position.x+P.face*(13+w*.30),
                         y:b.position.y+(P.crouch?14:-20)+8 });
    Body.setVelocity(q,{x:b.velocity.x, y:b.velocity.y});
    /* 구덩이에 갖다 대면 저절로 걸쳐지고 손에서 놓인다 */
    if(P.grounded&&snapBridge(P.hold,q,true)) letGo();
  }

  /* 안전장치 — 사람이 제 달려드는 힘보다 빨리 위로 솔는 일은 없다.
     물리가 터져도 하늘로 날아가지만은 않게 받친다 */
  if(b.velocity.y < -JUMP*1.3) Body.setVelocity(b,{x:b.velocity.x, y:-JUMP*1.3});

  stepUp(dir);                                     // 낮은 턱은 걸음으로 넘는다
  holdBridges();                                   // 걸쳐 둔 널판은 자리를 지킨다
  clearGhost();                                    // 놓은 널판은 몸에서 빠진 뒤에 부딪힌다
  if(!P.grounded) tryLedge();

  /* 잡고 있던 게 너무 멀어지면 놓친다 */
  if(P.holdJoint&&jointLen(P.holdJoint)>128) letGo();

  Body.setAngle(b,0); Body.setAngularVelocity(b,0);

  /* 구덩이에 빠뜨린 물건은 제자리로 돌려놓는다.
     널판을 빠뜨리면 길이 영영 막혀 버린다 */
  for(const e of ENTS){
    if(e.type==='land'||e.type==='rope'||e.type==='swing'||e.type==='gate'||e.type==='plate') continue;
    for(let i=0;i<e.bodies.length;i++){
      const q=e.bodies[i];
      if(q.isStatic||q.position.y<=760) continue;      // 땅(600)보다 한참 아래면 이미 구덩이 — 바로 돌려놓는다
      if(P.holdBody===q) letGo();
      Body.setPosition(q, e.home[i]); Body.setAngle(q,0);
      Body.setVelocity(q,{x:0,y:0}); Body.setAngularVelocity(q,0);
    }
  }

  /* ⚠ 예전엔 .034 였다 — 한 주기(두 걸음)에 185px 를 가는 셈인데,
     다리 길이(31px)로 뻗을 수 있는 보폭은 한 걸음에 33px 뿐이다.
     모자란 거리의 절반을 발이 미끄러져 메웠다 — 이게 ‘사람 같지 않다’의 정체였다(2026-08-27).
     주기를 보폭에 맞춘다: 2π / (2×33px) = 0.095 */
  P.ph+=Math.abs(b.velocity.x)*.095;                   // 보폭 33px 에 맞춘 걸음 주기
  P.sp=lerp(P.sp||0, Math.min(1,Math.abs(b.velocity.x)/3.2), .10);
  /* 착지 — 세게 떨어질수록 깊이 주저앉고 오래 추스른다.
     예전엔 1cm 를 내려오나 3층에서 떨어지나 똑같은 착지였다(2026-08-27) */
  if(P.grounded&&P.wasAir>4){
    const hit=clamp((P.vyPrev||0)/13,0,1.6);       // 떨어지던 속도
    P.impact=hit;
    P.landT=Math.round(9+hit*13);
    P.landMax=P.landT;
    if(hit>.95){ P.stumble=Math.round(10+hit*8); shake=Math.max(shake,3+hit*4); }
  }
  P.vyPrev=b.velocity.y;
  if(P.stumble>0){ P.stumble--; }
  if(P.leapT>0){ P.leapT--; }
  P.wasAir = P.grounded ? 0 : (P.wasAir||0)+1;
  if(P.landT>0) P.landT--;

  /* 한 방향 발판 위에서 ↓ 를 누르면 내려간다(앉지 않는다) */
  if(P.dropT>0) P.dropT--;
  if(DOWN()&&P.grounded&&P.grounded.plugin.oneway&&!P.holdJoint&&(P.dropT||0)===0){
    P.dropT=16; P.grounded=null; Body.setVelocity(b,{x:b.velocity.x,y:1.6});
  }
  P.crouch = (DOWN()&&P.grounded&&!P.grounded.plugin.oneway&&!P.hangJoint&&!P.ledge) ? 1 : 0;
  P.st = P.crouch&&Math.abs(b.velocity.x)<1.2 ? 'crouch'
       : P.leapT>0 ? 'reach'
       : P.stumble>0&&P.grounded ? 'stumble'
       : P.landT>0&&P.grounded ? 'land'
       : !P.grounded ? (b.velocity.y<0?'jump':'fall')
       : P.strain>.35||(P.holdJoint&&strained) ? 'push'
       : Math.abs(b.velocity.x)>(P.st==='walk'?.18:.5) ? 'walk' : 'idle';
  if(b.position.y>DEAD) die();
}
function die(){ P.dead=1; shake=14; }

/* 한 방향 발판 — 사람이 아래에서 올라올 때(또는 ↓ 로 내려갈 때)만 충돌을 끈다.
   ⚠ 물건까지 통과시키면 그 위에 상자를 못 쌓는다. 사람만 봐준다 */
/* 한 방향 발판은 '충돌 편'을 갈라서 처리한다.
   ⚠ 충돌 이벤트에서 pair.isActive=false 로 끄는 흔한 수법은 여기선 안 먹었다(막힌 채였다).
     사람 쪽 마스크에서 발판 편을 빼는 게 확실하다.
   끄는 때: 사다리를 타는 중 · ↓ 로 내려가는 중 · 솟아오르는 중 · 몸이 발판에 걸쳐 있을 때 */
function deckPass(b){
  if(P.onLadder||(P.dropT||0)>0||b.velocity.y<-.05) return true;
  for(const e of ENTS){
    if(e.type!=='deck') continue;
    const g=e.box;
    if(b.position.x<g.x-12||b.position.x>g.x+g.w+12) continue;
    if(b.bounds.max.y>g.y+10&&b.bounds.min.y<g.y+14) return true;   // 몸이 발판에 걸쳐 있다
  }
  return false;
}

/* 사다리에 몸이 닿아 있나 — 가로로 22 안쪽, 세로로 사다리 구간 안 */
/* 손잡이 — 잡힐 수 있는 거리와 뛰어서 닿는 거리 */
const GRIP_R=58;            // 손끝이 이만큼 안으로 오면 잡힌다
const LEAP_X=190, LEAP_UP=150, LEAP_DN=90;   // 한 번에 건너뛸 수 있는 거리
function gripNear(px,py,r,skip){
  let best=null,bd=r;
  for(const e of ENTS){
    if(e.type!=='grip'||e.gone||e===skip) continue;
    const d=Math.hypot(px-e.x, py-e.y);
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}
/* 지금 잡은 손잡이에서 그쪽으로 건너뛸 수 있는 다음 손잡이.
   옆으로 누르면 옆을, ↑ 만 누르면 위를 본다. 가까운 것 하나만 고른다 */
function gripTarget(from, dir, up){
  let best=null,bs=1e9;
  for(const e of ENTS){
    if(e.type!=='grip'||e.gone||e===from) continue;
    const dx=e.x-from.x, dy=e.y-from.y;
    if(dir){ if(Math.sign(dx)!==dir||Math.abs(dx)<10) continue; }
    else   { if(Math.abs(dx)>70) continue; }        // ↑ 만 누를 땐 거의 바로 위
    if(dx*dx>LEAP_X*LEAP_X) continue;
    if(dy<-LEAP_UP||dy>LEAP_DN) continue;
    if(up&&dy>-10) continue;                        // ↑ 을 누르면 위쪽만 본다(←↑ = 왼위 대각선)
    if(!up&&dy<-LEAP_UP*.62) continue;              // ↑ 없이는 너무 높은 건 안 잡는다
    let s=Math.abs(dx)+Math.abs(dy)*1.3;
    if(dy>0) s+=150;                                /* ⬇ 내려가는 손잡이는 마지막 선택 —
       앞서는 옆으로 누를 때마다 방금 올라온 아래 손잡이로 다시 내려갔다(봇으로 확인) */
    if(s<bs){ bs=s; best=e; }
  }
  return best;
}
/* 손을 놓고 포물선을 그리며 날아간다 — 순간이동이 아니다.
   닿는 순간 위에서 저절로 잡는다(gripNear) */
function leapTo(from, to){
  const b=P.body, T=16;
  const dx=to.x-from.x, dy=(to.y+30)-(from.y+30);
  P.grip=null; P.gripFrom=from; P.gripCool=6;
  P.face = dx>=0?1:-1;
  Body.setVelocity(b,{ x:dx/T, y:dy/T - .5*GRAV*T });
  P.leapT=10;
}
function ladderAt(b){
  for(const e of ENTS){
    if(e.type!=='ladder') continue;
    if(Math.abs(b.position.x-e.x)>32) continue;      // 22 는 너무 좁았다 — 앞에 서도 안 잡혀 뛰기만 했다
    if(b.bounds.max.y<e.y-6||b.bounds.min.y>e.y+e.h+6) continue;
    return e;
  }
  return null;
}

/* 턱 모서리를 손으로 잡는다.
   떨어지는 중에 손끝이 모서리 높이에 걸리면 붙잡고, 위를 누르면 팔로 몸을 끌어올린다 */
const LEDGE_UP=26;                                   // 오르는 데 걸리는 칸 수
/* 오를 수 있는 모서리를 모은다.
   땅뿐 아니라 상자 위도 손으로 잡고 오른다 — 사람은 1m 짜리 궤짝을 뛰어서 올라가지 않는다.
   상자는 굴러다니므로 똑바로 놓여 있고 잠잠할 때만 잡힌다 */
function edges(){
  const out=[];
  for(const e of ENTS){
    if(e.type==='land'||e.type==='deck'){ const g=e.box; out.push({L:g.x, R:g.x+g.w, top:g.y, body:null}); }
    else if(e.type==='crate'){
      for(const q of e.bodies){
        if(Math.abs(q.angle)>.3) continue;                       // 기울어진 건 못 잡는다
        if(Math.abs(q.velocity.x)+Math.abs(q.velocity.y)>1.5) continue;   // 구르는 중엔 못 잡는다
        out.push({L:q.bounds.min.x, R:q.bounds.max.x, top:q.bounds.min.y, body:q});
      }
    }
  }
  return out;
}
function tryLedge(){
  if(P.ledge||P.hangJoint||P.grounded||P.holdJoint) return;
  const b=P.body;
  if(b.velocity.y<-1.2) return;                      // 솟아오르는 중엔 안 잡힌다
  const hx=b.position.x+P.face*15, hy=b.bounds.min.y+5;
  for(const g of edges()){
    const ex = P.face>0 ? g.L : g.R;
    if(Math.abs(hx-ex)>24) continue;
    if(hy<g.top-34||hy>g.top+22) continue;
    if(solidAt2(ex+P.face*20, g.top-40)) continue;    // 위가 막혔으면 못 오른다
    P.ledge={x:ex, y:g.top, side:P.face, body:g.body}; P.climb=0;
    Body.setVelocity(b,{x:0,y:0});
    return;
  }
}
function solidAt2(px,py){
  for(const g of edges())
    if(px>g.L&&px<g.R&&py>g.top&&py<g.top+460) return true;
  return false;
}
/* 매달린 자세 → 손을 턱에 얹고 → 몸이 올라온다 */
function ledgePose(k){
  const po={};
  if(k<=0){ po.ar1=2.66; po.ar2=2.74; po.el1=.16; po.el2=.12;
            po.th1=.16; po.th2=-.14; po.kn1=-.58; po.kn2=-.32; po.rot=-.06; po.hd=2; return po; }
  const a=ease(clamp(k/.42,0,1));                    // 손이 턱을 넘어간다
  const c=ease(clamp((k-.30)/.70,0,1));              // 몸이 따라 올라온다
  po.ar1=lerp(2.66,1.05,a);  po.el1=lerp(.16,.55,a);
  po.ar2=lerp(2.74,2.05,a*.5+c*.5); po.el2=lerp(.12,.32,c);
  po.th1=lerp(.16,.95,c);    po.kn1=-lerp(.58,1.25,Math.sin(c*Math.PI))-c*.05;
  po.th2=lerp(-.14,-.30,c);  po.kn2=-lerp(.32,.95,c);
  po.rot=lerp(-.06,0,c);     po.hd=lerp(2,1,c);
  return po;
}

/* 몸으로 미는 힘.
   낼 수 있는 힘은 정해져 있고(제 몸무게의 STRENGTH 배), 빨리 걸을수록 줄어든다.
   그 힘에서 물체의 마찰(μmg)을 뺀 나머지가 물체를 움직인다.
   → 가벼운 건 걷는 속도까지 밀리고, 무거운 건 기어가듯 밀리고, 더 무거우면 꿈쩍도 안 한다 */
function bodyPush(dir){
  P.strain=0;
  if(!dir||!P.grounded) return 0;
  const v=P.body.velocity.x*dir;
  const budget=STRENGTH*P.body.mass*G*clamp(1-v/SPEED,0,1);
  let heaviest=0;
  for(const pr of engine.pairs.list){
    if(!pr.isActive) continue;
    const o = pr.bodyA===P.body?pr.bodyB : pr.bodyB===P.body?pr.bodyA : null;
    if(!o||o.isStatic||o.plugin.noStand) continue;
    if(o===P.holdBody) continue;                                    // 들고 있는 건 '미는 것'이 아니다 — 이게 없으면 기어간다
    if(o.plugin.bridged) continue;                                  // 걸쳐 놓은 다리는 이제 땅이다
    if(Math.abs(o.position.y-P.body.position.y)>46) continue;      // 밟고 선 게 아니라 옆에 닿은 것
    if(Math.sign(o.position.x-P.body.position.x)!==dir) continue;
    heaviest=Math.max(heaviest,o.mass);
    const need=mu(o)*o.mass*G;
    P.strain=Math.max(P.strain,clamp(need/(STRENGTH*P.body.mass*G),0,1.4));
    const net=budget-need;
    if(net<=0) continue;                                            // 꿈쩍도 안 한다
    accel(o,dir*net/o.mass);
    accel(P.body,-dir*net/P.body.mass*.5);                          // 반작용
  }
  return heaviest;
}

/*═══════════════════════════════════════════════════════════════════════
  판 — 데이터 한 줄이 물체 하나다
═══════════════════════════════════════════════════════════════════════*/

     같이 구덩이로 쓸려 들어갔다. 여기서 배우는 건 '앉아서 널판을 들어 다리를 놓는다' 하나뿐이다 */

  {t:'land', x:1250, y:600, w:550, h:460},           // 1250 ~ 1800
  {t:'crate',   x:1320, y:540},
  {t:'crate',   x:1384, y:540},

  {t:'crate',   x:1900, y:390},
  {t:'boulder', x:2080, y:398, r:30},                // 밀어 떨어뜨려 무게판까지 굴린다

     구덩이 앞 발판(2920~3120)에 눕혀 뒀다 — 문(2680)에는 안 걸린다 */
  {t:'plank', x:3020, y:582, w:520, h:18},
  {t:'rope', x:3300, y:170, links:17, seg:20},
  {t:'land', x:3520, y:600, w:760, h:460},           // 3520 ~ 4280
  {t:'crate',   x:3660, y:540},
  {t:'boulder', x:3820, y:548, r:26},                // 시소에 올려 보라고 둔 돌
  {t:'plank',   x:4000, y:545, w:300, h:18, pivot:true},
  {t:'land', x:4280, y:600, w:520, h:460},           // 4280 ~ 4800
  {t:'crate',   x:4420, y:540},
  {t:'crate',   x:4484, y:540},
  {t:'plank',   x:4650, y:575, w:210, h:16},         // 여기도 널판 하나

  /* ── 3막 · 한라산 ── */
  /* 4800 ~ 5220 구덩이 — 매달린 널판을 타고 건넌다 */
  /* 그네 널판 — 예전엔 x5010 y520 w230 이었다. 점프를 사람 크기로 낮추자
     ① 바닥에서 87px 떠야 올라설 수 있고 ② 발판 끝에서 95px 날아야 닿아서 아예 못 건넜다.
     낮추고(565) 길게(380) 바꿔 30px만 뛰어 올라타고 흔들리는 널판 위를 걸어 건너게 했다.
     매다는 지점 높이(330)는 그대로 — len 도 같이 235 로 늘렸다 */
  {t:'swing', x:5020, y:565, w:380, len:235},
  {t:'land', x:5220, y:600, w:1100, h:460},          // 5220 ~ 6320
  {t:'boulder', x:5460, y:543, r:44},                // 168 — 꿈쩍도 안 한다
  {t:'crate',   x:5680, y:540},
  {t:'crate',   x:5744, y:540},

const K={};
addEventListener('keydown',e=>{
  if(SC.now==='ready'){ beginOpening(); K[e.key]=1; return; }  // 시작 화면 — 여기서 음악이 함께 나간다
  if(SC.now==='title'){ toPlay(); K[e.key]=1; return; }     // 제목 화면에서 아무 키나
  /* 키는 이동(←→↑↓ · A D W X)과 잡기(E) 둘뿐이다(사용자 지시 2026-08-27).
     음악과 오프닝 건너뛰기는 화면 단추로 누른다 */
  if(!K[e.key]){
    if(e.key==='e'||e.key==='E') useHand();
  }
  K[e.key]=1;
  if(e.key.indexOf('Arrow')===0||e.key===' ')e.preventDefault();
});
addEventListener('keyup',e=>K[e.key]=0);
let tX=0,tJ=0,tE=0,tD=0;
const TOUCH=matchMedia('(hover:none) and (pointer:coarse)').matches;

/*═══ 폰 조작 ═══
  예전엔 화면을 구역으로 나눠서 "위쪽을 누르면 잡기, 가운데를 누르면 점프"였다.
  어디를 눌러야 하는지 눈에 보이지 않아 손이 헤맸다. 지금은 보이는 물건 두 개다.

    왼쪽        조이스틱 — 제자리에 고정. 좌우=걷기, 위=뛰기·오르기, 아래=앉기·내려가기
    오른쪽      주먹 단추 하나 — 잡기 / 놓기 (키보드 E 와 같다)
    왼쪽 위    오름게임즈 링크 · 왼쪽 아래 전체화면
               — 둘 다 공용 스크립트(game-home.js)가 붙인다. 페어붐·오름냥과 같은 모양이다 */
const PAD=document.getElementById('pad'), RING=document.getElementById('ring'),
      KNOB=document.getElementById('knob'), FIST=document.getElementById('fist');
const STICK_R=54;    // 손가락이 이만큼 벗어나면 끝까지 민 것으로 본다
const STICK_DEAD=13;       // 이 안쪽은 안 민 것으로 본다 — 엄지 떨림을 무시한다

let padId=null, padX=0, padY=0;
const padPos=e=>{ const r=PAD.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
function padDraw(el,x,y){ el.style.left=x+'px'; el.style.top=y+'px'; }
function padAim(x,y){
  let dx=x-padX, dy=y-padY;
  const d=Math.hypot(dx,dy); if(d>STICK_R){ dx*=STICK_R/d; dy*=STICK_R/d; }
  padDraw(KNOB,padX+dx,padY+dy);
  tX = dx<-STICK_DEAD ? -1 : dx>STICK_DEAD ? 1 : 0;
  tJ = dy<-STICK_DEAD*1.5 ? 1 : 0;
  tD = dy> STICK_DEAD*1.5 ? 1 : 0;
}
/* 조이스틱의 '제자리' — 왼쪽 자리의 한가운데 높이(2026-08-23 사용자 "가운데로 더 위로").
   위아래 72px 씩 물러난 자리의 절반이니 화면 높이의 한가운데다.
   손을 떼면 여기로 돌아와 계속 보인다 */
function padHome(){
  const r=PAD.getBoundingClientRect();
  if(!r.width) return;                       // 데스크톱에서는 숨어 있으니 할 일 없다
  padX=Math.round(r.width*.28); padY=Math.round(r.height*.5);
  padDraw(RING,padX,padY); padDraw(KNOB,padX,padY);
}
function padOff(){ padId=null; tX=0; tJ=0; tD=0; PAD.classList.remove('live'); padHome(); }
addEventListener('resize',padHome);
addEventListener('orientationchange',()=>setTimeout(padHome,120));
/* ⚠ 링은 제자리에 못 박혀 있다. 예전엔 손 댄 자리로 옮겨 다녔는데,
   "누르기 전엔 가운데 있다가 누르면 밑으로 간다"고 했다(2026-08-23).
   지금은 링은 그대로 있고 손잡이만 손을 따라간다 — 민 방향이 곧 가는 방향이다 */
PAD.addEventListener('pointerdown',e=>{
  if(padId!==null) return;
  padId=e.pointerId;
  PAD.classList.add('live');
  const p=padPos(e); padAim(p[0],p[1]);
  try{ PAD.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
PAD.addEventListener('pointermove',e=>{ if(e.pointerId===padId){ const p=padPos(e); padAim(p[0],p[1]); } });
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
  PAD.addEventListener(ev,e=>{ if(e.pointerId===padId) padOff(); }));

/* 주먹 = 키보드 E. 누르는 순간 반응해야 손맛이 난다 */
FIST.addEventListener('pointerdown',e=>{
  e.preventDefault();
  useHand();
});

  if(!document.fullscreenElement) return;
  try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(err){}
});

/* 시작 화면·제목 화면은 화면 아무 데나 눌러도 넘어간다 (단추 위는 뺀다) */
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('button,a')) return;
  if(SC.now==='ready') beginOpening(); else if(SC.now==='title') toPlay();
});
const LEFT =()=>K.ArrowLeft ||K.a||K.A||tX<0;
const RIGHT=()=>K.ArrowRight||K.d||K.D||tX>0;
const UP   =()=>K.ArrowUp   ||K.w||K.W||tJ;
/* ⚠ 예전엔 DOWN 이 아예 없었다. 모서리에 매달려 위를 안 누르면 그때 터졌다 */
const DOWN =()=>K.ArrowDown ||K.x||K.X||tD;

/* 개발용 — ?test=1&dump=1 이면 화면 대신 글로 상태를 뽑아 준다.
   헤드리스 크롬 --dump-dom 으로 읽으면 눈으로 못 재는 걸 정확히 볼 수 있다 */
let dumped=0, PHYS=0;
/* 개발용 봇 — 키를 정해진 칸에서 눌렀다 뗐다 하며 물리를 한 번에 쭉 돌린다.
   헤드리스 크롬은 그림을 초당 몇 장밖에 못 그려서 실시간으로는 검증이 안 된다.
   보기:  ?test=1&x=6420&y=560&steps=200&bot=0:ArrowUp;160:-ArrowUp
          (0칸에서 ↑ 누르고 160칸에서 뗀 뒤 200칸까지 돌린 상태를 제목에 찍는다) */
function runBot(){
  const plan={};
  (DEV.get('bot')||'').split(';').filter(Boolean).forEach(seg=>{
    const i=seg.indexOf(':'); plan[+seg.slice(0,i)]=seg.slice(i+1).split(',');
  });
  const n=+DEV.get('steps')||300;
  for(let i=0;i<n;i++){
    /* ⚠ 주소에서 + 는 공백으로 풀린다. 누르기는 그냥 이름, 떼기는 앞에 - */
    if(plan[i]) plan[i].forEach(a=>{
      if(a==='E'){ useHand(); return; }                            // 봇도 E 를 누른다
      const off=a[0]==='-'; K[off?a.slice(1):a]= off?0:1; });
    playerStep();
    for(const e of ENTS) if(e.update) e.update(e,DT);
    Engine.update(engine,DT);
  }
  cam=P.body.position.x-W*.42;                     // 카메라도 바로 제자리에
  const ty=P.body.position.y;
  camY = ty<EYE-BAND_UP ? ty-(EYE-BAND_UP) : ty>EYE+BAND_DN ? ty-(EYE+BAND_DN) : 0;
  dumpNow();
}
function dump(){
  /* 그림 장수는 컴퓨터마다 들쭉날쭉하다. 물리 칸 수로 세야 늘 같은 시점이 찍힌다 */
  const at=+(DEV.get('dump'))||60;                // ?dump=120 이면 물리 120칸(2초) 뒤
  if(PHYS<at||dumped++) return;
  dumpNow();
}
function dumpNow(){
  const b=P.body, L=[];
  L.push('사람  x '+b.position.x.toFixed(0)+'  y '+b.position.y.toFixed(0)
        +'  vx '+b.velocity.x.toFixed(2)+'  힘겨움 '+(P.strain||0).toFixed(2)
        +(P.holdBody?('  든것 무게 '+P.holdBody.mass.toFixed(0)+' 기울기 '+(P.holdBody.angle*57.3).toFixed(0)+'도'):'')
        +'  상태 '+P.st
        +'  발밑 '+(P.grounded?'있음':'없음')+(P.onLadder?'  사다리 탐':'')+(P.grip?('  손잡이 '+P.grip.x.toFixed(0)):'')+'  cool'+(P.gripCool||0));
  L.push('카메라 cam '+cam.toFixed(0)+'  camY '+camY.toFixed(0)+'   발판통과 '+(deckPass(b)?'켜짐':'꺼짐'));
  const near=ENTS.filter(e=>{
    const g=e.box||(e.type==='ladder'?{x:e.x-e.w/2,y:e.y,w:e.w,h:e.h}:null)
          ||(e.type==='grip'?{x:e.x-e.w/2,y:e.y,w:e.w,h:6}:null)
          ||(e.bodies[0]?{x:e.bodies[0].position.x-10,y:e.bodies[0].position.y-10,w:20,h:20}:null);
    return g && Math.abs(g.x-b.position.x)<700;
  });
  for(const e of near){
    const g=e.box||(e.type==='ladder'?{x:e.x-e.w/2,y:e.y,w:e.w,h:e.h}:null)
          ||(e.type==='grip'?{x:e.x-e.w/2,y:e.y,w:e.w,h:6}:null);
    if(e.type==='plank'){ const q=e.bodies[0];
      L.push('  plank  x '+q.position.x.toFixed(0)+' y '+q.position.y.toFixed(0)
            +(q.isStatic?' [굳음]':' [물렁]')+(q.plugin.bridged?' [다리]':'')
            +' 기울기 '+(q.angle*57.3).toFixed(0)+'도'); continue; }
    L.push('  '+e.type.padEnd(7)+(g?('x '+g.x.toFixed(0)+'~'+(g.x+g.w).toFixed(0)+'  윗면 y '+g.y.toFixed(0))
          :('x '+e.bodies[0].position.x.toFixed(0)+'  y '+e.bodies[0].position.y.toFixed(0))));
  }
  document.title='DUMP// '+L.join(' // ');        // 제목에 실어 보낸다 — 헤드리스에서 읽기 쉽다
}

/* 물리 퍼즐은 되돌릴 수 있어야 한다 — 물체를 엉뚱한 데 빠뜨렸을 때 */
function reset(){
  for(const e of ENTS){ if(e.joints) e.joints.forEach(dropJoint); e.bodies.forEach(b=>Composite.remove(world,b)); }
  ENTS.length=0; for(const k in BYID) delete BYID[k];
  dropJoint(TIE); TIE=null; letGo(); letGoRope();
  Composite.remove(world,P.body);
  LEVEL.forEach(spawn); makePlayer(P.spawn.x,P.spawn.y); P.safe=null;
}

/* ═══════════ 사람 그리기 ═══════════ */
function segl(x0,y0,a,l,w){const x1=x0+Math.sin(a)*l,y1=y0+Math.cos(a)*l;
  x.lineWidth=w;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();return[x1,y1];}
function figure(sx,hipY,sc,face,po,t){
  x.save(); x.translate(sx,hipY); x.scale(sc*face,sc); x.rotate(po.rot||0);
  x.fillStyle='#000'; x.strokeStyle='#000'; x.lineCap='round';
  /* 골반이 (0,0) 이다. 어깨는 그 위 27, 머리 중심은 42 */
  const hy=-13, SH=-27, HC=-42;
  /* 웅크리면 등이 말려 상체가 짧아지고(curl), 그래도 얼굴은 앞을 본다(neck) */
  const sq=1-(po.curl||0)*.18, nk=po.neck||0;
  const th1=po.th1||0,th2=po.th2||0,kn1=po.kn1||0,kn2=po.kn2||0;
  const ar1=po.ar1||0,ar2=po.ar2||0,el1=po.el1||0,el2=po.el2||0;
  const HEAD=f=>{ x.save(); x.translate(0,HC*sq); x.rotate(-nk); x.translate(0,-HC); f(); x.restore(); };

  x.globalAlpha*=.8;
  let r=segl(0,hy+13,th2,10.5,5.4); segl(r[0],r[1],th2+kn2,10.5,4.4);
  r=segl(-1.5,SH*sq,ar2,9.5,4.6); segl(r[0],r[1],ar2+el2,8.5,3.8);
  x.globalAlpha/=.8;

  if(!po.bald) HEAD(()=>{
    /* 머리카락 — 예전엔 머리의 두 배라 실루엣을 통째로 잡아먹었다. 좁게 붙인다 */
    const df=(po.hd||0)*.7+Math.sin(t*.0013)*1.2;
    x.beginPath(); x.moveTo(-1,hy-37.5);
    x.quadraticCurveTo(-9.6,hy-35,-10.2-df*.35,hy-22);
    x.quadraticCurveTo(-11.2-df*.8,hy-10,-7.6-df*1.2,hy-1);
    x.quadraticCurveTo(-5.4-df*.8,hy-7,-5.8,hy-19);
    x.quadraticCurveTo(-7,hy-28,-1,hy-31.5); x.closePath(); x.fill();
  });
  x.save(); x.scale(1,sq);                       // 상체만 줄인다 — 다리 길이는 그대로
  if(po.pack){ x.beginPath(); x.ellipse(-9.5,hy-9,7.6,11.5,-.12,0,7); x.fill(); }
  const bw=po.bald?1.25:1;
  x.beginPath(); x.moveTo(-3*bw,hy-24); x.lineTo(-7.6*bw,hy-16);
  x.quadraticCurveTo(-4.9*bw,hy-1,-6.9*bw,hy+14); x.lineTo(6.9*bw,hy+14);
  x.quadraticCurveTo(4.9*bw,hy-1,7.6*bw,hy-16); x.lineTo(3*bw,hy-24);
  x.closePath(); x.fill();
  x.restore();

  r=segl(0,hy+13,th1,10.5,5.6); segl(r[0],r[1],th1+kn1,10.5,4.6);
  r=segl(1.5,SH*sq,ar1,9.5,4.8); const h1=segl(r[0],r[1],ar1+el1,8.5,4);

  HEAD(()=>{
    x.beginPath(); x.arc(0,hy-29,po.bald?9.8:9.2,0,7); x.fill();
    if(!po.bald){ x.beginPath(); x.moveTo(-3,hy-38.4);
      x.quadraticCurveTo(7,hy-37,9.4,hy-30.5);
      x.quadraticCurveTo(6,hy-33,-3,hy-33.5); x.closePath(); x.fill(); }
  });
  if(po.club){ x.lineWidth=4.6; x.beginPath(); x.moveTo(h1[0],h1[1]);
    x.lineTo(h1[0]+Math.sin(ar1+el1+po.club)*26, h1[1]+Math.cos(ar1+el1+po.club)*26); x.stroke(); }
  x.restore();
}

/* ═══════════ 제주 사물 ═══════════ */
function basalt(bx,by,w,h,seed){          // 현무암 덩이
  x.fillStyle='#000'; x.beginPath();
  const n=13;
  for(let a=0;a<n;a++){ const th=a/n*6.283, j=.74+rnd(seed+a*2.7)*.5;
    const qx=bx+w/2+Math.cos(th)*w/2*j, qy=by+h/2+Math.sin(th)*h/2*j;
    a?x.lineTo(qx,qy):x.moveTo(qx,qy); }
  x.closePath(); x.fill();
  x.fillStyle='#1a1a17';
  for(let k=0;k<5;k++){ x.beginPath();
    x.arc(bx+w*(.2+rnd(seed+k*5)*.6), by+h*(.2+rnd(seed+k*9)*.6), 1.6+rnd(seed+k)*2.6,0,7); x.fill(); }
}
function choga(bx,by,w,h,fill,rope){       // 초가 — 지붕을 집줄로 묶는다
  x.fillStyle=fill;
  x.beginPath(); x.moveTo(bx,by);
  x.quadraticCurveTo(bx+w*.06,by-h*.86,bx+w*.5,by-h);
  x.quadraticCurveTo(bx+w*.94,by-h*.86,bx+w,by);
  x.closePath(); x.fill();
  x.fillRect(bx+w*.10,by,w*.80,h*.44);
  if(rope){ x.strokeStyle=rope; x.lineWidth=1.5;
    for(let i=1;i<6;i++){ const u=i/6;
      x.beginPath(); x.moveTo(bx+w*u*.9+w*.05, by);
      x.quadraticCurveTo(bx+w*.5, by-h*(1-Math.abs(u-.5)*.5)*.92, bx+w*u*.9+w*.05, by); x.stroke(); }
    for(let i=1;i<4;i++){ const v=i/4;
      x.beginPath(); x.ellipse(bx+w*.5, by-h*v*.82, w*.5*(1-v*.72), h*.09*(1-v*.4), 0, Math.PI, 0); x.stroke(); } }
}
function harbang(bx,by,s,fill){            // 돌하르방
  x.fillStyle=fill; x.save(); x.translate(bx,by); x.scale(s,s);
  x.beginPath(); x.moveTo(-19,0);
  x.quadraticCurveTo(-16,-20,-14,-33); x.lineTo(14,-33);
  x.quadraticCurveTo(16,-20,19,0); x.closePath(); x.fill();
  x.beginPath(); x.ellipse(0,-45,14.5,15,0,0,7); x.fill();
  x.beginPath(); x.moveTo(-17,-54);
  x.quadraticCurveTo(-15,-74,0,-76); x.quadraticCurveTo(15,-74,17,-54);
  x.quadraticCurveTo(0,-60,-17,-54); x.closePath(); x.fill();
  x.restore();
}
function jeongnang(bx,by,s,fill){          // 정낭 — 대문 대신 걸친 나무 막대 셋
  x.fillStyle=fill; x.save(); x.translate(bx,by); x.scale(s,s);
  x.fillRect(-42,-46,7,46); x.fillRect(35,-46,7,46);
  for(let i=0;i<3;i++){ const y=-12-i*13;
    x.beginPath(); x.moveTo(-40,y); x.quadraticCurveTo(0,y-2.5,40,y);
    x.lineTo(40,y+4); x.quadraticCurveTo(0,y+1.5,-40,y+4); x.closePath(); x.fill(); }
  x.restore();
}
function sandam(bx,by,s,fill){             // 산담 — 무덤을 두른 낮은 돌담
  x.fillStyle=fill; x.save(); x.translate(bx,by); x.scale(s,s);
  x.beginPath(); x.ellipse(0,0,46,17,0,Math.PI,0); x.fill();       // 봉분
  x.fillRect(-62,-3,124,7);
  x.fillRect(-64,-16,8,16); x.fillRect(56,-16,8,16);
  x.restore();
}

/* ═══════════ 풀·나무 ═══════════ */
function blade(sx,by,h,lean,seed,t,dark,light,lw){       // 억새
  const wd=Math.sin(t*.0013+seed)*.55+Math.sin(t*.0034+seed*1.7)*.2;
  const tx=sx+lean+wd*h*.3, ty=by-h;
  x.lineCap='round'; x.strokeStyle=dark; x.lineWidth=lw;
  x.beginPath(); x.moveTo(sx,by);
  x.quadraticCurveTo(sx+lean*.25+wd*h*.09,by-h*.6,tx,ty); x.stroke();
  const ang=Math.atan2(tx-sx,-h)+wd*.1, L=h*.44;
  x.strokeStyle=light; x.lineWidth=lw*.5;
  for(let k=0;k<13;k++){ const sp=(k/12-.5)*.34, ll=L*(.72+rnd(seed+k*1.7)*.45);
    x.beginPath(); x.moveTo(tx,ty);
    x.quadraticCurveTo(tx+Math.sin(ang+sp*.35)*ll*.45,ty-Math.cos(ang)*ll*.55,
                       tx+Math.sin(ang+sp)*ll*1.02,ty-Math.cos(ang+sp*.25)*ll*.8); x.stroke(); }
}
function gfield(t,rate,by,gap,hmin,hmax,dark,light,lw,spread){
  const off=cam*rate, i0=Math.floor((off-160)/gap), i1=Math.ceil((off+W+160)/gap);
  for(let i=i0;i<=i1;i++){ const r=rnd(i*1.7), r2=rnd(i*3.3);
    blade(i*gap+r*gap-off, by+r2*(spread||12), hmin+r2*(hmax-hmin), (r-.5)*26, i*2.3, t, dark, light, lw); }
}
function fern(bx,by,h,ph,t,fill){          // 고사리 — 잎이 부챗살로 퍼진다
  const wd=Math.sin(t*.0016+ph)*.4;
  x.fillStyle=fill;
  for(let k=0;k<7;k++){
    const a=(k-3)*.34+wd*.3, L=h*(.6+rnd(ph+k)*.55);
    const tx=bx+Math.sin(a)*L, ty=by-Math.cos(a)*L;
    x.beginPath(); x.moveTo(bx-1.4,by);
    x.quadraticCurveTo(bx+Math.sin(a)*L*.4-2.2, by-Math.cos(a)*L*.55, tx,ty);
    x.quadraticCurveTo(bx+Math.sin(a)*L*.4+2.2, by-Math.cos(a)*L*.55, bx+1.4,by);
    x.closePath(); x.fill(); }
}
function bamboo(bx,by,h,ph,t,fill){        // 조릿대 — 넓고 뾰족한 잎
  const wd=Math.sin(t*.0016+ph)*.45;
  x.fillStyle=fill;
  for(let k=0;k<5;k++){
    const a=(k-2)*.42+wd*.3, L=h*(.65+rnd(ph+k)*.5);
    const tx=bx+Math.sin(a)*L, ty=by-Math.cos(a)*L;
    x.beginPath(); x.moveTo(bx-1.6,by);
    x.quadraticCurveTo(bx+Math.sin(a)*L*.4-2.6, by-Math.cos(a)*L*.55, tx,ty);
    x.quadraticCurveTo(bx+Math.sin(a)*L*.4+2.6, by-Math.cos(a)*L*.55, bx+1.6,by);
    x.closePath(); x.fill(); }
}
function lowRow(fn,t,rate,by,gap,hmin,hmax,fill,spread){
  const off=cam*rate, i0=Math.floor((off-120)/gap), i1=Math.ceil((off+W+120)/gap);
  for(let i=i0;i<=i1;i++){ const r=rnd(i*1.7), r2=rnd(i*3.3);
    fn(i*gap+r*gap-off, by+r2*(spread||10), hmin+r2*(hmax-hmin), r*90, t, fill); }
}
function fir(bx,by,h,fill,seed,t,lw){      // 구상나무 고사목 — 곧은 줄기, 앙상한 가지
  const sway=Math.sin(t*.0009+seed)*.5;
  x.strokeStyle=fill; x.lineCap='round';
  x.lineWidth=lw; x.beginPath(); x.moveTo(bx,by);
  x.quadraticCurveTo(bx+sway*h*.03, by-h*.5, bx+sway*h*.06, by-h); x.stroke();
  const n=Math.floor(7+rnd(seed)*5);
  for(let i=0;i<n;i++){
    const f=.16+i/n*.78, y=by-h*f, tw=lw*(1-f*.75);
    const len=h*(.30-f*.23)*(.6+rnd(seed+i)*.8);
    for(const d of[-1,1]){
      if(rnd(seed+i*3+(d>0?1:0))<.16) continue;
      x.lineWidth=Math.max(.6,tw); x.beginPath();
      x.moveTo(bx+sway*h*.06*f, y);
      x.quadraticCurveTo(bx+d*len*.6, y-len*.10, bx+d*len, y-len*(.22+rnd(seed+i)*.3));
      x.stroke();
    }
  }
}
function tree(bx,by,h,fill,seed,t,lw){     // 곶자왈 — 낮게 뒤틀리며 갈라지는 활엽수
  const sway=Math.sin(t*.0008+seed)*.6;
  x.strokeStyle=fill; x.lineCap='round';
  const limb=(px,py,ang,len,w,d)=>{
    const ex=px+Math.sin(ang)*len, ey=py-Math.cos(ang)*len;
    x.lineWidth=Math.max(.7,w); x.beginPath(); x.moveTo(px,py);
    x.quadraticCurveTo(px+Math.sin(ang+.3)*len*.5, py-Math.cos(ang)*len*.55, ex,ey); x.stroke();
    if(d<=0) return;
    const s=rnd(seed+d*7+len);
    limb(ex,ey,ang-.42-s*.3+sway*.05,len*(.62+s*.16),w*.62,d-1);
    limb(ex,ey,ang+.40+rnd(seed+d*3)*.3+sway*.05,len*(.58+s*.2),w*.6,d-1);
    if(d===3&&s>.55) limb(ex,ey,ang+(s-.5)*.5,len*.5,w*.5,d-1);
  };
  limb(bx,by,sway*.06,h*.44,lw,3);
}
function treeRow(fn,t,rate,by,gap,hmin,hmax,fill,lw,spread){
  const off=cam*rate, i0=Math.floor((off-260)/gap), i1=Math.ceil((off+W+260)/gap);
  for(let i=i0;i<=i1;i++){ const r=rnd(i*1.7), r2=rnd(i*3.3);
    fn(i*gap+r*gap-off, by+r2*(spread||14), hmin+r2*(hmax-hmin), fill, i*1.3, t, lw); }
}
function crow(cx,cy,s,t,ph,perch){
  x.save(); x.translate(cx,cy); x.scale(s,s); x.fillStyle='#000';
  if(perch){
    x.beginPath(); x.ellipse(0,0,8.5,5.4,-.18,0,7); x.fill();
    x.beginPath(); x.arc(7,-5.6,3.6,0,7); x.fill();
    x.beginPath(); x.moveTo(9.6,-6.2); x.lineTo(15,-5.2); x.lineTo(9.6,-4); x.fill();
    x.beginPath(); x.moveTo(-6,1); x.quadraticCurveTo(-15,3,-18,7);
    x.quadraticCurveTo(-11,3.5,-5,3.4); x.fill();
  }else{ const f=Math.sin(t*.009+ph);
    x.beginPath(); x.ellipse(0,0,7.5,3,0,0,7); x.fill();
    for(const d of[-1,1]){ x.beginPath(); x.moveTo(d,-1);
      x.quadraticCurveTo(d*12,-6-f*10,d*21,2-f*6.5); x.quadraticCurveTo(d*11,1,d,3); x.fill(); } }
  x.restore();
}
function stonewall(rate,y,sc,fill){        // 밭담
  const off=cam*rate; x.fillStyle=fill;
  for(let row=0;row<3;row++){ const ry=y-row*13*sc, g=17*sc;
    const i0=Math.floor((off-70)/g), i1=Math.ceil((off+W+70)/g);
    for(let i=i0;i<=i1;i++){ const sd=i*7+row*31;
      const sx=i*g-off+(rnd(sd)-.5)*9*sc, rw=(9+rnd(sd+1)*7)*sc, rh=(7+rnd(sd+2)*5)*sc;
      x.beginPath();
      for(let a=0;a<9;a++){ const th=a/9*6.283, j=.72+rnd(sd+a*3)*.5;
        const qx=sx+Math.cos(th)*rw*j, qy=ry+Math.sin(th)*rh*j; a?x.lineTo(qx,qy):x.moveTo(qx,qy); }
      x.closePath(); x.fill(); } }
}
function ridge(rate,P2,h,base,fill,crater){
  x.beginPath(); x.moveTo(-60,H);
  for(let s=-60;s<=W+60;s+=5){ const wx=s+cam*rate, i=Math.floor(wx/P2), u=(wx/P2-i)*2-1;
    let y=base-h*(.6+rnd(i*1.7)*.8)*Math.exp(-u*u*6);
    if(crater&&Math.abs(u)<.28&&rnd(i*3.1)>.45) y+=48*Math.pow(Math.cos(u/.28*Math.PI/2),2);
    x.lineTo(s,y); }
  x.lineTo(W+60,H); x.closePath(); x.fillStyle=fill; x.fill();
}
function halla(rate,anchor,fill){          // 한라산 — 세계 저 끝에 서 있다
  const cx=anchor-cam*rate;
  x.beginPath(); x.moveTo(-60,H);
  for(let px=-60;px<=W+60;px+=4){
    const u=(px-cx)/640;
    let y=452-262*Math.exp(-u*u*1.05)+Math.sin(px*.009)*4;
    if(Math.abs(u)<.17) y+=32*Math.pow(Math.cos(u/.17*Math.PI/2),2);   // 백록담
    x.lineTo(px,y); }
  x.lineTo(W+60,H); x.closePath(); x.fillStyle=fill; x.fill();
}
function fog(y,h,a){const g=x.createLinearGradient(0,y-h,0,y+h);
  g.addColorStop(0,'rgba(252,252,250,0)');g.addColorStop(.5,'rgba(252,252,250,'+a+')');
  g.addColorStop(1,'rgba(252,252,250,0)');x.fillStyle=g;x.fillRect(0,y-h,W,h*2);}
function sky(a,b,cc,gx,gy,gr){
  const sk=x.createLinearGradient(0,0,0,H*.8);
  sk.addColorStop(0,a);sk.addColorStop(.75,b);sk.addColorStop(1,cc);
  x.fillStyle=sk;x.fillRect(0,0,W,H);
  if(gr){ const gl=x.createRadialGradient(gx,gy,20,gx,gy,gr);
    gl.addColorStop(0,'rgba(255,255,255,.9)');gl.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gl;x.fillRect(0,0,W,H); }
}

/* ═══════════ 배경 세 곳 ═══════════
   ⚠ 2편은 화면이 위아래로도 흐른다. 배경을 두 켜로 나눠 그린다.
     · 하늘·먼 산·안개·까마귀 → 화면에 못 박아 둔다 (세로로 안 움직임)
     · 땅·잔디·돌담·하르방   → ground() 로 감싸 세계와 같이 오르내린다
     이걸 안 나누면 올라갈 때 땅 그림만 제자리에 남아 지형과 어긋난다 */
