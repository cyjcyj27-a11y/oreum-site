<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제발 데뷔해줘 — 오름게임즈</title>
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
  @font-face { font-family: 'Ria'; src: url('fonts/RiaSans-ExtraBold.woff2') format('woff2'); font-display: swap; }
  :root{
    --bg:#ebe7e0; --panel:#f8f6f2; --panel2:#ece8e1; --line:#d9d3ca;
    --txt:#1d1a24; --dim:#736d7c;
    --rust:#b8553c; --sage:#6f8560; --steel:#4f7d99; --cream:#3a2f4a;
    --gold:#b8891f; --red:#d24b4b; --good:#3f9a72; --pink:#e0699c; --sky:#3f9ad1;
    --grad:linear-gradient(135deg,#f2a7c4,#9b7fc4 50%,#6fbbe6);
    --shadow:0 6px 24px rgba(40,30,60,.07);
    --beat:.508s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{
    background:
      radial-gradient(900px 520px at 12% -12%, #f3dde5 0%, transparent 62%),
      radial-gradient(760px 440px at 96% 4%, #dde8f0 0%, transparent 58%),
      var(--bg);
    color:var(--txt);
    font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    font-size:37.2px; letter-spacing:-.01em;
    min-height:100vh; padding:calc(84px + env(safe-area-inset-top)) 18px 40px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:none;margin:0 auto}
  h2{font-size:57.6px;font-weight:800;letter-spacing:-.4px}
  .center{text-align:center}
  .btn{background:var(--grad);color:#fff;border:0;border-radius:14px;padding:18px 40px;
       font-size:40.8px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.3px;box-shadow:0 6px 18px rgba(155,127,196,.35);text-shadow:0 1px 2px rgba(0,0,0,.15);
       transition:transform .12s,filter .12s;touch-action:manipulation}
  .btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.14)}
  .btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
  .btn:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.7)}
  .hidden{display:none !important}
  .num{font-family:'Ria',inherit;letter-spacing:.5px;font-weight:normal}

  /* ── HUD — 스카이라이더 기본. 왼쪽 위 오름 알약(game-home.js) 옆 스탯 알약, 오른쪽 토글 ── */
  #topbar { position: fixed; left: 0; width: var(--vwz, 100vw); top: 0; min-height: calc(64px + env(safe-area-inset-top)); padding: calc(6px + env(safe-area-inset-top)) calc(120px + env(safe-area-inset-right)) 6px calc(120px + env(safe-area-inset-left)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; background: linear-gradient(180deg, rgba(235,231,224,.97), rgba(235,231,224,0)); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .8s; }
  #topbar.show { opacity: 1; }
  .stat { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size:38.4px; white-space: nowrap; box-shadow: 0 2px 10px rgba(40,30,60,.06); color: var(--txt); }
  .stat b { font-weight: normal; font-size:45.6px; font-family: 'Ria', sans-serif; letter-spacing: 1px; } .stat .ic { font-size:33.6px; }
  .stat .lb{font-size:.8em;color:var(--dim);font-weight:600;margin-right:2px}
  .stat.warn b{color:var(--red)}
  .tog { position: absolute; top: calc(4px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--txt); font-family: inherit; font-size:28px; line-height: 1; display: grid; place-items: center; overflow: hidden; padding: 0; touch-action: manipulation; cursor: pointer; box-shadow: 0 2px 10px rgba(40,30,60,.06); }
  #btnBgm { right: calc(72px + env(safe-area-inset-right)); }
  .tog.off { opacity: .4; text-decoration: line-through; }
  @media (max-width: 700px) { html:not(.zm) #topbar{ padding-left: calc(104px + env(safe-area-inset-left)); padding-right: calc(92px + env(safe-area-inset-right)); gap: 4px 5px; } html:not(.zm) .stat{ font-size:31.2px; padding: 3px 7px; gap: 4px; } html:not(.zm) .stat b{ font-size:36px; } html:not(.zm) .tog{ width: 32px; height: 32px; font-size:36px; } html:not(.zm) #btnBgm{ right: calc(46px + env(safe-area-inset-right)); } }

  /* ── 무대 (애니메이션) ── */
  .stage{position:relative;height:min(52vh,420px);min-height:260px;overflow:hidden;border-radius:12px;
    background:
      radial-gradient(700px 320px at 20% 110%, rgba(236,110,170,.55) 0%, transparent 60%),
      radial-gradient(700px 320px at 80% 110%, rgba(140,90,220,.55) 0%, transparent 60%),
      linear-gradient(180deg, #4a2a7a 0%, #6b3a9e 45%, #a44d95 100%);
    border:1px solid var(--line)}
  .stage .floor{position:absolute;left:0;right:0;bottom:0;height:17%;
    background:linear-gradient(180deg,rgba(120,60,150,.9),#3a1a55);border-top:1px solid rgba(255,255,255,.14)}
  .stage .floor::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.03) 60px 61px)}
  .stage .beam{position:absolute;top:-6%;left:var(--x);width:34%;height:110%;transform-origin:50% 0;
    background:linear-gradient(180deg,var(--c,rgba(255,220,180,.5)),transparent 75%);
    clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:.75;
    animation:sweep var(--dur,6s) ease-in-out infinite alternate;animation-delay:var(--d,0s);pointer-events:none}
  @keyframes sweep{from{transform:translateX(-50%) rotate(-14deg)}to{transform:translateX(-50%) rotate(14deg)}}
  .stage .glow{position:absolute;left:0;right:0;bottom:12%;height:40%;
    background:radial-gradient(60% 100% at 50% 100%,rgba(255,180,220,.22),transparent 70%);pointer-events:none}
  .idol{position:absolute;bottom:14%;left:var(--x);height:calc(var(--h,78%) * var(--hm,1));aspect-ratio:1/3;transform:translateX(-50%);
    --amp:6px;--tilt:3deg;
    animation:bounce var(--beat) ease-in-out infinite;animation-delay:var(--d,0s);will-change:transform}
  .idol,.idol .head{animation:none !important}   /* 흔들지 않는다 (사장님, 2026-09-07) */
  .idol .body,.idol .head{position:absolute;inset:0;background:var(--img) center bottom/contain no-repeat}
  .idol .body{clip-path:inset(23% 0 0 0)}
  .idol .head{clip-path:inset(0 0 75% 0);transform-origin:50% 24%;animation:nod calc(var(--beat)*2) ease-in-out infinite;animation-delay:var(--d,0s)}
  .idol.alt .head{animation-name:nodAlt}
  .idol .shadow{position:absolute;left:15%;right:15%;bottom:-2%;height:4%;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(3px)}
  .idol.center{--amp:9px;--tilt:5deg}
  .idol.still{animation:breathe 3.2s ease-in-out infinite}
  .idol.still .head{animation:none}
  @keyframes bounce{0%{transform:translateX(-50%) translateY(0) rotate(0)}50%{transform:translateX(-50%) translateY(calc(var(--amp)*-1)) rotate(var(--tilt))}100%{transform:translateX(-50%) translateY(0) rotate(0)}}
  @keyframes bounceAlt{0%{transform:translateX(-50%) translateY(0) rotate(0)}50%{transform:translateX(-50%) translateY(calc(var(--amp)*-1)) rotate(calc(var(--tilt)*-1))}100%{transform:translateX(-50%) translateY(0) rotate(0)}}
  @keyframes nod{0%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-4deg)}}
  @keyframes nodAlt{0%{transform:rotate(4deg)}50%{transform:rotate(-5deg)}100%{transform:rotate(4deg)}}
  @keyframes breathe{0%,100%{transform:translateX(-50%) scaleY(1)}50%{transform:translateX(-50%) scaleY(1.012)}}
  .crowd{position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;
    background:linear-gradient(0deg,#2c1448 40%,transparent)}
  .stick{position:absolute;bottom:8%;width:5px;height:26px;border-radius:3px;background:var(--c);
    box-shadow:0 0 10px var(--c),0 0 22px var(--c);transform-origin:50% 100%;
    animation:wave calc(var(--beat)*2) ease-in-out infinite;animation-delay:var(--d)}
  @keyframes wave{0%{transform:rotate(-16deg) translateY(0)}50%{transform:rotate(16deg) translateY(-6px)}100%{transform:rotate(-16deg) translateY(0)}}
  .stage .sign{position:absolute;left:50%;top:9%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    font-family:'Ria',sans-serif;font-size:clamp(22px,3vw,34px);letter-spacing:6px;color:#fff;opacity:.85;
    text-shadow:0 0 12px var(--pink),0 0 30px var(--sky)}
  .confetti{position:absolute;top:-4%;width:8px;height:12px;background:var(--c);left:var(--x);
    animation:fall var(--dur) linear infinite;animation-delay:var(--d);opacity:.9;border-radius:2px}
  @keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(120vh) rotate(720deg)}}
  .stage.dim{filter:saturate(.35) brightness(.65)}
  .stage.frozen .idol,.stage.frozen .idol .head{animation:none}
  @media(max-width:1250px){ html:not(.zm) body{padding-top:calc(170px + env(safe-area-inset-top))} }
  @media(max-width:700px){ html:not(.zm) body{padding-top:calc(230px + env(safe-area-inset-top))} html:not(.zm) .idol{--hm:.8} html:not(.zm) #scene-title .stage{height:min(60vh,520px);min-height:0} }
  @media(max-width:420px){ html:not(.zm) .idol{--hm:.68} }

  /* ── 타이틀 ── */
  #rotate{position:fixed;inset:0;z-index:95;display:none;place-items:center;text-align:center;background:#1a1426;color:#f2ede4;font-size:17px;line-height:1.8;padding:8vw;pointer-events:auto}
  body.touch.portrait #rotate{display:grid}
  #rotate button{margin:22px 0 16px;padding:15px 32px;border:0;border-radius:99px;cursor:pointer;font-family:inherit;font-size:17px;font-weight:800;color:#2a1c08;background:#ffd24a}
  #rotate .sub{font-size:14px;color:#b8ae9c;line-height:1.7} #rotate .sub a{color:#d8cfbc}
  #scene-title{position:relative}
  #scene-title{position:fixed;left:0;top:0;width:var(--vwz,100vw);height:var(--vhz,100vh);display:flex;flex-direction:column;padding:54px 14px 14px;box-sizing:border-box}
  #scene-title .stage{flex:1;height:auto;min-height:0}
  #scene-title .stage .idol{bottom:9%;--hm:.78}   /* 제목·START 자리 확보(2026-09-08) */
  #scene-title .stage .idol.pro{bottom:6%}
  @media(max-height:900px){ #scene-title .stage .idol{--hm:.82} }
  @media(max-height:700px){ #scene-title .stage .idol{--hm:.66} }
  #scene-title .ttl{position:absolute;left:0;right:0;top:6px;text-align:center;pointer-events:none}
  #scene-title h1{font-family:'Nanum Pen Script','Ria',cursive;font-size:clamp(90px,12vw,240px);letter-spacing:2px;color:#fff;
    text-shadow:0 2px 0 #3a2440,0 0 18px rgba(242,167,196,.8),0 0 40px rgba(95,179,217,.6);line-height:1.1}
  #scene-title .en{font-family:'Ria',sans-serif;font-size:clamp(30px,3.4vw,64px);letter-spacing:10px;color:#f6e3c8;opacity:.9;margin-top:0}
  #scene-title .go{position:absolute;left:0;right:0;top:31%;text-align:center;margin:0;z-index:5;pointer-events:none}   /* 제목과 인물 사이 빈 자리에 (2026-09-08) */
  #scene-title .go .btn{pointer-events:auto}
  #scene-title .go .btn{font-size:96px;padding:22px 80px;border-radius:24px;box-shadow:0 8px 30px rgba(242,167,196,.35)}

  /* ── 카드 ── */
  .hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;
        font-size:33.6px;color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
  .chip b{font-family:'Ria',sans-serif;font-size:45.6px;color:var(--txt);font-weight:normal;letter-spacing:.5px}
  .chip.hl b{color:var(--gold)}
  .chip.bad{border-color:var(--red)}
  .grid{display:grid;gap:14px}
  .g4,.g5{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1300px){ html:not(.zm) .g4,html:not(.zm) .g5{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:700px){ html:not(.zm) .g4,html:not(.zm) .g5{grid-template-columns:1fr} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;
        transition:border-color .15s,transform .15s,box-shadow .15s;position:relative;overflow:hidden;box-shadow:var(--shadow);
        background:linear-gradient(160deg,var(--panel) 55%,var(--tint,transparent))}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,transparent)}
  .card.pick{cursor:pointer}
  .card.pick:hover{border-color:var(--acc,#6b6478);transform:translateY(-3px);box-shadow:0 12px 30px rgba(40,30,60,.12)}
  .card.sel{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink) inset,0 12px 30px rgba(224,105,156,.18)}
  #leaderPick .card{overflow:visible;text-align:center}
  #leaderPick .chead{flex-direction:column;gap:10px;padding-right:0;justify-content:center}
  #leaderPick .ava{width:150px;height:150px}
  #leaderPick .nm{font-size:clamp(30px,2.4vw,44px);justify-content:center}
  #leaderPick .pos{font-size:clamp(20px,1.5vw,28px)}
  #leaderPick .card.sel::after{content:"👑";position:absolute;top:-22px;right:-10px;font-size:52px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
  #leaderPick .card.sel .nm{color:var(--pink)}
  .card.out{opacity:.5;filter:grayscale(.9)}
  .card.gain{animation:cardpop .5s cubic-bezier(.2,1.4,.3,1)}
  @keyframes cardpop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
  .chead{display:flex;gap:14px;align-items:center;margin-bottom:12px;padding-right:120px}
  #scene-training .chead{padding-right:0;min-height:150px}
  #scene-training .nm{white-space:nowrap}
  .ava .crown{position:absolute;left:2px;top:0;font-size:36px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));z-index:2}
  .ava{width:130px;height:130px;border-radius:12px;flex-shrink:0;overflow:hidden;position:relative;
       background:linear-gradient(160deg,var(--p0,#2a2430),var(--p1,#161320))}
  .ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 100%;animation:avaBreathe 3.4s ease-in-out infinite}
  @keyframes avaBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .ava.hop img{animation:avaHop .55s cubic-bezier(.2,1.5,.3,1)}
  @keyframes avaHop{0%{transform:translateY(0)}35%{transform:translateY(-9px) scale(1.06)}100%{transform:translateY(0)}}
  .ava.tired img{filter:grayscale(.6) brightness(.8)}
  .ava .zz{position:absolute;right:3px;top:2px;font-size:31.2px;animation:zz 1.6s ease-in-out infinite;color:#fff;text-shadow:0 1px 2px #000}
  @keyframes zz{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
  .nm{font-size:50.4px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .nm .kr{font-size:31.2px;color:var(--dim);font-weight:500;letter-spacing:0}
  .pos{font-size:31.2px;color:var(--dim);margin-top:4px;letter-spacing:0}
  .tag{padding:5px 12px;font-size:28.8px;font-weight:700;border-radius:6px;letter-spacing:0;
       background:rgba(184,137,31,.1);color:var(--gold);border:1px solid rgba(184,137,31,.28)}
  .tag.leader{background:rgba(224,105,156,.12);color:var(--pink);border-color:rgba(224,105,156,.4)}
  .tag.joined{position:absolute;right:14px;top:14px;background:rgba(63,154,114,.12);color:var(--good);border-color:rgba(63,154,114,.45)}
  .tag.ask{position:absolute;right:14px;top:14px;background:rgba(224,105,156,.12);color:var(--pink);border-color:rgba(224,105,156,.45);animation:blink 1.6s infinite}
  .tag.sig{background:rgba(63,154,209,.1);color:var(--sky);border-color:rgba(63,154,209,.32)}

  .bar{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:32.4px}
  .bar span:first-child{width:110px;color:var(--dim);flex-shrink:0;letter-spacing:0;font-weight:600}
  .track{flex:1;height:14px;background:#dcd6cc;border-radius:4px;overflow:hidden}
  .fill{height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1);border-radius:4px}
  .bar .val{width:66px;text-align:right;font-family:'Ria',sans-serif;font-variant-numeric:tabular-nums;font-size:36px}
  .up{color:var(--good);font-weight:700;width:64px;font-size:28.8px;font-family:'Ria',sans-serif}
  .up.big{color:#d08a00}

  /* ── 말풍선 컷 (클로즈업 + 대사) ── */
  #vidov{position:fixed;left:0;top:0;width:var(--vwz,100vw);height:var(--vhz,100vh);z-index:60;background:#0b0810;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fadein .4s}
  #vidov video{height:100%;max-width:100%;object-fit:contain;box-shadow:0 0 80px rgba(242,167,196,.25)}
  #vidov .onair{position:absolute;left:calc(24px + env(safe-area-inset-left));top:calc(70px + env(safe-area-inset-top));background:#e0343c;color:#fff;font-weight:800;font-size:28px;letter-spacing:2px;padding:8px 20px;border-radius:999px;box-shadow:0 0 18px rgba(224,52,60,.6);animation:blink 1.2s steps(2) infinite}
  #vidov .cut-next{position:absolute;right:28px;bottom:24px;color:#fff;opacity:.7;font-size:40px}
  @keyframes fadein{from{opacity:0}to{opacity:1}} @keyframes blink{50%{opacity:.45}}
  #cutin{position:fixed;left:0;top:0;width:var(--vwz,100vw);height:var(--vhz,100vh);z-index:40;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  #cutin .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(235,231,224,.97) 0%,rgba(235,231,224,.88) 50%,rgba(235,231,224,.72) 100%);backdrop-filter:blur(4px)}
  .cut-char{position:absolute;left:0;bottom:0;width:46%;height:84%;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%)}
  .cut-char img{position:absolute;bottom:-3%;left:50%;height:103%;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 12px 30px rgba(40,30,60,.25));animation:cutIn .45s cubic-bezier(.2,1.2,.3,1)}
  .cut-char img.full{height:150%;bottom:auto;top:2%}
  #cutin.right .cut-char{left:auto;right:0}
  @keyframes cutIn{0%{transform:translateX(-50%) translateY(26px) scale(.94);opacity:0}100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
  .cut-box{position:absolute;left:46%;right:3%;top:16%;max-width:1200px;background:#fff;color:#1d1a24;border-radius:30px;padding:26px 34px 36px;border:1px solid var(--line);
    font-size:clamp(32px,3.6vw,60px);line-height:1.45;font-weight:700;box-shadow:0 20px 50px rgba(40,30,60,.18);animation:pop .28s cubic-bezier(.2,1.1,.3,1);word-break:keep-all}
  .cut-box::before{content:"";position:absolute;left:-16px;top:38px;border:12px solid transparent;border-right-color:#fff;border-left:0}
  #cutin.right .cut-box{left:4%;right:46%;margin-left:auto}
  #cutin.right .cut-box::before{left:auto;right:-16px;border-right:0;border-left:12px solid #fff}
  .cut-name{font-size:31.2px;letter-spacing:3px;color:var(--pink);margin-bottom:6px;font-weight:800}
  .cut-narr::after{content:'▼';position:absolute;right:14px;bottom:6px;font-size:.5em;opacity:.8;animation:blink 1s infinite}
  .cut-next{position:absolute;right:16px;bottom:8px;font-size:28.8px;color:#999;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .cut-narr{position:absolute;left:auto;right:3%;top:9%;height:78%;width:49%;max-width:49%;display:flex;align-items:center;box-sizing:border-box;background:linear-gradient(135deg,#f28a3c,#e8642e);color:#fff;padding:22px 36px;border-radius:22px;text-shadow:0 1px 2px rgba(0,0,0,.15);
    font-size:clamp(34px,3.4vw,68px);line-height:1.55;text-align:left;box-shadow:0 10px 30px rgba(232,100,46,.35);font-weight:700;padding:40px 48px;border-radius:30px;animation:pop .3s;word-break:keep-all}
  #cutin.right .cut-narr{left:3%;right:auto}
  .cut-narr::after{bottom:14px;right:22px}

  @media(max-width:700px){ html:not(.zm) .cut-char{width:50%;height:70%} html:not(.zm) .cut-box{left:50%;right:3%;top:16%;padding:12px 14px 20px;border-radius:16px} html:not(.zm) #cutin.right .cut-box{left:3%;right:50%} html:not(.zm) .cut-choices{left:3%;right:3%;bottom:calc(52px + env(safe-area-inset-bottom))} html:not(.zm) #cutin.right .cut-choices{left:3%;right:3%} html:not(.zm) .cut-narr{top:4%;max-width:94%} }

  /* 결과 */
  #scene-result .stage{height:min(60vh,520px);margin-bottom:16px}

  .stage .mv{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);z-index:3;border-left:1px solid rgba(255,255,255,.12);border-right:1px solid rgba(255,255,255,.12);box-shadow:0 0 60px rgba(242,167,196,.35)}
  .rank{font-family:'Nanum Pen Script','Ria',cursive;font-size:clamp(72px,11vw,140px);letter-spacing:1px;line-height:1.15;margin:10px 0 6px;color:var(--txt)}

  input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:14px;

  input[type=text]::placeholder{color:#b3adba;font-weight:500;letter-spacing:0}

  @keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}

  /* ── 비주얼노벨 표준 배치: 인물 크게, 아래 가로 대사 상자 + 이름표, 선택지는 가운데 ── */
  .cut-char{left:6%;width:46%;height:96%;bottom:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}

<body>

<div id="topbar">
  <span class="stat"><span class="ic">🪙</span><span class="lb" data-en="Coins">코인</span><b id="tbMoney">0</b></span>
  <span class="stat"><span class="ic">🤝</span><span class="lb" data-en="Team">호흡</span><b id="tbTeam">0</b></span>
  <span class="stat"><span class="ic">🔥</span><span class="lb" data-en="Fame">유명세</span><b id="tbHype">0</b></span>
  <span class="stat" id="stWeek"><span class="ic">📅</span><span class="lb" data-en="Week">주차</span><b id="tbWeek">1/12</b></span>
  <button class="tog" id="btnBgm" type="button" title="Music">♪</button>
  <button class="tog" id="btnSnd" type="button" title="Sound">🔊</button>
</div>

<div class="wrap">

  <!-- 타이틀: 실제 무대 장면 위에 제목만 -->
  <section id="scene-title">
    <div class="stage" id="titleStage"></div>
    <div class="ttl">
      <h1 data-en="HOTSHOT INDIE">제발 데뷔해줘</h1>
      <div class="en" data-en="FROM HONGDAE BUSKING, 12 WEEKS">HOTSHOT INDIE</div>
    </div>
    <div class="go"><button class="btn" id="btnStart" data-en="START">START</button></div>
  </section>

  <!-- 섭외 -->
  <section id="scene-audition" class="hidden">
    <div class="hdr">
      <h2 data-en="Hongdae Busking Recruit">홍대 앞 버스킹 영입</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="chip"><b id="pickCount">0 / 5</b></span>
        <span class="chip hl" id="chipCost">🪙 <b id="pickCost">0</b></span>
        <button class="btn" id="btnConfirmPick" disabled data-en="FORM BAND">결성</button>
      </div>
    </div>
    <div class="grid g4" id="applicants"></div>
  </section>

  <!-- 결성 -->
  <section id="scene-setup" class="hidden center">
    <div class="stage" id="setupStage" style="height:min(40vh,300px);margin-bottom:22px"></div>
    <div class="lbl">BAND NAME</div>
    <input type="text" id="groupName" placeholder="밴드 이름을 정하세요" data-en-ph="Name your band" maxlength="14" autocomplete="off">
    <div class="lbl" data-en="PICK A LEADER">리더를 정하세요</div>
    <div class="grid g5" id="leaderPick"></div>
    <button class="btn" id="btnStartTraining" disabled style="margin-top:26px" data-en="DEBUT PROJECT ▶">데뷔 프로젝트 ▶</button>
  </section>

  <!-- 트레이닝 -->
  <section id="scene-training" class="hidden">
    <div class="hdr">
      <div>
        <h2 id="tbName" class="num">—</h2>
        <div class="pos" id="tbLeader"></div>
      </div>
      <button class="btn" id="btnWeek">▶</button>
    </div>
    <div class="grid g5" id="roster"></div>
    <div class="logbox"><h3>LOG</h3><div id="log"></div></div>
  </section>

  <!-- 컨셉 -->
  <section id="scene-concept" class="hidden center">
    <h2 data-en="Title Track">타이틀곡</h2>
    <div class="concepts" id="concepts"></div>
    <div class="logbox" style="text-align:left;max-height:none"><h3>TEAM</h3><div id="conceptHint"></div></div>
  </section>

  <!-- 결과 -->
  <section id="scene-result" class="hidden center">
    <div class="stage" id="resultStage"></div>
    <div class="pos" style="letter-spacing:2px;font-size:11px">12 WEEKS LATER</div>
    <div class="rank" id="rsRank">—</div>
    <div class="scorebig" id="rsScore"></div>
    <div id="rsBest"></div>
    <div class="verdict" id="rsText"></div>
    <div class="logbox" style="text-align:left;max-height:none;margin-bottom:20px">
      <h3>MEMBERS</h3><div id="rsMembers"></div>
    </div>
    <button class="btn" id="btnRetry">RETRY</button>
  </section>
</div>
<div id="cutin" class="hidden">
  <div class="shade"></div>
  <div class="cut-char"><img id="cutImg" alt=""></div>
  <div class="cut-narr hidden" id="cutNarr"></div>
  <div class="cut-box hidden" id="cutBox"><div class="cut-name" id="cutName"></div><div id="cutText"></div><div class="cut-next">▼</div></div>
  <div class="cut-choices hidden" id="cutChoices"></div>
</div>
<div id="overlay"></div>

<script src="assets/game-home.js" data-top="6" data-left="6" data-fullscreen="1" defer></script>
<div id="rotate">
  <div>
    <p data-en="This game plays in landscape">가로 화면에서 하는 게임입니다</p>
    <button type="button" id="rotGo" data-en="Turn to landscape">가로로 돌리기</button>
    <p class="sub"><span data-en="If the button does nothing, turn off your phone's rotation lock and lay it sideways">단추가 안 먹으면 폰의 화면 회전 잠금을 풀고 눕혀 주세요</span></p>
  </div>
</div>
