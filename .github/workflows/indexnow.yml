# 푸시할 때마다 바뀐 페이지만 골라 빙·네이버에 알립니다.
# 게임 하나 올릴 때마다 색인 요청 단추를 누르지 않아도 됩니다.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
  workflow_dispatch:      # 손으로 돌려보고 싶을 때

# 앞의 것이 아직 기다리는 중이면 취소하지 말고 줄 세웁니다
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 앞 커밋과 견주려면 기록이 필요합니다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 바뀐 페이지를 빙·네이버에 알림
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python .github/scripts/indexnow.py
