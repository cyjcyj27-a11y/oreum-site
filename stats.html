<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>루루냥 지표 — 오름게임즈</title>
<style>
  :root {
    --void: #f8f5ec; --panel: #fffdf7; --line: #e6dfcd; --line2: #d7ccb4;
    --ink: #1b2a1f; --ink2: #45523f; --muted: #7d8a76;
    --green: #4e8f4a; --green-lit: #2e6b39; --green-soft: #e7f0dc;
    --ember: #e08a2e; --ember-ink: #a35c10; --cold: #3d8a97; --cold-ink: #276570;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(60,55,35,.05), 0 10px 26px rgba(60,55,35,.06); }
  .card h2 { font-size: 14px; font-weight: 800; margin: 0 0 12px; color: var(--green-lit); letter-spacing: .2px; }
  .card h2 .em { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .big { font-size: 40px; font-weight: 800; line-height: 1; }
  .big small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .split { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .chip { flex: 1 1 120px; background: var(--green-soft); border-radius: 12px; padding: 10px 12px; }
  .chip .n { font-size: 22px; font-weight: 800; }
  .chip .l { font-size: 12px; color: var(--ink2); margin-top: 2px; }
  .chip.ember { background: #fbecd7; } .chip.ember .n { color: var(--ember-ink); }
  .chip.cold { background: #dceef1; } .chip.cold .n { color: var(--cold-ink); }
  .bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .bar .name { width: 78px; font-size: 13px; font-weight: 700; color: var(--ink2); flex: none; }
  .bar .track { flex: 1; background: #eee6d5; border-radius: 8px; height: 22px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 8px; background: var(--green); min-width: 2px; transition: width .5s; }
  .bar .val { width: 96px; text-align: right; font-size: 13px; color: var(--ink2); flex: none; }
  .milestone { display: flex; gap: 6px; margin-top: 12px; }
  .ms { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: #f0ead9; font-size: 12px; color: var(--muted); }
  .ms.done { background: var(--green-lit); color: #fff; font-weight: 700; }
  .ms.now { outline: 2px solid var(--ember); color: var(--ember-ink); font-weight: 700; }
  .rate { display: flex; align-items: baseline; gap: 8px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  .reload { display: inline-block; margin-top: 4px; color: var(--green-lit); font-weight: 700; text-decoration: none; font-size: 13px; cursor: pointer; }
  .loading { color: var(--muted); font-size: 14px; }
  @media (max-width: 480px) { .bar .name { width: 62px; } .bar .val { width: 84px; } .big { font-size: 34px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 루루냥 지표</h1>
  <p class="sub">쿠키 없이 · 브라우저당 하루 1회 집계 · 실시간</p>

  <div class="card">
    <h2>① 방문 수 <span class="em">누구든 게임을 연 수</span></h2>
    <div class="big" id="visits">…</div>
    <div class="milestone" id="milestone"></div>
    <div class="split">
      <div class="chip"><div class="n" id="v-new">–</div><div class="l">신규</div></div>
      <div class="chip cold"><div class="n" id="v-ret">–</div><div class="l">재방문</div></div>
      <div class="chip ember"><div class="n" id="v-today">–</div><div class="l">오늘</div></div>
    </div>
  </div>

  <div class="card">
    <h2>⑤ 재방문율 <span class="em">게임에 생명력이 있는지</span></h2>
    <div class="rate"><span class="big" id="ret-rate">…</span></div>
    <div class="note" id="ret-note"></div>
  </div>

  <div class="card">
    <h2>③ 게임 실행률 <span class="em">연 사람 중 실제로 시작한 비율</span></h2>
    <div class="rate"><span class="big" id="start-rate">…</span></div>
    <div class="note" id="start-note"></div>
  </div>

  <div class="card">
    <h2>② 유입 경로</h2>
    <div id="sources"><div class="loading">불러오는 중…</div></div>
  </div>

  <div class="card">
    <h2>④ 체류 · 몰입 <span class="em">시작한 사람 중 얼마나 오래 붙잡혔나</span></h2>
    <div id="dwell"><div class="loading">불러오는 중…</div></div>
    <div class="note">실제로 게임을 시작한 사람 기준입니다. 오래 남을수록 게임이 재밌다는 뜻이에요.</div>
  </div>

  <div class="foot">
    <a class="reload" onclick="location.reload()">↻ 새로고침</a><br>
    이 페이지는 검색에 안 잡히고 링크로만 봅니다.
  </div>
</div>

<script>
(function () {
  var NS = 'oreumgames';
  var base = 'https://abacus.jasoncameron.dev/get/' + NS + '/';
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function get(k) {
    return fetch(base + k, { mode: 'cors' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return j && typeof j.value === 'number' ? j.value : 0; })
      .catch(function () { return 0; });
  }
  var today = ymd(new Date());
  var keys = ['total', 'returning', 'game_open', 'day_' + today,
              'src_tiktok', 'src_instagram', 'src_threads', 'src_x', 'src_kakao',
              'src_youtube', 'src_facebook', 'src_search', 'src_direct', 'src_other',
              'play_1m', 'play_3m', 'play_10m'];
  // 한꺼번에 많이 부르면 속도 제한에 걸려 실제 값이 0으로 오기도 해서, 3개씩 나눠 부릅니다
  function fetchChunked(list, size) {
    var out = [], i = 0;
    function next() {
      if (i >= list.length) return Promise.resolve(out);
      var chunk = list.slice(i, i + size); i += size;
      return Promise.all(chunk.map(get)).then(function (vs) { out = out.concat(vs); return next(); });
    }
    return next();
  }
  fetchChunked(keys, 3).then(function (vals) {
    var d = {}; keys.forEach(function (k, i) { d[k] = vals[i]; });
    var fmt = function (n) { return n.toLocaleString('ko-KR'); };

    // ① 방문 수 + 신규/재방문/오늘 (신규 = 전체 − 재방문)
    var newV = Math.max(0, d.total - d.returning);
    document.getElementById('visits').innerHTML = fmt(d.total) + '<small>명</small>';
    document.getElementById('v-new').textContent = fmt(newV);
    document.getElementById('v-ret').textContent = fmt(d.returning);
    document.getElementById('v-today').textContent = fmt(d['day_' + today]);

    // 마일스톤 37 → 100 → 300 → 1000
    var stones = [37, 100, 300, 1000], msEl = document.getElementById('milestone'), passed = -1;
    stones.forEach(function (s, i) { if (d.total >= s) passed = i; });
    msEl.innerHTML = stones.map(function (s, i) {
      var cls = i <= passed ? 'ms done' : (i === passed + 1 ? 'ms now' : 'ms');
      return '<div class="' + cls + '">' + (i <= passed ? '✓ ' : '') + fmt(s) + '</div>';
    }).join('');

    // ⑤ 재방문율 = 재방문 / 전체 방문
    var retRate = d.total ? Math.round(d.returning / d.total * 100) : 0;
    document.getElementById('ret-rate').innerHTML = retRate + '<small>%</small>';
    document.getElementById('ret-note').textContent =
      d.returning === 0
        ? '아직 재방문자가 없어요. 한 명이라도 다시 찾아오기 시작하면 여기 숫자가 오릅니다.'
        : '지금까지 ' + fmt(d.returning) + '명이 다른 날 다시 돌아왔어요. 이 숫자가 꾸준히 오르면 게임에 생명력이 있다는 신호입니다.';

    // ③ 게임 실행률 = 홈페이지 방문자 중 실제 게임을 연 비율
    var startRate = d.total ? Math.round(d.game_open / d.total * 100) : 0;
    document.getElementById('start-rate').innerHTML = startRate + '<small>%</small>';
    document.getElementById('start-note').textContent =
      '홈페이지에 온 ' + fmt(d.total) + '명 중 ' + fmt(d.game_open) + '명이 실제로 게임을 열었어요. (게임 링크로 바로 온 사람이 많으면 100%를 넘을 수도 있어요)';

    // ② 유입 경로 — 값이 0인 채널은 접어두고, 들어온 것만 큰 순서로 보여줍니다
    var srcDefs = [['틱톡', 'src_tiktok'], ['인스타', 'src_instagram'], ['스레드', 'src_threads'],
                   ['X', 'src_x'], ['카톡', 'src_kakao'], ['유튜브', 'src_youtube'],
                   ['페북', 'src_facebook'], ['검색', 'src_search'], ['직접', 'src_direct'], ['기타', 'src_other']];
    var srcTotal = srcDefs.reduce(function (a, s) { return a + d[s[1]]; }, 0) || 1;
    var shown = srcDefs.filter(function (s) { return d[s[1]] > 0; }).sort(function (a, b) { return d[b[1]] - d[a[1]]; });
    if (!shown.length) shown = [['아직 없음', null]];
    document.getElementById('sources').innerHTML = shown.map(function (s) {
      if (!s[1]) return '<div class="note">아직 유입 기록이 없어요. 링크로 사람들이 들어오면 채널별로 쌓입니다.</div>';
      var n = d[s[1]], pct = Math.round(n / srcTotal * 100);
      return '<div class="bar"><div class="name">' + s[0] + '</div>' +
             '<div class="track"><div class="fill" style="width:' + Math.max(pct, n ? 4 : 0) + '%"></div></div>' +
             '<div class="val">' + fmt(n) + '명 · ' + pct + '%</div></div>';
    }).join('');

    // ④ 체류 · 몰입 (게임을 연 사람 기준)
    var denom = d.game_open || 1;
    var dwellDefs = [['1분+', d.play_1m], ['3분+', d.play_3m], ['10분+', d.play_10m]];
    document.getElementById('dwell').innerHTML = dwellDefs.map(function (s) {
      var pct = Math.round(s[1] / denom * 100);
      return '<div class="bar"><div class="name">' + s[0] + '</div>' +
             '<div class="track"><div class="fill" style="width:' + Math.max(pct, s[1] ? 4 : 0) + '%;background:var(--ember)"></div></div>' +
             '<div class="val">' + fmt(s[1]) + '명 · ' + pct + '%</div></div>';
    }).join('');
  });
})();
</script>
</body>
</html>
